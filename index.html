      if (market === "US") return value > 0 && value < 1 ? 0.0001 : 0.01;
      if (market !== "HK") return 0.01;
      if (value < 0.25) return 0.001;
      if (value < 0.5) return 0.005;
      if (value < 20) return 0.01;
      if (value < 50) return 0.02;
      if (value < 100) return 0.05;
      if (value < 200) return 0.1;
      if (value < 500) return 0.2;
      if (value < 1000) return 0.5;
      if (value < 2000) return 1;
      if (value < 5000) return 2;
      return 5;
    }

    function priceInputAttrs(market, price) {
      return `step="${portfolioPriceTick(market, price)}" data-price-market="${escapeHtml(market || "")}"`;
    }

    function costInputAttrs() {
      return `step="any" inputmode="decimal" data-portfolio-cost`;
    }

    function renderRebalanceModal(modal) {
      const portfolio = activePortfolio();
      const metrics = portfolioMetrics(portfolio);
      const side = (key, label, className) => {
        const stock = modal[`${key}Stock`];
        const position = rebalanceCurrentPosition(stock, portfolio);
        const currency = stock?.currency || position?.currency || "";
        const price = modal[`${key}Price`] ?? (stock?.latestPrice || position?.latestPrice || "");
        return `<section class="rebalance-side ${className}">
          <h3>${label}</h3>
          ${renderRebalanceStockSearch(modal, key)}
          <div class="rebalance-fields">
            <label class="field"><span>${key === "sell" ? "卖出价格" : "买入价格"}</span><div class="input-with-suffix"><input name="${key}Price" data-rebalance-price="${key}" type="number" min="0" ${priceInputAttrs(stock?.market || position?.market, price)} value="${Number(price) || ""}" required><span class="input-suffix">${currency || "原币"}</span></div></label>
            <label class="field"><span class="rebalance-field-title"><span>${key === "sell" ? "卖出数量" : "买入数量"}</span>${key === "sell" && position ? `<span class="rebalance-holding-note">当前持有 ${Number(position.shares).toLocaleString("zh-CN")} 股</span>` : ""}</span><div class="input-with-suffix"><input name="${key}Shares" data-rebalance-shares="${key}" type="number" min="1" step="1" value="${Number(modal[`${key}Shares`] || 0) || ""}" ${key === "sell" && position ? `max="${Number(position.shares)}"` : ""}><span class="input-suffix">股</span></div>${renderRebalanceQuick(key)}</label>
          </div>
          ${renderRebalancePreview(modal, key, portfolio, metrics)}
        </section>`;
      };
      return modalShell("换仓", `<div class="rebalance-grid">${side("sell", "卖出", "sell")}${side("buy", "买入", "buy")}</div>`, "rebalanceTrade", "确认换仓", "rebalance-modal");
    }

    function renderPositionModal(modal) {
      const portfolio = activePortfolio();
      const isOpen = modal.type === "open";
      const position = modal.position;
      const title = isOpen ? "开仓" : modal.type === "add" ? "加仓" : "减持";
      const stockBlock = isOpen ? `
        <div class="field"><span class="portfolio-search-heading"><span>${modal.searchOptions?"期权通用代码搜索":"股票名称/代码搜索"}</span><label class="portfolio-option-search-toggle"><input type="checkbox" data-input="portfolioOptionSearch" ${modal.searchOptions?"checked":""}>搜索期权</label></span><div class="search-combobox">
          <input data-input="portfolioStockSearch" autocomplete="off" placeholder="${modal.searchOptions?"富途格式：FUTU 260731 101.00C；OCC：FUTU260731C00101000":"输入股票名称、代码或拼音，例如：腾讯 / 0700 / AAPL"}" value="${escapeHtml(modal.searchQuery || "")}">
          ${(state.portfolioSearchLoading || state.portfolioSearchResults.length || (modal.searchQuery && !modal.stock)) ? `<div class="search-results show">
            ${state.portfolioSearchLoading ? `<div class="empty" style="padding:18px">正在匹配${modal.searchOptions?"期权":"股票"}...</div>` : state.portfolioSearchResults.length ? state.portfolioSearchResults.map((item, index) => `<button type="button" class="result-item" data-action="selectPortfolioStock" data-index="${index}"><span><strong>${escapeHtml(item.assetType==="option"?`${item.underlyingName} ${item.optionType==="put"?"Put":"Call"}`:item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}${item.assetType==="option"?` · ${item.expiryDate} · ${formatPortfolioNumber(item.strikePrice)}`:""}</span></span></button>`).join("") : `<div class="empty" style="padding:18px">${modal.searchOptions?"请输入有效的美股 OCC 代码或“标的.市场-到期日-C/P-行权价”通用代码。":"没有匹配结果，请尝试其他名称或代码。"}</div>`}
          </div>` : ""}
        </div></div>
      ` : `<div class="portfolio-selected-stock"><strong>${escapeHtml(position.name)}</strong> <span class="stock-code">${escapeHtml(position.code)} · ${position.currency}</span></div>`;
      const currency = modal.stock?.currency || position?.currency || "";
      if (modal.type === "edit" && position?.assetType === "option") {
        const direction=position.direction==="short"?"short":"long";
        return modalShell("编辑期权方向", `<div class="portfolio-selected-stock"><strong>${escapeHtml(position.optionType==="put"?"Put":"Call")} · ${escapeHtml(position.code)}</strong><span class="stock-code">${escapeHtml(position.underlyingName||position.name)} · ${escapeHtml(position.expiryDate||"")} · 行权 ${formatPortfolioNumber(position.strikePrice)}</span></div><div class="option-direction-editor"><div class="option-direction-current"><span>当前方向</span><span class="portfolio-option-badge ${direction==="short"?"short":""}">${direction==="short"?"做空":"做多"}</span></div><div class="muted">用于纠正录入时选错的方向；保存后会同步修正该仓位对应的现金方向。</div></div>`, "positionTrade", "保存", "position-trade-modal", `<button type="button" data-action="closePortfolioModal">取消</button><button class="option-direction-action short" type="submit" name="direction" value="short">改为做空</button><button class="option-direction-action long" type="submit" name="direction" value="long">改为做多</button>`);
      }
      if (modal.type === "edit") return modalShell("编辑持仓", `<div class="position-edit-layout">
        <div class="position-edit-main">${stockBlock}
          <div class="grid-3 position-edit-fields"><label class="field"><span>摊薄成本</span><div class="input-with-suffix"><input name="price" type="number" min="0" ${costInputAttrs()} value="${roundPortfolioCost(position.averageCost)}" required><span class="input-suffix">${escapeHtml(currency || "原币")}</span></div></label><label class="field"><span>持股数</span><div class="input-with-suffix"><input name="shares" data-position-edit-shares type="number" min="1" step="1" value="${Number(position.shares)}" required><span class="input-suffix">股</span></div></label><label class="field"><span>仓位</span><div class="position-current-weight" data-position-current-weight>${formatPositionWeight(positionWeightPercent(position))}</div></label></div>
          <label class="field"><span>关联股池估值版本</span><select name="valuationStockId" data-input="portfolioValuationVersion"><option value="">不关联</option>${portfolioValuationVersions(position).map((stock) => `<option value="${escapeHtml(stock.id)}"${stock.id === position.valuationStockId ? " selected" : ""}>${escapeHtml(normalizeStockVersion(stock.version))} · ${escapeHtml(formatDate(stock.updatedAt || stock.marketCapUpdatedAt))}</option>`).join("")}</select><div class="position-valuation-preview" data-portfolio-valuation-preview>${renderPortfolioValuationPreview(position)}</div></label>
          <label class="field"><span>目标仓位</span><div class="position-target-control"><button type="button" data-target-weight-step="-1" aria-label="降低目标仓位">−</button><input name="targetWeight" type="text" inputmode="decimal" value="${formatPositionTargetWeight(position.targetWeight)}" required><button type="button" data-target-weight-step="1" aria-label="提高目标仓位">+</button></div><div class="position-target-quick">${[2,3,5,8,15,25,35].map((value) => `<button type="button" data-target-weight-value="${value}">${value}%</button>`).join("")}</div></label>
          <div class="position-tag-editor"><div class="position-tag-title">标签</div><div class="position-tag-input"><input name="newTag" maxlength="20" placeholder="自定义标签，如：AI / 高股息"><button type="button" data-action="addPositionTag">添加</button></div>${modal.tags.length ? `<div class="position-tags-selected">${modal.tags.map((tag) => `<button type="button" data-action="toggleEditPositionTag" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)} ×</button>`).join("")}</div>` : `<div class="muted">暂未添加标签</div>`}${allPortfolioTags().filter((tag) => !modal.tags.includes(tag)).length ? `<div class="position-tag-existing"><span>快速选择已有标签</span><div>${allPortfolioTags().filter((tag) => !modal.tags.includes(tag)).map((tag) => `<button type="button" data-action="toggleEditPositionTag" data-tag="${escapeHtml(tag)}">+ ${escapeHtml(tag)}</button>`).join("")}</div></div>` : ""}</div>
        </div>
        ${renderPositionTradePlan(position)}
      </div>`, "positionTrade", "保存", "position-edit-modal");
      const stockMarket = modal.stock?.market || position?.market || "";
      const stockConnectNote = portfolio?.accountType === "CNY" && stockMarket === "HK"
        ? `<div class="muted">港股通按港币成交价录入，成交金额将按当前汇率折算为人民币现金。</div>`
        : "";
      const suggestion = !isOpen && position?.assetType!=="option" ? positionTradeSuggestion(position, portfolio, modal.type) : null;
      const suggestedShares = suggestion?.action === modal.type ? suggestion.gridShares : 0;
      const defaultTradeShares = modal.type === "add" ? "" : (suggestedShares || "");
      const suggestionBlock = suggestion ? renderPositionTradeSuggestion(suggestion, modal.type) : "";
      const tradePrice = Number(position?.latestPrice || modal.stock?.latestPrice) || "";
      const option=modal.stock?.assetType==="option"?modal.stock:position?.assetType==="option"?position:null;
      const tradingDays=option?optionTradingDaysUntil(option.expiryDate):null;
      const optionFields=option?`<div class="portfolio-option-fields"><div class="portfolio-option-meta"><div class="portfolio-option-meta-item"><span class="portfolio-option-meta-label">类型</span><div class="portfolio-option-meta-value"><span class="portfolio-option-type ${option.optionType==="put"?"put":"call"}">${option.optionType==="put"?"Put":"Call"}</span></div></div><div class="portfolio-option-meta-item"><span class="portfolio-option-meta-label">到期日</span><div class="portfolio-option-meta-value"><span>${escapeHtml(String(option.expiryDate||"").replaceAll("-","/"))}</span>${tradingDays!==null?`<span class="portfolio-option-expiry-note">${tradingDays===0?"今日到期":`还有 ${tradingDays} 个交易日到期`}</span>`:""}</div></div></div><div class="grid-2"><label class="field"><span>行权价</span><input name="strikePrice" type="number" min="0.0001" step="any" value="${Number(option.strikePrice)||""}" required></label><label class="field"><span>每张股数</span><input name="contractMultiplier" type="number" min="1" step="1" value="${Number(option.contractMultiplier)||""}" placeholder="${option.market==="US"?"默认 100":"按港交所合约填写"}" required></label></div><div class="grid-2"><div class="field"><span>${modal.type==="reduce"?"平仓":"交易"}张数</span><input name="contracts" type="number" min="1" step="1" max="${modal.type==="reduce"?Number(option.contracts||0):""}" required></div><label class="field"><span>权利金</span><div class="input-with-suffix"><input name="price" type="number" min="0.0001" step="any" value="${Number(position?.latestPrice)||""}" required><span class="input-suffix">${currency||option.currency}</span></div></label></div><div class="portfolio-option-footer"><div class="portfolio-option-hint">美股通常每张代表100股；港股每张对应股数随标的而异，以交易所合约资料为准。</div><label class="portfolio-backfill"><input name="backfillTrade" type="checkbox" data-input="portfolioBackfill" ${modal.backfillTrade?"checked":""}>补录交易</label></div></div>${modal.backfillTrade?`<label class="field portfolio-backfill-time"><span>交易时间（日期 · 小时 · 分钟）</span><input name="occurredAt" type="datetime-local" step="60" max="${localDateTimeMinuteValue()}" value="${escapeHtml(modal.occurredAt||localDateTimeMinuteValue())}" required></label>`:""}`:"";
      const tradeFields = option
        ? optionFields
        : `<div class="grid-2"><label class="field"><span>${modal.type === "reduce" ? "卖出" : "买入"}价格</span><div class="input-with-suffix"><input name="price" type="number" min="0" ${priceInputAttrs(stockMarket, tradePrice)} value="${tradePrice}" required><span class="input-suffix">${currency || "原币"}</span></div></label><div class="field"><span class="trade-quantity-heading"><span>${modal.type === "reduce" ? "卖出" : "买入"}数量</span><label class="portfolio-backfill"><input name="backfillTrade" type="checkbox" data-input="portfolioBackfill" ${modal.backfillTrade ? "checked" : ""}>补录交易</label></span><div class="input-with-suffix"><input name="shares" type="number" min="1" step="1" value="${defaultTradeShares}" required ${modal.type === "reduce" ? `max="${position.shares}"` : ""}><span class="input-suffix">股</span></div></div></div>${modal.backfillTrade ? `<label class="field portfolio-backfill-time"><span>交易时间（日期 · 小时 · 分钟）</span><input name="occurredAt" type="datetime-local" step="60" max="${localDateTimeMinuteValue()}" value="${escapeHtml(modal.occurredAt || localDateTimeMinuteValue())}" required></label>` : ""}`;
      const tradeMain = `${stockBlock}${suggestionBlock}${tradeFields}${stockConnectNote}${modal.type === "reduce" ? `<div class="muted">当前持有 ${Number(position.shares).toLocaleString("zh-CN")} 股</div>` : ""}`;
      const body = isOpen ? tradeMain : `<div class="position-trade-layout"><div class="position-trade-main">${tradeMain}</div>${renderPositionTradePlanReadonly(position, modal.type === "reduce" ? "sell" : "buy")}</div>`;
      const optionOpenFooter=option&&isOpen?`<button type="button" data-action="closePortfolioModal">取消</button><button class="option-direction-action short" type="submit" name="direction" value="short">做空开仓</button><button class="option-direction-action long" type="submit" name="direction" value="long">做多开仓</button>`:"";
      return modalShell(title, body, "positionTrade", option?(modal.type==="reduce"?"确认平仓":"确认开仓"):modal.type === "reduce" ? "确认减持" : "确认买入", isOpen ? "" : "position-trade-modal", optionOpenFooter);
    }

    function normalizedPositionTradePlan(position) {
      const source = position?.tradePlan || {};
      const normalizeSide = (side) => Array.from({ length: Math.max(3, Array.isArray(source[side]) ? source[side].length : 0) }, (_, index) => {
        const row = Array.isArray(source[side]) ? source[side][index] : null;
        return { id: row?.id || "", price: Number(row?.price) || "", shares: Number(row?.shares) || "", remark: String(row?.remark || ""), done: Boolean(row?.done) };
      });
      return { buy: normalizeSide("buy"), sell: normalizeSide("sell") };
    }

    function renderPositionTradeSuggestion(suggestion, type) {
      const isAdd = type === "add";
      const title = isAdd ? "加仓建议" : "减仓建议";
      const summary = `当前 ${suggestion.currentWeight.toFixed(2)}% · 目标 ${suggestion.targetWeight.toFixed(2)}% · 差额 ${suggestion.gapPercent > 0 ? "+" : ""}${suggestion.gapPercent.toFixed(2)}%`;
      let message = "";
      if (suggestion.targetWeight <= 0) {
        message = "尚未设置有效目标仓位，暂不提供建议。";
      } else if (suggestion.action === type) {
        message = `建议${isAdd ? "买入" : "卖出"}约 <strong>${suggestion.fullShares.toLocaleString("zh-CN")} 股</strong>到达目标；按四档网格分批，本次建议 <strong>${suggestion.gridShares.toLocaleString("zh-CN")} 股</strong>。`;
      } else if (isAdd && suggestion.gapPercent < 0) {
        message = `当前仓位已超配 ${Math.abs(suggestion.gapPercent).toFixed(2)}%，不建议加仓。`;
      } else if (!isAdd && suggestion.gapPercent > 0) {
        message = `当前仓位仍低配 ${suggestion.gapPercent.toFixed(2)}%，不建议减仓。`;
      } else {
        message = `当前仓位已接近目标，不建议${isAdd ? "加仓" : "减仓"}。`;
      }
      return `<div class="trade-suggestion"><strong>${title}</strong><br>${summary}<br>${message}</div>`;
    }

    function parsePositionTargetWeight(value) {
      const parsed = Number(String(value ?? "").replace("%", "").trim());
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function formatPositionTargetWeight(value) {
      const parsed = Number(value) || 0;
      return `${Number.isInteger(parsed) ? parsed : parsed.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}%`;
    }

    function renderPositionTradePlan(position) {
      const plan = normalizedPositionTradePlan(position);
      const currency = position?.currency || "原币";
      const valuationStock = portfolioValuationStock(position);
      const rowHtml = (side, label, row, index) => {
        const computed = positionPlanValuation(position, row.price);
        const weight = positionWeightPercent(position, row.shares, row.price);
        return `<div class="position-plan-row plan-${side}" data-plan-row data-plan-side="${side}" data-plan-index="${index}">
        <span>${label}${index + 1}</span>
        <div class="input-with-suffix"><input name="plan_${side}_${index}_price" data-plan-price data-plan-side="${side}" data-plan-index="${index}" type="number" min="0" ${priceInputAttrs(position?.market, row.price)} value="${row.price}" placeholder="价格" aria-label="${label}${index + 1}价格"><span class="input-suffix">${currency}</span></div>
        <div class="input-with-suffix position-plan-metric"><input data-plan-metric="upside" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="${computed ? formatPositionPlanNumber(computed.upside * 100) : ""}" placeholder="--" aria-label="${label}${index + 1} Upside" ${valuationStock ? "" : "disabled"}><span class="input-suffix">%</span></div>
        <div class="input-with-suffix position-plan-metric"><input data-plan-metric="forwardPE" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="${computed ? formatPositionPlanNumber(computed.forwardPE) : ""}" placeholder="--" aria-label="${label}${index + 1} Forward PE" ${valuationStock ? "" : "disabled"}><span class="input-suffix">x</span></div>
        <div class="input-with-suffix position-plan-metric"><input data-plan-metric="shareholderReturnRate" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="${computed ? formatPositionPlanNumber(computed.shareholderReturnRate * 100) : ""}" placeholder="--" aria-label="${label}${index + 1}股东回报率" ${valuationStock ? "" : "disabled"}><span class="input-suffix">%</span></div>
        <div class="input-with-suffix"><input name="plan_${side}_${index}_shares" data-plan-shares data-plan-side="${side}" data-plan-index="${index}" type="number" min="0" step="1" value="${row.shares}" placeholder="股数" aria-label="${label}${index + 1}股数"><span class="input-suffix">股</span></div>
        <div class="position-plan-value position-plan-weight" data-plan-weight data-plan-side="${side}" data-plan-index="${index}">${formatPositionWeight(weight)}</div>
        <input name="plan_${side}_${index}_remark" type="text" maxlength="300" value="${escapeHtml(row.remark)}" placeholder="备注" aria-label="${label}${index + 1}备注">
        <input name="plan_${side}_${index}_done" type="checkbox" ${row.done ? "checked" : ""} aria-label="${label}${index + 1}完成">
      </div>`;
      };
      const rows = (side, label) => plan[side].map((row, index) => rowHtml(side, label, row, index)).join("");
      return `<section class="position-plan"><div class="position-plan-title"><h3>加减仓计划</h3><div class="position-plan-actions"><button type="button" data-action="addPositionPlanPoint" data-plan-side="buy">+ 添加买点</button><button type="button" data-action="addPositionPlanPoint" data-plan-side="sell">+ 添加卖点</button></div></div><div class="position-plan-head"><span>计划</span><span>价格</span><span>Upside</span><span>Forward PE</span><span>股东回报率</span><span>股数</span><span>对应仓位</span><span>备注</span><span>完成</span></div><div data-plan-rows="buy">${rows("buy", "买点")}</div><div data-plan-rows="sell">${rows("sell", "卖点")}</div></section>`;
    }

    function bindPositionPlanRow(row) {
      row.querySelectorAll("[data-plan-price]").forEach((input) => input.addEventListener("input", () => {
        syncPositionPlanRow(input.dataset.planSide, Number(input.dataset.planIndex));
        syncPositionPlanWeight(input.dataset.planSide, Number(input.dataset.planIndex));
      }));
      row.querySelectorAll("[data-plan-metric]").forEach((input) => input.addEventListener("input", () => {
        syncPositionPlanRow(input.dataset.planSide, Number(input.dataset.planIndex), input.dataset.planMetric);
        syncPositionPlanWeight(input.dataset.planSide, Number(input.dataset.planIndex));
      }));
      row.querySelectorAll("[data-plan-shares]").forEach((input) => input.addEventListener("input", () => syncPositionPlanWeight(input.dataset.planSide, Number(input.dataset.planIndex))));
    }

    function addPositionPlanPoint(side) {
      const position = state.portfolioModal?.position;
      const container = document.querySelector(`[data-plan-rows='${side}']`);
      if (!position || state.portfolioModal?.type !== "edit" || !container || !["buy", "sell"].includes(side)) return;
      const index = container.querySelectorAll("[data-plan-row]").length;
      const label = side === "buy" ? "买点" : "卖点";
      const currency = position.currency || "原币";
      const valuationStock = portfolioValuationStock(position, currentPositionPlanValuationId());
      container.insertAdjacentHTML("beforeend", `<div class="position-plan-row plan-${side}" data-plan-row data-plan-side="${side}" data-plan-index="${index}"><span>${label}${index + 1}</span><div class="input-with-suffix"><input name="plan_${side}_${index}_price" data-plan-price data-plan-side="${side}" data-plan-index="${index}" type="number" min="0" step="any" value="" placeholder="价格" aria-label="${label}${index + 1}价格"><span class="input-suffix">${escapeHtml(currency)}</span></div><div class="input-with-suffix position-plan-metric"><input data-plan-metric="upside" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="" placeholder="--" aria-label="${label}${index + 1} Upside" ${valuationStock ? "" : "disabled"}><span class="input-suffix">%</span></div><div class="input-with-suffix position-plan-metric"><input data-plan-metric="forwardPE" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="" placeholder="--" aria-label="${label}${index + 1} Forward PE" ${valuationStock ? "" : "disabled"}><span class="input-suffix">x</span></div><div class="input-with-suffix position-plan-metric"><input data-plan-metric="shareholderReturnRate" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="" placeholder="--" aria-label="${label}${index + 1}股东回报率" ${valuationStock ? "" : "disabled"}><span class="input-suffix">%</span></div><div class="input-with-suffix"><input name="plan_${side}_${index}_shares" data-plan-shares data-plan-side="${side}" data-plan-index="${index}" type="number" min="0" step="1" value="" placeholder="股数" aria-label="${label}${index + 1}股数"><span class="input-suffix">股</span></div><div class="position-plan-value position-plan-weight" data-plan-weight data-plan-side="${side}" data-plan-index="${index}">--</div><input name="plan_${side}_${index}_remark" type="text" maxlength="300" value="" placeholder="备注" aria-label="${label}${index + 1}备注"><input name="plan_${side}_${index}_done" type="checkbox" aria-label="${label}${index + 1}完成"></div>`);
      const row = container.querySelector(`[data-plan-row][data-plan-index='${index}']`);
      if (row) bindPositionPlanRow(row);
    }

    function renderPositionTradePlanReadonly(position, side) {
      const plan = normalizedPositionTradePlan(position)[side];
      const label = side === "buy" ? "买点" : "卖点";
      const currency = position?.currency || "原币";
      const rows = plan.map((row, index) => {
        const computed = positionPlanValuation(position, row.price);
        const weight = positionWeightPercent(position, row.shares, row.price);
        return `<div class="position-plan-row plan-${side}"><span>${label}${index + 1}</span><div class="position-plan-value">${row.price ? `${row.price} ${currency}` : "--"}</div><div class="position-plan-value">${renderPositionPlanMetricValue(computed, "upside")}</div><div class="position-plan-value">${renderPositionPlanMetricValue(computed, "forwardPE")}</div><div class="position-plan-value">${renderPositionPlanMetricValue(computed, "shareholderReturnRate")}</div><div class="position-plan-value">${row.shares ? `${row.shares} 股` : "--"}</div><div class="position-plan-value">${formatPositionWeight(weight)}</div><div class="position-plan-value" title="${escapeHtml(row.remark)}">${escapeHtml(row.remark)||"--"}</div><input type="checkbox" data-plan-live-done data-position-id="${position.id}" data-plan-side="${side}" data-plan-index="${index}" ${row.done ? "checked" : ""} aria-label="${label}${index + 1}完成"></div>`;
      }).join("");
      return `<section class="position-plan-readonly"><div class="position-plan-head"><span>计划</span><span>价格</span><span>Upside</span><span>Forward PE</span><span>股东回报率</span><span>股数</span><span>对应仓位</span><span>完成</span></div>${rows}</section>`;
    }

    function syncPositionPlanWeight(side, index) {
      const position = state.portfolioModal?.position;
      if (!position || state.portfolioModal?.type !== "edit") return;
      const price = document.querySelector(`[data-plan-price][data-plan-side='${side}'][data-plan-index='${index}']`)?.value;
      const shares = document.querySelector(`[data-plan-shares][data-plan-side='${side}'][data-plan-index='${index}']`)?.value;
      const target = document.querySelector(`[data-plan-weight][data-plan-side='${side}'][data-plan-index='${index}']`);
      if (target) target.textContent = formatPositionWeight(positionWeightPercent(position, shares, price));
    }

    function syncPositionEditWeight() {
      const position = state.portfolioModal?.position;
      const shares = document.querySelector("[data-position-edit-shares]")?.value;
      const target = document.querySelector("[data-position-current-weight]");
      if (position && target) target.textContent = formatPositionWeight(editedPositionWeightPercent(position, shares));

    function currentPositionPlanValuationId() {
      const selected = document.querySelector("[data-input='portfolioValuationVersion']")?.value;
      return selected === undefined ? state.portfolioModal?.position?.valuationStockId : selected;
    }

    function syncPositionPlanRow(side, index, sourceMetric = "") {
      const position = state.portfolioModal?.position;
      if (!position || state.portfolioModal?.type !== "edit") return;
      const selectedId = currentPositionPlanValuationId();
      const stock = portfolioValuationStock(position, selectedId);
      const priceInput = document.querySelector(`[data-plan-price][data-plan-side='${side}'][data-plan-index='${index}']`);
      const metricInputs = [...document.querySelectorAll(`[data-plan-metric][data-plan-side='${side}'][data-plan-index='${index}']`)];
      metricInputs.forEach((input) => { input.disabled = !stock; });
      if (!stock || !priceInput) {
        metricInputs.forEach((input) => { input.value = ""; input.setCustomValidity(""); input.removeAttribute("aria-invalid"); });
        return;
      }
      if (sourceMetric) {
        const sourceInput = metricInputs.find((input) => input.dataset.planMetric === sourceMetric);
        if (!sourceInput) return;
        if (!sourceInput.value.trim()) {
          priceInput.value = "";
          metricInputs.forEach((input) => { input.value = ""; input.setCustomValidity(""); input.removeAttribute("aria-invalid"); });
          return;
        }
        const nextPrice = positionPlanPriceFromMetric(position, sourceMetric, sourceInput.value, selectedId);
        if (!(nextPrice > 0)) {
          const message = sourceMetric === "upside"
            ? "Upside 需大于 -100%，且估值需能计算出正的前瞻市值。"
            : sourceMetric === "forwardPE"
            ? "当前估值缺少有效的前瞻利润，无法按 Forward PE 反算。"
            : "股东回报率和前瞻股东回报需为非零值。";
          sourceInput.setCustomValidity(message);
          sourceInput.setAttribute("aria-invalid", "true");
          sourceInput.title = message;
          return;
        }
        sourceInput.setCustomValidity("");
        sourceInput.removeAttribute("aria-invalid");
        sourceInput.removeAttribute("title");
        priceInput.value = Number(nextPrice).toFixed(2);
      }
      const computed = positionPlanValuation(position, priceInput.value, selectedId);
      metricInputs.forEach((input) => {
        input.setCustomValidity("");
        input.removeAttribute("aria-invalid");
        input.removeAttribute("title");
        if (!computed) {
          input.value = "";
          return;
        }
        if (input.dataset.planMetric === sourceMetric) return;
        const value = input.dataset.planMetric === "forwardPE"
          ? computed.forwardPE
          : computed[input.dataset.planMetric] == null ? null : computed[input.dataset.planMetric] * 100;
        input.value = formatPositionPlanNumber(value);
      });
    }

    function compactStockSearchValue(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[^\u4e00-\u9fffa-z0-9]+/g, "");
    }

    function stockMatchesPoolSearch(stock, rawQuery) {
      const tokens = String(rawQuery ?? "").trim().split(/\s+/).map(compactStockSearchValue).filter(Boolean);
      if (!tokens.length) return true;
      const aliases = Array.isArray(stock.aliases) ? stock.aliases.join(" ") : stock.aliases;
      const code = String(stock.code || "");
      const codeWithoutLeadingZeros = code.replace(/^0+(?=\d)/, "");
      const searchableValues = [
        stock.name,
        code,
        codeWithoutLeadingZeros,
        aliases,
        stock.market,
        stock.exchange
      ].map(compactStockSearchValue).filter(Boolean);
      return tokens.every((token) => searchableValues.some((value) => value.includes(token)));
    }

    function userStocks() {
      const query = state.query.trim();
      let rows = [...state.stocks];
      if (state.filter !== "ALL") rows = rows.filter((item) => item.market === state.filter);
      if (query) rows = rows.filter((item) => stockMatchesPoolSearch(item, query));
      rows.sort((a, b) => {
        if (state.sort.key === "manual") return (a.manualOrder || 0) - (b.manualOrder || 0);
        const va = listSortValue(a, state.sort.key);
        const vb = listSortValue(b, state.sort.key);
        if (["bias30w", "bias2yPercentile"].includes(state.sort.key)) {
          const aMissing = !Number.isFinite(va), bMissing = !Number.isFinite(vb);
          if (aMissing !== bMissing) return aMissing ? 1 : -1;
        }
        return state.sort.dir === "asc" ? va - vb : vb - va;
      });
      return rows;
    }

    function listSortValue(stock, key) {
      const c = calc(stock);
      const latest = Number(stock.latestMarketCapCny) || 0;
      if (key === "shareholderReturnRate") return shareholderReturnRateForList(stock, c) ?? -Infinity;
      if (key === "dividendYield") return latest ? (Number(stock.expectedDividendCny) || 0) / latest : -Infinity;
      if (key === "buybackRate") return latest ? (Number(stock.expectedBuybackCny) || 0) / latest : -Infinity;
      if (key === "bias30w" || key === "bias2yPercentile") return Number.isFinite(stock[key]) ? stock[key] : NaN;
      return c[key] ?? -Infinity;
    }

    function biasTrendDirection(item) {
      const values = Array.isArray(item?.biasRecentValues)
        ? item.biasRecentValues.slice(-3).map(Number).filter(Number.isFinite)
        : [];
      if (values.length !== 3) return "";
      if (values[0] < values[1] && values[1] < values[2]) return "strengthening";
      if (values[0] > values[1] && values[1] > values[2]) return "weakening";
      return "";
    }

    function renderBiasAlertPanel(items, scopeLabel) {
      const unique = new Map();
      (items || []).filter((item) => item?.assetType !== "option").forEach((item) => {
        const key = `${item.market || ""}:${item.code || item.id || ""}`;
        if (!unique.has(key)) unique.set(key, item);
      });
      const panelTitle = "乖离率洞察";
      const rows = [...unique.values()].filter((item) => Number.isFinite(item.bias30w) && Number.isFinite(item.bias2yPercentile));
      if (!rows.length) return `<section class="bias-alert-panel" aria-label="${escapeHtml(scopeLabel)}${panelTitle}"><div class="bias-alert-head"><strong>${panelTitle}</strong><span>暂无可用乖离率数据</span></div></section>`;
      const categories = [
        {
          key: "weak", title: "弱周期极端位置", guide: "观察基本面转折信号", condition: (item) => item.bias30w < -30 || item.bias2yPercentile < 10
        },
        {
          key: "strong", title: "强周期极端位置", guide: "观察基本面赔率空间是否充足和基本面转弱信号", condition: (item) => item.bias30w > 30 || item.bias2yPercentile > 90
        },
        {
          key: "expanding", title: "叙事展开期", guide: "乖离值连续3周走强，观察基本面变化趋势", condition: (item) => biasTrendDirection(item) === "strengthening"
        },
        {
          key: "compressing", title: "叙事压缩期", guide: "乖离值连续3周走弱，观察基本面变化趋势", condition: (item) => biasTrendDirection(item) === "weakening"
        }
      ];
      const renderStock = (item, categoryKey) => {
        const trend = (item.biasRecentValues || []).slice(-3).map((value) => `${Number(value).toFixed(1)}%`).join(" → ");
        const metric = ["expanding", "compressing"].includes(categoryKey)
          ? trend
          : `${item.bias30w > 0 ? "+" : ""}${item.bias30w.toFixed(1)}% · P${item.bias2yPercentile.toFixed(0)}`;
        return `<span class="bias-alert-stock" title="${escapeHtml(`${item.name || item.code} ${metric}`)}"><b>${escapeHtml(item.name || item.code || "--")}</b><em>${escapeHtml(metric)}</em></span>`;
      };
      return `<section class="bias-alert-panel" aria-label="${escapeHtml(scopeLabel)}${panelTitle}">
        <div class="bias-alert-head"><strong>${panelTitle}</strong><span>极端位置看30周乖离率或2年分位；趋势按最近3个周度乖离值判断</span></div>
        <div class="bias-alert-grid">${categories.map((category) => {
          const matched = rows.filter(category.condition);
          return `<article class="bias-alert-card ${category.key}"><div class="bias-alert-card-title"><span>${category.title}</span><span class="bias-alert-count">${matched.length}</span></div><div class="bias-alert-guide">${category.guide}</div><div class="bias-alert-stocks">${matched.length ? matched.map((item) => renderStock(item, category.key)).join("") : `<span class="bias-alert-empty">暂无命中</span>`}</div></article>`;
        }).join("")}</div>
      </section>`;
    }

    function biasMetricCell(item) {
      const bias = Number.isFinite(item?.bias30w) ? Number(item.bias30w) : NaN;
      const percentile = Number.isFinite(item?.bias2yPercentile) ? Number(item.bias2yPercentile) : NaN;
      const biasText = Number.isFinite(bias) ? `${bias > 0 ? "+" : ""}${bias.toFixed(2)}%` : "--";
      const percentileText = Number.isFinite(percentile) ? `2年分位 ${percentile.toFixed(0)}%` : "2年分位 --";
      const valueClass = Number.isFinite(bias) ? (bias > 0 ? "gain" : bias < 0 ? "loss" : "") : "muted";
      return `<td data-label="30周乖离率 / 2年分位" class="num bias-metric-cell ${valueClass}"><span>${biasText}</span><span class="muted">${percentileText}</span></td>`;
    }

                      ${formField("前瞻回购", amountInput("expectedBuybackCny", form.expectedBuybackCny, amountCurrencyFor(form, "expectedBuybackCny"), locked), { className: "input-short" })}
                      ${formField("前瞻股东回报", amountInput("expectedShareholderReturnCny", form.expectedShareholderReturnCny, amountCurrencyFor(form, "expectedShareholderReturnCny"), locked), { className: "input-short" })}

                    <div class="form-grid single follow-row">
                      ${formField("股东回报政策", `<textarea class="auto-grow-note" rows="1" data-field="shareholderReturnRemark" ${locked}>${escapeHtml(form.shareholderReturnRemark)}</textarea>`, { className: "input-wide" })}

                      ${formField("净现金盘点", amountInput("netCashCny", form.netCashCny, amountCurrencyFor(form, "netCashCny"), locked), { className: "input-short" })}
                      ${formField("现金折扣", percentStepperInput("netCashDiscountRate", form.netCashDiscountRate, locked), { className: "input-short" })}

                    <div class="form-grid single follow-row">
                      ${formField("净现金口径", `<textarea class="auto-grow-note" rows="1" data-field="netCashScope" placeholder="例如：现金及短投 - 有息负债" ${locked}>${escapeHtml(form.netCashScope || "")}</textarea>`, { className: "input-wide" })}

                  <input type="hidden" data-field="name" value="${escapeHtml(form.name)}">
                  <input type="hidden" data-field="code" value="${escapeHtml(form.code)}">
                  <input type="hidden" data-field="market" value="${escapeHtml(form.market)}">
                  <input type="hidden" data-field="exchange" value="${escapeHtml(form.exchange)}">
                  ${generalError ? `<div class="form-error">${escapeHtml(generalError)}</div>` : ""}

                <div class="result-panel">

                    <label>个人研究备注</label>
                    <textarea class="markdown-note" data-field="myNote" data-markdown="true" placeholder="支持 Markdown：记录投资假设、风险点、跟踪事项或财报观察。">${escapeHtml(form.myNote || "")}</textarea>
                  </div>
                  <div class="valuation-summary-block">
                    <h3>估值测算</h3>
                    <div class="result-grid summary">
                      ${resultItem("前瞻市值", metricMoney(c.expectedMarketCapCny, currency))}
                      ${resultItem("Upside", percent(c.upside))}
                      ${resultItem("Forward PE", c.forwardPE ? `${trimNumber(c.forwardPE)} 倍` : "--")}
                      ${resultItem("股东回报率", percent(c.shareholderReturnRate))}
                    </div>
                    <div class="disclaimer">内容为用户个人记录，不构成投资建议。</div>

              </div>

            <div class="drawer-foot">
              <div class="foot-left">
                <span class="hint">${state.formDirty ? "有未保存修改" : "所有已保存内容会保留在你的私人股池中"}</span>
                ${form.id ? `<button class="drawer-delete-link" data-action="openDeleteConfirm" data-id="${form.id}" ${state.saving ? "disabled" : ""}>删除股票</button>` : ""}
              </div>
              <div class="foot-actions">
                <button data-action="closeDrawer" ${state.saving ? "disabled" : ""}>取消</button>
                <button class="primary" data-action="saveStock" ${state.saving ? "disabled" : ""}>${state.saving ? "保存中..." : "保存股票"}</button>

    function renderVersionControl(form, locked = "") {
      const version = normalizeStockVersion(form.version);
      const mode = form.versionCustom ? "自定义" : stockVersionMode(version);
      if (mode === "自定义") {
        return `<input data-field="version" value="${escapeHtml(form.versionCustom ? (form.version || "") : version)}" placeholder="输入版本" ${locked}>`;
      }
      return `
        <select data-field="version" ${locked}>
          ${["乐观", "中性", "悲观", "自定义"].map((option) => `<option value="${option}" ${mode === option ? "selected" : ""}>${option}</option>`).join("")}
        </select>
      `;
    }

    function renderValuationAssumptions(form, currency, locked = "") {
      if (form.useSegmentValuation) return renderSegmentValuation(form, currency, locked);
      return `
        <div class="form-grid three">
          ${formField("前瞻利润", amountInput("expectedProfitCny", form.expectedProfitCny, amountCurrencyFor(form, "expectedProfitCny"), locked), { required: true, className: "input-short" })}
          ${formField("前瞻 PE", `<input class="numeric-input" type="number" step="any" data-field="expectedPE" value="${escapeHtml(form.expectedPEInput !== undefined ? form.expectedPEInput : form.expectedPE)}" required ${locked}>`, { required: true, className: "input-short" })}
          ${formField("前瞻年份", forecastYearSelect(form.forecastYear, locked), { className: "input-short" })}
        </div>
        <div class="form-grid three follow-row">
          ${formField("利润备注", `<textarea class="auto-grow-note" rows="1" data-field="expectedPERemark" ${locked}>${escapeHtml(form.expectedPERemark)}</textarea>`, { className: "input-wide span-2" })}
          ${formField("版本", renderVersionControl(form, locked), { className: "input-medium" })}
        </div>
      `;
    }

    function renderSegmentValuation(form, currency, locked = "") {
      const segments = Array.isArray(form.segmentValuations) ? form.segmentValuations : [];
      return `
        <div class="segment-valuation">
          <div class="segment-row head">
            <span>分部名</span><span>前瞻利润</span><span>前瞻 PE</span><span>前瞻年份</span><span>利润备注</span><span></span>
          </div>
          ${segments.map((segment, index) => `
            <div class="segment-row">
              <input data-segment-field="segmentName" data-segment-index="${index}" value="${escapeHtml(segment.segmentName || "")}" placeholder="分部${index + 1}" ${locked}>
              ${amountInput(`segmentProfit:${index}`, segment.expectedProfitCny, amountCurrencyFor(form, `segmentProfit:${index}`), locked)}
              <input class="numeric-input" type="number" step="any" data-segment-field="expectedPE" data-segment-index="${index}" value="${escapeHtml(segment.expectedPEInput !== undefined ? segment.expectedPEInput : segment.expectedPE)}" ${locked}>
              ${segmentForecastYearSelect(segment.forecastYear || form.forecastYear, index, locked)}
              <textarea class="auto-grow-note" rows="1" data-segment-field="expectedPERemark" data-segment-index="${index}" ${locked}>${escapeHtml(segment.expectedPERemark || "")}</textarea>
              <button class="icon segment-remove" type="button" data-action="removeSegment" data-index="${index}" title="删除分部" aria-label="删除分部" ${locked || segments.length <= 1 ? "disabled" : ""}>×</button>
            </div>
          `).join("")}
          <div class="segment-actions">
            <button type="button" data-action="addSegment" ${locked}>增加分部</button>
          </div>
          <div class="segment-total">
            ${formField("加总前瞻利润", `<div class="readonly-value"><span data-segment-total="profit">${metricMoney(form.expectedProfitCny, currency)}</span></div>`, { className: "input-short" })}
            ${formField("加总前瞻 PE", `<div class="readonly-value"><span data-segment-total="pe">${form.expectedPE ? `${trimNumber(form.expectedPE)} 倍` : "--"}</span></div>`, { className: "input-short" })}
          </div>
          <div class="segment-version">
            ${formField("版本", renderVersionControl(form, locked), { className: "input-medium" })}
          </div>
        </div>
      `;
    }

    function sectionCard(title, description, body, options = {}) {
      return `
        <section class="section-card">
          <div class="section-head">
            <h3>${escapeHtml(title)}</h3>
            ${options.titleExtra || ""}
          </div>
          ${body}
        </section>
      `;
    }

    function formField(label, control, options = {}) {
      return `
        <div class="form-field ${options.className || ""}">
          <label class="${options.required ? "required" : ""}">${escapeHtml(label)}</label>
          ${control}
          ${options.help ? `<div class="field-help">${escapeHtml(options.help)}</div>` : ""}
          ${options.error ? `<div class="inline-error">${escapeHtml(options.error)}</div>` : ""}
        </div>
      `;
    }

    function amountInput(key, cny, currency, attrs = "") {
      return `
        <div class="amount-field">
          <input class="numeric-input" type="number" step="any" data-amount="${key}" value="${escapeHtml(amountInputValueFor(state.form, key, cny, currency))}" placeholder="0.00" ${attrs}>
          <select data-amount-currency="${key}" aria-label="金额币种" ${attrs}>
            ${Object.keys(currencies).map((code) => `<option value="${code}" ${currency === code ? "selected" : ""}>亿 ${code}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function percentStepperInput(key, value, attrs = "") {
      const percent = (Number(value) || 0) * 100;
      return `
        <div class="percent-stepper">
          <button type="button" data-discount-step="-10" ${attrs}>-</button>
          <input class="numeric-input" type="text" inputmode="decimal" data-percent-field="${key}" value="${escapeHtml(formatPercentInput(percent))}" ${attrs}>
          <button type="button" data-discount-step="10" ${attrs}>+</button>
        </div>
      `;
    }

    function parsePercentInput(value) {
      const parsed = Number(String(value ?? "").replace("%", "").trim());
      return Math.min(100, Math.max(0, Number.isFinite(parsed) ? parsed : 0));
    }

    function formatPercentInput(value) {
      return `${trimNumber(parsePercentInput(value))}%`;
    }

    function field(label, key, value, type = "text") {
      return `<div class="field"><label>${label}</label><input type="${type}" data-field="${key}" value="${escapeHtml(value)}"></div>`;
    }

    function numberField(label, key, value, min = "", max = "", step = "any") {
      return `<div class="field"><label>${label}</label><input type="number" min="${min}" max="${max}" step="${step}" data-field="${key}" value="${escapeHtml(value)}"></div>`;
    }

    function amountField(label, key, cny, currency) {
      return `<div class="field"><label>${label}（${currencies[currency].unit}）</label><input type="number" step="any" data-amount="${key}" value="${escapeHtml(toDisplay(cny, currency))}"></div>`;
    }

    function selectField(label, key, value, options) {
      return `
        <div class="field">
          <label>${label}</label>
          <select data-field="${key}">
            ${options.map(([optionValue, optionLabel]) => `<option value="${optionValue}" ${value === optionValue ? "selected" : ""}>${optionLabel}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function textareaField(label, key, value) {
      return `<div class="field"><label>${label}</label><textarea data-field="${key}">${escapeHtml(value)}</textarea></div>`;
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><span>${label}</span><strong class="${cls}">${value}</strong></div>`;
    }

    function resultItem(label, value) {
      const text = value && value !== "--" ? value : "—";
      const cls = String(text).startsWith("-") ? "loss" : String(text).includes("%") && text !== "—" ? "gain" : "";
      return `<div class="result-metric"><strong>${label}</strong><span class="${cls}">${text}</span></div>`;
    }

    function forecastYearSelect(value, attrs = "") {
      const years = ["2025A"];
      for (let year = 2026; year <= 2035; year += 1) years.push(`${year}E`);
      if (value && !years.includes(value)) years.unshift(value);
      return `
        <select data-field="forecastYear" ${attrs}>
          ${years.map((year) => `<option value="${year}" ${value === year ? "selected" : ""}>${year}</option>`).join("")}
        </select>
      `;
    }

    function segmentForecastYearSelect(value, index, attrs = "") {
      const years = ["2025A"];
      for (let year = 2026; year <= 2035; year += 1) years.push(`${year}E`);
      if (value && !years.includes(value)) years.unshift(value);
      return `
        <select data-segment-field="forecastYear" data-segment-index="${index}" ${attrs}>
          ${years.map((year) => `<option value="${year}" ${value === year ? "selected" : ""}>${year}</option>`).join("")}
        </select>
      `;
    }

    function bindEvents() {
      document.getElementById("app").onclick = (event) => {
        if (state.themeMenuOpen && !event.target.closest(".theme-dock")) {
          state.themeMenuOpen = false;
          document.querySelector(".theme-dock")?.classList.remove("open");
          document.querySelector(".theme-orb")?.setAttribute("aria-expanded", "false");
        }
        const actionEl = event.target.closest("[data-action]");
        if (actionEl) onAction({ currentTarget: actionEl });
      };
      document.querySelectorAll("[data-nav-point]").forEach((target) => {
        const showTooltip = () => {
          const chart = target.closest("[data-nav-chart]");
          const tooltip = chart?.querySelector("[data-nav-tooltip]");
          if (!chart || !tooltip) return;
          const data = JSON.parse(target.dataset.navPoint || "{}");
          tooltip.innerHTML = `<strong>${escapeHtml(data.date || "")}</strong><div class="portfolio-nav-tooltip-row"><span>单位净值</span><b>${escapeHtml(data.nav || "--")}</b></div><div class="portfolio-nav-tooltip-row"><span>组合收益</span><b>${escapeHtml(data.portfolio || "--")}</b></div>${data.benchmark ? `<div class="portfolio-nav-tooltip-row"><span>${escapeHtml(state.benchmarkCode)}</span><b>${escapeHtml(data.benchmark)}</b></div>` : ""}`;
          const chartRect = chart.getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          const left = Math.min(chart.clientWidth - 178, Math.max(8, targetRect.left - chartRect.left + targetRect.width / 2 + 10));
          const top = Math.max(8, targetRect.top - chartRect.top + 18);
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${top}px`;
          tooltip.classList.add("visible");
        };
        const hideTooltip = () => target.closest("[data-nav-chart]")?.querySelector("[data-nav-tooltip]")?.classList.remove("visible");
        target.addEventListener("mouseenter", showTooltip);
        target.addEventListener("mouseleave", hideTooltip);
        target.addEventListener("focus", showTooltip);
        target.addEventListener("blur", hideTooltip);
      });
      document.querySelectorAll("[data-market-chart-point]").forEach((target) => {
        const showTooltip = () => {
          const chart = target.closest("[data-market-chart]");
          const tooltip = chart?.querySelector("[data-market-chart-tooltip]");
          if (!chart || !tooltip) return;
          const data = JSON.parse(target.dataset.marketChartPoint || "{}");
          tooltip.innerHTML = `<strong>${escapeHtml(data.date || "")}</strong>${(data.entries || []).map((entry) => `<div class="market-insight-chart-tooltip-row"><span>${escapeHtml(entry.label || "")}</span><b>${escapeHtml(entry.value || "--")}</b></div>`).join("")}`;
          const chartRect = chart.getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          const left = Math.min(chart.clientWidth - 210, Math.max(8, targetRect.left - chartRect.left + targetRect.width / 2 + 10));
          const top = Math.max(8, targetRect.top - chartRect.top + 18);
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${top}px`;
          tooltip.classList.add("visible");
        };
        const hideTooltip = () => target.closest("[data-market-chart]")?.querySelector("[data-market-chart-tooltip]")?.classList.remove("visible");
        target.addEventListener("mouseenter", showTooltip);
        target.addEventListener("mouseleave", hideTooltip);
        target.addEventListener("focus", showTooltip);
        target.addEventListener("blur", hideTooltip);
      });
      document.querySelectorAll("[data-filter]").forEach((el) => {
        el.addEventListener("click", () => { state.filter = el.dataset.filter; render(); });
      });
      document.querySelectorAll("[data-sort]").forEach((el) => {
        el.addEventListener("click", () => toggleSort(el.dataset.sort));
      });
      bindRowDragEvents();
      const stockConnectTax = document.querySelector("[data-input='stockConnectTax']");
      if (stockConnectTax) {
        stockConnectTax.addEventListener("click", (event) => event.stopPropagation());
        stockConnectTax.addEventListener("change", (event) => {
          state.stockConnectDividendTax = event.target.checked;
          render();
        });
      }
      document.querySelectorAll("[data-field]").forEach((el) => {
        el.addEventListener("input", () => {
          updateFormField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
          if (el.matches("textarea.auto-grow-note")) autoGrowTextarea(el);
        });
        el.addEventListener("change", () => updateFormField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value));
      });
      document.querySelectorAll("textarea.auto-grow-note").forEach(autoGrowTextarea);
      document.querySelectorAll("[data-amount]").forEach((el) => {
        el.addEventListener("input", () => updateAmountField(el.dataset.amount, el.value));
      });
      document.querySelectorAll("[data-amount-currency]").forEach((el) => {
        el.addEventListener("change", () => updateAmountCurrency(el.dataset.amountCurrency, el.value));
      });
      document.querySelectorAll("[data-segment-field]").forEach((el) => {
        el.addEventListener("input", () => {
          updateSegmentField(Number(el.dataset.segmentIndex), el.dataset.segmentField, el.value);
          if (el.matches("textarea.auto-grow-note")) autoGrowTextarea(el);
        });
        el.addEventListener("change", () => updateSegmentField(Number(el.dataset.segmentIndex), el.dataset.segmentField, el.value));
      });
      document.querySelectorAll("[data-percent-field]").forEach((el) => {
        el.addEventListener("input", () => updatePercentField(el.dataset.percentField, el.value));
        el.addEventListener("change", () => {
          updatePercentField(el.dataset.percentField, el.value);
          el.value = formatPercentInput((Number(state.form?.[el.dataset.percentField]) || 0) * 100);
        });
      });
      document.querySelectorAll("[data-discount-step]").forEach((el) => {
        el.addEventListener("click", () => stepDiscountField(Number(el.dataset.discountStep)));
      });
      const loginForm = document.querySelector("[data-form='login']");
      if (loginForm) loginForm.addEventListener("submit", onLogin);
      const profileForm = document.querySelector("[data-form='profile']");
      if (profileForm) profileForm.addEventListener("submit", onProfileSubmit);
      const listSearch = document.querySelector("[data-input='searchList']");
      if (listSearch) {
        const applyListSearch = (input) => {
          state.query = input.value;
          const selectionStart = input.selectionStart;
          const selectionEnd = input.selectionEnd;
          render();
          const nextInput = document.querySelector("[data-input='searchList']");
          if (!nextInput) return;
          nextInput.focus({ preventScroll: true });
          if (Number.isInteger(selectionStart) && Number.isInteger(selectionEnd)) nextInput.setSelectionRange(selectionStart, selectionEnd);
        };
        listSearch.addEventListener("compositionstart", () => { listSearch.dataset.composing = "true"; });
        listSearch.addEventListener("compositionend", (event) => {
          delete event.currentTarget.dataset.composing;
          applyListSearch(event.currentTarget);
        });
        listSearch.addEventListener("input", (event) => {
          const input = event.currentTarget;
          state.query = input.value;
          if (event.isComposing || input.dataset.composing === "true") return;
          applyListSearch(input);
        });
      }
      const marketInsightSearch = document.querySelector("[data-input='marketInsightSearch']");
      if (marketInsightSearch) {
        const applyMarketInsightSearch = (input) => {
          state.marketInsightSearch = input.value;
          state.marketInsightPage = 1;
          const selectionStart = input.selectionStart;
          const selectionEnd = input.selectionEnd;
          render();
          const nextInput = document.querySelector("[data-input='marketInsightSearch']");
          if (!nextInput) return;
          nextInput.focus({ preventScroll:true });
          if (Number.isInteger(selectionStart) && Number.isInteger(selectionEnd)) nextInput.setSelectionRange(selectionStart, selectionEnd);
        };
        marketInsightSearch.addEventListener("compositionstart", () => { marketInsightSearch.dataset.composing = "true"; });
        marketInsightSearch.addEventListener("compositionend", (event) => {
          delete event.currentTarget.dataset.composing;
          applyMarketInsightSearch(event.currentTarget);
        });
        marketInsightSearch.addEventListener("input", (event) => {
          if (event.currentTarget.dataset.composing !== "true") applyMarketInsightSearch(event.currentTarget);
        });
      }
      const navYear = document.querySelector("[data-input='navYear']");
      if (navYear) navYear.addEventListener("change", (event) => { state.navYear = event.target.value; state.navRange = event.target.value ? "YEAR" : "ALL"; render(); });
      const benchmark = document.querySelector("[data-input='benchmark']");
      if (benchmark) benchmark.addEventListener("change", (event) => { state.benchmarkCode = event.target.value; render(); });
      const portfolioAccountType = document.querySelector("[data-input='portfolioAccountType']");
      if (portfolioAccountType) portfolioAccountType.addEventListener("change", (event) => {
        document.querySelectorAll("[data-account-fields]").forEach((el) => { el.style.display = el.dataset.accountFields === event.target.value ? "block" : "none"; });
      });
      const initializationAccountType = document.querySelector("[data-input='initializationAccountType']");
      if (initializationAccountType) initializationAccountType.addEventListener("change", (event) => {
        if (state.portfolioModal?.type !== "initialize") return;
        state.portfolioModal.accountType = event.target.value;
        render();
      });
      document.querySelectorAll("[data-init-field]").forEach((input) => input.addEventListener("input", () => {
        if (state.portfolioModal?.type === "initialize") state.portfolioModal[input.dataset.initField] = input.value;
      }));
      document.querySelectorAll("[data-init-row-field]").forEach((input) => input.addEventListener("input", () => {
        const row = state.portfolioModal?.rows?.find((item) => item.id === input.dataset.rowId);
        if (row) row[input.dataset.initRowField] = input.value;
      }));
      document.querySelectorAll("[data-input='initializationStockSearch']").forEach((input) => {
        input.addEventListener("input", onInitializationStockSearch);
      });
      document.querySelectorAll("[data-input='portfolioStockSearch']").forEach((portfolioSearch) => {
        portfolioSearch.addEventListener("compositionstart", () => { state.portfolioSearchComposing = true; });
        portfolioSearch.addEventListener("compositionend", (event) => {
          state.portfolioSearchComposing = false;
          onPortfolioStockSearch(event);
        });
        portfolioSearch.addEventListener("input", (event) => {
          if (!state.portfolioSearchComposing && !event.isComposing) onPortfolioStockSearch(event);
        });
      });
      const portfolioValuationVersion = document.querySelector("[data-input='portfolioValuationVersion']");
      if (portfolioValuationVersion) portfolioValuationVersion.addEventListener("change", (event) => {
        const preview = document.querySelector("[data-portfolio-valuation-preview]");
        if (preview && state.portfolioModal?.position) preview.innerHTML = renderPortfolioValuationPreview(state.portfolioModal.position, event.target.value);
        refreshPositionPlanValuations();
      });
      const createPortfolioForm = document.querySelector("[data-form='createPortfolio']");
      if (createPortfolioForm) createPortfolioForm.addEventListener("submit", submitCreatePortfolio);
      const initializePortfolioForm = document.querySelector("[data-form='initializePortfolio']");
      if (initializePortfolioForm) initializePortfolioForm.addEventListener("submit", submitInitializePortfolio);
      const renamePortfolioForm = document.querySelector("[data-form='renamePortfolio']");
      if (renamePortfolioForm) renamePortfolioForm.addEventListener("submit", submitRenamePortfolio);

    async function loadPortfolioPerformance() {
      const portfolio = activePortfolio();
      if (!portfolio || !state.session?.access_token || state.session.access_token === "local-demo") return;
      const requestedPortfolioId = portfolio.id;
      try {
        const [navRows, benchmarkRows] = await Promise.all([
          supabaseRequest(`/rest/v1/portfolio_daily_nav?portfolio_id=eq.${encodeURIComponent(portfolio.id)}&select=nav_date,unit_nav,total_assets,total_units,cash_value,position_value,base_currency,fx_rates,price_status&order=nav_date.asc`),
          supabaseRequest(`/rest/v1/benchmark_daily_close?select=benchmark_code,trade_date,close_value&order=trade_date.asc`)
        ]);
        if (state.activePortfolioId !== requestedPortfolioId) return;
        state.navHistory = (navRows || []).map((row) => ({ ...row, ...(portfolio.navHistoryCorrections?.[row.nav_date] || {}) }));
        state.navHistoryPortfolioId = requestedPortfolioId;
        state.benchmarkHistory = benchmarkRows || [];
      } catch (error) {
        console.warn("净值历史表尚未就绪。", error);
        if (state.activePortfolioId !== requestedPortfolioId) return;
        state.navHistory = [];
        state.navHistoryPortfolioId = requestedPortfolioId;
        state.benchmarkHistory = [];
      }
    }

    function portfolioStorageKey() {
      return `${PORTFOLIO_STORAGE_PREFIX}${state.session?.user?.id || "guest"}`;
    }

    function normalizePortfolioPositionIds(portfolios) {
      let changed = false;
      const seenIds = new Set();
      const normalized = (portfolios || []).map((portfolio) => ({
        ...portfolio,
        positions: (portfolio.positions || []).map((position) => {
          const currentId = typeof position.id === "string" ? position.id.trim() : "";
          if (currentId && !seenIds.has(currentId)) {
            seenIds.add(currentId);
            return position;
          }
          const positionId = id("position");
          seenIds.add(positionId);
          changed = true;
          return { ...position, id: positionId };
        })
      }));
      return { portfolios: normalized, changed };
    }

    function settleExpiredOptionsInPortfolio(portfolio) {
      const today=portfolioCalendarDateString(new Date());
      const expired=(portfolio.positions||[]).filter((position)=>position.assetType==="option"&&position.expiryDate&&position.expiryDate<today);
      if(!expired.length) return {portfolio,changed:false};
      let positions=[...(portfolio.positions||[])],cash={...(portfolio.cash||{})},tradeHistory=[...(portfolio.tradeHistory||[])],changed=false;
      expired.forEach((option)=>{
        const underlying=positions.find((position)=>position.assetType!=="option"&&optionUnderlyingKey(position)===optionUnderlyingKey(option));
        const underlyingPrice=Number(underlying?.latestPrice)||Number(option.underlyingLatestPrice)||0,strike=Number(option.strikePrice)||0;
        const itm=option.optionType==="call"?underlyingPrice>strike:underlyingPrice<strike;
        positions=positions.filter((position)=>position.id!==option.id);
        const settledAt=new Date().toISOString();
        if(!itm){
          tradeHistory.push({id:id("trade"),positionId:option.id,assetType:"option",code:option.code,type:"expire",contracts:option.contracts,occurredAt:settledAt});
          changed=true;
          return;
        }
        const direction=option.direction==="short"?-1:1,optionFactor=option.optionType==="call"?1:-1;
        const sharesDelta=direction*optionFactor*Number(option.contracts||0)*Number(option.contractMultiplier||0);
        const currency=option.currency||marketCurrency(option.market),cashCurrency=portfolio.accountType==="CNY"?"CNY":currency;
        const cashDelta=-sharesDelta*strike*portfolioFx(currency,cashCurrency);
        cash[cashCurrency]=Number(cash[cashCurrency]||0)+cashDelta;
        const stockIndex=positions.findIndex((position)=>position.assetType!=="option"&&optionUnderlyingKey(position)===optionUnderlyingKey(option));
        if(stockIndex>=0){
          const stock=positions[stockIndex],oldShares=Number(stock.shares||0),nextShares=oldShares+sharesDelta;
          if(!nextShares) positions.splice(stockIndex,1);
          else{
            const sameDirection=!oldShares||Math.sign(oldShares)===Math.sign(sharesDelta);
            const nextCost=sameDirection?(Math.abs(oldShares)*Number(stock.averageCost||strike)+Math.abs(sharesDelta)*strike)/(Math.abs(oldShares)+Math.abs(sharesDelta)):Math.sign(nextShares)===Math.sign(oldShares)?Number(stock.averageCost||strike):strike;
            positions[stockIndex]={...stock,shares:nextShares,averageCost:roundPortfolioCost(nextCost),latestPrice:underlyingPrice||stock.latestPrice};
          }
        }else{
          positions.push({id:id("position"),name:option.underlyingName||option.underlyingCode,code:option.underlyingCode,rawCode:option.rawCode||"",market:option.market,exchange:option.exchange||"",quoteId:option.quoteId||"",currency,shares:sharesDelta,averageCost:roundPortfolioCost(strike),latestPrice:underlyingPrice||strike,previousClose:underlyingPrice||strike,priceUpdatedAt:settledAt});
        }
        tradeHistory.push({id:id("trade"),positionId:option.id,assetType:"option",code:option.code,type:"exercise",contracts:option.contracts,shares:Math.abs(sharesDelta),price:strike,currency,occurredAt:settledAt});
        changed=true;
      });
      return {portfolio:{...portfolio,positions,cash,tradeHistory,updatedAt:new Date().toISOString()},changed};
    }

    function settleExpiredOptions() {
      let changed=false;
      state.portfolios=state.portfolios.map((portfolio)=>{
        const result=settleExpiredOptionsInPortfolio(portfolio);
        changed=changed||result.changed;
        return result.portfolio;
      });
      return changed;
    }

      portfolioInitializationSearchTimer = window.setTimeout(async () => {

          if (requestId !== portfolioInitializationSearchRequestId || row.query.trim() !== query) return;

      if (!modal || !["open","plan","rebalance"].includes(modal.type)) return;
      if (modal.type === "rebalance") {
        const safeSide = side === "buy" ? "buy" : "sell";
        state.portfolioModal.searchSide = safeSide;
        state.portfolioModal[`${safeSide}Query`] = query;
        state.portfolioModal[`${safeSide}Stock`] = null;
        state.portfolioModal[`${safeSide}Price`] = "";
      } else {
        state.portfolioModal.searchQuery = query;
        state.portfolioModal.stock = null;
      }
      state.portfolioSearchResults = [];
      if (!query) {
        state.portfolioSearchLoading = false;
        render();
        return;
      }
      state.portfolioSearchLoading = true;
      const expectedQuery = query;
      render();
      try {
        const results = state.portfolioModal?.type==="open"&&state.portfolioModal?.searchOptions ? await searchOptions(query) : await searchStocks(query);
        if (state.portfolioModal?.type === "rebalance") {
          const safeSide = side === "buy" ? "buy" : "sell";
          if (state.portfolioModal?.[`${safeSide}Query`] !== expectedQuery || state.portfolioModal?.searchSide !== safeSide) return;
        } else if (state.portfolioModal?.searchQuery !== expectedQuery) return;
        state.portfolioSearchResults = results;
      } finally {
        if (state.portfolioModal?.type === "rebalance") {
          const safeSide = side === "buy" ? "buy" : "sell";
          if (state.portfolioModal?.[`${safeSide}Query`] === expectedQuery) state.portfolioSearchLoading = false;
        } else if (state.portfolioModal?.searchQuery === expectedQuery) state.portfolioSearchLoading = false;
      }
      render();
      requestAnimationFrame(() => {
        const selector = state.portfolioModal?.type === "rebalance" ? `[data-input='portfolioStockSearch'][data-side='${side === "buy" ? "buy" : "sell"}']` : "[data-input='portfolioStockSearch']";

      if (!name) return showPortfolioError("请输入组合名称。");
      if (state.portfolios.some((item) => item.id !== modal.portfolioId && item.name.trim().toLowerCase() === name.toLowerCase())) return showPortfolioError("组合名称不能重复。");
      if (Object.values(amounts).some((value) => !Number.isFinite(value) || value < 0)) return showPortfolioError("启动金额和现金不能小于 0。");
      const startBase = accountType === "HKUS" ? amounts.startUsd + amounts.startHkd * portfolioFx("HKD", "USD") : amounts.startCny;
      if (startBase <= 0) return showPortfolioError("组合启动金额必须大于 0。");
      const completedRows = (modal.rows || []).filter((row) => row.stock || row.shares || row.averageCost);
      for (const row of completedRows) {
        if (!row.stock) return showPortfolioError("请为每一行持仓选择股票。");
        if (!(Number(row.shares) > 0)) return showPortfolioError(`${row.stock.name} 的持股数必须大于 0。`);
        if (!(Number(row.averageCost) > 0)) return showPortfolioError(`${row.stock.name} 的摊薄成本必须大于 0。`);
        if (accountType === "CNY" && !["CN", "HK"].includes(row.stock.market)) return showPortfolioError("人民币账户只能导入 A 股或港股通股票。");
        if (accountType === "HKUS" && !["HK", "US"].includes(row.stock.market)) return showPortfolioError("港美账户只能导入港股或美股。");
      }
      const duplicate = completedRows.find((row, index) => completedRows.findIndex((other) => other.stock.code === row.stock.code && other.stock.market === row.stock.market) !== index);
      if (duplicate) return showPortfolioError(`${duplicate.stock.name} 重复录入，请合并为一行。`);
      state.portfolioError = "";
      const now = new Date().toISOString();
      const positions = await Promise.all(completedRows.map(async (row) => {
        let quote = row.stock;
        try { quote = { ...row.stock, ...(await fetchQuote(row.stock)) }; } catch (error) { console.warn("初始化行情读取失败，暂以摊薄成本计算。", error); }
        const existingPosition = existing?.positions?.find((item) => item.code === row.stock.code && item.market === row.stock.market);
        return {
          ...(existingPosition || {}), id: existingPosition?.id || id("position"), name: row.stock.name, code: row.stock.code, rawCode: row.stock.rawCode || row.stock.code,
          market: row.stock.market, exchange: row.stock.exchange, quoteId: row.stock.quoteId,
          currency: row.stock.currency || marketCurrency(row.stock.market), shares: Number(row.shares), averageCost: roundPortfolioCost(row.averageCost),
          latestPrice: Number(quote.latestPrice) || Number(row.averageCost), previousClose: Number(quote.previousClose) || 0,
          changePercent: Number.isFinite(Number(quote.changePercent)) ? Number(quote.changePercent) : null,
          targetWeight: Number(existingPosition?.targetWeight || 0), priceUpdatedAt: now, createdAt: existingPosition?.createdAt || now, updatedAt: now
        };
      }));
      const portfolio = {
        ...(existing || {}), id: existing?.id || id("portfolio"), name, accountType,
        startCny: accountType === "CNY" ? amounts.startCny : 0,
        startHkd: accountType === "HKUS" ? amounts.startHkd : 0,
        startUsd: accountType === "HKUS" ? amounts.startUsd : 0,
        startBase, totalUnits: startBase,
        cash: accountType === "HKUS" ? { CNY: 0, HKD: amounts.cashHkd, USD: amounts.cashUsd } : { CNY: amounts.cashCny, HKD: 0, USD: 0 },
        positions, tradeHistory: existing?.tradeHistory || [], cashFlows: existing?.cashFlows || [], initializationMethod: "import", initializedAt: now, createdAt: existing?.createdAt || now, updatedAt: now
      };
      if (existing) state.portfolios = state.portfolios.map((item) => item.id === existing.id ? portfolio : item);
      else state.portfolios.push(portfolio);
      state.activePortfolioId = portfolio.id;
      savePortfolios();
      closePortfolioModal();
    }

    function submitCalibrateCash(event) {

    function renderDeletePortfolioModal() {
      const portfolio = activePortfolio();
      const positionCount = portfolio?.positions?.length || 0;
      const detail = positionCount ? `当前组合包含 ${positionCount} 只持仓，现金、持仓、交易流水和净值数据都会一并删除。` : "当前组合的现金、交易流水和净值数据都会一并删除。";
      return modalShell("删除组合", `
        <div class="portfolio-delete-warning">
          <strong>这是不可逆操作。</strong>
          <span>你将删除组合「${escapeHtml(portfolio?.name || "当前组合")}」。${escapeHtml(detail)}</span>
        </div>
        <label class="field"><span>请输入 0000 确认删除</span><input name="confirmCode" inputmode="numeric" pattern="0000" autocomplete="off" placeholder="0000" required></label>
      `, "deletePortfolio", "确认删除", "portfolio-delete-modal");
    }

    function renderCashModal(modal) {
      const portfolio = activePortfolio();
      const isHkus = portfolio?.accountType === "HKUS";
      return modalShell("校准现金", isHkus ? `
        <div class="grid-2"><label class="field"><span>港币余额（万港币）</span><input name="cashHkd" type="number" min="0" step="any" value="${Number(portfolio.cash?.HKD || 0) / 10000}" required></label><label class="field"><span>美元余额（万美元）</span><input name="cashUsd" type="number" min="0" step="any" value="${Number(portfolio.cash?.USD || 0) / 10000}" required></label></div>
      ` : `<label class="field"><span>人民币余额（万元）</span><input name="cashCny" type="number" min="0" step="any" value="${Number(portfolio?.cash?.CNY || 0) / 10000}" required></label>`, "calibrateCash", "保存");
    }

    function renderCashFlowModal(modal) {
      const portfolio = activePortfolio();
      const isSubscription = modal.type === "subscription";
      const currenciesForAccount = portfolio?.accountType === "HKUS" ? ["HKD", "USD"] : ["CNY"];
      return modalShell(isSubscription ? "申购" : "赎回", `
        <label class="field"><span>币种</span><select name="currency">${currenciesForAccount.map((currency) => `<option value="${currency}">${currencies[currency].label}</option>`).join("")}</select></label>
        <label class="field"><span>${isSubscription ? "申购" : "赎回"}金额（万原币）</span><input name="amount" type="number" min="0.000001" step="any" required></label>
        <div class="muted">按操作前盘中估算净值折算份额；${isSubscription ? "资金增加、份额增加" : "资金减少、份额减少"}，单位净值不因资金流入流出突变。</div>
      `, "portfolioCashFlow", isSubscription ? "确认申购" : "确认赎回");
    }

    function renderRebalanceStockSearch(modal, side) {
      const queryKey = `${side}Query`;
      const stockKey = `${side}Stock`;
      const stock = modal[stockKey];
      const isActive = modal.searchSide === side;
      return `
        <label class="field"><span>${side === "sell" ? "卖出" : "买入"}股票名称/代码搜索</span><div class="search-combobox">
          <input data-input="portfolioStockSearch" data-side="${side}" autocomplete="off" placeholder="输入股票名称、代码或拼音" value="${escapeHtml(modal[queryKey] || "")}">
          ${isActive && (state.portfolioSearchLoading || state.portfolioSearchResults.length || (modal[queryKey] && !stock)) ? `<div class="search-results show">
            ${state.portfolioSearchLoading ? `<div class="empty" style="padding:18px">正在匹配股票...</div>` : state.portfolioSearchResults.length ? state.portfolioSearchResults.map((item, index) => `<button type="button" class="result-item" data-action="selectPortfolioStock" data-side="${side}" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}</span></span></button>`).join("") : `<div class="empty" style="padding:18px">没有匹配结果，请尝试其他名称或代码。</div>`}
          </div>` : ""}
        </div></label>
      `;
    }

    function rebalanceCurrentPosition(stock, portfolio) {
      if (!stock || !portfolio) return null;
      return (portfolio.positions || []).find((item) => item.code === stock.code && item.market === stock.market) || null;
    }

    function rebalanceSidePreview(modal, side, portfolio, metrics) {
      const stock = modal[`${side}Stock`];
      const position = rebalanceCurrentPosition(stock, portfolio);
      const currency = stock?.currency || marketCurrency(stock?.market);
      const price = Number(modal[`${side}Price`] || stock?.latestPrice || position?.latestPrice || position?.averageCost || 0);
      const shares = Number(modal[`${side}Shares`] || 0);
      const currentRatio = position && metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase * 100 : 0;
      const tradeBase = price > 0 && shares > 0 ? price * shares * portfolioFx(currency, portfolioBaseCurrency(portfolio)) : 0;
      const tradeRatio = metrics.netBase ? tradeBase / metrics.netBase * 100 : 0;
      const afterRatio = side === "sell" ? Math.max(0, currentRatio - tradeRatio) : currentRatio + tradeRatio;
      return { currentRatio, tradeRatio, afterRatio };
    }

    function renderRebalancePreview(modal, side, portfolio, metrics) {
      const preview = rebalanceSidePreview(modal, side, portfolio, metrics);
      const label = side === "sell" ? "本次卖出仓位" : "本次买入仓位";
      const afterLabel = side === "sell" ? "卖出后仓位" : "买入后仓位";
      return `<div class="rebalance-preview">
        <div class="rebalance-preview-item"><span>当前持仓仓位</span><strong data-rebalance-preview="${side}-current">${preview.currentRatio.toFixed(2)}%</strong></div>
        <div class="rebalance-preview-item"><span>${label}</span><strong data-rebalance-preview="${side}-trade">${preview.tradeRatio.toFixed(2)}%</strong></div>
        <div class="rebalance-preview-item"><span>${afterLabel}</span><strong data-rebalance-preview="${side}-after">${preview.afterRatio.toFixed(2)}%</strong></div>
      </div>`;
    }

    function renderRebalanceQuick(side) {
      return `<div class="rebalance-quick">${[
        ["1/5", 0.2],
        ["1/4", 0.25],
        ["1/3", 1 / 3],
        ["1/2", 0.5]
      ].map(([label, ratio]) => `<button type="button" data-rebalance-ratio-side="${side}" data-rebalance-ratio="${ratio}">${label}</button>`).join("")}</div>`;
    }

    function renderRebalanceModal(modal) {
      const portfolio = activePortfolio();
      const metrics = portfolioMetrics(portfolio);
      const side = (key, label, className) => {
        const stock = modal[`${key}Stock`];
        const position = rebalanceCurrentPosition(stock, portfolio);
        const currency = stock?.currency || position?.currency || "";
        const price = modal[`${key}Price`] ?? (stock?.latestPrice || position?.latestPrice || "");
        return `<section class="rebalance-side ${className}">
          <h3>${label}</h3>
          ${renderRebalanceStockSearch(modal, key)}
          <div class="rebalance-fields">
            <label class="field"><span>${key === "sell" ? "卖出价格" : "买入价格"}</span><div class="input-with-suffix"><input name="${key}Price" data-rebalance-price="${key}" type="number" min="0.000001" step="any" value="${Number(price) || ""}" required><span class="input-suffix">${currency || "原币"}</span></div></label>
            <label class="field"><span class="rebalance-field-title"><span>${key === "sell" ? "卖出数量" : "买入数量"}</span>${key === "sell" && position ? `<span class="rebalance-holding-note">当前持有 ${Number(position.shares).toLocaleString("zh-CN")} 股</span>` : ""}</span><div class="input-with-suffix"><input name="${key}Shares" data-rebalance-shares="${key}" type="number" min="1" step="1" value="${Number(modal[`${key}Shares`] || 0) || ""}" ${key === "sell" && position ? `max="${Number(position.shares)}"` : ""}><span class="input-suffix">股</span></div>${renderRebalanceQuick(key)}</label>
          </div>
          ${renderRebalancePreview(modal, key, portfolio, metrics)}
        </section>`;
      };
      return modalShell("调仓", `<div class="rebalance-grid">${side("sell", "卖出", "sell")}${side("buy", "买入", "buy")}</div>`, "rebalanceTrade", "确认调仓", "rebalance-modal");
    }

    function renderPositionModal(modal) {
      const portfolio = activePortfolio();
      const isOpen = modal.type === "open";
      const position = modal.position;
      const title = isOpen ? "开仓" : modal.type === "add" ? "加仓" : "减持";
      const stockBlock = isOpen ? `
        <label class="field"><span>股票名称/代码搜索</span><div class="search-combobox">
          <input data-input="portfolioStockSearch" autocomplete="off" placeholder="输入股票名称、代码或拼音，例如：腾讯 / 0700 / AAPL" value="${escapeHtml(modal.searchQuery || "")}">
          ${(state.portfolioSearchLoading || state.portfolioSearchResults.length || (modal.searchQuery && !modal.stock)) ? `<div class="search-results show">
            ${state.portfolioSearchLoading ? `<div class="empty" style="padding:18px">正在匹配股票...</div>` : state.portfolioSearchResults.length ? state.portfolioSearchResults.map((item, index) => `<button type="button" class="result-item" data-action="selectPortfolioStock" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}</span></span></button>`).join("") : `<div class="empty" style="padding:18px">没有匹配结果，请尝试其他名称或代码。</div>`}
          </div>` : ""}
        </div></label>
      ` : `<div class="portfolio-selected-stock"><strong>${escapeHtml(position.name)}</strong> <span class="stock-code">${escapeHtml(position.code)} · ${position.currency}</span></div>`;
      const currency = modal.stock?.currency || position?.currency || "";
      if (modal.type === "edit") return modalShell("编辑持仓", `<div class="position-edit-layout">
        <div class="position-edit-main">${stockBlock}
          <div class="grid-2 position-edit-fields"><label class="field"><span>摊薄成本</span><div class="input-with-suffix"><input name="price" type="number" min="0.000001" step="any" value="${Number(position.averageCost)}" required><span class="input-suffix">HKD</span></div></label><label class="field"><span>持股数</span><div class="input-with-suffix"><input name="shares" type="number" min="1" step="1" value="${Number(position.shares)}" required><span class="input-suffix">股</span></div></label></div>
          <label class="field"><span>目标仓位</span><div class="position-target-control"><button type="button" data-target-weight-step="-1" aria-label="降低目标仓位">−</button><input name="targetWeight" type="text" inputmode="decimal" value="${formatPositionTargetWeight(position.targetWeight)}" required><button type="button" data-target-weight-step="1" aria-label="提高目标仓位">+</button></div><div class="position-target-quick">${[2,3,5,8,15,25,35].map((value) => `<button type="button" data-target-weight-value="${value}">${value}%</button>`).join("")}</div></label>
        </div>
        ${renderPositionTradePlan(position)}
      </div>`, "positionTrade", "保存", "position-edit-modal");
      const stockMarket = modal.stock?.market || position?.market || "";
      const stockConnectNote = portfolio?.accountType === "CNY" && stockMarket === "HK"
        ? `<div class="muted">港股通按港币成交价录入，成交金额将按当前汇率折算为人民币现金。</div>`
        : "";
      const suggestion = !isOpen ? positionTradeSuggestion(position, portfolio, modal.type) : null;
      const suggestedShares = suggestion?.action === modal.type ? suggestion.gridShares : 0;
      const defaultTradeShares = modal.type === "add" ? "" : (suggestedShares || "");
      const suggestionBlock = suggestion ? renderPositionTradeSuggestion(suggestion, modal.type) : "";
      const tradeFields = `<div class="grid-2"><label class="field"><span>${modal.type === "reduce" ? "卖出" : "买入"}价格</span><div class="input-with-suffix"><input name="price" type="number" min="0.000001" step="any" value="${Number(position?.latestPrice) || ""}" required><span class="input-suffix">${currency || "原币"}</span></div></label><label class="field"><span>${modal.type === "reduce" ? "卖出" : "买入"}数量</span><div class="input-with-suffix"><input name="shares" type="number" min="1" step="1" value="${defaultTradeShares}" required ${modal.type === "reduce" ? `max="${position.shares}"` : ""}><span class="input-suffix">股</span></div></label></div>`;
      const tradeMain = `${stockBlock}${suggestionBlock}${tradeFields}${stockConnectNote}${modal.type === "reduce" ? `<div class="muted">当前持有 ${Number(position.shares).toLocaleString("zh-CN")} 股</div>` : ""}`;
      const body = isOpen ? tradeMain : `<div class="position-trade-layout"><div class="position-trade-main">${tradeMain}</div>${renderPositionTradePlanReadonly(position, modal.type === "reduce" ? "sell" : "buy")}</div>`;
      return modalShell(title, body, "positionTrade", modal.type === "reduce" ? "确认减持" : "确认买入", isOpen ? "" : "position-trade-modal");
    }

    function normalizedPositionTradePlan(position) {
      const source = position?.tradePlan || {};
      const normalizeSide = (side) => Array.from({ length: 3 }, (_, index) => {
        const row = Array.isArray(source[side]) ? source[side][index] : null;
        return { price: Number(row?.price) || "", shares: Number(row?.shares) || "", done: Boolean(row?.done) };
      });
      return { buy: normalizeSide("buy"), sell: normalizeSide("sell") };
    }

    function renderPositionTradeSuggestion(suggestion, type) {
      const isAdd = type === "add";
      const title = isAdd ? "加仓建议" : "减仓建议";
      const summary = `当前 ${suggestion.currentWeight.toFixed(2)}% · 目标 ${suggestion.targetWeight.toFixed(2)}% · 差额 ${suggestion.gapPercent > 0 ? "+" : ""}${suggestion.gapPercent.toFixed(2)}%`;
      let message = "";
      if (suggestion.targetWeight <= 0) {
        message = "尚未设置有效目标仓位，暂不提供建议。";
      } else if (suggestion.action === type) {
        message = `建议${isAdd ? "买入" : "卖出"}约 <strong>${suggestion.fullShares.toLocaleString("zh-CN")} 股</strong>到达目标；按四档网格分批，本次建议 <strong>${suggestion.gridShares.toLocaleString("zh-CN")} 股</strong>。`;
      } else if (isAdd && suggestion.gapPercent < 0) {
        message = `当前仓位已超配 ${Math.abs(suggestion.gapPercent).toFixed(2)}%，不建议加仓。`;
      } else if (!isAdd && suggestion.gapPercent > 0) {
        message = `当前仓位仍低配 ${suggestion.gapPercent.toFixed(2)}%，不建议减仓。`;
      } else {
        message = `当前仓位已接近目标，不建议${isAdd ? "加仓" : "减仓"}。`;
      }
      return `<div class="trade-suggestion"><strong>${title}</strong><br>${summary}<br>${message}</div>`;
    }

    function parsePositionTargetWeight(value) {
      const parsed = Number(String(value ?? "").replace("%", "").trim());
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function formatPositionTargetWeight(value) {
      const parsed = Number(value) || 0;
      return `${Number.isInteger(parsed) ? parsed : parsed.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}%`;
    }

    function renderPositionTradePlan(position) {
      const plan = normalizedPositionTradePlan(position);
      const currency = position?.currency || "原币";
      const rows = (side, label) => plan[side].map((row, index) => `<div class="position-plan-row plan-${side}">
        <span>${label}${index + 1}</span>
        <div class="input-with-suffix"><input name="plan_${side}_${index}_price" type="number" min="0" step="any" value="${row.price}" placeholder="价格" aria-label="${label}${index + 1}价格"><span class="input-suffix">${currency}</span></div>
        <div class="input-with-suffix"><input name="plan_${side}_${index}_shares" type="number" min="0" step="1" value="${row.shares}" placeholder="股数" aria-label="${label}${index + 1}股数"><span class="input-suffix">股</span></div>
        <input name="plan_${side}_${index}_done" type="checkbox" ${row.done ? "checked" : ""} aria-label="${label}${index + 1}完成">
      </div>`).join("");
      return `<section class="position-plan"><h3>加减仓计划</h3><div class="position-plan-head"><span>计划</span><span>价格</span><span>股数</span><span>完成</span></div>${rows("buy", "买点")}${rows("sell", "卖点")}</section>`;
    }

    function renderPositionTradePlanReadonly(position, side) {
      const plan = normalizedPositionTradePlan(position)[side];
      const label = side === "buy" ? "买点" : "卖点";
      const currency = position?.currency || "原币";
      const rows = plan.map((row, index) => `<div class="position-plan-row plan-${side}"><span>${label}${index + 1}</span><div class="position-plan-value">${row.price ? `${row.price} ${currency}` : "--"}</div><div class="position-plan-value">${row.shares ? `${row.shares} 股` : "--"}</div><input type="checkbox" data-plan-live-done data-position-id="${position.id}" data-plan-side="${side}" data-plan-index="${index}" ${row.done ? "checked" : ""} aria-label="${label}${index + 1}完成"></div>`).join("");
      return `<section class="position-plan-readonly"><div class="position-plan-head"><span>计划</span><span>价格</span><span>股数</span><span>完成</span></div>${rows}</section>`;
    }

    function renderSquare() {
      const query = state.query.trim().toLowerCase();
      let profiles = [...state.squareProfiles];
      if (query) profiles = profiles.filter((item) => `${item.nickname} ${item.email || ""}`.toLowerCase().includes(query));
      profiles.sort((a, b) => {
        if (state.squareSort === "count") return (b.stockCount || 0) - (a.stockCount || 0);
        return String(b.latestPublishedAt || "").localeCompare(String(a.latestPublishedAt || ""));
      });
      return `
        <div class="toolbar">
          <input data-input="searchList" placeholder="搜索发布者昵称" value="${escapeHtml(state.query)}">
          <select data-input="squareSort">
            <option value="recent" ${state.squareSort === "recent" ? "selected" : ""}>最近发布</option>
            <option value="count" ${state.squareSort === "count" ? "selected" : ""}>发布数量</option>
          </select>
        </div>
        ${profiles.length ? `
          <div class="card-grid">
            ${profiles.map(renderSquareCard).join("")}
          </div>
        ` : `<section class="table-panel"><div class="empty">暂无公开分享股池。</div></section>`}
      `;
    }

    function renderSquareCard(profile) {
      const stocks = (profile.stocks || []).slice(0, 3);
      return `
        <section class="square-card">
          <div>
            <h3>${escapeHtml(profile.nickname || "--")}</h3>
            <div class="publisher-meta">
              <span>${profile.stockCount || 0} 只已发布</span>
              <span>最近：${formatDateTime(profile.latestPublishedAt)}</span>
            </div>
          </div>
          <ul class="mini-list">
            ${stocks.length ? stocks.map((stock) => {
              const c = calc(stock);
              return `<li><span>${escapeHtml(stock.name)} <span class="stock-code">${escapeHtml(stock.code)}</span></span><span>${percent(c.upside)} · ${c.forwardPE ? trimNumber(c.forwardPE) + "x" : "--"}</span></li>`;
            }).join("") : `<li><span>暂无代表股票</span><span></span></li>`}
          </ul>
          <button class="primary" data-action="openPublisherFromSquare" data-id="${profile.id}">进入股池</button>
        </section>
      `;
    }

    function renderAdmin() {
      const selected = state.adminUsers.find((item) => item.id === state.adminSelectedUserId);
      return `
        <div class="admin-layout">
          <aside class="admin-list">
            ${state.adminUsers.length ? state.adminUsers.map((user) => `
              <button class="admin-user-row ${state.adminSelectedUserId === user.id ? "active" : ""}" data-action="selectAdminUser" data-id="${user.id}">
                <strong>${escapeHtml(user.nickname || "--")}</strong>
                <span class="stock-code">${escapeHtml(user.email || "")}</span>
                <span class="publisher-meta">
                  <span>${user.share_visibility === "public" ? "公开" : "私密"}</span>
                  ${user.square_hidden ? "<span>广场隐藏</span>" : ""}
                  ${user.share_banned ? "<span>禁用分享</span>" : ""}
                </span>

          </aside>

          </section>
        </div>
      `;
    }

    function renderAdminUserDetail(user) {

        <div class="admin-card">
          <h3>${escapeHtml(user.nickname || "--")}</h3>

            <span>${escapeHtml(user.email || "")}</span>

                </tr>

    function renderAdminStockRow(stock) {

      return `

          <td data-label="标的"><div class="stock-name">${escapeHtml(stock.name || "--")}</div><div class="stock-code">${escapeHtml(stock.code || "--")}</div></td>
          <td data-label="可见性">${stock.isShared ? "公开发布" : "私有记录"}${stock.adminHidden ? `<br><span class="badge warn">已隐藏</span>` : ""}</td>
          <td data-label="最新市值">${moneyYiCny(stock.latestMarketCapCny)}</td>
          <td data-label="upside">${percent(c.upside)}</td>
          <td data-label="Forward PE">${c.forwardPE ? trimNumber(c.forwardPE) + "x" : "--"}</td>
          <td data-label="发布">${formatDateTime(stock.lastPublishedAt)}</td>
          <td data-label="操作"><button data-action="adminToggleStockHidden" data-id="${stock.id}">${stock.adminHidden ? "恢复公开" : "隐藏股票"}</button></td>
        </tr>
      `;
    }

    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <main class="login-wrap">
          <section class="login-panel">
            <h1>钞·作业</h1>
            <p>登录成功后，你的股池会保存到云端数据库。</p>
            <div class="login-actions">
              <button class="primary oauth-button" data-action="githubLogin" type="button">使用 GitHub 登录</button>
              <div class="login-divider">或使用邮箱 Magic Link</div>
            </div>
            <form class="form-row" data-form="login">
              <div class="field">
                <label for="email">邮箱</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
              </div>
              <button class="primary" type="submit">发送链接</button>
            </form>
            ${state.loginNotice ? `
              <div class="notice">
                ${escapeHtml(state.loginNotice)}
              </div>` : ""}
            ${state.lastError ? `<div class="notice" style="border-color:#f6c0b7;background:#fff3f0;color:#912018">${escapeHtml(state.lastError)}</div>` : ""}
          </section>
        </main>
      `;
      bindEvents();
    }

    function renderToolbar() {
      const viewingOwn = state.viewPublisherId === "own";
      return `
        <div class="toolbar">
          <div class="toolbar-left">
            <input data-input="searchList" placeholder="股票名称、代码框" value="${escapeHtml(state.query)}">
          </div>
          <div class="toolbar-filters">
            <div class="segmented" aria-label="市场筛选">
              ${["ALL", "CN", "HK", "US"].map((key) => `
                <button class="${state.filter === key ? "active" : ""}" data-filter="${key}">
                  ${key === "ALL" ? "全部" : marketLabel(key)}
                </button>
              `).join("")}
            </div>
            ${viewingOwn ? `
              <button class="${state.shareFilter === "SHARED" ? "primary" : "secondary"}" data-action="toggleSharedFilter">已分享</button>
            ` : ""}
          </div>
          <div class="toolbar-actions">
            ${viewingOwn ? `
              <button class="primary" data-action="newStock">+添加股票</button>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderPublisherSelect() {
      const viewingOwn = state.viewPublisherId === "own";
      return `
        <select class="nav-publisher-select" data-input="viewPublisher" aria-label="股池筛选">
          <option value="own" ${viewingOwn ? "selected" : ""}>我的股池</option>
          ${state.followedPublishers.map((item) => `<option value="${item.id}" ${state.viewPublisherId === item.id ? "selected" : ""}>${escapeHtml(item.nickname)} 的股池</option>`).join("")}
        </select>
      `;
    }

    function userStocks() {
      const query = state.query.trim().toLowerCase();
      const viewingOwn = state.viewPublisherId === "own";
      let rows = viewingOwn ? [...state.stocks] : [...state.publisherStocks];
      if (state.filter !== "ALL") rows = rows.filter((item) => item.market === state.filter);
      if (viewingOwn && state.shareFilter === "SHARED") rows = rows.filter((item) => item.isShared);
      if (query) {
        rows = rows.filter((item) => `${item.name} ${item.code}`.toLowerCase().includes(query));
      }
      rows.sort((a, b) => {
        if (state.sort.key === "manual") return (a.manualOrder || 0) - (b.manualOrder || 0);
        const va = listSortValue(a, state.sort.key);
        const vb = listSortValue(b, state.sort.key);
        return state.sort.dir === "asc" ? va - vb : vb - va;
      });
      return rows;
    }

    function listSortValue(stock, key) {
      const c = calc(stock);
      const latest = Number(stock.latestMarketCapCny) || 0;
      if (key === "shareholderReturnRate") return shareholderReturnRateForList(stock, c) ?? -Infinity;
      if (key === "dividendYield") return latest ? (Number(stock.expectedDividendCny) || 0) / latest : -Infinity;
      if (key === "buybackRate") return latest ? (Number(stock.expectedBuybackCny) || 0) / latest : -Infinity;
      return c[key] ?? -Infinity;
    }

    function renderTable() {
      const rows = userStocks();
      const viewingOwn = state.viewPublisherId === "own";
      if (state.tableLoading) return renderTableSkeleton(viewingOwn);
      if (!rows.length) {
        const title = viewingOwn ? "还没有匹配的股票" : "这个分享股池暂无已发布股票";
        const text = viewingOwn ? "从股票搜索开始录入市值、盈利假设和估值参数，建立你的研究股池。" : "可以切换其他关注人，或回到自己的股池继续维护研究记录。";
        return `
          <section class="table-panel">
            <div class="empty">
              <strong>${title}</strong>
              <p>${text}</p>
              ${viewingOwn ? `<button class="primary" data-action="newStock">+添加股票</button>` : ""}
            </div>
          </section>
        `;
      }
      return `
        <section class="table-panel">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  ${viewingOwn ? `<th class="drag-col sticky-col" aria-label="拖拽排序"></th>` : ""}
                  <th class="sticky-col ${viewingOwn ? "stock-col-after-drag" : ""}">股票名称</th>
                  <th>版本</th>
                  <th class="num">最新市值<br><span class="stock-code">CNY 亿</span></th>
                  ${sortTh("upside", "Upside", "num")}
                  ${sortTh("forwardPE", "Forward PE", "num")}
                  ${sortTh("shareholderReturnRate", "股东回报率", "num")}
                  ${sortTh("dividendYield", "股息率", "num")}
                  ${sortTh("buybackRate", "回购率", "num")}
                  <th class="num">前瞻市值<br><span class="stock-code">CNY 亿</span></th>
                  <th class="num">前瞻利润<br><span class="stock-code">CNY 亿</span></th>
                  <th class="num">前瞻 PE</th>
                  <th class="num">净现金<br><span class="stock-code">CNY 亿</span></th>
                  <th class="num">现金折扣</th>
                  <th class="num">前瞻股东回报<br><span class="stock-code">CNY 亿</span></th>
                  ${viewingOwn ? "<th class=\"share-head\">分享</th><th>来源</th>" : ""}
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((stock) => renderRow(stock, viewingOwn)).join("")}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderTableSkeleton(viewingOwn) {
      const colSpan = viewingOwn ? 18 : 15;
      return `
        <section class="table-panel">
          <div class="table-scroll">
            <table>
              <thead><tr><th colspan="${colSpan}">正在加载股池数据</th></tr></thead>
              <tbody>${Array.from({ length: 6 }).map(() => `<tr><td colspan="${colSpan}"><div class="skeleton-row"></div></td></tr>`).join("")}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function sortTh(key, label, cls = "") {
      const active = state.sort.key === key;
      const arrow = active ? (state.sort.dir === "asc" ? " ↑" : " ↓") : "";
      return `<th class="sortable ${cls}" data-sort="${key}">${label}${arrow}</th>`;
    }

    function renderRow(stock, viewingOwn) {
      const c = calc(stock);
      const sourceDeleted = Boolean(stock.sourceDeletedAt);
      const shareholderRate = shareholderReturnRateForList(stock, c);
      const latest = Number(stock.latestMarketCapCny) || 0;
      const dividendYield = latest ? (Number(stock.expectedDividendCny) || 0) / latest : null;
      const buybackRate = latest ? (Number(stock.expectedBuybackCny) || 0) / latest : null;
      return `
        <tr class="stock-row" data-stock-row="${stock.id}">
          ${viewingOwn ? `<td data-label="排序" class="drag-col sticky-col"><span class="drag-handle" draggable="true" data-drag-id="${stock.id}" title="拖拽调整顺序" aria-label="拖拽调整顺序">⠿</span></td>` : ""}
          <td data-label="股票名称" class="sticky-col ${viewingOwn ? "stock-col-after-drag" : ""}">
            <div class="stock-name">${escapeHtml(stock.name || "--")}</div>
            <div class="stock-code">${escapeHtml(stock.code || "--")}</div>
          </td>
          <td data-label="版本" class="version-cell" title="${escapeHtml(normalizeStockVersion(stock.version))}">${escapeHtml(normalizeStockVersion(stock.version))}</td>
          <td data-label="最新市值" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.latestMarketCapCny)}</td>
          <td data-label="Upside" class="kpi plain-kpi ${Number(c.upside) >= 0 ? "gain" : "loss"}">${sourceDeleted ? "--" : percent(c.upside)}</td>
          <td data-label="Forward PE" class="kpi plain-kpi">${sourceDeleted || !c.forwardPE ? "--" : trimNumber(c.forwardPE) + "x"}</td>
          <td data-label="股东回报率" class="kpi ${Number(shareholderRate) >= 0 ? "gain" : "loss"}">${sourceDeleted ? "--" : percent(shareholderRate)}</td>
          <td data-label="股息率" class="kpi">${sourceDeleted ? "--" : percent(dividendYield)}</td>
          <td data-label="回购率" class="kpi">${sourceDeleted ? "--" : percent(buybackRate)}</td>
          <td data-label="前瞻市值" class="num">${sourceDeleted ? "--" : moneyYiCny(c.expectedMarketCapCny)}</td>
          <td data-label="前瞻利润" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.expectedProfitCny)}</td>
          <td data-label="前瞻 PE" class="num">${sourceDeleted || !stock.expectedPE ? "--" : trimNumber(stock.expectedPE) + "x"}</td>
          <td data-label="净现金" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.netCashCny)}</td>
          <td data-label="现金折扣" class="num">${sourceDeleted ? "--" : stock.netCashDiscountRate ?? "--"}</td>
          <td data-label="前瞻股东回报" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.expectedShareholderReturnCny)}</td>
          ${viewingOwn ? `
            <td data-label="分享" class="share-cell">${renderShareState(stock)}</td>
            <td data-label="来源">${renderSourceCell(stock)}</td>
          ` : ""}
          <td data-label="操作">
            <div class="actions">
              ${viewingOwn ? `
                <button class="icon" title="编辑" data-action="edit" data-id="${stock.id}">✎</button>
                <button class="icon" title="上提1位" data-action="moveUp" data-id="${stock.id}">↑</button>
                <button class="icon" title="下提1位" data-action="moveDown" data-id="${stock.id}">↓</button>
                ${stock.sourceType === "subscribed" ? `
                  <button class="text-action" title="取消订阅" data-action="unsubscribeStock" data-id="${stock.id}">取消订阅</button>
                  <button class="text-action" title="转为我的股票" data-action="convertToOwn" data-id="${stock.id}">转为我的</button>
                ` : ""}
                <button class="icon danger" title="删除" data-action="delete" data-id="${stock.id}">×</button>
              ` : `
                <button class="text-action" data-action="copySharedStock" data-id="${stock.id}">一键复制</button>
                <button class="primary text-action" data-action="subscribeStock" data-id="${stock.id}">订阅</button>
                <button class="text-action" data-action="openPublicationHistory" data-id="${stock.id}">历史</button>
              `}
            </div>
          </td>
        </tr>
      `;
    }

    function renderShareState(stock) {
      if (stock.sourceDeletedAt) {
        return `<span class="badge unshared">订阅失效</span>`;
      }
      if (!stock.isShared) {
        const sharing = state.sharingStockId === stock.id;
        return `<button class="text-action share-action" data-action="shareStock" data-id="${stock.id}" ${sharing ? "disabled" : ""}>${sharing ? "分享中..." : "去分享"}</button>`;
      }
      return `
        <div class="share-state">
          <span class="badge shared">已分享</span>
          <button class="text-action share-action" data-action="openPublicationHistory" data-id="${stock.id}">历史</button>
        </div>
      `;
    }

    function renderPublicationHistory() {
      const modal = state.publicationHistory;
      if (!modal.open) return "";
      const stock = modal.stock || {};
      return `
        <div class="history-modal open" data-history-backdrop="true">
          <section class="history-panel">
            <div class="history-head">
              <div>
                <h3>${escapeHtml(stock.name || "发布历史")}</h3>
                <p>${escapeHtml(stock.code || "")}${stock.publisherNickname ? ` · ${escapeHtml(stock.publisherNickname)}` : ""}</p>
              </div>
              <button class="icon" data-action="closePublicationHistory" title="关闭">×</button>
            </div>
            <div class="history-body">
              ${modal.loading ? `<div class="empty">正在加载发布历史...</div>` : ""}
              ${modal.error ? `<div class="form-error">${escapeHtml(modal.error)}</div>` : ""}
              ${!modal.loading && !modal.error ? renderPublicationHistoryRows(modal.rows) : ""}
            </div>
          </section>
        </div>
      `;
    }

    function renderDeleteConfirm() {
      const modal = state.deleteConfirm;
      if (!modal.open) return "";
      return `
        <div class="history-modal open" data-delete-backdrop="true">
          <section class="confirm-panel">
            <div class="confirm-head">
              <h3>删除股票</h3>
              <button class="icon" data-action="closeDeleteConfirm" title="关闭" ${modal.deleting ? "disabled" : ""}>×</button>
            </div>
            <div class="confirm-body">
              <p>确认删除该股票吗？如有分享，也同步一并删除。</p>
              ${modal.stockName ? `<div class="stock-code">${escapeHtml(modal.stockName)}</div>` : ""}
              ${modal.error ? `<div class="form-error">${escapeHtml(modal.error)}</div>` : ""}
              <div class="confirm-actions">
                <button data-action="closeDeleteConfirm" ${modal.deleting ? "disabled" : ""}>取消</button>
                <button class="danger-primary" data-action="confirmDeleteStock" ${modal.deleting ? "disabled" : ""}>${modal.deleting ? "删除中..." : "确认删除"}</button>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderPublicationHistoryRows(rows) {
      if (!rows.length) return `<div class="empty">还没有发布快照。</div>`;
      return `
        <div class="history-list">
          ${rows.map((row, index) => renderPublicationHistoryItem(row, rows[index + 1])).join("")}
        </div>
      `;
    }

    function renderPublicationHistoryItem(row, previousRow) {
      const stock = stockFromPublication(row);
      const previous = previousRow ? stockFromPublication(previousRow) : null;
      const c = row.payload?.computed || calc(stock);
      return `
        <article class="history-item">
          <div class="history-item-head">
            <div>
              <h4>V${Number(row.version_number) || "--"} · ${formatDateTime(row.created_at)}</h4>
              <div class="stock-code">${escapeHtml(stock.forecastYear || "--")} · ${escapeHtml(marketLabel(stock.market))}</div>
            </div>
            <div class="history-delta">${renderPublicationDeltas(stock, previous)}</div>
          </div>
          ${row.change_note ? `<p class="history-note">${escapeHtml(row.change_note)}</p>` : ""}
          <div class="history-grid">
            ${historyMetric("当时市值", moneyYiCny(stock.latestMarketCapCny))}
            ${historyMetric("前瞻市值", moneyYiCny(c.expectedMarketCapCny), { meta: stock.forecastYear ? `@${stock.forecastYear}` : "" })}
            ${historyMetric("Upside", percent(c.upside))}
            ${historyMetric("前瞻利润", moneyYiCny(stock.expectedProfitCny), { meta: stock.expectedPERemark || "", tooltip: stock.expectedPERemark || "" })}
            ${historyMetric("前瞻估值", stock.expectedPE ? `${trimNumber(stock.expectedPE)}x` : "--")}
            ${historyMetric("Forward PE", c.forwardPE ? `${trimNumber(c.forwardPE)}x` : "--")}
            ${historyMetric("净现金", moneyYiCny(stock.netCashCny))}
            ${historyMetric("现金折扣", percent(stock.netCashDiscountRate))}
            ${historyMetric("净现金口径", stock.netCashScope || "--", { text: true, tooltip: stock.netCashScope || "" })}
            ${historyMetric("前瞻股东回报", moneyYiCny(stock.expectedShareholderReturnCny))}
            ${historyMetric("前瞻股东回报率", percent(c.shareholderReturnRate))}
            ${historyMetric("股东回报政策", stock.shareholderReturnRemark || "--", { text: true, tooltip: stock.shareholderReturnRemark || "" })}
          </div>
        </article>
      `;
    }

    function historyMetric(label, value, options = {}) {
      const tooltip = options.tooltip ? ` data-tooltip="${escapeHtml(options.tooltip)}" title="${escapeHtml(options.tooltip)}"` : "";
      const meta = options.meta ? `<em${tooltip}>${escapeHtml(options.meta)}</em>` : "";
      const valueTooltip = options.text && options.tooltip ? ` data-tooltip="${escapeHtml(options.tooltip)}" title="${escapeHtml(options.tooltip)}"` : "";
      return `
        <div class="history-metric">
          <div class="history-metric-title"><span>${escapeHtml(label)}</span>${meta}</div>
          <strong class="${options.text ? "text-value" : ""}"${valueTooltip}>${escapeHtml(value)}</strong>
        </div>
      `;
    }

    function renderPublicationDeltas(stock, previous) {
      if (!previous) return `<span class="badge soft">首个版本</span>`;
      const items = [
        deltaBadge("市值", previous.latestMarketCapCny, stock.latestMarketCapCny, ""),
        deltaBadge("利润", previous.expectedProfitCny, stock.expectedProfitCny, ""),
        deltaBadge("PE", previous.expectedPE, stock.expectedPE, "x"),
        deltaBadge("净现金", previous.netCashCny, stock.netCashCny, "")
      ].filter(Boolean);
      return items.length ? items.join("") : `<span class="badge soft">核心假设无变化</span>`;
    }

    function deltaBadge(label, before, after, suffix) {
      const a = Number(after);
      const b = Number(before);
      if (!Number.isFinite(a) || !Number.isFinite(b) || a === b) return "";
      return `<span class="badge soft">${escapeHtml(label)} ${trimNumber(b)}${suffix} → ${trimNumber(a)}${suffix}</span>`;
    }

    function renderSourceCell(stock) {
      if (stock.sourceDeletedAt) {
        return `
          <div class="source-cell">
            <div class="source-tags">
              <strong>${escapeHtml(stock.sourceNickname || stock.sourceUserId || "--")}</strong>
              <span class="badge warn">已删除</span>
            </div>
          </div>
        `;
      }
      if (!stock.sourceStockId) return "";
      const typeLabel = stock.sourceType === "subscribed" ? "订阅" : stock.sourceType === "copied" ? "复制" : "来源";
      return `
        <div class="source-cell">
          <div class="source-tags">
            <strong>${escapeHtml(stock.sourceNickname || stock.sourceUserId || "--")}</strong>
            <span class="badge source">${typeLabel}</span>
          </div>
        </div>
      `;
    }

    function emptyForm() {
      return {
        id: null,
        version: "中性",
        name: "",
        code: "",
        market: "HK",
        exchange: "",
        displayCurrency: "CNY",
        latestMarketCapCny: 0,
        marketCapUpdatedAt: "",
        amountCurrencies: defaultAmountCurrencies(),
        amountInputValues: normalizeAmountInputValues(),
        originalAmounts: {},
        useSegmentValuation: false,
        segmentValuations: [
          emptySegmentValuationRow(1, "2026E"),
          emptySegmentValuationRow(2, "2026E")
        ],
        expectedProfitCny: 0,
        expectedPE: 0,
        expectedPEInput: "",
        expectedPERemark: "",
        netCashCny: 0,
        netCashScope: "",
        netCashDiscountRate: 0.5,
        expectedDividendCny: 0,
        expectedBuybackCny: 0,
        expectedShareholderReturnCny: 0,
        shareholderReturnRemark: "",
        forecastYear: "2026E",
        investmentNote: "",
        publishNote: "",
        isShared: false,
        lastPublishedAt: "",
        sourceUserId: "",
        sourceStockId: "",
        sourceNickname: "",
        sourceType: "self",
        sourceSeenPublishedAt: "",
        lastSourceUpdatedAt: "",
        sourceStopped: false,
        sourceDeletedAt: "",
        hasSourceUpdate: false,
        myNote: ""
      };
    }

    function renderDrawer() {
      const form = state.form || emptyForm();
      const c = calc(form);
      const currency = form.displayCurrency || "CNY";
      const isSubscribed = form.sourceType === "subscribed";
      const locked = isSubscribed ? "disabled" : "";
      const stockError = state.drawerError && (!form.name.trim() || !form.code.trim()) ? state.drawerError : "";
      const generalError = state.drawerError && !stockError ? state.drawerError : "";
      return `
        <aside class="drawer ${state.drawerOpen ? "open" : ""}">
          <div class="drawer-panel">
            <div class="drawer-head">
              <div class="drawer-title">
                <h2>${form.id ? "编辑股票" : "新增股票"}</h2>
              </div>
              <button class="icon" data-action="closeDrawer" title="关闭">×</button>
            </div>
            <div class="drawer-body">

                  ${sectionCard("基础信息", "从股票名称或代码搜索匹配标的，市值会自动带入并可按选择币种展示。", `
                    <div class="form-grid three">
                      ${formField("股票名称/代码搜索", `
                        <div class="search-combobox">
                          <input data-input="stockSearch" value="${escapeHtml(form.name ? `${form.name}（${form.code}）` : "")}" placeholder="输入股票名称、代码或拼音，例如：腾讯 / 0700 / AAPL" ${locked}>
                          <div class="search-results" id="searchResults"></div>
                        </div>
                      `, { required: true, error: stockError, className: "input-medium" })}
                      ${formField("货币单位", `
                        <select class="currency-select" data-field="displayCurrency" ${locked}>
                          ${Object.keys(currencies).map((key) => `<option value="${key}" ${currency === key ? "selected" : ""}>${key} · ${currencies[key].label}</option>`).join("")}
                        </select>
                      `)}
                      ${formField("当前市值", `<div class="readonly-value"><span>${metricMoney(form.latestMarketCapCny, currency)}</span></div>`, { className: "input-medium" })}
                    </div>

                  ${sectionCard("盈利与估值假设", "维护前瞻利润、目标 PE 和利润口径说明，用于计算前瞻市值与 Upside。", renderValuationAssumptions(form, currency, locked), {
                    titleExtra: `
                      <label class="section-toggle">
                        <input type="checkbox" data-field="useSegmentValuation" ${form.useSegmentValuation ? "checked" : ""} ${locked}>
                        <span>分部估值法</span>
                      </label>
                    `
                  })}

                  ${sectionCard("股东回报", "记录未来分红、回购或其他股东回报假设。", `
                    <div class="form-grid three">
                      ${formField("前瞻股息", amountInput("expectedDividendCny", form.expectedDividendCny, amountCurrencyFor(form, "expectedDividendCny"), locked), { className: "input-short" })}
                      ${formField("前瞻回购", amountInput("expectedBuybackCny", form.expectedBuybackCny, amountCurrencyFor(form, "expectedBuybackCny"), locked), { className: "input-short" })}
                      ${formField("前瞻股东回报", amountInput("expectedShareholderReturnCny", form.expectedShareholderReturnCny, amountCurrencyFor(form, "expectedShareholderReturnCny"), locked), { className: "input-short" })}
                    </div>
                    <div class="form-grid single follow-row">
                      ${formField("股东回报政策", `<textarea class="auto-grow-note" rows="1" data-field="shareholderReturnRemark" ${locked}>${escapeHtml(form.shareholderReturnRemark)}</textarea>`, { className: "input-wide" })}
                    </div>
                  `)}

                  ${sectionCard("净现金调整", "净现金可按折扣系数计入估值，适合处理现金、投资资产或净负债。", `
                    <div class="form-grid">
                      ${formField("净现金盘点", amountInput("netCashCny", form.netCashCny, amountCurrencyFor(form, "netCashCny"), locked), { className: "input-short" })}

                    </div>
                    <div class="form-grid single follow-row">
                      ${formField("净现金口径", `<textarea class="auto-grow-note" rows="1" data-field="netCashScope" placeholder="例如：现金及短投 - 有息负债" ${locked}>${escapeHtml(form.netCashScope || "")}</textarea>`, { className: "input-wide" })}
                    </div>
                  `)}

                  <input type="hidden" data-field="name" value="${escapeHtml(form.name)}">
                  <input type="hidden" data-field="code" value="${escapeHtml(form.code)}">
                  <input type="hidden" data-field="market" value="${escapeHtml(form.market)}">
                  <input type="hidden" data-field="exchange" value="${escapeHtml(form.exchange)}">
                  ${generalError ? `<div class="form-error">${escapeHtml(generalError)}</div>` : ""}

                <div class="result-panel">
                  <div class="side-note-box">

                  </div>
                  <div class="valuation-summary-block">
                    <h3>估值测算</h3>
                    <div class="result-grid summary">
                      ${resultItem("前瞻市值", metricMoney(c.expectedMarketCapCny, currency))}
                      ${resultItem("Upside", percent(c.upside))}
                      ${resultItem("Forward PE", c.forwardPE ? `${trimNumber(c.forwardPE)} 倍` : "--")}
                      ${resultItem("前瞻股东回报率", percent(c.shareholderReturnRate))}
                    </div>
                    <div class="disclaimer">内容为用户个人记录，不构成投资建议。</div>
                    ${!isSubscribed ? `
                      <div class="publish-box">
                        <label>发布快照说明</label>
                        <textarea class="auto-grow-note" data-field="publishNote" placeholder="记录这次发布相对上一版的变化，例如利润假设、PE、股东回报或净现金口径调整。">${escapeHtml(form.publishNote || "")}</textarea>
                        <div class="publish-actions">
                          <button data-action="publishStock" ${state.saving || state.publishing ? "disabled" : ""}>${state.publishing ? "发布中..." : "发布快照"}</button>
                        </div>
                      </div>
                    ` : ""}
                  </div>
                </div>
              </div>
            </div>
            <div class="drawer-foot">
              <div class="foot-left">
                <span class="hint">${state.formDirty ? "有未保存修改" : "所有已保存内容会保留在你的私人股池中"}</span>
                ${form.id ? `<button class="drawer-delete-link" data-action="openDeleteConfirm" data-id="${form.id}" ${state.saving || state.publishing ? "disabled" : ""}>删除股票</button>` : ""}
              </div>
              <div class="foot-actions">
                <button data-action="closeDrawer" ${state.saving || state.publishing ? "disabled" : ""}>取消</button>
                <button class="primary" data-action="saveStock" ${state.saving || state.publishing ? "disabled" : ""}>${state.saving ? "保存中..." : "保存股票"}</button>
              </div>
            </div>
          </div>
        </aside>
      `;

    function renderVersionControl(form, locked = "") {
      const version = normalizeStockVersion(form.version);
      const mode = form.versionCustom ? "自定义" : stockVersionMode(version);
      if (mode === "自定义") {
        return `<input data-field="version" value="${escapeHtml(form.versionCustom ? (form.version || "") : version)}" placeholder="输入版本" ${locked}>`;
      }
      return `
        <select data-field="version" ${locked}>
          ${["乐观", "中性", "悲观", "自定义"].map((option) => `<option value="${option}" ${mode === option ? "selected" : ""}>${option}</option>`).join("")}
        </select>
      `;
    }

    function renderValuationAssumptions(form, currency, locked = "") {
      if (form.useSegmentValuation) return renderSegmentValuation(form, currency, locked);
      return `
        <div class="form-grid three">
          ${formField("前瞻利润", amountInput("expectedProfitCny", form.expectedProfitCny, amountCurrencyFor(form, "expectedProfitCny"), locked), { required: true, className: "input-short" })}
          ${formField("前瞻 PE", `<input class="numeric-input" type="number" step="any" data-field="expectedPE" value="${escapeHtml(form.expectedPEInput !== undefined ? form.expectedPEInput : form.expectedPE)}" required ${locked}>`, { required: true, className: "input-short" })}
          ${formField("前瞻年份", forecastYearSelect(form.forecastYear, locked), { className: "input-short" })}
        </div>
        <div class="form-grid three follow-row">
          ${formField("利润备注", `<textarea class="auto-grow-note" rows="1" data-field="expectedPERemark" ${locked}>${escapeHtml(form.expectedPERemark)}</textarea>`, { className: "input-wide span-2" })}
          ${formField("版本", renderVersionControl(form, locked), { className: "input-medium" })}
        </div>
      `;
    }

    function renderSegmentValuation(form, currency, locked = "") {
      const segments = Array.isArray(form.segmentValuations) ? form.segmentValuations : [];
      return `
        <div class="segment-valuation">
          <div class="segment-row head">
            <span>分部名</span><span>前瞻利润</span><span>前瞻 PE</span><span>前瞻年份</span><span>利润备注</span><span></span>
          </div>
          ${segments.map((segment, index) => `
            <div class="segment-row">
              <input data-segment-field="segmentName" data-segment-index="${index}" value="${escapeHtml(segment.segmentName || "")}" placeholder="分部${index + 1}" ${locked}>
              ${amountInput(`segmentProfit:${index}`, segment.expectedProfitCny, amountCurrencyFor(form, `segmentProfit:${index}`), locked)}
              <input class="numeric-input" type="number" step="any" data-segment-field="expectedPE" data-segment-index="${index}" value="${escapeHtml(segment.expectedPEInput !== undefined ? segment.expectedPEInput : segment.expectedPE)}" ${locked}>
              ${segmentForecastYearSelect(segment.forecastYear || form.forecastYear, index, locked)}
              <textarea class="auto-grow-note" rows="1" data-segment-field="expectedPERemark" data-segment-index="${index}" ${locked}>${escapeHtml(segment.expectedPERemark || "")}</textarea>
              <button class="icon segment-remove" type="button" data-action="removeSegment" data-index="${index}" title="删除分部" aria-label="删除分部" ${locked || segments.length <= 1 ? "disabled" : ""}>×</button>
            </div>
          `).join("")}
          <div class="segment-actions">
            <button type="button" data-action="addSegment" ${locked}>增加分部</button>
          </div>
          <div class="segment-total">
            ${formField("加总前瞻利润", `<div class="readonly-value"><span data-segment-total="profit">${metricMoney(form.expectedProfitCny, currency)}</span></div>`, { className: "input-short" })}
            ${formField("加总前瞻 PE", `<div class="readonly-value"><span data-segment-total="pe">${form.expectedPE ? `${trimNumber(form.expectedPE)} 倍` : "--"}</span></div>`, { className: "input-short" })}
          </div>
          <div class="segment-version">
            ${formField("版本", renderVersionControl(form, locked), { className: "input-medium" })}
          </div>
        </div>
      `;
    }

    function sectionCard(title, description, body, options = {}) {
      return `
        <section class="section-card">
          <div class="section-head">
            <h3>${escapeHtml(title)}</h3>
            ${options.titleExtra || ""}
          </div>
          ${body}
        </section>
      `;
    }

    function formField(label, control, options = {}) {
      return `
        <div class="form-field ${options.className || ""}">
          <label class="${options.required ? "required" : ""}">${escapeHtml(label)}</label>
          ${control}
          ${options.help ? `<div class="field-help">${escapeHtml(options.help)}</div>` : ""}
          ${options.error ? `<div class="inline-error">${escapeHtml(options.error)}</div>` : ""}
        </div>
      `;
    }

    function amountInput(key, cny, currency, attrs = "") {
      return `
        <div class="amount-field">
          <input class="numeric-input" type="number" step="any" data-amount="${key}" value="${escapeHtml(amountInputValueFor(state.form, key, cny, currency))}" placeholder="0.00" ${attrs}>
          <select data-amount-currency="${key}" aria-label="金额币种" ${attrs}>
            ${Object.keys(currencies).map((code) => `<option value="${code}" ${currency === code ? "selected" : ""}>亿 ${code}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function percentStepperInput(key, value, attrs = "") {
      const percent = (Number(value) || 0) * 100;
      return `
        <div class="percent-stepper">
          <button type="button" data-discount-step="-10" ${attrs}>-</button>
          <input class="numeric-input" type="text" inputmode="decimal" data-percent-field="${key}" value="${escapeHtml(formatPercentInput(percent))}" ${attrs}>
          <button type="button" data-discount-step="10" ${attrs}>+</button>
        </div>
      `;
    }

    function parsePercentInput(value) {
      const parsed = Number(String(value ?? "").replace("%", "").trim());
      return Math.min(100, Math.max(0, Number.isFinite(parsed) ? parsed : 0));
    }

    function formatPercentInput(value) {
      return `${trimNumber(parsePercentInput(value))}%`;
    }

    function field(label, key, value, type = "text") {
      return `<div class="field"><label>${label}</label><input type="${type}" data-field="${key}" value="${escapeHtml(value)}"></div>`;
    }

    function numberField(label, key, value, min = "", max = "", step = "any") {
      return `<div class="field"><label>${label}</label><input type="number" min="${min}" max="${max}" step="${step}" data-field="${key}" value="${escapeHtml(value)}"></div>`;
    }

    function amountField(label, key, cny, currency) {
      return `<div class="field"><label>${label}（${currencies[currency].unit}）</label><input type="number" step="any" data-amount="${key}" value="${escapeHtml(toDisplay(cny, currency))}"></div>`;
    }

    function selectField(label, key, value, options) {
      return `
        <div class="field">
          <label>${label}</label>
          <select data-field="${key}">
            ${options.map(([optionValue, optionLabel]) => `<option value="${optionValue}" ${value === optionValue ? "selected" : ""}>${optionLabel}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function textareaField(label, key, value) {
      return `<div class="field"><label>${label}</label><textarea data-field="${key}">${escapeHtml(value)}</textarea></div>`;
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><span>${label}</span><strong class="${cls}">${value}</strong></div>`;
    }

    function resultItem(label, value) {
      const text = value && value !== "--" ? value : "—";
      const cls = String(text).startsWith("-") ? "loss" : String(text).includes("%") && text !== "—" ? "gain" : "";
      return `<div class="result-metric"><strong>${label}</strong><span class="${cls}">${text}</span></div>`;
    }

    function forecastYearSelect(value, attrs = "") {
      const years = ["2025A"];
      for (let year = 2026; year <= 2035; year += 1) years.push(`${year}E`);
      if (value && !years.includes(value)) years.unshift(value);
      return `
        <select data-field="forecastYear" ${attrs}>
          ${years.map((year) => `<option value="${year}" ${value === year ? "selected" : ""}>${year}</option>`).join("")}
        </select>
      `;
    }

    function segmentForecastYearSelect(value, index, attrs = "") {
      const years = ["2025A"];
      for (let year = 2026; year <= 2035; year += 1) years.push(`${year}E`);
      if (value && !years.includes(value)) years.unshift(value);
      return `
        <select data-segment-field="forecastYear" data-segment-index="${index}" ${attrs}>
          ${years.map((year) => `<option value="${year}" ${value === year ? "selected" : ""}>${year}</option>`).join("")}
        </select>
      `;
    }

    function bindEvents() {
      document.getElementById("app").onclick = (event) => {
        const actionEl = event.target.closest("[data-action]");
        if (actionEl) onAction({ currentTarget: actionEl });
      };
      document.querySelectorAll("[data-filter]").forEach((el) => {
        el.addEventListener("click", () => { state.filter = el.dataset.filter; render(); });
      });
      document.querySelectorAll("[data-sort]").forEach((el) => {
        el.addEventListener("click", () => toggleSort(el.dataset.sort));
      });
      bindRowDragEvents();
      const stockConnectTax = document.querySelector("[data-input='stockConnectTax']");
      if (stockConnectTax) {
        stockConnectTax.addEventListener("click", (event) => event.stopPropagation());
        stockConnectTax.addEventListener("change", (event) => {
          state.stockConnectDividendTax = event.target.checked;
          render();
        });
      }
      document.querySelectorAll("[data-field]").forEach((el) => {
        el.addEventListener("input", () => {
          updateFormField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
          if (el.matches("textarea.auto-grow-note")) autoGrowTextarea(el);
        });
        el.addEventListener("change", () => updateFormField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value));
      });
      document.querySelectorAll("textarea.auto-grow-note").forEach(autoGrowTextarea);
      document.querySelectorAll("[data-amount]").forEach((el) => {
        el.addEventListener("input", () => updateAmountField(el.dataset.amount, el.value));
      });
      document.querySelectorAll("[data-amount-currency]").forEach((el) => {
        el.addEventListener("change", () => updateAmountCurrency(el.dataset.amountCurrency, el.value));
      });
      document.querySelectorAll("[data-segment-field]").forEach((el) => {
        el.addEventListener("input", () => {
          updateSegmentField(Number(el.dataset.segmentIndex), el.dataset.segmentField, el.value);
          if (el.matches("textarea.auto-grow-note")) autoGrowTextarea(el);
        });
        el.addEventListener("change", () => updateSegmentField(Number(el.dataset.segmentIndex), el.dataset.segmentField, el.value));
      });
      document.querySelectorAll("[data-percent-field]").forEach((el) => {
        el.addEventListener("input", () => updatePercentField(el.dataset.percentField, el.value));
        el.addEventListener("change", () => {
          updatePercentField(el.dataset.percentField, el.value);
          el.value = formatPercentInput((Number(state.form?.[el.dataset.percentField]) || 0) * 100);
        });
      });
      document.querySelectorAll("[data-discount-step]").forEach((el) => {
        el.addEventListener("click", () => stepDiscountField(Number(el.dataset.discountStep)));
      });
      const loginForm = document.querySelector("[data-form='login']");
      if (loginForm) loginForm.addEventListener("submit", onLogin);
      const profileForm = document.querySelector("[data-form='profile']");
      if (profileForm) profileForm.addEventListener("submit", onProfileSubmit);
      const listSearch = document.querySelector("[data-input='searchList']");
      if (listSearch) listSearch.addEventListener("input", (event) => { state.query = event.target.value; render(); });
      const viewPublisher = document.querySelector("[data-input='viewPublisher']");
      if (viewPublisher) viewPublisher.addEventListener("change", async (event) => {
        state.viewPublisherId = event.target.value;
        state.query = "";
        if (state.viewPublisherId === "own") {
          openOwnPool();
          return;
        } else {
          state.tableLoading = true;
          render();
          await loadPublisherStocks(state.viewPublisherId);
          state.tableLoading = false;
        }
        render();
      });
      const shareVisibilityToggle = document.querySelector("[data-input='shareVisibilityToggle']");
      if (shareVisibilityToggle) {
        shareVisibilityToggle.addEventListener("change", (event) => {
          updateShareVisibility(event.target.checked ? "public" : "private");
        });
      }
      const squareSort = document.querySelector("[data-input='squareSort']");
      if (squareSort) squareSort.addEventListener("change", (event) => { state.squareSort = event.target.value; render(); });
      const navYear = document.querySelector("[data-input='navYear']");
      if (navYear) navYear.addEventListener("change", (event) => { state.navYear = event.target.value; state.navRange = event.target.value ? "YEAR" : "ALL"; render(); });
      const benchmark = document.querySelector("[data-input='benchmark']");
      if (benchmark) benchmark.addEventListener("change", (event) => { state.benchmarkCode = event.target.value; render(); });
      const portfolioAccountType = document.querySelector("[data-input='portfolioAccountType']");
      if (portfolioAccountType) portfolioAccountType.addEventListener("change", (event) => {
        document.querySelectorAll("[data-account-fields]").forEach((el) => { el.style.display = el.dataset.accountFields === event.target.value ? "block" : "none"; });
      });
      document.querySelectorAll("[data-input='portfolioStockSearch']").forEach((portfolioSearch) => {
        portfolioSearch.addEventListener("compositionstart", () => { state.portfolioSearchComposing = true; });
        portfolioSearch.addEventListener("compositionend", (event) => {
          state.portfolioSearchComposing = false;
          onPortfolioStockSearch(event);
        });
        portfolioSearch.addEventListener("input", (event) => {
          if (!state.portfolioSearchComposing && !event.isComposing) onPortfolioStockSearch(event);
        });
      });
      const createPortfolioForm = document.querySelector("[data-form='createPortfolio']");
      if (createPortfolioForm) createPortfolioForm.addEventListener("submit", submitCreatePortfolio);
      const renamePortfolioForm = document.querySelector("[data-form='renamePortfolio']");
      if (renamePortfolioForm) renamePortfolioForm.addEventListener("submit", submitRenamePortfolio);
      const deletePortfolioForm = document.querySelector("[data-form='deletePortfolio']");
      if (deletePortfolioForm) deletePortfolioForm.addEventListener("submit", submitDeletePortfolio);
      const cashForm = document.querySelector("[data-form='calibrateCash']");
      if (cashForm) cashForm.addEventListener("submit", submitCalibrateCash);
      const cashFlowForm = document.querySelector("[data-form='portfolioCashFlow']");
      if (cashFlowForm) cashFlowForm.addEventListener("submit", submitPortfolioCashFlow);
      const tradeForm = document.querySelector("[data-form='positionTrade']");
      if (tradeForm) tradeForm.addEventListener("submit", submitPositionTrade);
      const rebalanceForm = document.querySelector("[data-form='rebalanceTrade']");
      if (rebalanceForm) rebalanceForm.addEventListener("submit", submitRebalanceTrade);
      document.querySelectorAll("[data-rebalance-shares]").forEach((input) => {
        input.addEventListener("input", () => onRebalanceInput(input.dataset.rebalanceShares, "shares"));
      });
      document.querySelectorAll("[data-rebalance-price]").forEach((input) => {
        input.addEventListener("input", () => onRebalanceInput(input.dataset.rebalancePrice, "price"));
      });
      document.querySelectorAll("[data-rebalance-ratio-side]").forEach((button) => {
        button.addEventListener("click", () => applyRebalanceRatio(button.dataset.rebalanceRatioSide, Number(button.dataset.rebalanceRatio)));
      });
      document.querySelectorAll("[data-target-weight-step]").forEach((button) => {
        button.addEventListener("click", () => stepPositionTargetWeight(Number(button.dataset.targetWeightStep)));
      });
      document.querySelectorAll("[data-target-weight-value]").forEach((button) => {
        button.addEventListener("click", () => setPositionTargetWeight(Number(button.dataset.targetWeightValue)));
      });
      document.querySelectorAll("[data-plan-live-done]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => updatePositionPlanDone(checkbox.dataset.positionId, checkbox.dataset.planSide, Number(checkbox.dataset.planIndex), checkbox.checked));
      });
      const targetWeightInput = document.querySelector('input[name="targetWeight"]');
      if (targetWeightInput) targetWeightInput.addEventListener("blur", () => {
        const value = parsePositionTargetWeight(targetWeightInput.value);
        targetWeightInput.value = formatPositionTargetWeight(Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : 0);
      });
      const stockSearch = document.querySelector("[data-input='stockSearch']");
      if (stockSearch) stockSearch.addEventListener("input", onStockSearch);
      const historyBackdrop = document.querySelector("[data-history-backdrop]");
      if (historyBackdrop) {
        historyBackdrop.addEventListener("click", (event) => {
          if (event.target === historyBackdrop) closePublicationHistory();
        });
      }
      const deleteBackdrop = document.querySelector("[data-delete-backdrop]");
      if (deleteBackdrop) {
        deleteBackdrop.addEventListener("click", (event) => {
          if (event.target === deleteBackdrop) closeDeleteConfirm();
        });
      }
    }

    async function onAction(event) {
      const action = event.currentTarget.dataset.action;
      const stockId = event.currentTarget.dataset.id;
      if (action === "logout") {
        stopMarketCapAutoRefresh();
        stopPortfolioQuoteAutoRefresh();
        writeJson(AUTH_STORAGE_KEY, null);
        state.session = null;
        state.profile = null;
        state.profileRequired = false;
        state.stocks = [];
        state.publisherStocks = [];
        state.publisherProfile = null;
        state.followedPublishers = [];
        state.portfolios = [];
        state.activePortfolioId = "";
        render();
      }
      if (action === "githubLogin") loginWithGithub();
      if (action === "switchMainView") switchMainView(event.currentTarget.dataset.view);
      if (action === "selectPortfolio") {
        state.activePortfolioId = stockId;
        state.navHistory = [];
        state.navHistoryPortfolioId = "";
        state.benchmarkHistory = [];
        savePortfolios();
        render();
        await Promise.all([refreshPortfolioQuotes({ renderAfter: false }), loadPortfolioPerformance()]);
        render();
      }
      if (action === "portfolioPage") {
        state.portfolioPage = event.currentTarget.dataset.page;
        if (state.portfolioPage === "performance") await loadPortfolioPerformance();
        render();
      }
      if (action === "sortPortfolio") {
        const key = event.currentTarget.dataset.sortKey;
        state.portfolioSort = state.portfolioSort?.key === key
          ? { key, dir: state.portfolioSort.dir === "asc" ? "desc" : "asc" }
          : { key, dir: "desc" };
        render();
      }
      if (action === "refreshPortfolioQuotes") {
        await refreshPortfolioQuotes();
      }
      if (action === "togglePortfolioPrivacy") {
        state.portfolioPrivacyMode = !state.portfolioPrivacyMode;
        render();
      }
      if (action === "togglePortfolioSummary") {
        state.portfolioSummaryExpanded = !state.portfolioSummaryExpanded;
        render();
      }
      if (action === "navRange") { state.navRange = event.currentTarget.dataset.range; state.navYear = ""; render(); }
      if (action === "createPortfolio") openPortfolioModal("create");
      if (action === "renamePortfolio") openPortfolioModal("rename");
      if (action === "deletePortfolio") openPortfolioModal("delete");
      if (action === "closePortfolioModal") closePortfolioModal();
      if (action === "openPosition") openPortfolioModal("open");
      if (action === "rebalancePortfolio") openPortfolioModal("rebalance");
      if (action === "calibrateCash") openPortfolioModal("cash");
      if (action === "subscribePortfolio") openPortfolioModal("subscription");
      if (action === "redeemPortfolio") openPortfolioModal("redemption");
      if (action === "addPosition") openPortfolioModal("add", stockId);
      if (action === "reducePosition") openPortfolioModal("reduce", stockId);
      if (action === "editPosition") openPortfolioModal("edit", stockId);
      if (action === "positionHistory") openPortfolioModal("history", stockId);
      if (action === "rollbackTrade") rollbackPortfolioTrade(event.currentTarget.dataset.tradeId);
      if (action === "selectPortfolioStock") selectPortfolioStock(Number(event.currentTarget.dataset.index), event.currentTarget.dataset.side || "");
      if (action === "newStock") openDrawer();
      if (action === "closeDrawer") closeDrawer();
      if (action === "saveStock") saveStock();
      if (action === "publishStock") publishStock();
      if (action === "shareStock") shareStockFromList(stockId);
      if (action === "openPublicationHistory") openPublicationHistory(stockId);
      if (action === "closePublicationHistory") closePublicationHistory();
      if (action === "openDeleteConfirm") openDeleteConfirm(stockId);
      if (action === "closeDeleteConfirm") closeDeleteConfirm();
      if (action === "confirmDeleteStock") confirmDeleteStock();
      if (action === "toggleSharedFilter") {
        state.shareFilter = state.shareFilter === "SHARED" ? "ALL" : "SHARED";
        render();
      }
      if (action === "copyShareLink") copyShareLink();
      if (action === "followPublisher") followPublisher(stockId);
      if (action === "openOwnPool") openOwnPool();
      if (action === "copySharedStock") copySharedStock(stockId, "copied");
      if (action === "subscribeStock") copySharedStock(stockId, "subscribed");
      if (action === "unsubscribeStock") unsubscribeStock(stockId);
      if (action === "convertToOwn") convertToOwnStock(stockId);
      if (action === "addSegment") addSegmentValuation();
      if (action === "removeSegment") removeSegmentValuation(Number(event.currentTarget.dataset.index));
      if (action === "markSourceUpdatesRead") markSourceUpdatesRead();
      if (action === "openPublisherFromSquare") openPublisherFromSquare(stockId);
      if (action === "selectAdminUser") selectAdminUser(stockId);

      if (action === "adminToggleShareBan") adminToggleUser(stockId, "share_banned");
      if (action === "adminSaveNote") adminSaveNote(stockId);
      if (action === "adminToggleStockHidden") adminToggleStockHidden(stockId);
      if (action === "edit") openDrawer(stockId);

      if (action === "moveDown") moveStockOneStep(stockId, 1);

    async function switchMainView(view) {
      state.mainView = view || "pool";
      state.query = "";
      render();
      if (state.mainView === "square") {
        await loadSquare();
        render();
        return;
      }
      if (state.mainView === "admin" && state.isAdmin) {
        await loadAdmin();
        render();
        return;
      }
      if (state.mainView === "pool") {
        refreshMarketCaps({ renderAfter: false }).then(render).catch((error) => console.warn("市值刷新失败。", error));
        return;
      }
      if (state.mainView === "portfolio") {
        Promise.all([refreshPortfolioQuotes({ renderAfter: false }), loadPortfolioPerformance()])
          .then(render)
          .catch((error) => console.warn("组合数据刷新失败。", error));
      }

    async function loadPortfolioPerformance() {
      const portfolio = activePortfolio();
      if (!portfolio || !state.session?.access_token || state.session.access_token === "local-demo") return;
      const requestedPortfolioId = portfolio.id;
      try {
        const [navRows, benchmarkRows] = await Promise.all([
          supabaseRequest(`/rest/v1/portfolio_daily_nav?portfolio_id=eq.${encodeURIComponent(portfolio.id)}&select=nav_date,unit_nav,total_assets,total_units&order=nav_date.asc`),
          supabaseRequest(`/rest/v1/benchmark_daily_close?select=benchmark_code,trade_date,close_value&order=trade_date.asc`)
        ]);
        if (state.activePortfolioId !== requestedPortfolioId) return;
        state.navHistory = navRows || [];
        state.navHistoryPortfolioId = requestedPortfolioId;
        state.benchmarkHistory = benchmarkRows || [];
      } catch (error) {
        console.warn("净值历史表尚未就绪。", error);
        if (state.activePortfolioId !== requestedPortfolioId) return;
        state.navHistory = [];
        state.navHistoryPortfolioId = requestedPortfolioId;
        state.benchmarkHistory = [];
      }
    }

    function portfolioStorageKey() {
      return `${PORTFOLIO_STORAGE_PREFIX}${state.session?.user?.id || "guest"}`;
    }

    async function loadPortfolios() {
      const saved = readJson(portfolioStorageKey(), { portfolios: [], activePortfolioId: "" });
      state.portfolios = Array.isArray(saved?.portfolios) ? saved.portfolios : [];
      state.activePortfolioId = saved?.activePortfolioId || state.portfolios[0]?.id || "";
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        try {
          const rows = await supabaseRequest(`/rest/v1/portfolios?user_id=eq.${encodeURIComponent(state.session.user.id)}&select=id,payload&order=created_at.asc`);
          const cloudPortfolios = (rows || []).map((row) => ({ ...(row.payload || {}), id: row.id }));
          if (cloudPortfolios.length) {
            state.portfolios = cloudPortfolios;
          } else if (state.portfolios.length) {
            await persistPortfoliosToCloud(state.portfolios);
          }
        } catch (error) {
          console.warn("组合云端表尚未就绪，暂时使用本地数据。", error);
        }
      }
      if (state.activePortfolioId && !state.portfolios.some((item) => item.id === state.activePortfolioId)) {
        state.activePortfolioId = state.portfolios[0]?.id || "";
      }
      if (!state.activePortfolioId) state.activePortfolioId = state.portfolios[0]?.id || "";
      writeJson(portfolioStorageKey(), { portfolios: state.portfolios, activePortfolioId: state.activePortfolioId });
    }

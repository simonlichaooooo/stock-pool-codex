    function submitPortfolioCashFlow(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || !["subscription", "redemption"].includes(modal?.type)) return;
      const form = new FormData(event.currentTarget);
      const currency = String(form.get("currency") || portfolioBaseCurrency(portfolio));
      const amount = Number(form.get("amount")) * 10000;
      if (!Number.isFinite(amount) || amount <= 0) return showPortfolioError("请输入有效金额。");
      const metrics = portfolioMetrics(portfolio);
      if (metrics.nav <= 0) return showPortfolioError("当前净值无效，无法计算份额。");
      if (modal.type === "redemption" && Number(portfolio.cash?.[currency] || 0) < amount) return showPortfolioError(`${currencies[currency].label}现金余额不足。`);
      const baseAmount = amount * portfolioFx(currency, portfolioBaseCurrency(portfolio));
      const unitsChanged = baseAmount / metrics.nav;
      const oldUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      if (modal.type === "redemption" && unitsChanged >= oldUnits) return showPortfolioError("赎回份额必须小于当前总份额。");
      updateActivePortfolio((item) => ({
        ...item,
        totalUnits: oldUnits + (modal.type === "subscription" ? unitsChanged : -unitsChanged),
        cash: { ...item.cash, [currency]: Number(item.cash?.[currency] || 0) + (modal.type === "subscription" ? amount : -amount) },
        cashFlows: [...(item.cashFlows || []), { id: id("flow"), type: modal.type, currency, amount, navBefore: metrics.nav, unitsChanged, occurredAt: new Date().toISOString() }],
        updatedAt: new Date().toISOString()
      }));
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        supabaseRequest("/rest/v1/portfolio_cash_flows", { method: "POST", body: JSON.stringify({
          portfolio_id: portfolio.id, user_id: state.session.user.id, flow_type: modal.type,
          currency, amount, nav_before: metrics.nav, units_changed: unitsChanged
        }) }).catch((error) => console.warn("申购赎回流水保存失败。", error));
      }
      closePortfolioModal();
    }

    function rebalanceCashCurrency(portfolio, currency) {
      return portfolio.accountType === "CNY" ? "CNY" : currency;
    }

    function rebalanceBasePerShare(stock, price, portfolio) {
      const currency = stock?.currency || marketCurrency(stock?.market);
      return Number(price || 0) * portfolioFx(currency, portfolioBaseCurrency(portfolio));
    }

    function updateRebalancePreviewDom() {
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || modal?.type !== "rebalance") return;
      const metrics = portfolioMetrics(portfolio);
      ["sell", "buy"].forEach((side) => {
        const stock = modal[`${side}Stock`];
        const priceInput = document.querySelector(`[data-rebalance-price='${side}']`);
        const sharesInput = document.querySelector(`[data-rebalance-shares='${side}']`);
        const price = Number(priceInput?.value || 0);
        const shares = Number(sharesInput?.value || 0);
        const position = rebalanceCurrentPosition(stock, portfolio);
        const currentRatio = position && metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase * 100 : 0;
        const tradeBase = price > 0 && shares > 0 ? price * shares * portfolioFx(stock?.currency || marketCurrency(stock?.market), portfolioBaseCurrency(portfolio)) : 0;
        const tradeRatio = metrics.netBase ? tradeBase / metrics.netBase * 100 : 0;
        const afterRatio = side === "sell" ? Math.max(0, currentRatio - tradeRatio) : currentRatio + tradeRatio;
        const currentNode = document.querySelector(`[data-rebalance-preview='${side}-current']`);
        const tradeNode = document.querySelector(`[data-rebalance-preview='${side}-trade']`);
        const afterNode = document.querySelector(`[data-rebalance-preview='${side}-after']`);
        if (currentNode) currentNode.textContent = `${currentRatio.toFixed(2)}%`;
        if (tradeNode) tradeNode.textContent = `${tradeRatio.toFixed(2)}%`;
        if (afterNode) afterNode.textContent = `${afterRatio.toFixed(2)}%`;
      });
    }

    function applyRebalanceRatio(side, ratio) {
      const modal = state.portfolioModal;
      const portfolio = activePortfolio();
      if (!portfolio || modal?.type !== "rebalance" || !["sell", "buy"].includes(side) || !Number.isFinite(ratio) || ratio <= 0) return;
      const input = document.querySelector(`[data-rebalance-shares='${side}']`);
      if (!input) return;
      const stock = modal[`${side}Stock`];
      const position = rebalanceCurrentPosition(stock, portfolio);
      let shares = position ? Math.floor(Number(position.shares || 0) * ratio) : 0;
      if (side === "buy" && !shares) {
        const sellStock = modal.sellStock;
        const buyStock = modal.buyStock;
        const sellPrice = Number(document.querySelector("[data-rebalance-price='sell']")?.value || 0);
        const buyPrice = Number(document.querySelector("[data-rebalance-price='buy']")?.value || 0);
        const sellPosition = rebalanceCurrentPosition(sellStock, portfolio);
        if (sellStock && buyStock && sellPosition && sellPrice > 0 && buyPrice > 0) {
          const sellShares = Math.floor(Number(sellPosition.shares || 0) * ratio);
          const sourceBase = rebalanceBasePerShare(sellStock, sellPrice, portfolio) * sellShares;
          const buyPerShare = rebalanceBasePerShare(buyStock, buyPrice, portfolio);
          shares = buyPerShare > 0 ? Math.floor(sourceBase / buyPerShare) : 0;
        }
      }
      input.value = shares > 0 ? String(shares) : "";
      modal[`${side}Shares`] = input.value;
      modal.lastEditedSide = side;
      onRebalanceInput(side, "shares");
    }

    function onRebalanceInput(side, field) {
      const modal = state.portfolioModal;
      const portfolio = activePortfolio();
      if (!portfolio || modal?.type !== "rebalance" || !["sell", "buy"].includes(side)) return;
      const priceInput = document.querySelector(`[data-rebalance-price='${side}']`);
      const sharesInput = document.querySelector(`[data-rebalance-shares='${side}']`);
      modal[`${side}Price`] = priceInput?.value || "";
      modal[`${side}Shares`] = sharesInput?.value || "";
      if (field === "shares") modal.lastEditedSide = side;
      const sourceSide = modal.lastEditedSide || side;
      const targetSide = sourceSide === "sell" ? "buy" : "sell";
      const sourceStock = modal[`${sourceSide}Stock`];
      const targetStock = modal[`${targetSide}Stock`];
      const sourcePrice = Number(document.querySelector(`[data-rebalance-price='${sourceSide}']`)?.value || 0);
      const targetPrice = Number(document.querySelector(`[data-rebalance-price='${targetSide}']`)?.value || 0);
      const sourceShares = Number(document.querySelector(`[data-rebalance-shares='${sourceSide}']`)?.value || 0);
      const targetSharesInput = document.querySelector(`[data-rebalance-shares='${targetSide}']`);
      if (sourceStock && targetStock && sourcePrice > 0 && targetPrice > 0 && sourceShares > 0 && targetSharesInput) {
        const sourceBase = rebalanceBasePerShare(sourceStock, sourcePrice, portfolio) * sourceShares;
        const targetPerShare = rebalanceBasePerShare(targetStock, targetPrice, portfolio);
        const nextShares = targetPerShare > 0
          ? (sourceSide === "sell" ? Math.floor(sourceBase / targetPerShare) : Math.ceil(sourceBase / targetPerShare))
          : 0;
        targetSharesInput.value = nextShares > 0 ? String(nextShares) : "";
        modal[`${targetSide}Shares`] = targetSharesInput.value;
      }
      updateRebalancePreviewDom();
    }

    function validatePortfolioStockForAccount(portfolio, stock, label) {
      if (portfolio.accountType === "CNY" && !["CN", "HK"].includes(stock.market)) return `${label}股票不符合人民币账户可交易市场。`;
      if (portfolio.accountType === "HKUS" && !["HK", "US"].includes(stock.market)) return `${label}股票不符合港美账户可交易市场。`;
      return "";
    }

    function submitRebalanceTrade(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || modal?.type !== "rebalance") return;
      const form = new FormData(event.currentTarget);
      const sellStock = modal.sellStock;
      const buyStock = modal.buyStock;
      if (!sellStock) return showPortfolioError("请先选择卖出股票。");
      if (!buyStock) return showPortfolioError("请先选择买入股票。");
      if (sellStock.code === buyStock.code && sellStock.market === buyStock.market) return showPortfolioError("调仓买入和卖出不能是同一只股票。");
      const marketError = validatePortfolioStockForAccount(portfolio, sellStock, "卖出") || validatePortfolioStockForAccount(portfolio, buyStock, "买入");
      if (marketError) return showPortfolioError(marketError);
      const sellPosition = rebalanceCurrentPosition(sellStock, portfolio);
      if (!sellPosition) return showPortfolioError("卖出股票必须是当前持仓。");
      const sellPrice = Number(form.get("sellPrice"));
      const buyPrice = Number(form.get("buyPrice"));
      const sellShares = Number(form.get("sellShares"));
      const buyShares = Number(form.get("buyShares"));
      if (!Number.isFinite(sellPrice) || sellPrice <= 0 || !Number.isFinite(buyPrice) || buyPrice <= 0) return showPortfolioError("请输入有效的卖出价格和买入价格。");
      if (!Number.isInteger(sellShares) || sellShares <= 0 || !Number.isInteger(buyShares) || buyShares <= 0) return showPortfolioError("卖出数量和买入数量必须为正整数。");
      if (sellShares > Number(sellPosition.shares)) return showPortfolioError("卖出数量不能超过当前持股数。");
      const sellCurrency = sellStock.currency || sellPosition.currency || marketCurrency(sellStock.market);
      const buyCurrency = buyStock.currency || marketCurrency(buyStock.market);
      const sellCashCurrency = rebalanceCashCurrency(portfolio, sellCurrency);
      const buyCashCurrency = rebalanceCashCurrency(portfolio, buyCurrency);
      const sellCashAmount = sellPrice * sellShares * portfolioFx(sellCurrency, sellCashCurrency);
      const buyCashAmount = buyPrice * buyShares * portfolioFx(buyCurrency, buyCashCurrency);
      const cashDeltas = { [sellCashCurrency]: sellCashAmount };
      cashDeltas[buyCashCurrency] = Number(cashDeltas[buyCashCurrency] || 0) - buyCashAmount;
      for (const [currency, delta] of Object.entries(cashDeltas)) {
        if (Number(portfolio.cash?.[currency] || 0) + delta < -0.000001) return showPortfolioError(`${currencies[currency]?.label || currency}现金余额不足。`);
      }
      updateActivePortfolio((item) => {
        const positions = [...item.positions];
        const now = new Date().toISOString();
        const sellIndex = positions.findIndex((position) => position.id === sellPosition.id);
        let soldPositionId = sellPosition.id;
        if (sellIndex >= 0) {
          const old = positions[sellIndex];
          const remaining = Number(old.shares) - sellShares;
          if (remaining === 0) positions.splice(sellIndex, 1);
          else positions[sellIndex] = {
            ...old,
            shares: remaining,
            averageCost: roundPortfolioCost((Number(old.shares) * Number(old.averageCost) - sellPrice * sellShares) / remaining),
            latestPrice: Number(old.latestPrice) || sellPrice
          };
        }
        const buyIndex = positions.findIndex((position) => position.code === buyStock.code && position.market === buyStock.market);
        let boughtPositionId = "";
        if (buyIndex >= 0) {
          const old = positions[buyIndex];
          const newShares = Number(old.shares) + buyShares;
          positions[buyIndex] = {
            ...old,
            shares: newShares,
            averageCost: roundPortfolioCost((Number(old.shares) * Number(old.averageCost) + buyPrice * buyShares) / newShares),
            latestPrice: Number(buyStock.latestPrice) || Number(old.latestPrice) || buyPrice
          };
          boughtPositionId = old.id;
        } else {
          boughtPositionId = id("position");
          positions.push({
            id: boughtPositionId, name: buyStock.name, code: buyStock.code, rawCode: buyStock.rawCode || "", market: buyStock.market,
            exchange: buyStock.exchange || "", quoteId: buyStock.quoteId || "", currency: buyCurrency, shares: buyShares, averageCost: roundPortfolioCost(buyPrice),
            latestPrice: Number(buyStock.latestPrice) || buyPrice, priceUpdatedAt: buyStock.marketCapUpdatedAt || todayString()
          });
        }
        const nextCash = { ...item.cash };
        Object.entries(cashDeltas).forEach(([currency, delta]) => { nextCash[currency] = Number(nextCash[currency] || 0) + delta; });
        const tradeHistory = [
          ...(item.tradeHistory || []),
          { id: id("trade"), positionId: soldPositionId, code: sellStock.code, market: sellStock.market, type: "reduce", currency: sellCurrency, price: sellPrice, shares: sellShares, occurredAt: now },
          { id: id("trade"), positionId: boughtPositionId, code: buyStock.code, market: buyStock.market, type: "add", currency: buyCurrency, price: buyPrice, shares: buyShares, occurredAt: now }
        ];
        return { ...item, positions, tradeHistory, cash: nextCash, updatedAt: now };
      });
      closePortfolioModal();
    }

    function localDateTimeMinuteValue(value = new Date()) {
      const date = value instanceof Date ? value : new Date(value);
      if (!Number.isFinite(date.getTime())) return "";
      const pad = (number) => String(number).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function portfolioTradeSign(type) { return type === "reduce" ? -1 : 1; }
    function portfolioTradeTypeText(type) { return type === "open" ? "开仓" : type === "add" ? "加仓" : type === "expire" ? "到期作废" : type === "exercise" ? "自动行权" : "减持/平仓"; }
    function portfolioTradeDate(trade) { return localDateTimeMinuteValue(trade?.occurredAt).slice(0, 10); }

    function historicalFx(currency, baseCurrency, rates = {}) {
      if (currency === baseCurrency) return 1;
      const hkdCny = Number(rates.HKD_CNY);
      const usdCny = Number(rates.USD_CNY);
      if (baseCurrency === "CNY" && currency === "HKD" && hkdCny > 0) return hkdCny;
      if (baseCurrency === "CNY" && currency === "USD" && usdCny > 0) return usdCny;
      if (baseCurrency === "USD" && currency === "CNY" && usdCny > 0) return 1 / usdCny;
      if (baseCurrency === "USD" && currency === "HKD" && hkdCny > 0 && usdCny > 0) return hkdCny / usdCny;
      return portfolioFx(currency, baseCurrency);
    }

    async function fetchHistoricalCloses(stock, firstDate, lastDate) {
      let quoteId = stockQuoteId(stock);
      if (!quoteId && stock.market === "US") quoteId = `105.${String(stock.rawCode || stock.code || "").toUpperCase()}`;
      if (!quoteId) throw new Error("暂时无法识别这只股票的历史行情代码。");
      const compact = (value) => String(value).replaceAll("-", "");
      const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${encodeURIComponent(quoteId)}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=${compact(firstDate)}&end=${compact(lastDate)}`;
      const response = await fetchWithTimeout(url, 10000);
      if (!response.ok) throw new Error("历史行情请求失败。");
      const json = await response.json();
      const closes = (json?.data?.klines || []).map((line) => String(line).split(",")).map((parts) => [parts[0], Number(parts[2])]).filter((item) => item[0] && item[1] > 0);
      if (!closes.length) throw new Error("没有取得该股票的历史收盘价。");
      return closes;
    }

    async function revisedNavForTrades(portfolio, stock, changes) {
      if (state.navHistoryPortfolioId !== portfolio.id && state.session?.access_token !== "local-demo") await loadPortfolioPerformance();
      const rows = (state.navHistory || []).map((row) => ({ ...row }));
      if (!rows.length) return { rows, corrections: { ...(portfolio.navHistoryCorrections || {}) } };
      const applicableDates = changes.map(({ trade }) => portfolioTradeDate(trade)).filter(Boolean);
      const firstDate = [...applicableDates, rows[0].nav_date].sort()[0];
      const lastDate = rows[rows.length - 1].nav_date;
      if (firstDate > lastDate) return { rows, corrections: { ...(portfolio.navHistoryCorrections || {}) } };
      const priceStart = new Date(`${firstDate}T00:00:00`);
      priceStart.setDate(priceStart.getDate() - 10);
      const closes = await fetchHistoricalCloses(stock, localDateTimeMinuteValue(priceStart).slice(0, 10), lastDate);
      let closeIndex = 0;
      let latestClose = 0;
      const corrections = { ...(portfolio.navHistoryCorrections || {}) };
      rows.forEach((row) => {
        while (closeIndex < closes.length && closes[closeIndex][0] <= row.nav_date) { latestClose = closes[closeIndex][1]; closeIndex += 1; }
        let totalDelta = 0;
        let positionDelta = 0;
        let cashDelta = 0;
        changes.forEach(({ trade, multiplier }) => {
          if (row.nav_date < portfolioTradeDate(trade)) return;
          const currency = trade.currency || stock.currency || marketCurrency(stock.market);
          const baseCurrency = row.base_currency || (portfolio.accountType === "CNY" ? "CNY" : "USD");
          const fx = historicalFx(currency, baseCurrency, row.fx_rates || {});
          const signedShares = portfolioTradeSign(trade.type) * Number(trade.shares) * multiplier;
          positionDelta += signedShares * latestClose * fx;
          cashDelta -= signedShares * Number(trade.price) * fx;
        });
        totalDelta = positionDelta + cashDelta;
        if (Math.abs(totalDelta) < 0.0000001) return;
        if (!(latestClose > 0) || !Number.isFinite(Number(row.total_assets)) || !(Number(row.total_units) > 0)) throw new Error(`无法安全重算 ${row.nav_date} 的净值。`);
        const corrected = {
          total_assets: Number(row.total_assets) + totalDelta,
          position_value: Number(row.position_value || 0) + positionDelta,
          cash_value: Number(row.cash_value || 0) + cashDelta,
          unit_nav: (Number(row.total_assets) + totalDelta) / Number(row.total_units),
          revised_at: new Date().toISOString()
        };
        Object.assign(row, corrected);
        corrections[row.nav_date] = corrected;
      });
      return { rows, corrections };
    }

    async function submitPositionTrade(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || !modal) return;
      const form = new FormData(event.currentTarget, event.submitter);
      const selectedAsset = modal.type === "open" ? modal.stock : modal.position;
      if(selectedAsset?.assetType==="option"&&modal.type==="edit") return submitOptionDirectionEdit(form,portfolio,selectedAsset);
      const price = Number(form.get("price"));
      const shares = Number(form.get("shares"));
      if (!Number.isFinite(price) || price <= 0) return showPortfolioError("请输入有效价格。");
      if(selectedAsset?.assetType==="option") return submitOptionTrade(form,portfolio,modal,selectedAsset,price);
      if (!Number.isInteger(shares) || shares <= 0) return showPortfolioError("买卖数量必须为正整数。");
      const stock = selectedAsset;
      if (!stock) return showPortfolioError("请先选择股票。");
      if (modal.type === "edit") {
        const targetWeight = parsePositionTargetWeight(form.get("targetWeight"));
        const valuationStockId = String(form.get("valuationStockId") || "");
        if (valuationStockId && !portfolioValuationStock(stock, valuationStockId)) return showPortfolioError("所选估值版本已不存在，请重新选择。");
        if (!Number.isFinite(targetWeight) || targetWeight < 0 || targetWeight > 100) return showPortfolioError("目标仓位请输入 0 到 100 之间的百分比。");
        const tradePlan = { buy: [], sell: [] };
        for (const side of ["buy", "sell"]) {
          const rowCount = event.currentTarget.querySelectorAll(`[data-plan-row][data-plan-side='${side}']`).length;
          for (let index = 0; index < rowCount; index += 1) {
            const planPrice = Number(form.get(`plan_${side}_${index}_price`) || 0);
            const planShares = Number(form.get(`plan_${side}_${index}_shares`) || 0);
            const planRemark = String(form.get(`plan_${side}_${index}_remark`) || "").trim();
            if (!Number.isFinite(planPrice) || planPrice < 0) return showPortfolioError("计划价格不能小于 0。");
            if (!Number.isInteger(planShares) || planShares < 0) return showPortfolioError("计划股数必须为非负整数。");
            const existingPlan=normalizedPositionTradePlan(stock)[side][index]||{};
            tradePlan[side].push({ ...existingPlan, price: planPrice, shares: planShares, remark: planRemark, done: form.has(`plan_${side}_${index}_done`) });
          }
        }
        updateActivePortfolio((item) => ({
          ...item,
          positions: item.positions.map((position) => position.id === stock.id ? { ...position, shares, averageCost: roundPortfolioCost(price), targetWeight, valuationStockId, tradePlan, tags: [...new Set((modal.tags || []).map((tag) => String(tag).trim()).filter(Boolean))] } : position),
          updatedAt: new Date().toISOString()
        }));
        closePortfolioModal();
        return;
      }
      if (portfolio.accountType === "CNY" && !["CN", "HK"].includes(stock.market)) return showPortfolioError("人民币账户只能开仓 A 股或港股通股票。");
      if (portfolio.accountType === "HKUS" && !["HK", "US"].includes(stock.market)) return showPortfolioError("港美账户只能开仓港股或美股。");
      if (modal.type === "open" && portfolio.positions.some((item) => item.code === stock.code && item.market === stock.market)) return showPortfolioError("该股票已在组合中，请使用加仓。");
      if (modal.type === "reduce" && shares > Number(stock.shares)) return showPortfolioError("减持数量不能超过当前股数。");
      const occurredAt = form.has("backfillTrade") ? new Date(String(form.get("occurredAt") || "")) : new Date();
      if (!Number.isFinite(occurredAt.getTime())) return showPortfolioError("请输入有效的补录交易时间。");
      if (occurredAt.getTime() > Date.now() + 60000) return showPortfolioError("补录交易时间不能晚于现在。");
      const amount = price * shares;
      const currency = stock.currency || marketCurrency(stock.market);
      const cashCurrency = portfolio.accountType === "CNY" ? "CNY" : currency;
      const cashAmount = amount * portfolioFx(currency, cashCurrency);
      if (modal.type === "open" && Number(portfolio.cash?.[cashCurrency] || 0) < cashAmount) return showPortfolioError(`${currencies[cashCurrency]?.label || cashCurrency}现金余额不足。`);
      const now = new Date().toISOString();
      const newPositionId = modal.type === "open" ? id("position") : stock.id;
      const trade = { id: id("trade"), positionId: newPositionId, code: stock.code, market: stock.market, type: modal.type, currency, price, shares, occurredAt: occurredAt.toISOString() };
      let navRevision;
      if (form.has("backfillTrade")) {
        try { navRevision = await revisedNavForTrades(portfolio, stock, [{ trade, multiplier: 1 }]); }
        catch (error) { return showPortfolioError(error.message || "历史净值回溯失败，请稍后重试。"); }
      }
      updateActivePortfolio((item) => {
        const positions = [...item.positions];
        if (modal.type === "open") {
          positions.push({
            id: newPositionId, name: stock.name, code: stock.code, rawCode: stock.rawCode || "", market: stock.market,
            exchange: stock.exchange || "", quoteId: stock.quoteId || "", currency, shares, averageCost: roundPortfolioCost(price),
            latestPrice: Number(stock.latestPrice) || price, priceUpdatedAt: stock.marketCapUpdatedAt || todayString()
          });
        } else {
          const index = positions.findIndex((position) => position.id === stock.id);
          if (index >= 0 && modal.type === "add") {
            const old = positions[index];
            const newShares = Number(old.shares) + shares;
            positions[index] = { ...old, shares: newShares, averageCost: roundPortfolioCost((Number(old.shares) * Number(old.averageCost) + amount) / newShares), latestPrice: Number(old.latestPrice) || price };
          }
          if (index >= 0 && modal.type === "reduce") {
            const oldPosition = positions[index];
            const remaining = Number(oldPosition.shares) - shares;
            if (remaining === 0) positions.splice(index, 1);
            else positions[index] = {
              ...oldPosition,
              shares: remaining,
              averageCost: roundPortfolioCost((Number(oldPosition.shares) * Number(oldPosition.averageCost) - amount) / remaining)
            };
          }
        }
        const cashDelta = modal.type === "reduce" ? cashAmount : -cashAmount;
        const tradeHistory = [...(item.tradeHistory || []), trade];
        return { ...item, positions, tradeHistory, navHistoryCorrections: navRevision?.corrections || item.navHistoryCorrections, cash: { ...item.cash, [cashCurrency]: Number(item.cash?.[cashCurrency] || 0) + cashDelta }, updatedAt: now };
      });
      if (navRevision) { state.navHistory = navRevision.rows; state.navHistoryPortfolioId = portfolio.id; }
      closePortfolioModal();
    }

    function submitOptionDirectionEdit(form,portfolio,option){
      const nextDirection=String(form.get("direction")||"")==="short"?"short":"long";
      const previousDirection=option.direction==="short"?"short":"long";
      if(nextDirection===previousDirection){
        closePortfolioModal();
        return;
      }
      const currency=option.currency||marketCurrency(option.market),cashCurrency=portfolio.accountType==="CNY"?"CNY":currency;
      const premiumAmount=Number(option.averageCost||0)*Number(option.contracts||0)*Number(option.contractMultiplier||0);
      const baseCashAmount=premiumAmount*portfolioFx(currency,cashCurrency);
      const cashCorrection=previousDirection==="long"?baseCashAmount*2:-baseCashAmount*2;
      if(Number(portfolio.cash?.[cashCurrency]||0)+cashCorrection<-.000001) return showPortfolioError(`${currencies[cashCurrency]?.label||cashCurrency}现金余额不足，无法改为做多。`);
      updateActivePortfolio((item)=>({
        ...item,
        positions:(item.positions||[]).map((position)=>position.id===option.id?{...position,direction:nextDirection}:position),
        tradeHistory:(item.tradeHistory||[]).map((trade)=>trade.positionId===option.id?{...trade,direction:nextDirection}:trade),
        cash:{...item.cash,[cashCurrency]:Number(item.cash?.[cashCurrency]||0)+cashCorrection},
        updatedAt:new Date().toISOString()
      }));
      closePortfolioModal();
    }

    function submitOptionTrade(form,portfolio,modal,option,price){
      const contracts=Number(form.get("contracts")),multiplier=Number(form.get("contractMultiplier")||option.contractMultiplier),strike=Number(form.get("strikePrice")||option.strikePrice);
      const expiryDate=String(form.get("expiryDate")||option.expiryDate||""),direction=String(form.get("direction")||option.direction||"long")==="short"?"short":"long";
      if(!Number.isInteger(contracts)||contracts<=0) return showPortfolioError("期权交易张数必须为正整数。");
      if(!Number.isInteger(multiplier)||multiplier<=0) return showPortfolioError("每张对应股数必须为正整数。");
      if(!(strike>0)||!/^\d{4}-\d{2}-\d{2}$/.test(expiryDate)) return showPortfolioError("请填写有效的行权价和到期日。");
      if(expiryDate<portfolioCalendarDateString(new Date())) return showPortfolioError("到期日不能早于今天。");
      if(!["HK","US"].includes(option.market)) return showPortfolioError("第一期期权仅支持港股和美股标的。");
      if(portfolio.accountType==="CNY"&&option.market!=="HK") return showPortfolioError("人民币账户第一期仅支持港股期权。");
      if(modal.type==="reduce"&&contracts>Number(option.contracts||0)) return showPortfolioError("平仓张数不能超过当前持仓。");
      if(modal.type==="open"&&(portfolio.positions||[]).some((item)=>item.assetType==="option"&&item.code===option.code&&item.direction===direction)) return showPortfolioError("该方向的期权合约已在组合中，请使用加仓。");
      const occurredAt=form.has("backfillTrade")?new Date(String(form.get("occurredAt")||"")):new Date();
      if(!Number.isFinite(occurredAt.getTime())) return showPortfolioError("请输入有效的补录交易时间。");
      if(occurredAt.getTime()>Date.now()+60000) return showPortfolioError("补录交易时间不能晚于现在。");
      const currency=option.currency||marketCurrency(option.market),cashCurrency=portfolio.accountType==="CNY"?"CNY":currency;
      const premiumAmount=price*contracts*multiplier,baseCashAmount=premiumAmount*portfolioFx(currency,cashCurrency);
      const opening=modal.type!=="reduce",cashDelta=(direction==="long"?(opening?-1:1):(opening?1:-1))*baseCashAmount;
      if(Number(portfolio.cash?.[cashCurrency]||0)+cashDelta<-.000001) return showPortfolioError(`${currencies[cashCurrency]?.label||cashCurrency}现金余额不足。`);
      const now=new Date().toISOString(),newPositionId=modal.type==="open"?id("option"):option.id;
      const trade={id:id("trade"),positionId:newPositionId,code:option.code,market:option.market,assetType:"option",type:modal.type,direction,currency,price,contracts,multiplier,occurredAt:occurredAt.toISOString()};
      updateActivePortfolio((item)=>{
        const positions=[...(item.positions||[])];
        if(modal.type==="open"){
          positions.push({
            id:newPositionId,assetType:"option",name:option.underlyingName||option.name,code:option.contractCode||option.code,contractCode:option.contractCode||option.code,
            underlyingCode:option.underlyingCode,underlyingName:option.underlyingName||option.name,rawCode:option.rawCode||"",market:option.market,exchange:option.exchange||"",
            quoteId:option.underlyingQuoteId||option.quoteId||"",currency,optionType:option.optionType,direction,expiryDate,strikePrice:strike,contractMultiplier:multiplier,
            contracts,averageCost:roundPortfolioCost(price),latestPrice:price,previousClose:price,underlyingLatestPrice:Number(option.underlyingLatestPrice)||0,priceUpdatedAt:now
          });
        }else{
          const index=positions.findIndex((position)=>position.id===option.id);
          if(index>=0&&modal.type==="add"){
            const old=positions[index],nextContracts=Number(old.contracts)+contracts;
            positions[index]={...old,contracts:nextContracts,averageCost:roundPortfolioCost((Number(old.contracts)*Number(old.averageCost)+contracts*price)/nextContracts),latestPrice:price};
          }
          if(index>=0&&modal.type==="reduce"){
            const remaining=Number(option.contracts)-contracts;
            if(!remaining) positions.splice(index,1);
            else positions[index]={...positions[index],contracts:remaining,latestPrice:price};
          }
        }
        return {...item,positions,tradeHistory:[...(item.tradeHistory||[]),trade],cash:{...item.cash,[cashCurrency]:Number(item.cash?.[cashCurrency]||0)+cashDelta},updatedAt:now};
      });
      closePortfolioModal();
    }

    async function savePortfolioTradeShares(tradeId) {
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || modal?.type !== "history" || !tradeId) return;
      const trade = (portfolio.tradeHistory || []).find((item) => item.id === tradeId);
      if (!trade || !["open", "add", "reduce"].includes(trade.type)) return showPortfolioError("没有找到可修改的交易记录。");
      const sharesInput = document.querySelector(`[data-history-shares='${CSS.escape(tradeId)}']`);
      const priceInput = document.querySelector(`[data-history-price='${CSS.escape(tradeId)}']`);
      const timeInput = document.querySelector(`[data-history-time='${CSS.escape(tradeId)}']`);
      const nextTradeShares = Number(sharesInput?.value);
      const nextTradePrice = Number(priceInput?.value);
      const nextOccurredAt = new Date(String(timeInput?.value || ""));
      const oldTradeShares = Number(trade.shares);
      if (!Number.isInteger(nextTradeShares) || nextTradeShares <= 0) return showPortfolioError("交易股数必须为正整数。");
      if (!(nextTradePrice > 0)) return showPortfolioError("请输入有效成交价。");
      if (!Number.isFinite(nextOccurredAt.getTime()) || nextOccurredAt.getTime() > Date.now() + 60000) return showPortfolioError("请输入不晚于现在的有效交易时间。");
      if (!Number.isInteger(oldTradeShares) || oldTradeShares <= 0) return showPortfolioError("原交易股数无效，无法安全修改。");
      const nextTrade = { ...trade, shares: nextTradeShares, price: nextTradePrice, occurredAt: nextOccurredAt.toISOString() };
      if (nextTradeShares === oldTradeShares && nextTradePrice === Number(trade.price) && nextTrade.occurredAt === trade.occurredAt) return cancelPortfolioTradeSharesEdit();
      const position = (portfolio.positions || []).find((item) => item.id === trade.positionId || (!trade.positionId && item.code === trade.code && (!trade.market || item.market === trade.market)));
      if (!position) return showPortfolioError("当前持仓中已找不到这只股票，无法安全修改。");
      const price = Number(trade.price);
      const currentShares = Number(position.shares);
      const currentCost = Number(position.averageCost);
      if (!(price > 0) || !Number.isFinite(currentShares) || currentShares < 0 || !Number.isFinite(currentCost)) return showPortfolioError("持仓或交易数据不完整，无法安全修改。");
      const sign = portfolioTradeSign(trade.type);
      const tradeDifference = nextTradeShares - oldTradeShares;
      const positionSharesDelta = sign * tradeDifference;
      const nextPositionShares = currentShares + positionSharesDelta;
      if (nextPositionShares < 0) return showPortfolioError("修订后的减持数量超过当前可用股数。");
      const basisDelta = sign * (nextTradeShares * nextTradePrice - oldTradeShares * price);
      const nextCostBasis = currentShares * currentCost + basisDelta;
      const nextAverageCost = nextPositionShares > 0 ? nextCostBasis / nextPositionShares : 0;
      if (nextPositionShares > 0 && !Number.isFinite(nextAverageCost)) return showPortfolioError("修订后的摊薄成本无效，请检查股数。");
      const tradeCurrency = trade.currency || position.currency || marketCurrency(position.market);
      const cashCurrency = portfolio.accountType === "CNY" ? "CNY" : tradeCurrency;
      const cashDelta = -sign * (nextTradeShares * nextTradePrice - oldTradeShares * price) * portfolioFx(tradeCurrency, cashCurrency);
      const now = new Date().toISOString();
      let navRevision;
      try { navRevision = await revisedNavForTrades(portfolio, position, [{ trade, multiplier: -1 }, { trade: nextTrade, multiplier: 1 }]); }
      catch (error) {
        state.portfolioModal = { ...modal, editShares: String(nextTradeShares), editPrice: String(nextTradePrice), editOccurredAt: localDateTimeMinuteValue(nextOccurredAt) };
        return showPortfolioError(error.message || "历史净值回溯失败，请稍后重试。");
      }
      let nextPosition = null;
      updateActivePortfolio((item) => {
        const positions = [...(item.positions || [])];
        const index = positions.findIndex((entry) => entry.id === position.id);
        if (index < 0) return item;
        if (nextPositionShares === 0) {
          positions.splice(index, 1);
        } else {
          nextPosition = { ...positions[index], shares: nextPositionShares, averageCost: roundPortfolioCost(nextAverageCost), updatedAt: now };
          positions[index] = nextPosition;
        }
        return {
          ...item,
          positions,
          cash: { ...(item.cash || {}), [cashCurrency]: Number(item.cash?.[cashCurrency] || 0) + cashDelta },
          tradeHistory: (item.tradeHistory || []).map((entry) => entry.id === tradeId ? { ...nextTrade, revisedAt: now } : entry),
          navHistoryCorrections: navRevision.corrections,
          updatedAt: now
        };
      });
      state.navHistory = navRevision.rows;
      state.navHistoryPortfolioId = portfolio.id;
      state.portfolioError = "";
      if (!nextPosition) {
        state.portfolioModal = null;
      } else {
        state.portfolioModal = { ...modal, position: nextPosition, editTradeId: "", editShares: "", editPrice: "", editOccurredAt: "" };
      }
      render();
    }

    function rollbackPortfolioTrade(tradeId) {
      const portfolio = activePortfolio();
      if (!portfolio || !tradeId) return;
      const trade = (portfolio.tradeHistory || []).find((item) => item.id === tradeId);
      if (!trade || !["open", "add", "reduce"].includes(trade.type)) return showPortfolioError("没有找到可回滚的交易记录。");
      const position = (portfolio.positions || []).find((item) => item.id === trade.positionId)
        || (portfolio.positions || []).find((item) => item.assetType !== "option" && item.code === trade.code && (!trade.market || item.market === trade.market));
      if (!position) return showPortfolioError("当前持仓中已找不到这只股票，无法安全回滚。");
      const price = Number(trade.price);
      const shares = Number(trade.shares);
      const currentShares = Number(position.shares);
      const currentCost = Number(position.averageCost);
      if (!(price > 0) || !Number.isInteger(shares) || shares <= 0 || !Number.isFinite(currentShares)) return showPortfolioError("这条交易记录数据不完整，无法回滚。");
      if (portfolioTradeSign(trade.type) > 0 && currentShares < shares) return showPortfolioError("当前股数少于这笔买入数量，无法安全回滚。");
      const tradeTypeText = portfolioTradeTypeText(trade.type);
      const occurredAt = trade.occurredAt ? new Date(trade.occurredAt).toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "--";
      const cashCurrency = portfolio.accountType === "CNY" ? "CNY" : (trade.currency || position.currency || marketCurrency(position.market));
      const cashAmount = price * shares * portfolioFx(trade.currency || position.currency, cashCurrency);
      const cashText = formatPortfolioMoney(cashAmount, cashCurrency);
      const message = portfolioTradeSign(trade.type) > 0
        ? `确定回滚这笔${tradeTypeText}吗？\n\n${position.name} ${position.code}\n时间：${occurredAt}\n数量：${shares.toLocaleString("zh-CN")} 股\n成交价：${formatPortfolioMoney(price, trade.currency || position.currency)}\n\n回滚后会减少对应股数、恢复现金 ${cashText}，并删除这条交易历史。`
        : `确定回滚这笔${tradeTypeText}吗？\n\n${position.name} ${position.code}\n时间：${occurredAt}\n数量：${shares.toLocaleString("zh-CN")} 股\n成交价：${formatPortfolioMoney(price, trade.currency || position.currency)}\n\n回滚后会补回对应股数、扣回现金 ${cashText}，并删除这条交易历史。`;
      if (!confirm(message)) return;

      let nextPosition = null;
      updateActivePortfolio((item) => {
        const positions = [...(item.positions || [])];
        const index = positions.findIndex((entry) => entry.id === position.id);
        if (index < 0) return item;
        const old = positions[index];
        if (portfolioTradeSign(trade.type) > 0) {
          const remaining = Number(old.shares) - shares;
          if (remaining <= 0) {
            positions.splice(index, 1);
            nextPosition = null;
          } else {
            const restoredCost = (Number(old.shares) * Number(old.averageCost) - price * shares) / remaining;
            nextPosition = { ...old, shares: remaining, averageCost: roundPortfolioCost(restoredCost) };
            positions[index] = nextPosition;
          }
        } else {
          const restoredShares = Number(old.shares) + shares;
          if (!restoredShares) {
            positions.splice(index, 1);
            nextPosition = null;
          } else {
            const restoredCost = (Number(old.shares) * (Number.isFinite(currentCost) ? currentCost : 0) + price * shares) / restoredShares;
            nextPosition = { ...old, shares: restoredShares, averageCost: roundPortfolioCost(restoredCost), latestPrice: Number(old.latestPrice) || price };
            positions[index] = nextPosition;
          }
        }
        const cashDelta = portfolioTradeSign(trade.type) > 0 ? cashAmount : -cashAmount;
        const nextCash = { ...(item.cash || {}), [cashCurrency]: Number(item.cash?.[cashCurrency] || 0) + cashDelta };
        return {
          ...item,
          positions,
          cash: nextCash,
          tradeHistory: (item.tradeHistory || []).filter((entry) => entry.id !== tradeId),
          updatedAt: new Date().toISOString()
        };
      });
      if (nextPosition && state.portfolioModal?.type === "history") state.portfolioModal = { ...state.portfolioModal, position: nextPosition };
      if (!nextPosition && state.portfolioModal?.type === "history") state.portfolioModal = null;
      state.portfolioError = "";
      render();
    }

    function showPortfolioError(message) {
      state.portfolioError = message;
      render();
    }

    function stepPositionTargetWeight(direction) {
      const input = document.querySelector('input[name="targetWeight"]');
      if (!input) return;
      const tiers = [2, 3, 5, 8, 15, 25, 35];
      const current = parsePositionTargetWeight(input.value);
      const next = direction > 0
        ? (tiers.find((value) => value > current + 0.000001) ?? tiers.at(-1))
        : ([...tiers].reverse().find((value) => value < current - 0.000001) ?? tiers[0]);
      input.value = formatPositionTargetWeight(next);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function setPositionTargetWeight(value) {
      const input = document.querySelector('input[name="targetWeight"]');
      if (!input) return;
      input.value = formatPositionTargetWeight(value);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function stepPortfolioTagTargetWeight(direction) {
      const input = document.querySelector('input[name="tagTargetWeight"]');
      if (!input) return;
      const tiers = [0, 3, 5, 8, 15, 20, 30, 50, 100];
      const current = parsePositionTargetWeight(input.value);
      const next = direction > 0
        ? (tiers.find((value) => value > current + 0.000001) ?? 100)
        : ([...tiers].reverse().find((value) => value < current - 0.000001) ?? 0);
      input.value = formatPositionTargetWeight(next);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function setPortfolioTagTargetWeight(value) {
      const input = document.querySelector('input[name="tagTargetWeight"]');
      if (!input) return;
      input.value = formatPositionTargetWeight(value);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function updatePositionPlanDone(positionId, side, index, done) {
      if (!positionId || !["buy", "sell"].includes(side) || !Number.isInteger(index) || index < 0) return;
      updateActivePortfolio((portfolio) => ({
        ...portfolio,
        positions: portfolio.positions.map((position) => {
          if (position.id !== positionId) return position;
          const tradePlan = normalizedPositionTradePlan(position);
          tradePlan[side][index] = { ...tradePlan[side][index], done };
          return { ...position, tradePlan };
        }),
        updatedAt: new Date().toISOString()
      }));
      const updated = activePortfolio()?.positions?.find((position) => position.id === positionId);
      if (updated && state.portfolioModal?.position?.id === positionId) state.portfolioModal.position = updated;
    }

    function syncPortfolioPlanTargetWeight() {
      const portfolio=activePortfolio(),stock=state.portfolioModal?.stock,target=document.querySelector("[data-plan-target-weight]");
      const price=Number(document.querySelector("[data-plan-target-price]")?.value),shares=Number(document.querySelector("[data-plan-target-shares]")?.value);
      if(!target) return;
      const weight=portfolio&&stock&&price>0&&shares>0&&portfolioMetrics(portfolio).netBase>0
        ? price*shares*portfolioFx(stock.currency||marketCurrency(stock.market),portfolioBaseCurrency(portfolio))/portfolioMetrics(portfolio).netBase*100
        : NaN;
      target.textContent=Number.isFinite(weight)?`${weight.toFixed(2)}%`:"--";

    function submitPortfolioPlan(event) {
      event.preventDefault();
      const portfolio=activePortfolio(),modal=state.portfolioModal,stock=modal?.stock;
      if(!portfolio||modal?.type!=="plan"||!stock) return showPortfolioError("请先选择股票。");
      const form=new FormData(event.currentTarget,event.submitter),side=form.get("side")==="sell"?"sell":"buy";
      const price=Number(form.get("targetPrice")),shares=Number(form.get("targetShares")),remark=String(form.get("remark")||"").trim();
      if(!(price>0)) return showPortfolioError("请输入有效的目标价格。");
      if(!Number.isInteger(shares)||shares<=0) return showPortfolioError("目标数量必须为正整数。");
      const currency=stock.currency||marketCurrency(stock.market),metrics=portfolioMetrics(portfolio);
      const targetWeight=metrics.netBase>0?price*shares*portfolioFx(currency,portfolioBaseCurrency(portfolio))/metrics.netBase*100:0;
      const held=(portfolio.positions||[]).find((position)=>position.assetType!=="option"&&position.code===stock.code&&position.market===stock.market);
      updateActivePortfolio((item)=>{
        if(held){
          return {...item,positions:item.positions.map((position)=>{
            if(position.id!==held.id) return position;
            const tradePlan={buy:[...(position.tradePlan?.buy||[])],sell:[...(position.tradePlan?.sell||[])]};
            while(tradePlan[side].length<3) tradePlan[side].push({id:id("plan"),price:"",shares:"",remark:"",done:false});
            const emptyIndex=tradePlan[side].findIndex((row)=>!(Number(row?.price)>0)&&!(Number(row?.shares)>0)&&!String(row?.remark||"").trim());
            const nextPlan={id:id("plan"),price,shares,remark,done:false};
            if(emptyIndex>=0) tradePlan[side][emptyIndex]=nextPlan;
            else tradePlan[side].push(nextPlan);
            return {...position,tradePlan};
          }),updatedAt:new Date().toISOString()};
        }
        return {...item,plans:[...(item.plans||[]),{id:id("plan"),side,name:stock.name,code:stock.code,rawCode:stock.rawCode||"",market:stock.market,currency,price,shares,targetWeight,remark,done:false,createdAt:new Date().toISOString()}],updatedAt:new Date().toISOString()};

    function positionTradeSuggestion(position, portfolio, requestedType) {
      const metrics = portfolioMetrics(portfolio);
      const targetWeight = Number(position.targetWeight) || 0;
      const currentValue = positionBaseValue(position, portfolio);
      const currentWeight = metrics.netBase > 0 ? currentValue / metrics.netBase * 100 : 0;
      const gapBase = metrics.netBase * targetWeight / 100 - currentValue;
      const price = Number(position.latestPrice) || Number(position.averageCost) || 0;
      const basePerShare = price * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
      const lotSize = position.market === "CN" && requestedType === "add" ? 100 : 1;
      const roundLot = (value) => Math.floor(Math.max(0, value) / lotSize) * lotSize;
      const maxShares = requestedType === "reduce" ? Number(position.shares) : Infinity;
      const fullShares = basePerShare > 0 ? Math.min(maxShares, roundLot(Math.abs(gapBase) / basePerShare)) : 0;
      const gridShares = Math.min(maxShares, roundLot(Math.max(lotSize, fullShares / 4)));
      const toleranceBase = metrics.netBase * 0.0025;
      const action = !targetWeight || !basePerShare || Math.abs(gapBase) <= toleranceBase || !fullShares ? "hold" : gapBase > 0 ? "add" : "reduce";
      return { targetWeight, currentWeight, gapPercent: targetWeight - currentWeight, fullShares, gridShares: action === "hold" ? 0 : gridShares, action };
    }

        state.portfolios = state.portfolios.map((item) => item.id === portfolio.id ? {

            intradayQuoteAt: updates[index].intradayQuoteAt || "",
            changePercent: updates[index].changePercent,
            bias30w: Number.isFinite(updates[index].bias30w) ? updates[index].bias30w : (Number.isFinite(position.bias30w) ? position.bias30w : null),
            bias2yPercentile: Number.isFinite(updates[index].bias2yPercentile) ? updates[index].bias2yPercentile : (Number.isFinite(position.bias2yPercentile) ? position.bias2yPercentile : null),
            biasRecentValues: Array.isArray(updates[index].biasRecentValues) && updates[index].biasRecentValues.length ? updates[index].biasRecentValues : (Array.isArray(position.biasRecentValues) ? position.biasRecentValues : []),

    async function fetchIntradayBenchmark(item) {
      const variableName = `v_${item.symbol}`;
      delete window[variableName];
      await loadScript(`https://qt.gtimg.cn/q=${item.symbol}&_=${Date.now()}`);
      const text = window[variableName];
      delete window[variableName];
      const parts = text ? text.split("~") : [];
      const latest = Number(parts[3]);
      const previousClose = Number(parts[4]);
      const quotedChange = Number(parts[32]);
      if (!latest || !previousClose) throw new Error(`${item.label}行情不可用`);
      return { code: item.code, latest, changePercent: Number.isFinite(quotedChange) ? quotedChange : (latest / previousClose - 1) * 100 };
    }

      state.saving = true;

      const payload = {
        ...normalizeShareholderReturnFields(state.form),
        updatedAt: now,
        manualOrder: state.form.manualOrder ?? Date.now()
      };
      const persistedPayload = payloadForStockRecord(payload);
      const rowPatch = {
        payload: persistedPayload,
        updated_at: now
      };
      if (payload.id) {
        try {
          await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(payload.id)}`, {
            method: "PATCH",
            body: JSON.stringify(rowPatch)
          });
        } catch (error) {
          state.drawerError = `保存失败：${error.message || String(error)}`;
          state.saving = false;
          render();
          return null;
        }
        state.stocks = state.stocks.map((item) => item.id === payload.id ? payload : item);
      } else {
        payload.createdAt = now;
        payload.pin = "normal";
        let data;
        try {
          data = await supabaseRequest("/rest/v1/stock_records?select=id,payload", {
            method: "POST",
            prefer: "return=representation",
            body: JSON.stringify({
              user_id: state.session.user.id,

            })
          });
        } catch (error) {
          state.drawerError = `保存失败：${error.message || String(error)}`;
          state.saving = false;
          render();
          return null;
        }
        payload.id = data?.[0]?.id;
        state.stocks.push(payload);
      }
      state.form = { ...payload };
      state.formInitialSnapshot = formSnapshot(state.form);
      state.formDirty = false;
      state.saving = false;
      state.drawerOpen = false;
      state.editingId = null;
      state.form = null;
      state.formInitialSnapshot = "";
      render();
      return payload;
    }

    async function moveStockOneStep(stockId, direction) {
      const stock = state.stocks.find((item) => item.id === stockId);
      if (!stock) return;
      const rows = [...state.stocks].sort((a, b) => (Number(a.manualOrder) || 0) - (Number(b.manualOrder) || 0));
      const index = rows.findIndex((item) => item.id === stockId);
      const targetIndex = index + direction;
      if (index < 0 || targetIndex < 0 || targetIndex >= rows.length) return;
      const neighbor = rows[targetIndex];
      const currentOrder = Number(stock.manualOrder) || (index + 1) * 1000;
      const neighborOrder = Number(neighbor.manualOrder) || (targetIndex + 1) * 1000;
      const fallbackCurrentOrder = (targetIndex + 1) * 1000;
      const fallbackNeighborOrder = (index + 1) * 1000;
      const now = new Date().toISOString();
      const currentPayload = {
        ...stock,
        pin: "normal",
        manualOrder: currentOrder === neighborOrder ? fallbackCurrentOrder : neighborOrder,
        updatedAt: now
      };
      const neighborPayload = {
        ...neighbor,
        pin: "normal",
        manualOrder: currentOrder === neighborOrder ? fallbackNeighborOrder : currentOrder,
        updatedAt: now
      };
      try {
        await Promise.all([currentPayload, neighborPayload].map((payload) => {
          return supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(payload.id)}`, {
            method: "PATCH",
            body: JSON.stringify({ payload: payloadForStockRecord(payload), updated_at: payload.updatedAt })
          });
        }));
      } catch (error) {
        alert(`更新失败：${error.message || String(error)}`);
        return;
      }
      state.stocks = state.stocks.map((item) => {
        if (item.id === currentPayload.id) return currentPayload;
        if (item.id === neighborPayload.id) return neighborPayload;
        return item;
      });
      state.sort = { key: "manual", dir: "asc" };
      render();
    }

    function autoGrowTextarea(element) {
      element.style.height = "auto";
      element.style.height = `${Math.max(30, element.scrollHeight)}px`;
    }

    function bindRowDragEvents() {
      let draggedId = "";
      document.querySelectorAll("[data-drag-id]").forEach((handle) => {
        handle.addEventListener("dragstart", (event) => {
          draggedId = handle.dataset.dragId;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggedId);
          handle.closest("tr")?.classList.add("dragging");
        });
        handle.addEventListener("dragend", () => {
          document.querySelectorAll("tr.stock-row").forEach((row) => row.classList.remove("dragging", "drag-over-before", "drag-over-after"));
          draggedId = "";
        });
      });
      document.querySelectorAll("tr[data-stock-row]").forEach((row) => {
        row.addEventListener("dragover", (event) => {
          if (!draggedId || row.dataset.stockRow === draggedId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          const before = event.clientY < row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
          document.querySelectorAll("tr.stock-row").forEach((item) => item.classList.remove("drag-over-before", "drag-over-after"));
          row.classList.add(before ? "drag-over-before" : "drag-over-after");
        });
        row.addEventListener("dragleave", () => row.classList.remove("drag-over-before", "drag-over-after"));
        row.addEventListener("drop", (event) => {
          event.preventDefault();
          const sourceId = draggedId || event.dataTransfer.getData("text/plain");
          const targetId = row.dataset.stockRow;
          const before = event.clientY < row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
          row.classList.remove("drag-over-before", "drag-over-after");
          if (sourceId && targetId && sourceId !== targetId) reorderStocksByDrag(sourceId, targetId, before);
        });
      });
    }

    async function reorderStocksByDrag(sourceId, targetId, beforeTarget) {
      const previousStocks = state.stocks.map((stock) => ({ ...stock }));
      const ordered = [...state.stocks].sort((a, b) => (Number(a.manualOrder) || 0) - (Number(b.manualOrder) || 0));
      const sourceIndex = ordered.findIndex((stock) => stock.id === sourceId);
      if (sourceIndex < 0 || !ordered.some((stock) => stock.id === targetId)) return;
      const [moved] = ordered.splice(sourceIndex, 1);
      const targetIndex = ordered.findIndex((stock) => stock.id === targetId);
      ordered.splice(targetIndex + (beforeTarget ? 0 : 1), 0, moved);
      const now = new Date().toISOString();
      const reordered = ordered.map((stock, index) => ({ ...stock, pin: "normal", manualOrder: (index + 1) * 1000, updatedAt: now }));
      const byId = new Map(reordered.map((stock) => [stock.id, stock]));
      state.stocks = state.stocks.map((stock) => byId.get(stock.id) || stock);
      state.sort = { key: "manual", dir: "asc" };
      render();
      try {
        await Promise.all(reordered.map((payload) => supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(payload.id)}`, {
          method: "PATCH",
          body: JSON.stringify({ payload: payloadForStockRecord(payload), updated_at: payload.updatedAt })
        })));
      } catch (error) {
        state.stocks = previousStocks;
        alert(`排序保存失败：${error.message || String(error)}`);
        render();
      }
    }

    async function deleteStock(stockId) {
      const stock = state.stocks.find((item) => item.id === stockId);
      if (!stock) return false;
      try {
        await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(stockId)}`, {
          method: "DELETE"
        });
      } catch (error) {
        state.deleteConfirm = {
          ...state.deleteConfirm,
          deleting: false,
          error: `删除失败：${error.message || String(error)}`
        };
        render();
        return false;
      }
      state.stocks = state.stocks.filter((item) => item.id !== stockId);
      if (state.editingId === stockId) {
        state.drawerOpen = false;
        state.editingId = null;
        state.form = null;
        state.formInitialSnapshot = "";
        state.formDirty = false;
        state.drawerError = "";
      }
      render();
      return true;
    }

    function toggleSort(key) {
      if (state.sort.key !== key) state.sort = { key, dir: "desc" };
      else if (state.sort.dir === "desc") state.sort.dir = "asc";
      else state.sort = { key: "manual", dir: "asc" };
      render();
    }

    async function loadStocks() {
      let data;
      try {
        data = await supabaseRequest(`/rest/v1/stock_records?user_id=eq.${encodeURIComponent(state.session.user.id)}&select=id,user_id,payload,created_at,updated_at&order=created_at.asc`);
      } catch (error) {
        state.lastError = error.message || String(error);
        state.stocks = [];
        return;
      }
      state.stocks = (data || [])
        .filter((row) => row.user_id === state.session.user.id)
        .map((row) => normalizeStockRow(row));
    }

    function normalizeStockRow(row) {
      return normalizeShareholderReturnFields({
        ...row.payload,
        id: row.id,
        userId: row.user_id || row.payload?.userId || "",
        myNote: row.payload?.myNote || ""
      });
    }

    async function loadProfile() {
      const rows = await supabaseRequest(`/rest/v1/profiles?id=eq.${encodeURIComponent(state.session.user.id)}&select=id,email,nickname,created_at&limit=1`);
      state.profile = rows?.[0] || null;
      state.profileRequired = !state.profile;
    }

    async function afterProfileReady(initialStocksPromise = null) {
      const stocksReady = initialStocksPromise || loadStocks();
      const auxiliaryReady = Promise.allSettled([
        loadPortfolios(),
        loadJournals()
      ]);

      await stocksReady;
      state.loading = false;
      render();
      startMarketCapAutoRefresh();
      startPortfolioQuoteAutoRefresh();

      auxiliaryReady
        .then(() => render())
        .catch((error) => console.warn("辅助数据后台加载失败。", error));

      refreshMarketCaps({ renderAfter: false })
        .then(() => render())
        .catch((error) => console.warn("股池行情后台刷新失败。", error));
    }

    async function init() {
      applyColorTheme(readJson(THEME_STORAGE_KEY, DEFAULT_THEME_ID), { persist: false });
      renderLoading();
      const localDemoParams = new URLSearchParams(location.search);
      const localDemoHost = ["127.0.0.1", "localhost", "[::1]", "::1"].includes(location.hostname);
      const localPortfolioDemo = localDemoHost && (localDemoParams.has("portfolio-demo") || localDemoParams.has("market-insight-demo"));
      if (localPortfolioDemo) {
        state.session = { user: { id: "local-portfolio-demo", email: "portfolio-demo@local.test" }, access_token: "local-demo" };
        state.profile = { id: "local-portfolio-demo", nickname: "本地验收" };
        await loadPortfolios();
        await loadJournals();
        ensureLocalPortfolioDemo();
        ensureLocalPortfolioValuationDemo();
        await fetchExchangeRates();
        const demoToday = new Date();
        const demoPortfolio = activePortfolio();
        const demoCurrentNav = portfolioMetrics(demoPortfolio).nav || 1;
        const demoTotalUnits = Number(demoPortfolio?.totalUnits || demoPortfolio?.startBase || 1000000);
        state.navHistory = Array.from({ length: 100 }, (_, index) => {
          const date = new Date(demoToday);
          date.setDate(date.getDate() - (100 - index));
          const unitNav = demoCurrentNav * (.92 + index * .0008 + Math.sin(index / 6) * .012 + Math.cos(index / 15) * .006);
          const totalUnits = demoTotalUnits;
          return {
            nav_date: date.toISOString().slice(0, 10),
            unit_nav: unitNav,
            total_units: totalUnits,
            total_assets: unitNav * totalUnits,
            cash_value: unitNav * totalUnits * .18,
            position_value: unitNav * totalUnits * .82,
            base_currency: "CNY"
          };
        });
        state.navHistoryPortfolioId = state.activePortfolioId;
        state.loading = false;
        state.mainView = localDemoParams.has("market-insight-demo") ? "marketInsight" : "portfolio";
        render();
        if (state.mainView === "marketInsight") await refreshMarketInsight();
        else {
          await refreshPortfolioQuotes();
          startPortfolioQuoteAutoRefresh();
        }
        return;
      }
      state.session = currentSession();
      if (state.session) {
        const exchangeRatesReady = fetchExchangeRates();
        const initialStocksPromise = loadStocks();
        try {
          await loadProfile();
          if (!state.profileRequired) {
            await afterProfileReady(initialStocksPromise);
            exchangeRatesReady.then(() => render());
            return;
          }
        } catch (error) {
          state.lastError = error.message || String(error);
        }
        exchangeRatesReady.then(() => render());
      }
      state.loading = false;
      render();
      if (!state.session) fetchExchangeRates();
    }

    init();
  </script>
</body>

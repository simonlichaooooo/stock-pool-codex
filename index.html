    async function moveStockOneStep(stockId, direction) {
      const stock = state.stocks.find((item) => item.id === stockId);
      if (!stock) return;
      const rows = [...state.stocks].sort((a, b) => (Number(a.manualOrder) || 0) - (Number(b.manualOrder) || 0));
      const index = rows.findIndex((item) => item.id === stockId);
      const targetIndex = index + direction;
      if (index < 0 || targetIndex < 0 || targetIndex >= rows.length) return;
      const neighbor = rows[targetIndex];
      const currentOrder = Number(stock.manualOrder) || (index + 1) * 1000;
      const neighborOrder = Number(neighbor.manualOrder) || (targetIndex + 1) * 1000;
      const fallbackCurrentOrder = (targetIndex + 1) * 1000;
      const fallbackNeighborOrder = (index + 1) * 1000;
      const now = new Date().toISOString();
      const currentPayload = {
        ...stock,
        pin: "normal",
        manualOrder: currentOrder === neighborOrder ? fallbackCurrentOrder : neighborOrder,
        updatedAt: now
      };
      const neighborPayload = {
        ...neighbor,
        pin: "normal",
        manualOrder: currentOrder === neighborOrder ? fallbackNeighborOrder : currentOrder,
        updatedAt: now
      };
      try {
        await Promise.all([currentPayload, neighborPayload].map((payload) => {
          return supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(payload.id)}`, {
            method: "PATCH",
            body: JSON.stringify({ payload: payloadForStockRecord(payload), updated_at: payload.updatedAt })
          });
        }));
      } catch (error) {
        alert(`更新失败：${error.message || String(error)}`);
        return;
      }
      state.stocks = state.stocks.map((item) => {
        if (item.id === currentPayload.id) return currentPayload;
        if (item.id === neighborPayload.id) return neighborPayload;
        return item;
      });
      state.sort = { key: "manual", dir: "asc" };
      render();
    }

    function bindRowDragEvents() {
      let draggedId = "";
      document.querySelectorAll("[data-drag-id]").forEach((handle) => {
        handle.addEventListener("dragstart", (event) => {
          draggedId = handle.dataset.dragId;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggedId);
          handle.closest("tr")?.classList.add("dragging");
        });
        handle.addEventListener("dragend", () => {
          document.querySelectorAll("tr.stock-row").forEach((row) => row.classList.remove("dragging", "drag-over-before", "drag-over-after"));
          draggedId = "";
        });
      });
      document.querySelectorAll("tr[data-stock-row]").forEach((row) => {
        row.addEventListener("dragover", (event) => {
          if (!draggedId || row.dataset.stockRow === draggedId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          const before = event.clientY < row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
          document.querySelectorAll("tr.stock-row").forEach((item) => item.classList.remove("drag-over-before", "drag-over-after"));
          row.classList.add(before ? "drag-over-before" : "drag-over-after");
        });
        row.addEventListener("dragleave", () => row.classList.remove("drag-over-before", "drag-over-after"));
        row.addEventListener("drop", (event) => {
          event.preventDefault();
          const sourceId = draggedId || event.dataTransfer.getData("text/plain");
          const targetId = row.dataset.stockRow;
          const before = event.clientY < row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
          row.classList.remove("drag-over-before", "drag-over-after");
          if (sourceId && targetId && sourceId !== targetId) reorderStocksByDrag(sourceId, targetId, before);
        });
      });
    }

    async function reorderStocksByDrag(sourceId, targetId, beforeTarget) {
      const previousStocks = state.stocks.map((stock) => ({ ...stock }));
      const ordered = [...state.stocks].sort((a, b) => (Number(a.manualOrder) || 0) - (Number(b.manualOrder) || 0));
      const sourceIndex = ordered.findIndex((stock) => stock.id === sourceId);
      if (sourceIndex < 0 || !ordered.some((stock) => stock.id === targetId)) return;
      const [moved] = ordered.splice(sourceIndex, 1);
      const targetIndex = ordered.findIndex((stock) => stock.id === targetId);
      ordered.splice(targetIndex + (beforeTarget ? 0 : 1), 0, moved);
      const now = new Date().toISOString();
      const reordered = ordered.map((stock, index) => ({ ...stock, pin: "normal", manualOrder: (index + 1) * 1000, updatedAt: now }));
      const byId = new Map(reordered.map((stock) => [stock.id, stock]));
      state.stocks = state.stocks.map((stock) => byId.get(stock.id) || stock);
      state.sort = { key: "manual", dir: "asc" };
      render();
      try {
        await Promise.all(reordered.map((payload) => supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(payload.id)}`, {
          method: "PATCH",
          body: JSON.stringify({ payload: payloadForStockRecord(payload), updated_at: payload.updatedAt })
        })));
      } catch (error) {
        state.stocks = previousStocks;
        alert(`排序保存失败：${error.message || String(error)}`);
        render();
      }
    }

    async function deleteStock(stockId) {
      const stock = state.stocks.find((item) => item.id === stockId);
      if (!stock) return false;
      try {

        await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(stockId)}`, {

        });

          ...state.deleteConfirm,
          deleting: false,
          error: `删除失败：${error.message || String(error)}`

      state.stocks = state.stocks.filter((item) => item.id !== stockId);
      if (state.editingId === stockId) {
        state.drawerOpen = false;
        state.editingId = null;
        state.form = null;
        state.formInitialSnapshot = "";
        state.formDirty = false;
        state.drawerError = "";
      }
      render();
      return true;
    }

    async function loadStocks() {
      let data;
      try {
        data = await supabaseRequest(`/rest/v1/stock_records?user_id=eq.${encodeURIComponent(state.session.user.id)}&select=id,user_id,payload,source_user_id,source_stock_id,source_nickname,source_type,last_source_updated_at,source_seen_published_at,is_shared,last_published_at,created_at,updated_at&order=created_at.asc`);
      } catch (error) {
        state.lastError = error.message || String(error);
        state.stocks = [];
        return;
      }
      state.stocks = (data || [])
        .filter((row) => row.user_id === state.session.user.id)
        .map((row) => normalizeStockRow(row));
      await mergeLatestSourceStocks();

    function normalizeStockRow(row) {
      return normalizeShareholderReturnFields({
        ...row.payload,
        id: row.id,
        userId: row.user_id || row.payload?.userId || "",
        sourceUserId: row.source_user_id || row.payload?.sourceUserId || "",
        sourceStockId: row.source_stock_id || row.payload?.sourceStockId || "",
        sourceNickname: row.source_nickname || row.payload?.sourceNickname || "",
        sourceType: row.source_type || row.payload?.sourceType || (row.source_stock_id || row.payload?.sourceStockId ? "copied" : "self"),
        lastSourceUpdatedAt: row.last_source_updated_at || row.payload?.lastSourceUpdatedAt || "",
        sourceSeenPublishedAt: row.source_seen_published_at || row.payload?.sourceSeenPublishedAt || "",
        isShared: Boolean(row.is_shared || row.payload?.isShared),
        lastPublishedAt: row.last_published_at || row.payload?.lastPublishedAt || "",
        adminHidden: Boolean(row.admin_hidden || row.payload?.adminHidden),
        sourceStopped: Boolean(row.payload?.sourceStopped),
        sourceDeletedAt: row.payload?.sourceDeletedAt || "",
        hasSourceUpdate: Boolean(row.payload?.hasSourceUpdate),
        myNote: row.payload?.myNote || ""
      });
    }

    async function loadLatestPublications(stockIds) {
      const ids = [...new Set((stockIds || []).filter(Boolean))];
      if (!ids.length) return new Map();
      const rows = await supabaseRequest(`/rest/v1/stock_publications?stock_id=in.(${ids.map(encodeURIComponent).join(",")})&select=id,stock_id,version_number,change_note,payload,created_at&order=version_number.desc`);
      const latest = new Map();
      (rows || []).forEach((row) => {
        if (!latest.has(row.stock_id)) latest.set(row.stock_id, row);
      });
      return latest;
    }

    async function loadPublicationRows(stockId) {
      return await supabaseRequest(`/rest/v1/stock_publications?stock_id=eq.${encodeURIComponent(stockId)}&select=id,stock_id,publisher_id,version_number,change_note,payload,created_at&order=version_number.desc`) || [];
    }

    async function mergeLatestSourceStocks() {
      state.sourceUpdateCount = 0;
      const sourceIds = [...new Set(state.stocks.filter((stock) => stock.sourceType === "subscribed").map((stock) => stock.sourceStockId).filter(Boolean))];
      if (!sourceIds.length) return;
      try {
        const rows = await supabaseRequest(`/rest/v1/stock_records?id=in.(${sourceIds.map(encodeURIComponent).join(",")})&is_shared=eq.true&select=id,payload,source_nickname,last_published_at,updated_at`);
        const latestPublications = await loadLatestPublications(sourceIds);
        const sourceMap = new Map((rows || []).map((row) => {
          const source = normalizeStockRow(row);
          return [row.id, stockWithPublication(source, latestPublications.get(row.id))];
        }));
        state.stocks = state.stocks.map((stock) => {
          const source = sourceMap.get(stock.sourceStockId);
          if (!source) return { ...stock, sourceStopped: true, hasSourceUpdate: false };
          const sourcePublishedAt = source.lastPublishedAt || source.updatedAt || "";
          const hasSourceUpdate = Boolean(sourcePublishedAt && stock.sourceSeenPublishedAt && sourcePublishedAt > stock.sourceSeenPublishedAt);
          if (hasSourceUpdate) state.sourceUpdateCount += 1;
          return {
            ...source,
            id: stock.id,
            createdAt: stock.createdAt,
            manualOrder: stock.manualOrder,
            pin: stock.pin,
            isShared: stock.isShared,
            lastPublishedAt: stock.lastPublishedAt,
            sourceUserId: stock.sourceUserId,
            sourceStockId: stock.sourceStockId,
            sourceNickname: stock.sourceNickname,
            sourceType: stock.sourceType,
            sourceSeenPublishedAt: stock.sourceSeenPublishedAt,
            lastSourceUpdatedAt: sourcePublishedAt || stock.lastSourceUpdatedAt,
            updatedAt: source.updatedAt || stock.updatedAt,
            sourceStopped: false,
            hasSourceUpdate,
            myNote: stock.myNote || ""
          };
        });
      } catch (error) {
        console.warn("同步来源股池失败。", error);
      }
    }

    async function loadSquare() {
      try {
        const profiles = await supabaseRequest("/rest/v1/profiles?share_visibility=eq.public&square_hidden=eq.false&share_banned=eq.false&select=id,email,nickname,share_visibility,created_at");
        const rows = await supabaseRequest("/rest/v1/stock_records?is_shared=eq.true&admin_hidden=eq.false&select=id,user_id,payload,last_published_at,updated_at&order=last_published_at.desc");
        const latestPublications = await loadLatestPublications((rows || []).map((row) => row.id));
        const byUser = new Map();
        (rows || []).forEach((row) => {
          const stock = stockWithPublication(normalizeStockRow(row), latestPublications.get(row.id));
          const list = byUser.get(row.user_id) || [];
          list.push({ ...stock, userId: row.user_id });
          byUser.set(row.user_id, list);
        });
        state.squareProfiles = (profiles || [])
          .map((profile) => {
            const stocks = byUser.get(profile.id) || [];
            const latestPublishedAt = stocks.map((stock) => stock.lastPublishedAt).filter(Boolean).sort().at(-1);
            return { ...profile, stocks, stockCount: stocks.length, latestPublishedAt };
          })
          .filter((profile) => profile.stockCount > 0);

        alert(`读取广场失败：${error.message || String(error)}`);
      }
    }

    async function copySharedStock(stockId, mode = "copied") {
      const source = state.publisherStocks.find((stock) => stock.id === stockId);
      if (!source) return;
      const sourceType = mode === "subscribed" ? "subscribed" : "copied";
      if (sourceType === "subscribed" && state.stocks.some((stock) => stock.sourceType === "subscribed" && stock.sourceStockId === source.id)) {
        alert("你已经订阅过这只股票。");
        return;
      }
      const now = new Date().toISOString();
      const payload = {
        ...source,
        id: null,
        isShared: false,
        lastPublishedAt: "",
        sourceUserId: source.publisherId,
        sourceStockId: source.id,
        sourceNickname: source.publisherNickname,
        sourceType,
        sourceSeenPublishedAt: source.lastPublishedAt || source.updatedAt || now,
        lastSourceUpdatedAt: source.lastPublishedAt || source.updatedAt || now,
        sourceStopped: false,
        hasSourceUpdate: false,
        myNote: "",
        createdAt: now,
        updatedAt: now,
        pin: "normal",
        manualOrder: Date.now()
      };
      try {
        const rows = await supabaseRequest("/rest/v1/stock_records?select=id,payload", {
          method: "POST",
          prefer: "return=representation",
          body: JSON.stringify({
            user_id: state.session.user.id,
            payload: payloadForStockRecord(payload),
            source_user_id: payload.sourceUserId,
            source_stock_id: payload.sourceStockId,
            source_nickname: payload.sourceNickname,
            source_type: payload.sourceType,
            last_source_updated_at: payload.lastSourceUpdatedAt,
            source_seen_published_at: payload.sourceSeenPublishedAt,
            is_shared: false
          })
        });
        payload.id = rows?.[0]?.id;
        if (sourceType === "subscribed") {
          await supabaseRequest("/rest/v1/stock_subscriptions", {
            method: "POST",
            body: JSON.stringify({
              subscriber_id: state.session.user.id,
              publisher_id: payload.sourceUserId,
              source_stock_id: payload.sourceStockId,
              target_stock_id: payload.id,
              last_seen_published_at: payload.sourceSeenPublishedAt
            })
          });
        }
        state.stocks.push(payload);
        const shouldOpenOwnPool = confirm(sourceType === "subscribed" ? "已订阅到你的股池。现在去管理吗？" : "已复制到你的股池。现在去管理吗？");
        if (shouldOpenOwnPool) openOwnPool();
      } catch (error) {
        alert(`${sourceType === "subscribed" ? "订阅" : "复制"}失败：${error.message || String(error)}`);
      }
    }

      if (!confirm(`取消订阅 ${stock.name}？取消后可删除或转为你的股票。`)) return;
      try {
        await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(stockId)}`, { method: "DELETE" });
        await supabaseRequest(`/rest/v1/stock_subscriptions?target_stock_id=eq.${encodeURIComponent(stockId)}`, { method: "DELETE" });
        state.stocks = state.stocks.filter((item) => item.id !== stockId);
        await mergeLatestSourceStocks();
      } catch (error) {
        alert(`取消订阅失败：${error.message || String(error)}`);

      const stock = state.stocks.find((item) => item.id === stockId);
      if (!stock || !stock.sourceStockId) return;
      const now = new Date().toISOString();
      const payload = {
        ...stock,
        sourceUserId: "",
        sourceStockId: "",
        sourceNickname: "",
        sourceType: "self",
        sourceSeenPublishedAt: "",
        lastSourceUpdatedAt: "",
        sourceStopped: false,
        hasSourceUpdate: false,
        updatedAt: now
      };
      try {
        await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(stockId)}`, {
          method: "PATCH",
          body: JSON.stringify({
            payload: payloadForStockRecord(payload),
            updated_at: now,
            source_user_id: null,
            source_stock_id: null,
            source_nickname: null,
            source_type: "self",
            last_source_updated_at: null,
            source_seen_published_at: null
          })
        });

        alert(`转为我的股票失败：${error.message || String(error)}`);

    }

    async function markSourceUpdatesRead() {
      const updated = state.stocks.filter((stock) => stock.sourceType === "subscribed" && stock.hasSourceUpdate);
      if (!updated.length) return;
      try {
        await Promise.all(updated.map((stock) => {
          const seenAt = stock.lastSourceUpdatedAt || new Date().toISOString();
          const payload = { ...stock, sourceSeenPublishedAt: seenAt, hasSourceUpdate: false };
          return supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(stock.id)}`, {
            method: "PATCH",
            body: JSON.stringify({
              payload: payloadForStockRecord(payload),
              source_seen_published_at: seenAt,
              last_source_updated_at: stock.lastSourceUpdatedAt || null
            })
          });
        }));
        await loadStocks();
      } catch (error) {
        alert(`标记已读失败：${error.message || String(error)}`);
      }
      render();
    }

    async function init() {
      applyColorTheme(readJson(THEME_STORAGE_KEY, DEFAULT_THEME_ID), { persist: false });
      rememberPendingShareFromUrl();
      const localPortfolioDemo = ["127.0.0.1", "localhost"].includes(location.hostname) && new URLSearchParams(location.search).has("portfolio-demo");
      if (localPortfolioDemo) {
        state.session = { user: { id: "local-portfolio-demo", email: "portfolio-demo@local.test" }, access_token: "local-demo" };
        state.profile = { id: "local-portfolio-demo", nickname: "本地验收", share_visibility: "private" };
        await loadPortfolios();
        await loadJournals();
        ensureLocalPortfolioDemo();
        ensureLocalPortfolioValuationDemo();
        await fetchExchangeRates();
        const demoPreviousDate = new Date();
        demoPreviousDate.setDate(demoPreviousDate.getDate() - 1);
        state.navHistory = [{ nav_date: demoPreviousDate.toISOString().slice(0, 10), unit_nav: 0.98 }];
        state.navHistoryPortfolioId = state.activePortfolioId;
        state.loading = false;
        state.mainView = "portfolio";
        render();
        await refreshPortfolioQuotes();
        startPortfolioQuoteAutoRefresh();
        return;
      }
      state.session = currentSession();
      if (state.session) {
        try {
          await fetchExchangeRates();
          await loadProfile();
          if (!state.profileRequired) await afterProfileReady();
        } catch (error) {
          state.lastError = error.message || String(error);
        }
      }
      state.loading = false;
      render();
      if (!state.session) fetchExchangeRates();
    }

    init();
  </script>
</body>
</html>

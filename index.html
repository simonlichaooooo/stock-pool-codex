        return sum + (flow.type === "redemption" ? -baseAmount : baseAmount);

      return metrics.netBase - Number(portfolio.startBase || 0) - flowCapital;
    }

    function previousPortfolioNav() {

    function portfolioPositionDailyProfit(position, portfolio) {
      const latestPrice = Number(position?.latestPrice);
      if (!(latestPrice > 0)) return NaN;
      const optionPosition = position?.assetType === "option";
      const positionDirection = optionPosition && position.direction === "short" ? -1 : 1;
      const positionMultiplier = optionPosition ? Number(position.contractMultiplier || 0) : 1;
      const currentUnits = optionPosition
        ? positionDirection * Number(position.contracts || 0) * positionMultiplier
        : Number(position.shares || 0);
      const trades = (portfolio?.tradeHistory || []).filter((trade) => {
        if (!["open", "add", "reduce"].includes(trade.type) || portfolioTradeDate(trade) !== todayString()) return false;
        if (trade.positionId) return trade.positionId === position.id;
        return trade.code === position.code && (!trade.market || trade.market === position.market);
      }).map((trade) => {
        const quantity = optionPosition ? Number(trade.contracts || 0) : Number(trade.shares || 0);
        const multiplier = optionPosition ? Number(trade.multiplier || trade.contractMultiplier || positionMultiplier) : 1;
        const direction = optionPosition && (trade.direction || position.direction) === "short" ? -1 : 1;
        const tradeSign = trade.type === "reduce" ? -1 : 1;
        return { units: tradeSign * direction * quantity * multiplier, price: Number(trade.price) };
      }).filter((trade) => Number.isFinite(trade.units) && trade.units !== 0 && trade.price > 0);
      const tradedUnits = trades.reduce((sum, trade) => sum + trade.units, 0);
      const openingUnits = currentUnits - tradedUnits;
      const previousClose = Number(position.previousClose);
      if (Math.abs(openingUnits) > 0.000001 && !(previousClose > 0)) return NaN;
      const openingProfit = Math.abs(openingUnits) > 0.000001 ? openingUnits * (latestPrice - previousClose) : 0;
      const tradeProfit = trades.reduce((sum, trade) => sum + trade.units * (latestPrice - trade.price), 0);
      return (openingProfit + tradeProfit) * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
    }

    function portfolioDailyProfit(portfolio) {
      let dailyProfit = 0;
      let quotedPositions = 0;
      for (const position of portfolio.positions || []) {
        const quantity = position.assetType==="option" ? Number(position.contracts||0) : Number(position.shares||0);
        if (!quantity) continue;
        const positionProfit = portfolioPositionDailyProfit(position, portfolio);
        if (!Number.isFinite(positionProfit)) continue;
        quotedPositions += 1;
        dailyProfit += positionProfit;
      }
      return { amount: dailyProfit, quotedPositions };
    }

    function renderPortfolioNavChange(currentNav, portfolio) {
      if (state.portfolioPrivacyMode) return `<span class="muted">当日盈亏 **** · 较昨日 ****</span>`;
      const totalUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      const { amount: profitAmount, quotedPositions } = portfolioDailyProfit(portfolio);
      const hasPositions = (portfolio.positions || []).some((position) => position.assetType==="option"?Number(position.contracts||0)>0:Number(position.shares||0)!==0);
      if (!(totalUnits > 0) || (hasPositions && !quotedPositions)) return `<span class="muted">当日盈亏 -- · 较昨日 --</span>`;
      const delta = profitAmount / totalUnits;
      const previousNav = Number(currentNav) - delta;
      const change = previousNav > 0 ? delta / previousNav * 100 : 0;
      const sign = delta > 0 ? "+" : "";
      const className = delta > 0 ? "gain" : delta < 0 ? "loss" : "muted";
      return `<span class="portfolio-nav-change">当日盈亏 <span class="${className}">${formatPortfolioWan(profitAmount, { signed: true })}</span> · 较昨日 <span class="${className}">${sign}${delta.toFixed(4)}（${sign}${change.toFixed(2)}%）</span></span>`;
    }

    function portfolioDailyProfitSummary(portfolio, metrics) {
      const { amount, quotedPositions } = portfolioDailyProfit(portfolio);
      if (state.portfolioPrivacyMode) return { text: "当日盈亏 ****", className: "muted" };
      const hasPositions = (portfolio.positions || []).some((position) => position.assetType==="option"?Number(position.contracts||0)>0:Number(position.shares||0)!==0);
      if (hasPositions && !quotedPositions) return { text: "当日盈亏 --", className: "muted" };
      const previousNet = Number(metrics?.netBase || 0) - amount;
      const percent = previousNet > 0 ? amount / previousNet * 100 : 0;
      const sign = amount > 0 ? "+" : "";
      const className = amount > 0 ? "gain" : amount < 0 ? "loss" : "muted";
      const text = `${formatPortfolioWan(amount, { signed: true })} ${sign}${percent.toFixed(2)}%`;

    }

    function portfolioPlanEntries(portfolio, metrics) {
      const entries=[];

          const rows=Array.isArray(position.tradePlan?.[side])?position.tradePlan[side]:[];
          rows.forEach((row,index)=>{
            const price=Number(row?.price)||0,shares=Number(row?.shares)||0;
            if(row?.done||(!(price>0)&&!(shares>0))) return;
            const targetWeight=metrics.netBase>0?price*shares*portfolioFx(position.currency,portfolioBaseCurrency(portfolio))/metrics.netBase*100:0;
            entries.push({source:"position",positionId:position.id,side,index,name:position.name,code:position.code,market:position.market,currency:position.currency,price,shares,targetWeight,remark:String(row?.remark||"")});
          });
        });
      });
      (portfolio.plans||[]).forEach((plan)=>{
        if(plan.done) return;
        entries.push({source:"portfolio",planId:plan.id,side:plan.side==="sell"?"sell":"buy",name:plan.name,code:plan.code,market:plan.market,currency:plan.currency,price:Number(plan.price)||0,shares:Number(plan.shares)||0,targetWeight:Number(plan.targetWeight)||0,remark:String(plan.remark||"")});

    }

    function filteredNavHistory() {
      const rows = [...state.navHistory].sort((a, b) => a.nav_date.localeCompare(b.nav_date));

      if (state.navRange === "YEAR") return rows.filter((row) => row.nav_date.startsWith(state.navYear));
      const start = new Date(`${rows.at(-1).nav_date}T00:00:00`);
      if (state.navRange === "3M") start.setMonth(start.getMonth() - 3); else start.setMonth(0, 1);
      return rows.filter((row) => new Date(`${row.nav_date}T00:00:00`) >= start);
    }

    function performanceStats(rows) {
      if (rows.length < 2) return { total: null, drawdown: null, sharpe: null };
      let peak = Number(rows[0].unit_nav), drawdown = 0; const returns = [];
      rows.forEach((row, index) => { const nav = Number(row.unit_nav); peak = Math.max(peak, nav); drawdown = Math.min(drawdown, nav / peak - 1); if (index) returns.push(nav / Number(rows[index - 1].unit_nav) - 1); });
      const mean = returns.reduce((a,b)=>a+b,0) / returns.length; const variance = returns.reduce((s,v)=>s+(v-mean)**2,0) / Math.max(1, returns.length-1);
      return { total: Number(rows.at(-1).unit_nav) / Number(rows[0].unit_nav) - 1, drawdown, sharpe: variance ? mean / Math.sqrt(variance) * Math.sqrt(252) : null };
    }

      const all=[...values,...bmValues.filter(Number.isFinite)], rawMin = Math.min(...all), rawMax = Math.max(...all), padding = Math.max((rawMax-rawMin)*.12,.005);
      const min=rawMin-padding, max=rawMax+padding, span=max-min||.01, left=78, right=1572, top=18, bottom=248;
      const x=(index)=>left+index/Math.max(1,rows.length-1)*(right-left);

    function portfolioDailyPerformance(rows) {
      const allRows=[...rows].sort((a,b)=>a.nav_date.localeCompare(b.nav_date));
      const previousByDate=new Map(allRows.map((row,index)=>[row.nav_date,index?allRows[index-1]:null]));

    function portfolioPeriodKey(dateString, view) {
      const date=new Date(`${dateString}T00:00:00`);
      if(view==="month") return dateString.slice(0,7);
      const day=(date.getDay()+6)%7; date.setDate(date.getDate()-day);
      return portfolioCalendarDateString(date);
    }

    function portfolioCalendarDateString(date) {
      const pad=(value)=>String(value).padStart(2,"0");
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    }

    function optionTradingDaysUntil(expiryDate) {
      if(!/^\d{4}-\d{2}-\d{2}$/.test(String(expiryDate||""))) return null;
      const today=new Date(`${portfolioCalendarDateString(new Date())}T00:00:00`);
      const expiry=new Date(`${expiryDate}T00:00:00`);
      if(!Number.isFinite(expiry.getTime())) return null;
      if(expiry<today) return 0;
      let count=0;
      for(const date=new Date(today);date<expiry;){
        date.setDate(date.getDate()+1);
        const day=date.getDay();
        if(day!==0&&day!==6) count+=1;
      }
      return count;
    }

          const key=`${selectedYear}-${String(index+1).padStart(2,"0")}`,monthItems=groups.get(key)||[];

          const hasEstimate=monthItems.some((item)=>item.is_estimate),className=monthItems.length?(amount>0?"gain":amount<0?"loss":""):"";
          return `<div class="portfolio-calendar-month ${className} ${hasEstimate?"estimate":""}"><strong>${index+1} 月${hasEstimate?`<span class="portfolio-calendar-estimate-badge">含估算</span>`:""}</strong><div class="portfolio-calendar-month-value">${monthItems.length?portfolioPrivate(formatPortfolioWan(amount,{signed:true})):"--"}</div><div class="portfolio-calendar-month-rate">${Number.isFinite(rate)?`${rate>0?"+":""}${(rate*100).toFixed(2)}%`:"--"}</div></div>`;
        }).join("")}</div>`;
      }
      const periodLabel=view==="month"?`${selectedYear} 年`:`${selectedMonth.replace("-"," 年 ")} 月`;
      return `<section class="table-panel portfolio-calendar"><div class="portfolio-calendar-head"><div class="portfolio-calendar-heading"><button aria-label="${view==="month"?"上一年":"上个月"}" data-action="navCalendarPeriod" data-step="-1">‹</button><strong>${periodLabel}</strong><button aria-label="${view==="month"?"下一年":"下个月"}" data-action="navCalendarPeriod" data-step="1">›</button></div><div class="segmented"><button class="${view==="day"?"active":""}" data-action="navCalendarView" data-view="day">日</button><button class="${view==="week"?"active":""}" data-action="navCalendarView" data-view="week">周</button><button class="${view==="month"?"active":""}" data-action="navCalendarView" data-view="month">月</button></div></div><div class="portfolio-calendar-body">${content}</div></section>`;
    }

    function renderPortfolioNavHistory(rows, portfolio) {
      if (!rows.length) return `<section class="table-panel portfolio-nav-history"><div class="empty">暂无净值明细。</div></section>`;
      const allRows = [...state.navHistory].sort((a, b) => a.nav_date.localeCompare(b.nav_date));
      const previousByDate = new Map(allRows.map((row, index) => [row.nav_date, index ? allRows[index - 1] : null]));
      const body = [...rows].reverse().map((row) => {
        const nav = Number(row.unit_nav);
        const previousNav = Number(previousByDate.get(row.nav_date)?.unit_nav);
        const hasChange = nav > 0 && previousNav > 0;
        const navChange = hasChange ? nav / previousNav - 1 : NaN;
        const totalUnits = Number(row.total_units) || (nav > 0 ? Number(row.total_assets) / nav : 0);
        const profitAmount = hasChange && totalUnits > 0 ? (nav - previousNav) * totalUnits : NaN;
        const className = hasChange ? (navChange > 0 ? "gain" : navChange < 0 ? "loss" : "muted") : "muted";
        const changeText = hasChange ? `${navChange > 0 ? "+" : ""}${(navChange * 100).toFixed(2)}%` : "--";
        const profitText = Number.isFinite(profitAmount) ? formatPortfolioSummary(profitAmount, portfolio, { signed: true }) : "--";
        return `<tr><td>${escapeHtml(row.nav_date)}</td><td class="num">${nav > 0 ? nav.toFixed(4) : "--"}</td><td class="num ${className}">${changeText}</td><td class="num ${className}">${portfolioPrivate(profitText)}</td></tr>`;
      }).join("");
      return `<section class="table-panel portfolio-nav-history"><div class="portfolio-nav-history-title">净值明细</div><div class="table-scroll"><table><thead><tr><th>日期</th><th class="num">净值</th><th class="num">当日净值涨跌幅</th><th class="num">当日盈亏金额</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
    }

    function renderPortfolioPerformance(portfolio) {
      const rows = filteredNavHistory(), stats = performanceStats(rows); const years = [...new Set(state.navHistory.map((row)=>row.nav_date.slice(0,4)))].sort().reverse();
      const benchmarks = portfolio.accountType === "HKUS" ? [["HSI","恒生指数"],["HSTECH","恒生科技"],["SP500","标普500"],["NDX100","纳斯达克100"]] : [["CSI300","沪深300"]];
      if (!state.benchmarkCode || !benchmarks.some(([code])=>code===state.benchmarkCode)) state.benchmarkCode = benchmarks[0][0];
      return `<div class="toolbar portfolio-performance-toolbar"><div class="segmented"><button class="${state.navRange==="3M"?"active":""}" data-action="navRange" data-range="3M">近三个月</button><button class="${state.navRange==="YTD"?"active":""}" data-action="navRange" data-range="YTD">年初至今</button><button class="${state.navRange==="ALL"?"active":""}" data-action="navRange" data-range="ALL">全部</button></div><select data-input="navYear"><option value="">选择年份</option>${years.map((year)=>`<option ${state.navYear===year?"selected":""}>${year}</option>`).join("")}</select><select data-input="benchmark">${benchmarks.map(([code,label])=>`<option value="${code}" ${state.benchmarkCode===code?"selected":""}>${label}</option>`).join("")}</select></div><div class="performance-grid"><div class="portfolio-metric"><div class="portfolio-metric-label">区间收益</div><div class="portfolio-metric-value">${percent(stats.total)}</div></div><div class="portfolio-metric"><div class="portfolio-metric-label">最大回撤</div><div class="portfolio-metric-value">${percent(stats.drawdown)}</div></div><div class="portfolio-metric"><div class="portfolio-metric-label">年化夏普比率</div><div class="portfolio-metric-value">${stats.sharpe == null ? "--" : stats.sharpe.toFixed(2)}</div><div class="portfolio-metric-sub">无风险利率暂按 0</div></div></div><section class="table-panel portfolio-performance-chart">${renderNavSvg(rows)}</section><div class="portfolio-nav-details">${renderPortfolioNavHistory(rows, portfolio)}${renderPortfolioCalendar(rows, portfolio)}</div>`;
    }

    function triggeredPositionTradePlans(position, portfolio) {
      if (!isSameLocalDay(position?.intradayQuoteAt)) return [];
      const latestPrice = Number(position.latestPrice);
      if (!(latestPrice > 0)) return [];
      const dayHigh = Math.max(latestPrice, Number(position.dayHigh) || latestPrice);
      const dayLow = Math.min(latestPrice, Number(position.dayLow) || latestPrice);
      const plan = normalizedPositionTradePlan(position);
      return ["buy", "sell"].flatMap((side) => plan[side].map((row, index) => {
        const price = Number(row.price);
        if (!(price > 0) || row.done) return null;
        const triggered = side === "buy" ? dayLow <= price : dayHigh >= price;
        if (!triggered) return null;
        return {
          side,
          index,
          label: `${side === "buy" ? "买点" : "卖点"}${index + 1}`,
          price,
          shares: Number(row.shares) || 0,
          executionAmount: price * (Number(row.shares) || 0),
          executionAmountBase: price * (Number(row.shares) || 0) * portfolioFx(position.currency, portfolioBaseCurrency(portfolio)),
          touchedPrice: side === "buy" ? dayLow : dayHigh
        };
      })).filter(Boolean);
    }

    function renderPortfolioTradeAlerts(pendingByPosition) {
      if (!pendingByPosition.length) return "";
      const alerts = pendingByPosition.flatMap(({ position, items }) => items.map((item) => ({ position, item }))).sort((a, b) => b.item.executionAmountBase - a.item.executionAmountBase || a.item.index - b.item.index);
      alerts.forEach((entry, index) => { entry.item.sequence = index + 1; });
      const formatPrice = (value) => Number(value).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
      return `<section class="portfolio-trade-alerts" aria-label="今日待操作" aria-live="polite">

        </div>
        <div class="portfolio-trade-alert-items">${alerts.map(({ position, item }) => `<button type="button" class="portfolio-trade-alert-item ${item.side}" data-action="openPendingTrade" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}" data-side="${item.side}">
            <span class="portfolio-trade-alert-item-main"><span class="portfolio-trade-alert-stock-name"><strong>${escapeHtml(position.name)}</strong></span></span>

            <span class="portfolio-trade-alert-action"><strong class="portfolio-trade-alert-action-type">${item.side === "buy" ? "买入" : "卖出"}</strong><span aria-hidden="true">·</span><strong>${item.shares > 0 ? portfolioPrivate(`${item.shares.toLocaleString("zh-CN")} 股`) : "-- 股"}</strong></span>
            <span class="portfolio-trade-alert-sequence" aria-hidden="true">${String(item.sequence).padStart(2, "0")}</span>
          </button>`).join("")}</div>
      </section>`;

    function renderPortfolioTable(portfolio, metrics) {
      const sort = state.portfolioSort || { key: "value", dir: "desc" };
      const positionWeight = (position) => metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase : 0;
      const sortValue = (position) => sort.key === "change"
        ? (position.changePercent == null ? NaN : Number(position.changePercent))
        : sort.key === "weight"
          ? positionWeight(position)
          : ["bias30w", "bias2yPercentile"].includes(sort.key)
            ? (Number.isFinite(position[sort.key]) ? position[sort.key] : NaN)
            : positionBaseValue(position, portfolio);
      const allPositions = [...(portfolio.positions || [])];
      const pendingByPosition = allPositions.map((position) => {
        const items = triggeredPositionTradePlans(position, portfolio).sort((a, b) => b.executionAmountBase - a.executionAmountBase || a.index - b.index);
        return { position, items, totalExecutionAmountBase: items.reduce((sum, item) => sum + item.executionAmountBase, 0) };
      }).filter((row) => row.items.length).sort((a, b) => b.totalExecutionAmountBase - a.totalExecutionAmountBase || a.position.name.localeCompare(b.position.name, "zh-CN"));
      let pendingSequence = 1;
      pendingByPosition.forEach((row) => row.items.forEach((item) => { item.sequence = pendingSequence; pendingSequence += 1; }));
      const pendingByPositionId = new Map(pendingByPosition.map((row) => [row.position.id, row.items]));
      const sortedPositions = allPositions.filter((position) => !state.portfolioTagFilter || (position.tags || []).includes(state.portfolioTagFilter)).sort((a, b) => {
        const aValue = sortValue(a), bValue = sortValue(b);
        const aMissing = !Number.isFinite(aValue), bMissing = !Number.isFinite(bValue);
        if (aMissing !== bMissing) return aMissing ? 1 : -1;
        return (aValue - bValue) * (sort.dir === "asc" ? 1 : -1);
      });
      const groupMap=new Map();
      sortedPositions.forEach((position,sortRank)=>{
        const key=optionUnderlyingKey(position);
        if(!groupMap.has(key)) groupMap.set(key,{items:[],sortRank});
        groupMap.get(key).items.push(position);
      });
      const displayRows=[...groupMap.entries()].map(([key,groupEntry])=>{
        const items=groupEntry.items;
        const hasOptions=items.some((item)=>item.assetType==="option");
        const exposure=items.reduce((sum,item)=>sum+positionExposureBaseValue(item,portfolio),0);
        const stockPosition=items.find((item)=>item.assetType!=="option");
        const stockValue=stockPosition?positionBaseValue(stockPosition,portfolio):0;
        const sortedItems=[...items].sort((a,b)=>Math.abs(positionExposureBaseValue(b,portfolio))-Math.abs(positionExposureBaseValue(a,portfolio)));
        return {key,items:sortedItems,hasOptions,exposure,stockValue,sortRank:groupEntry.sortRank};
      }).sort((a,b)=>a.sortRank-b.sortRank).flatMap((group)=>group.hasOptions?[{kind:"group",group},...group.items.map((position)=>({kind:"position",position,grouped:true}))]:group.items.map((position)=>({kind:"position",position,grouped:false})));
      if (!allPositions.length) return `<section class="portfolio-empty"><strong>暂无持仓</strong><p>点击“开仓”录入第一只股票。</p><button class="primary" data-action="openPosition">+ 开仓</button></section>`;
      const base = portfolioBaseCurrency(portfolio);
      const dailySummary = portfolioDailyProfitSummary(portfolio, metrics);
      const sortIndicator = (key) => sort.key === key ? `<span class="portfolio-sort-indicator">${sort.dir === "asc" ? "▲" : "▼"}</span>` : "";
      return `
        ${state.portfolioTagsExpanded ? renderPortfolioTagSummary(portfolio, metrics) : ""}
        ${renderPortfolioTradeAlerts(pendingByPosition)}
        <section class="table-panel horizontal-data-table portfolio-table ${state.portfolioTagsExpanded ? "tags-expanded" : ""} ${state.portfolioSummaryExpanded ? "summary-expanded" : ""}">
          <div class="portfolio-list-head">
            <div class="portfolio-list-head-main">
              <div class="portfolio-list-head-title">持仓列表<span class="portfolio-account-badge">${base === "USD" ? "美元" : "人民币"}</span></div>
              <span class="portfolio-daily-chip ${dailySummary.className}">${dailySummary.text}</span>
            </div>
            <div class="portfolio-list-tools">
              ${state.portfolioQuotesUpdatedAt ? `<span class="portfolio-update-text">最新更新 ${formatDateTime(state.portfolioQuotesUpdatedAt)}</span>` : ""}
              <button class="portfolio-list-refresh" data-action="refreshPortfolioQuotes" ${portfolioQuoteRefreshInFlight ? "disabled" : ""} title="刷新实时股价及全部盈亏数据">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
                ${portfolioQuoteRefreshInFlight ? "刷新中" : "刷新"}
              </button>
            </div>
          </div>
          <div class="table-scroll"><table>
          <thead><tr><th class="sticky-col">股票 / 合约</th><th>数量</th><th class="num">成本</th><th class="num">现价</th><th class="sortable" data-action="sortPortfolio" data-sort-key="change">当日涨跌幅${sortIndicator("change")}</th><th class="num">当日盈亏</th><th class="num">持仓盈亏</th><th class="num">市值/敞口</th><th class="num sortable" data-action="sortPortfolio" data-sort-key="weight">仓位比例${sortIndicator("weight")}</th><th>目标仓位</th><th>估值 / 合约信息</th>${biasMetricHeader(sort, "sortPortfolio")}<th>操作</th></tr></thead>
          <tbody>${displayRows.map((entry) => {
            if(entry.kind==="group"){
              const group=entry.group,stock=group.items.find((item)=>item.assetType!=="option")||group.items[0],weight=metrics.netBase?group.exposure/metrics.netBase:0;
              return `<tr class="portfolio-group-row"><td class="sticky-col"><div class="stock-name">${escapeHtml(stock.assetType==="option"?(stock.underlyingName||stock.name):stock.name)}</div><div class="stock-code">${escapeHtml(stock.assetType==="option"?stock.underlyingCode:stock.code)}</div></td><td><span class="portfolio-group-summary">${group.items.length} 个仓位</span></td><td class="num" colspan="5"></td><td class="num">${portfolioPrivate(base==="USD"?formatPortfolioMoney(group.exposure,"USD"):formatWan(group.exposure))}</td><td class="num portfolio-weight-cell ${weight<0?"loss":weight>0?"gain":""}">${(weight*100).toFixed(2)}%</td><td>--</td><td></td>${biasMetricCell(stock)}<td>--</td></tr>`;
            }
            const position=entry.position;
            if(position.assetType==="option"){
              const directionSign=position.direction==="short"?-1:1,contracts=Number(position.contracts||0),multiplier=Number(position.contractMultiplier||0);
              const value=positionBaseValue(position,portfolio),exposure=positionExposureBaseValue(position,portfolio),weight=metrics.netBase?exposure/metrics.netBase:0;
              const latest=Number(position.latestPrice)||Number(position.averageCost)||0,previous=Number(position.previousClose),cost=Number(position.averageCost)||0;
              const dailyProfit=portfolioPositionDailyProfit(position,portfolio);
              const holdingProfit=directionSign*(latest-cost)*contracts*multiplier*portfolioFx(position.currency,base);
              const profitClass=holdingProfit>0?"gain":holdingProfit<0?"loss":"muted",dailyClass=Number.isFinite(dailyProfit)?dailyProfit>0?"gain":dailyProfit<0?"loss":"muted":"muted";
              return `<tr class="portfolio-child-row portfolio-option-row"><td class="sticky-col"><div class="stock-name">${escapeHtml(position.optionType==="put"?"Put":"Call")}<span class="portfolio-option-badge ${position.direction==="short"?"short":""}">${position.direction==="short"?"做空":"做多"}</span></div><div class="stock-code">${escapeHtml(position.code)}</div></td><td>${portfolioPrivate(`${position.direction==="short"?"-":""}${contracts} 张`)}</td><td class="num">${portfolioPrivate(formatPortfolioCost(cost))}</td><td class="num">${formatPortfolioNumber(latest)}</td><td class="muted">--</td><td class="num ${dailyClass}">${Number.isFinite(dailyProfit)?portfolioPrivate(`${dailyProfit>0?"+":""}${base==="USD"?formatPortfolioNumber(dailyProfit):formatWan(dailyProfit)}`):"--"}</td><td class="num ${profitClass}">${portfolioPrivate(`${holdingProfit>0?"+":""}${base==="USD"?formatPortfolioNumber(holdingProfit):formatWan(holdingProfit)}`)}</td><td class="num portfolio-option-exposure">${portfolioPrivate(`${base==="USD"?formatPortfolioMoney(value,"USD"):formatWan(value)} / ${base==="USD"?formatPortfolioMoney(exposure,"USD"):formatWan(exposure)}`)}</td><td class="num portfolio-weight-cell ${weight<0?"loss":weight>0?"gain":""}">${(weight*100).toFixed(2)}%</td><td>--</td><td class="portfolio-valuation-cell"></td>${biasMetricCell(position)}<td><div class="actions"><button class="trade-add" data-action="addPosition" data-id="${escapeHtml(position.id)}">加仓</button><button class="trade-reduce" data-action="reducePosition" data-id="${escapeHtml(position.id)}">平仓</button><button class="trade-edit" data-action="editPosition" data-id="${escapeHtml(position.id)}">编辑</button><button class="trade-history" data-action="positionHistory" data-id="${escapeHtml(position.id)}">交易历史</button></div></td></tr>`;
            }
            const pendingPlans = pendingByPositionId.get(position.id) || [];
            const pendingBuys = pendingPlans.filter((item) => item.side === "buy");
            const pendingSells = pendingPlans.filter((item) => item.side === "sell");
            const value = positionBaseValue(position, portfolio);
            const weight = positionWeight(position);
            const change = position.changePercent == null ? NaN : Number(position.changePercent);
            const changeClass = Number.isFinite(change) ? (change > 0 ? "gain" : change < 0 ? "loss" : "") : "muted";
            const dailyProfit = portfolioPositionDailyProfit(position, portfolio);
            const dailyProfitClass = state.portfolioPrivacyMode ? "muted" : Number.isFinite(dailyProfit) ? (dailyProfit > 0 ? "gain" : dailyProfit < 0 ? "loss" : "") : "muted";
            const dailyProfitText = Number.isFinite(dailyProfit)
              ? `${dailyProfit > 0 ? "+" : ""}${base === "USD" ? formatPortfolioNumber(dailyProfit) : formatWan(dailyProfit)}`
              : "--";
            const averageCost = Number(position.averageCost);
            const latestPrice = Number(position.latestPrice);
            const holdingProfit = averageCost > 0 && latestPrice > 0
              ? (latestPrice - averageCost) * Number(position.shares || 0) * portfolioFx(position.currency, base)
              : NaN;
            const holdingReturn = averageCost > 0 && latestPrice > 0 ? (latestPrice / averageCost - 1) * 100 : NaN;
            const holdingProfitClass = state.portfolioPrivacyMode ? "muted" : Number.isFinite(holdingProfit) ? (holdingProfit > 0 ? "gain" : holdingProfit < 0 ? "loss" : "") : "muted";
            const holdingProfitText = Number.isFinite(holdingProfit)
              ? `${holdingProfit > 0 ? "+" : ""}${base === "USD" ? formatPortfolioNumber(holdingProfit) : formatWan(holdingProfit)}`
              : "--";
            const holdingProfitCell = state.portfolioPrivacyMode
              ? "****"
              : `${holdingProfitText}${Number.isFinite(holdingReturn) ? `<div class="portfolio-holding-profit-rate">${holdingReturn > 0 ? "+" : ""}${holdingReturn.toFixed(2)}%</div>` : ""}`;
            return `<tr class="${entry.grouped?"portfolio-child-row":""}">
              <td data-label="股票" class="sticky-col"><div class="stock-name">${escapeHtml(position.name)}</div><div class="stock-code">${escapeHtml(position.code)}</div>${(position.tags || []).length ? `<div class="position-row-tags">${position.tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}</div>` : ""}</td>
              <td data-label="股数">${portfolioPrivate(Number(position.shares).toLocaleString("zh-CN"))}</td>
              <td data-label="摊薄成本" class="num">${portfolioPrivate(formatPortfolioCost(position.averageCost))}</td>
              <td data-label="实时股价" class="num">${position.latestPrice ? formatPortfolioNumber(position.latestPrice) : "--"}</td>
              <td data-label="当日涨跌幅" class="${changeClass}">${Number.isFinite(change) ? `${change > 0 ? "+" : ""}${change.toFixed(2)}%` : "--"}</td>
              <td data-label="当日盈亏" class="num ${dailyProfitClass}">${portfolioPrivate(dailyProfitText)}</td>
              <td data-label="持仓盈亏" class="num ${holdingProfitClass}">${holdingProfitCell}</td>
              <td data-label="市值" class="num">${portfolioPrivate(base === "USD" ? formatPortfolioMoney(value, "USD") : formatWan(value))}</td>
              <td data-label="仓位比例" class="num portfolio-position-weight">${(weight * 100).toFixed(2)}%</td>
              <td data-label="目标仓位">${Number(position.targetWeight) > 0 ? `${Number(position.targetWeight).toFixed(2)}%` : "--"}</td>
              <td data-label="估值信息" class="portfolio-valuation-cell">${renderPortfolioValuation(position)}</td>
              ${biasMetricCell(position)}
              <td data-label="操作"><div class="actions"><button class="trade-add ${pendingBuys.length ? "trade-plan-alert" : ""}" data-action="addPosition" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">${pendingBuys.length ? `<span class="trade-alert-dot" aria-hidden="true"></span>加仓` : "加仓"}</button><button class="trade-reduce ${pendingSells.length ? "trade-plan-alert" : ""}" data-action="reducePosition" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">${pendingSells.length ? `<span class="trade-alert-dot" aria-hidden="true"></span>减仓` : "减仓"}</button><button class="trade-edit" data-action="editPosition" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">编辑</button><button class="trade-history" data-action="positionHistory" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">交易历史</button></div></td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        </section>`;
    }

    function portfolioValuationVersions(position) {
      if (!position) return [];
      return state.stocks.filter((stock) => stock.code === position.code && stock.market === position.market);
    }

    function portfolioValuationStock(position, selectedId = position?.valuationStockId) {
      return portfolioValuationVersions(position).find((stock) => stock.id === selectedId) || null;
    }

    function renderPortfolioValuation(position, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      if (!stock) return `<span class="muted">--</span>`;
      const computed = calc(stock);
      return `<span>${percent(computed.upside)}</span><span>${computed.forwardPE == null ? "--" : `${trimNumber(computed.forwardPE)}x`}</span><span>${percent(computed.shareholderReturnRate)}</span>`;
    }

    function renderPortfolioValuationPreview(position, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      if (!stock) return "选择后将在持仓列表展示 Upside、Forward PE、股东回报率。";
      const computed = calc(stock);
      const item = (label, value) => `<span class="position-valuation-preview-item"><strong>${label}</strong><span>${value}</span></span>`;
      return `${item("Upside", percent(computed.upside))}<span class="position-valuation-preview-separator">·</span>${item("Forward PE", computed.forwardPE == null ? "--" : `${trimNumber(computed.forwardPE)}x`)}<span class="position-valuation-preview-separator">·</span>${item("股东回报率", percent(computed.shareholderReturnRate))}`;
    }

    function positionPlanValuation(position, price, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      const targetPrice = Number(price);
      const latestMarketCap = stockMarketCapCny(stock);
      const referencePrice = Number(stock?.latestPrice) || Number(position?.latestPrice);
      if (!stock || !(targetPrice > 0) || !(latestMarketCap > 0) || !(referencePrice > 0)) return null;
      const targetMarketCap = latestMarketCap * targetPrice / referencePrice;
      return { ...calc({ ...stock, latestMarketCapCny: targetMarketCap }), targetMarketCap, targetPrice };
    }

    function positionPlanPriceFromMetric(position, metric, value, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      const inputValue = Number(value);
      const latestMarketCap = stockMarketCapCny(stock);
      const referencePrice = Number(stock?.latestPrice) || Number(position?.latestPrice);
      if (!stock || !Number.isFinite(inputValue) || !(latestMarketCap > 0) || !(referencePrice > 0)) return null;
      const cashValue = (Number(stock.netCashCny) || 0) * (Number(stock.netCashDiscountRate) || 0);
      let targetMarketCap = 0;
      if (metric === "upside") {
        const upside = inputValue / 100;
        const expectedMarketCap = calc(stock).expectedMarketCapCny;
        if (!(upside > -1) || !(expectedMarketCap > 0)) return null;
        targetMarketCap = expectedMarketCap / (1 + upside);
      } else if (metric === "forwardPE") {
        const profit = Number(stock.expectedProfitCny) || 0;
        if (!profit) return null;
        targetMarketCap = inputValue * profit + cashValue;
      } else if (metric === "shareholderReturnRate") {
        const rate = inputValue / 100;
        const shareholderReturn = shareholderReturnTotal(stock);
        if (!rate || !shareholderReturn) return null;
        targetMarketCap = shareholderReturn / rate;
      } else {
        return null;
      }
      const price = referencePrice * targetMarketCap / latestMarketCap;
      return Number.isFinite(price) && price > 0 ? price : null;
    }

    function formatPositionPlanNumber(value, digits = 2) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "";
      return Number(value).toFixed(digits).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
    }

    function renderPositionPlanMetricValue(computed, metric) {
      if (!computed) return "--";
      if (metric === "forwardPE") return computed.forwardPE == null ? "--" : `${formatPositionPlanNumber(computed.forwardPE)}x`;
      return percent(computed[metric]);
    }

    function allPortfolioTags() {
      return [...new Set(state.portfolios.flatMap((portfolio) => (portfolio.positions || []).flatMap((position) => position.tags || [])).map((tag) => String(tag).trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "zh-CN"));
    }

    function portfolioTagTargetWeight(portfolio, tag) {
      const value = Number(portfolio?.tagTargets?.[tag]);
      return Number.isFinite(value) && value > 0 ? Math.min(100, value) : 0;
    }

    function rebalanceTagTolerance(target) {
      return Math.max(0.5, Math.min(2.5, Number(target || 0) * 0.08));
    }

    function rebalancePlanState(position) {
      const price = Number(position?.latestPrice) || Number(position?.averageCost) || 0;
      const plan = normalizedPositionTradePlan(position);
      const available = (side) => (plan?.[side] || []).filter((row) => !row.done && Number(row.price) > 0);
      const buys = available("buy").sort((a, b) => Number(b.price) - Number(a.price));
      const sells = available("sell").sort((a, b) => Number(a.price) - Number(b.price));
      const triggeredBuy = price > 0 && buys.some((row) => price <= Number(row.price));
      const triggeredSell = price > 0 && sells.some((row) => price >= Number(row.price));
      return { price, buys, sells, triggeredBuy, triggeredSell, nextBuy: buys[0] || null, nextSell: sells[0] || null };
    }

    function rebalanceValuationProfile(position) {
      const stock = portfolioValuationStock(position);
      const plan = rebalancePlanState(position);
      if (!stock) return { stock: null, plan, confidence: 0, score: 0, text: "未关联有效估值版本" };
      const computed = calc(stock);
      const upside = Number(computed.upside);
      const shareholderReturn = Number(computed.shareholderReturnRate);
      const complete = Number(stock.latestMarketCapCny) > 0 && Number(stock.expectedProfitCny) !== 0 && Number(stock.expectedPE) > 0;
      const updatedAt = new Date(stock.updatedAt || stock.marketCapUpdatedAt || 0).getTime();
      const ageDays = Number.isFinite(updatedAt) && updatedAt > 0 ? Math.max(0, (Date.now() - updatedAt) / 86400000) : Infinity;
      const freshness = ageDays <= 120 ? 1 : ageDays <= 365 ? 0.75 : 0.45;
      const confidence = complete && Number.isFinite(upside) ? freshness : Number.isFinite(upside) ? freshness * 0.55 : 0;
      const upsideSignal = Number.isFinite(upside) ? Math.tanh(upside / 0.35) : 0;
      const returnSignal = Number.isFinite(shareholderReturn) ? Math.tanh((shareholderReturn - 0.03) / 0.07) : 0;
      let score = confidence * (upsideSignal * 0.72 + returnSignal * 0.28);
      if (plan.triggeredBuy) score = Math.max(score, 0.25 * confidence);
      if (plan.triggeredSell) score = Math.min(score, -0.15 * confidence);
      const metrics = [Number.isFinite(upside) ? `Upside ${percent(upside)}` : "", Number.isFinite(shareholderReturn) ? `股东回报 ${percent(shareholderReturn)}` : ""].filter(Boolean);
      return { stock, computed, plan, confidence, score, upside, shareholderReturn, text: metrics.join(" · ") || "估值数据不完整" };
    }

    function projectRebalanceWeights(values, caps, total) {
      if (!(total > 0)) return values.map(() => 0);
      let low = Math.min(...values.map((value, index) => value - caps[index])) - 1;
      let high = Math.max(...values) + 1;
      for (let iteration = 0; iteration < 90; iteration += 1) {
        const offset = (low + high) / 2;
        const sum = values.reduce((result, value, index) => result + Math.max(0, Math.min(caps[index], value - offset)), 0);
        if (sum > total) low = offset; else high = offset;
      }
      const offset = (low + high) / 2;
      return values.map((value, index) => Math.max(0, Math.min(caps[index], value - offset)));
    }

    function portfolioRebalanceAdvice(portfolio, metrics) {
      const empty = (message) => ({ immediate: { reductions: [], additions: [] }, waiting: { reductions: [], additions: [] }, warnings: [], summary: null, message });
      const positions = (portfolio?.positions || []).filter((position) => Number(position.shares || 0) > 0);
      if (!positions.length || !(metrics?.netBase > 0)) return empty("当前没有可计算的持仓。");
      const tags = [...new Set(positions.flatMap((position) => position.tags || []))]
        .map((tag) => ({ tag, target: portfolioTagTargetWeight(portfolio, tag) }))
        .filter((item) => item.target > 0)
        .map((item) => ({ ...item, tolerance: rebalanceTagTolerance(item.target) }));
      if (!tags.length) return empty("请先为至少一个标签设置目标仓位。");
      const tagIndex = new Map(tags.map((item, index) => [item.tag, index]));
      const originalWeights = positions.map((position) => positionBaseValue(position, portfolio) / metrics.netBase * 100);
      const memberships = positions.map((position) => (position.tags || []).map((tag) => tagIndex.get(tag)).filter(Number.isInteger));
      const valuations = positions.map(rebalanceValuationProfile);
      const configuredCaps = positions.map((position, index) => Number(position.targetWeight) > 0 ? Math.min(100, Number(position.targetWeight)) : originalWeights[index]);
      const caps = configuredCaps.map((cap, index) => {
        const valuation = valuations[index];
        const canAdd = Number(positions[index].targetWeight) > 0 && valuation.confidence > 0 && (valuation.score > -0.18 || valuation.plan.triggeredBuy);
        return canAdd ? cap : Math.min(cap, originalWeights[index]);
      });
      const investedWeight = originalWeights.reduce((sum, value) => sum + value, 0);
      const targetInvestedWeight = Math.min(investedWeight, caps.reduce((sum, value) => sum + value, 0));
      const tagActual = (weights) => tags.map((_, tagPosition) => weights.reduce((sum, weight, index) => memberships[index].includes(tagPosition) ? sum + weight : sum, 0));
      const beforeActual = tagActual(originalWeights);
      const objective = (weights) => {
        const actual = tagActual(weights);
        const tagLoss = tags.reduce((sum, item, index) => sum + ((actual[index] - item.target) / item.tolerance) ** 2, 0);
        const turnoverLoss = weights.reduce((sum, weight, index) => sum + 0.035 * (weight - originalWeights[index]) ** 2, 0);
        const valuationBenefit = weights.reduce((sum, weight, index) => sum + 0.08 * valuations[index].score * (weight - originalWeights[index]), 0);
        return tagLoss + turnoverLoss - valuationBenefit;
      };
      let weights = projectRebalanceWeights(originalWeights, caps, targetInvestedWeight);
      let currentObjective = objective(weights);
      for (let iteration = 0; iteration < 1200; iteration += 1) {
        const actual = tagActual(weights);
        const gradient = positions.map((_, positionIndex) => {
          const tagGradient = memberships[positionIndex].reduce((sum, tagPosition) => {
            const item = tags[tagPosition];
            return sum + 2 * (actual[tagPosition] - item.target) / (item.tolerance ** 2);
          }, 0);
          return tagGradient + 0.07 * (weights[positionIndex] - originalWeights[positionIndex]) - 0.08 * valuations[positionIndex].score;
        });
        let step = 0.2;
        let next = weights;
        let nextObjective = currentObjective;
        while (step > 0.000001) {
          const candidate = projectRebalanceWeights(weights.map((weight, index) => weight - step * gradient[index]), caps, targetInvestedWeight);
          const candidateObjective = objective(candidate);
          if (candidateObjective <= currentObjective - 0.00000001) { next = candidate; nextObjective = candidateObjective; break; }
          step /= 2;
        }
        const movement = Math.max(...next.map((value, index) => Math.abs(value - weights[index])));
        weights = next;
        currentObjective = nextObjective;
        if (movement < 0.00001 || step <= 0.000001) break;
      }
      const afterActual = tagActual(weights);
      const gaps = tags.map((item, index) => ({ ...item, before: beforeActual[index], after: afterActual[index], gap: item.target - beforeActual[index] }));
      let recommendations = positions.map((position, index) => {
        const direction = weights[index] < originalWeights[index] ? "reduce" : "add";
        const requestedDelta = Math.abs(weights[index] - originalWeights[index]);
        if (requestedDelta < 0.12) return null;
        const basePerShare = (Number(position.latestPrice) || Number(position.averageCost) || 0) * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
        const lot = direction === "add" && position.market === "CN" ? 100 : 1;
        const rawShares = basePerShare > 0 ? metrics.netBase * requestedDelta / 100 / basePerShare : 0;
        const shares = Math.floor(rawShares / lot) * lot;
        if (!(shares > 0)) return null;
        const deltaWeight = shares * basePerShare / metrics.netBase * 100;
        const valuation = valuations[index];
        const relevant = gaps.filter((item) => (position.tags || []).includes(item.tag) && (direction === "add" ? item.gap > 0.05 : item.gap < -0.05))
          .sort((a, b) => Math.abs(b.gap / b.tolerance) - Math.abs(a.gap / a.tolerance)).slice(0, 2);
        const overCap = originalWeights[index] > configuredCaps[index] + 0.05;
        const reason = [overCap && direction === "reduce" ? `超过个股上限 ${(originalWeights[index] - configuredCaps[index]).toFixed(2)}%` : "", ...relevant.map((item) => `${item.tag}${item.gap > 0 ? "低配" : "超配"} ${Math.abs(item.gap).toFixed(2)}%`)].filter(Boolean).join(" · ") || "在全局约束下改善标签结构";
        const plan = valuation.plan;
        const immediate = direction === "reduce"
          ? overCap || plan.triggeredSell || (valuation.confidence > 0 && valuation.score < -0.22)
          : valuation.confidence > 0 && (plan.triggeredBuy || (!plan.buys.length && valuation.score > 0.08));
        const timing = immediate
          ? direction === "reduce" ? overCap ? "个股上限优先" : plan.triggeredSell ? "已进入卖点" : "估值偏弱" : plan.triggeredBuy ? "已进入买点" : "估值支持增配"
          : direction === "add" ? valuation.confidence <= 0 ? "缺少有效估值，暂不直接买入" : plan.nextBuy ? `等待买点 ${formatPortfolioNumber(plan.nextBuy.price)}` : "等待更合适价格" : plan.nextSell ? `等待卖点 ${formatPortfolioNumber(plan.nextSell.price)}` : "等待估值或价格信号";
        return { position, direction, shares, deltaWeight, currentWeight: originalWeights[index], targetWeight: originalWeights[index] + (direction === "add" ? deltaWeight : -deltaWeight), reason, valuationText: valuation.text, timing, immediate, overCap, directBenefit: overCap || relevant.length > 0, cashCurrency: rebalanceCashCurrency(portfolio, position.currency), cashAmount: shares * (Number(position.latestPrice) || Number(position.averageCost) || 0) * portfolioFx(position.currency, rebalanceCashCurrency(portfolio, position.currency)) };
      }).filter(Boolean);
      if (!recommendations.some((item) => item.direction === "add")) recommendations = recommendations.filter((item) => item.direction === "add" || item.directBenefit);
      const immediate = { reductions: recommendations.filter((item) => item.immediate && item.direction === "reduce"), additions: recommendations.filter((item) => item.immediate && item.direction === "add") };
      const waiting = { reductions: recommendations.filter((item) => !item.immediate && item.direction === "reduce"), additions: recommendations.filter((item) => !item.immediate && item.direction === "add") };
      const cashBudget = { ...(portfolio.cash || {}) };
      immediate.reductions.forEach((item) => { cashBudget[item.cashCurrency] = Number(cashBudget[item.cashCurrency] || 0) + item.cashAmount; });
      immediate.additions.sort((a, b) => valuations[positions.indexOf(b.position)].score - valuations[positions.indexOf(a.position)].score);
      immediate.additions = immediate.additions.map((item) => {
        const available = Number(cashBudget[item.cashCurrency] || 0);
        if (item.cashAmount <= available + 0.000001) { cashBudget[item.cashCurrency] = available - item.cashAmount; return item; }
        const price = Number(item.position.latestPrice) || Number(item.position.averageCost) || 0;
        const perShare = price * portfolioFx(item.position.currency, item.cashCurrency);
        const lot = item.position.market === "CN" ? 100 : 1;
        const shares = perShare > 0 ? Math.floor(available / perShare / lot) * lot : 0;
        if (!(shares > 0)) return { ...item, immediate: false, timing: `${currencies[item.cashCurrency]?.label || item.cashCurrency}现金不足，等待减仓或补充现金` };
        cashBudget[item.cashCurrency] = available - shares * perShare;
        const deltaWeight = shares * perShare * portfolioFx(item.cashCurrency, portfolioBaseCurrency(portfolio)) / metrics.netBase * 100;
        return { ...item, shares, cashAmount: shares * perShare, deltaWeight, targetWeight: item.currentWeight + deltaWeight };
      });
      const cashDeferred = immediate.additions.filter((item) => !item.immediate);
      immediate.additions = immediate.additions.filter((item) => item.immediate);
      waiting.additions.push(...cashDeferred);
      [immediate.reductions, immediate.additions, waiting.reductions, waiting.additions].forEach((rows) => rows.sort((a, b) => b.deltaWeight - a.deltaWeight));
      const displayedRecommendations = [...immediate.reductions, ...immediate.additions, ...waiting.reductions, ...waiting.additions];
      const warnings = [];
      tags.forEach((item, tagPosition) => {
        const memberCaps = caps.reduce((sum, cap, positionIndex) => memberships[positionIndex].includes(tagPosition) ? sum + cap : sum, 0);
        const nonMemberCaps = caps.reduce((sum, cap, positionIndex) => memberships[positionIndex].includes(tagPosition) ? sum : sum + cap, 0);
        const feasibleMin = Math.max(0, targetInvestedWeight - nonMemberCaps);
        const feasibleMax = Math.min(targetInvestedWeight, memberCaps);
        if (item.target < feasibleMin - item.tolerance || item.target > feasibleMax + item.tolerance) warnings.push(`${item.tag}目标 ${item.target.toFixed(2)}%，当前约束下可实现范围约为 ${feasibleMin.toFixed(2)}%–${feasibleMax.toFixed(2)}%。`);
      });
      const executableWeights = [...originalWeights];
      displayedRecommendations.forEach((item) => {
        const index = positions.indexOf(item.position);
        if (index >= 0) executableWeights[index] = Math.max(0, executableWeights[index] + (item.direction === "add" ? item.deltaWeight : -item.deltaWeight));
      });
      const executableAfterActual = tagActual(executableWeights);
      gaps.forEach((item, index) => { item.after = executableAfterActual[index]; });
      gaps.filter((item) => Math.abs(item.after - item.target) > item.tolerance * 1.35)
        .sort((a, b) => Math.abs(b.after - b.target) - Math.abs(a.after - a.target))
        .slice(0, 3).forEach((item) => warnings.push(`${item.tag}按可交易股数调整后仍${item.after > item.target ? "超配" : "低配"} ${Math.abs(item.after - item.target).toFixed(2)}%，受重叠标签、个股上限、估值条件或交易单位限制。`));
      const beforeMax = Math.max(...gaps.map((item) => Math.abs(item.before - item.target)));
      const afterMax = Math.max(...gaps.map((item) => Math.abs(item.after - item.target)));
      const beforeTotal = gaps.reduce((sum, item) => sum + Math.abs(item.before - item.target), 0);
      const afterTotal = gaps.reduce((sum, item) => sum + Math.abs(item.after - item.target), 0);
      const turnover = displayedRecommendations.reduce((sum, item) => sum + item.deltaWeight, 0) / 2;
      const valuationCoverage = positions.length ? valuations.filter((item) => item.confidence > 0).length / positions.length * 100 : 0;
      const summary = { beforeMax, afterMax, beforeTotal, afterTotal, turnover, valuationCoverage };
      const hasRows = immediate.reductions.length || immediate.additions.length || waiting.reductions.length || waiting.additions.length;
      return { immediate, waiting, warnings: [...new Set(warnings)].slice(0, 5), summary, message: hasRows ? "" : "当前没有达到最小有效交易量的调整；建议保持现状。" };
    }

    function renderPortfolioRebalanceAdvice(portfolio, metrics) {
      const advice = portfolioRebalanceAdvice(portfolio, metrics);
      const renderSide = (type, title, rows) => `<section class="portfolio-rebalance-advice-side ${type}"><strong>${title}</strong>${rows.length ? `<div class="portfolio-rebalance-advice-list">${rows.slice(0, 8).map((item) => `<div class="portfolio-rebalance-advice-item"><strong>${escapeHtml(item.position.name)}</strong><b>${type === "reduce" ? "−" : "+"}${item.deltaWeight.toFixed(2)}% · ${portfolioPrivate(`${item.shares.toLocaleString("zh-CN")} 股`)}</b><span>${escapeHtml(item.reason)} · ${escapeHtml(item.timing)}</span><em>${escapeHtml(item.valuationText)} · 调整后约 ${item.targetWeight.toFixed(2)}%</em></div>`).join("")}</div>` : `<div class="portfolio-rebalance-advice-empty">暂无${type === "reduce" ? "减配" : "增配"}项目</div>`}</section>`;
      const renderSection = (kind, title, subtitle, rows) => rows.reductions.length || rows.additions.length ? `<section class="portfolio-rebalance-advice-section ${kind}"><div class="portfolio-rebalance-advice-section-title"><b>${subtitle}</b>${title}</div><div class="portfolio-rebalance-advice-grid">${renderSide("reduce", "建议减少", rows.reductions)}${renderSide("add", "建议增配", rows.additions)}</div></section>` : "";
      const summary = advice.summary ? `<div class="portfolio-rebalance-advice-summary"><div><span>最大标签偏差</span><strong>${advice.summary.beforeMax.toFixed(2)}% → ${advice.summary.afterMax.toFixed(2)}%</strong></div><div><span>标签总偏差</span><strong>${advice.summary.beforeTotal.toFixed(2)}% → ${advice.summary.afterTotal.toFixed(2)}%</strong></div><div><span>预计换手率</span><strong>${advice.summary.turnover.toFixed(2)}%</strong></div><div><span>有效估值覆盖</span><strong>${advice.summary.valuationCoverage.toFixed(0)}%</strong></div></div>` : "";
      const warnings = advice.warnings?.length ? `<div class="portfolio-rebalance-advice-warnings">${advice.warnings.map((warning) => `<div class="portfolio-rebalance-advice-warning">${escapeHtml(warning)}</div>`).join("")}</div>` : "";
      return `<div class="portfolio-rebalance-advice"><div class="portfolio-rebalance-advice-head"><div class="portfolio-rebalance-advice-title"><strong>智能调仓建议</strong><span>标签决定结构，关联估值决定标的，买卖点决定时机；个股上限、现金和交易单位作为执行约束。</span></div><button type="button" class="portfolio-rebalance-advice-close" data-action="closePortfolioAdvice" aria-label="关闭调仓建议">×</button></div>${summary}${advice.message ? `<div class="portfolio-rebalance-advice-empty">${escapeHtml(advice.message)}</div>` : `${renderSection("immediate", "估值与价格条件支持，可优先处理", "现在执行", advice.immediate)}${renderSection("wait", "结构上需要调整，但当前价格或数据条件不足", "等待条件", advice.waiting)}`}${warnings}</div>`;
    }

    function renderPortfolioTagAllocationIcon(actualWeight, targetWeight) {
      if (!(targetWeight > 0) || Math.abs(actualWeight - targetWeight) < 0.005) return "";
      const over = actualWeight > targetWeight;
      const label = `${over ? "超配" : "低配"} ${Math.abs(actualWeight - targetWeight).toFixed(2)}%`;
      const path = over
        ? `<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>`
        : `<path d="M12 5v14"/><path d="m18 13-6 6-6-6"/>`;
      return `<span class="portfolio-tag-allocation ${over ? "over" : "under"}" title="${label}" aria-label="${label}"><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg></span>`;
    }

    function renderPortfolioTagSummary(portfolio, metrics) {
      const tagRows = [...new Set((portfolio.positions || []).flatMap((position) => position.tags || []))]
        .map((tag) => {
          const tagged = (portfolio.positions || []).filter((position) => (position.tags || []).includes(tag));
          return { tag, tagged, value: tagged.reduce((sum, position) => sum + positionBaseValue(position, portfolio), 0) };
        })
        .sort((a, b) => b.value - a.value || a.tag.localeCompare(b.tag, "zh-CN"));
      if (!tagRows.length) return `<section class="portfolio-tag-filter-panel"><div class="portfolio-tag-filter-head">标签筛选</div><div class="muted">当前组合暂无标签，可在编辑持仓中添加。</div></section>`;
      const base = portfolioBaseCurrency(portfolio);
      return `<section class="portfolio-tag-filter-panel"><div class="portfolio-tag-filter-head">标签筛选</div><div class="portfolio-tag-summary" aria-label="标签汇总">${tagRows.map(({ tag, tagged, value }) => {
        let profit = 0, previousValue = 0, quoted = 0;
        tagged.forEach((position) => {
          const previousClose = Number(position.previousClose), latestPrice = Number(position.latestPrice), shares = Number(position.shares || 0);
          if (previousClose > 0 && latestPrice > 0 && shares > 0) {
            const fx = portfolioFx(position.currency, base);
            quoted += 1; profit += (latestPrice - previousClose) * shares * fx; previousValue += previousClose * shares * fx;
          }
        });
        const dailyPercent = quoted && previousValue > 0 ? profit / previousValue * 100 : NaN;
        const active = state.portfolioTagFilter === tag;
        const className = Number.isFinite(dailyPercent) ? (dailyPercent > 0 ? "gain" : dailyPercent < 0 ? "loss" : "muted") : "muted";
        const actualWeight = metrics.netBase ? value / metrics.netBase * 100 : 0;
        const targetWeight = portfolioTagTargetWeight(portfolio, tag);
        const stat = `<button type="button" class="portfolio-tag-stat ${active ? "active" : ""}" data-action="togglePortfolioTag" data-tag="${escapeHtml(tag)}"><strong>${escapeHtml(tag)}</strong><span>${actualWeight.toFixed(2)}%</span>${renderPortfolioTagAllocationIcon(actualWeight, targetWeight)}<span class="${className}">${Number.isFinite(dailyPercent) ? `${dailyPercent > 0 ? "+" : ""}${dailyPercent.toFixed(2)}%` : "--"}</span></button>`;
        return active ? `<span class="portfolio-tag-filter-item">${stat}<button type="button" class="portfolio-tag-rename-trigger" data-action="editPortfolioTag" data-tag="${escapeHtml(tag)}" title="编辑标签" aria-label="编辑标签 ${escapeHtml(tag)}">✎</button></span>` : stat;
      }).join("")}</div>${state.portfolioAdviceExpanded ? renderPortfolioRebalanceAdvice(portfolio, metrics) : ""}</section>`;
    }

    function renderPortfolioModal() {
      const modal = state.portfolioModal;
      if (!modal) return "";
      if (modal.type === "create") return renderCreatePortfolioModal();
      if (modal.type === "initialize") return renderInitializePortfolioModal(modal);
      if (modal.type === "rename") return renderRenamePortfolioModal();
      if (modal.type === "delete") return renderDeletePortfolioModal(modal);
      if (modal.type === "cash") return renderCashModal(modal);
      if (modal.type === "subscription" || modal.type === "redemption") return renderCashFlowModal(modal);
      if (modal.type === "rebalance") return renderRebalanceModal(modal);
      if (modal.type === "plan") return renderPortfolioPlanModal(modal);
      if (modal.type === "history") return renderPositionHistoryModal(modal);
      if (modal.type === "tag") return renderPortfolioTagModal(modal);
      return renderPositionModal(modal);
    }

    function renderPortfolioPlanModal(modal) {
      const stock=modal.stock;
      const search=`<div class="field"><span>股票名称/代码搜索</span><div class="search-combobox"><input data-input="portfolioStockSearch" autocomplete="off" placeholder="输入股票名称或代码" value="${escapeHtml(modal.searchQuery||"")}">${(state.portfolioSearchLoading||state.portfolioSearchResults.length||(modal.searchQuery&&!stock))?`<div class="search-results show">${state.portfolioSearchLoading?`<div class="empty" style="padding:18px">正在匹配股票...</div>`:state.portfolioSearchResults.length?state.portfolioSearchResults.map((item,index)=>`<button type="button" class="result-item" data-action="selectPortfolioStock" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}</span></span></button>`).join(""):`<div class="empty" style="padding:18px">没有匹配结果，请尝试其他名称或代码。</div>`}</div>`:""}</div></div>`;
      return modalShell("添加计划", `${search}${stock?`<div class="portfolio-selected-stock"><strong>${escapeHtml(stock.name)}</strong> <span class="stock-code">${escapeHtml(stock.code)} · ${escapeHtml(stock.currency||marketCurrency(stock.market))}</span></div>`:""}<div class="grid-2"><label class="field"><span>目标价格</span><div class="input-with-suffix"><input name="targetPrice" data-plan-target-price type="number" min="0.0001" step="any" required><span class="input-suffix">${escapeHtml(stock?.currency||"原币")}</span></div></label><label class="field"><span>目标数量</span><div class="input-with-suffix"><input name="targetShares" data-plan-target-shares type="number" min="1" step="1" required><span class="input-suffix">股</span></div></label></div><div class="field"><span>目标仓位</span><div class="portfolio-plan-weight-preview" data-plan-target-weight>--</div></div><label class="field"><span>备注</span><textarea name="remark" rows="3" maxlength="300" placeholder="记录交易逻辑、触发条件或风险提示"></textarea></label>`, "portfolioPlan", "", "", `<button type="button" data-action="closePortfolioModal">取消</button><button class="portfolio-plan-submit buy" type="submit" name="side" value="buy">添加买入计划</button><button class="portfolio-plan-submit sell" type="submit" name="side" value="sell">添加卖出计划</button>`);
    }

    function renderPortfolioTagModal(modal) {
      return modalShell("编辑标签", `
        <label class="field"><span>标签名称</span><input name="tagName" maxlength="20" required value="${escapeHtml(modal.tag || "")}" placeholder="例如：AI / 高股息"></label>
        <label class="field"><span>目标仓位</span><div class="position-target-control"><button type="button" data-tag-target-weight-step="-1" aria-label="降低标签目标仓位">−</button><input name="tagTargetWeight" type="text" inputmode="decimal" value="${formatPositionTargetWeight(modal.targetWeight)}" required aria-label="标签目标仓位，支持 0% 到 100%"><button type="button" data-tag-target-weight-step="1" aria-label="提高标签目标仓位">+</button></div><div class="position-target-quick">${[3,5,8,15,20,30,50].map((value) => `<button type="button" data-tag-target-weight-value="${value}">${value}%</button>`).join("")}</div></label>
        <div class="portfolio-tag-edit-note">可手动输入 0%–100% 的任意仓位；目标仅应用于当前组合，设为 0% 时不显示偏离提示。</div>
      `, "portfolioTag", "保存");
    }

    function renderPositionHistoryModal(modal) {
      const portfolio = activePortfolio();
      const position = modal.position;
      const optionPosition=position?.assetType==="option";
      const rows = (portfolio?.tradeHistory || [])
        .filter((item) => item.positionId === position?.id || (item.code === position?.code && (!item.market || item.market === position?.market)))
        .sort((a, b) => String(b.occurredAt || "").localeCompare(String(a.occurredAt || "")));
      const body = rows.length ? `<div class="table-scroll"><table class="position-history-table">
        <thead><tr><th>日期</th><th>交易类型</th><th>成交价</th><th>${optionPosition?"变动张数":"变动股数"}</th><th>操作</th></tr></thead>
        <tbody>${rows.map((item) => {
          const sameStock = item.code === position?.code && (!item.market || item.market === position?.market);
          const canRollback = !optionPosition && (item.positionId === position?.id || sameStock);
          const editing = canRollback && modal.editTradeId === item.id;
          const sign = portfolioTradeSign(item.type) > 0 ? "+" : "-";
          const sharesCell = editing
            ? `<div class="history-full-edit"><input type="number" min="1" step="1" inputmode="numeric" value="${escapeHtml(String(modal.editShares || item.shares || ""))}" data-history-shares="${escapeHtml(item.id)}" aria-label="修订交易股数"></div>`
            : `${Number(optionPosition?item.contracts:item.shares).toLocaleString("zh-CN")}`;
          const actions = !canRollback
            ? `<span class="muted">历史周期</span>`
            : editing
              ? `<div class="history-actions"><button class="history-save" data-action="saveTradeShares" data-trade-id="${item.id}">保存</button><button class="history-cancel" data-action="cancelTradeShares">取消</button></div>`
              : `<div class="history-actions"><button class="history-edit" data-action="editTradeShares" data-trade-id="${item.id}">编辑交易</button><button class="history-rollback" data-action="rollbackTrade" data-trade-id="${item.id}">回滚</button></div>`;
          const timeCell = editing ? `<div class="history-full-edit"><input type="datetime-local" step="60" value="${escapeHtml(modal.editOccurredAt || localDateTimeMinuteValue(item.occurredAt))}" data-history-time="${escapeHtml(item.id)}" aria-label="修订交易时间"></div>` : new Date(item.occurredAt).toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
          const priceCell = editing ? `<div class="history-full-edit"><input type="number" min="0" ${priceInputAttrs(item.market || position.market, modal.editPrice || item.price)} value="${escapeHtml(String(modal.editPrice || item.price || ""))}" data-history-price="${escapeHtml(item.id)}" aria-label="修订成交价"></div>` : formatPortfolioMoney(item.price, item.currency || position.currency);
          return `<tr><td>${timeCell}</td><td>${portfolioTradeTypeText(item.type)}</td><td>${priceCell}</td><td>${sign}${sharesCell}</td><td>${actions}</td></tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div class="empty" style="padding:28px 12px">暂无交易记录。</div>`;
      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal">
        <div class="simple-modal-head"><h2>${escapeHtml(position?.name || "持仓")} · 交易历史</h2><button class="icon" data-action="closePortfolioModal" aria-label="关闭">×</button></div>
        <div class="simple-modal-body">${body}<div class="position-history-note">可修改交易时间、成交价和股数。保存后会同步修订当前持仓与现金，并从交易发生日开始重新回溯历史净值。</div>${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}</div>
        <div class="simple-modal-foot"><button data-action="closePortfolioModal">关闭</button></div>
      </section></div>`;
    }

    function modalShell(title, body, formName, submitText, modalClass = "", footerHtml = "") {
      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal ${escapeHtml(modalClass)}">
        <div class="simple-modal-head"><h2>${escapeHtml(title)}</h2><button class="icon" data-action="closePortfolioModal" aria-label="关闭">×</button></div>
        <form data-form="${formName}"><div class="simple-modal-body">${body}${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}</div>
        <div class="simple-modal-foot">${footerHtml || `<button type="button" data-action="closePortfolioModal">取消</button><button class="primary" type="submit">${escapeHtml(submitText)}</button>`}</div></form>
      </section></div>`;
    }

    function renderCreatePortfolioModal() {
      return modalShell("创建组合", `
        <label class="field"><span>组合名称</span><input name="name" maxlength="30" required placeholder="例如：长期账户"></label>
        <label class="field"><span>账户类型</span><select name="accountType" data-input="portfolioAccountType"><option value="CNY">人民币账户</option><option value="HKUS">港美账户</option></select></label>
        <div data-account-fields="CNY"><label class="field"><span>人民币启动金额（万元）</span><input name="startCny" type="number" min="0" step="0.01" value="0" required></label></div>
        <div data-account-fields="HKUS" style="display:none"><div class="grid-2"><label class="field"><span>港币启动金额（万港币）</span><input name="startHkd" type="number" min="0" step="0.01" value="0"></label><label class="field"><span>美元启动金额（万美元）</span><input name="startUsd" type="number" min="0" step="0.01" value="0"></label></div></div>
        <div class="portfolio-create-import"><div><strong>导入一个已运行的组合</strong><span>一次录入启动金额、当前现金和全部持仓，系统据此计算当前净值。</span></div><button type="button" data-action="initializePortfolio">初始化导入</button></div>
      `, "createPortfolio", "创建");
    }

    function initializationRow() {
      return { id: id("initrow"), query: "", stock: null, shares: "", averageCost: "", results: [], loading: false };
    }

    function initializationResultsMarkup(row) {
      if (!row?.loading && !row?.results?.length) return "";
      return `<div class="portfolio-initialize-results">${row.loading
        ? `<div class="muted" style="padding:10px">搜索中…</div>`
        : row.results.map((stock, resultIndex) => `<button type="button" class="portfolio-initialize-result" data-action="selectInitializationStock" data-row-id="${row.id}" data-index="${resultIndex}"><span>${escapeHtml(stock.name)}</span><small>${escapeHtml(stock.code)} · ${escapeHtml(stock.market)}</small></button>`).join("")}</div>`;
    }

    function renderInitializePortfolioModal(modal) {
      const isHkus = modal.accountType === "HKUS";
      const isEditing = Boolean(modal.portfolioId);
      const rows = modal.rows || [];
      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal portfolio-initialize-modal">
        <div class="simple-modal-head"><h2>${isEditing ? "导入组合" : "初始化导入组合"}</h2><button class="icon" data-action="closePortfolioModal" aria-label="关闭">×</button></div>
        <form data-form="initializePortfolio"><div class="simple-modal-body">
          <div class="grid-2"><label class="field"><span>组合名称</span><input data-init-field="name" name="name" maxlength="30" required value="${escapeHtml(modal.name || "")}" placeholder="例如：My"></label><label class="field"><span>账户类型</span><select data-input="initializationAccountType" name="accountType"${isEditing ? " disabled" : ""}><option value="CNY"${isHkus ? "" : " selected"}>人民币账户</option><option value="HKUS"${isHkus ? " selected" : ""}>港美账户</option></select></label></div>
          <section class="portfolio-initialize-section"><div class="portfolio-initialize-section-head"><h3>1. 启动金额</h3></div><div class="portfolio-initialize-help">组合最初开始运行时的本金，用作净值 1.0000 的计算基准。</div>${isHkus
            ? `<div class="grid-2"><label class="field"><span>港币启动金额（万港币）</span><input data-init-field="startHkd" name="startHkd" type="number" min="0" step="any" value="${escapeHtml(modal.startHkd || "")}"></label><label class="field"><span>美元启动金额（万美元）</span><input data-init-field="startUsd" name="startUsd" type="number" min="0" step="any" value="${escapeHtml(modal.startUsd || "")}"></label></div>`
            : `<label class="field"><span>人民币启动金额（万元）</span><input data-init-field="startCny" name="startCny" type="number" min="0" step="any" value="${escapeHtml(modal.startCny || "")}" required></label>`}</section>
          <section class="portfolio-initialize-section"><div class="portfolio-initialize-section-head"><h3>2. 当前现金</h3></div><div class="portfolio-initialize-help">填写导入当天账户内实际可用的现金余额。</div>${isHkus
            ? `<div class="grid-2"><label class="field"><span>港币现金（万港币）</span><input data-init-field="cashHkd" name="cashHkd" type="number" min="0" step="any" value="${escapeHtml(modal.cashHkd || "")}"></label><label class="field"><span>美元现金（万美元）</span><input data-init-field="cashUsd" name="cashUsd" type="number" min="0" step="any" value="${escapeHtml(modal.cashUsd || "")}"></label></div>`
            : `<label class="field"><span>人民币现金（万元）</span><input data-init-field="cashCny" name="cashCny" type="number" min="0" step="any" value="${escapeHtml(modal.cashCny || "")}" required></label>`}</section>
          <section class="portfolio-initialize-section"><div class="portfolio-initialize-section-head"><h3>3. 当前持仓</h3><button type="button" data-action="addInitializationRow">增加一行</button></div><div class="portfolio-initialize-help">逐行搜索股票并录入当前持股数和摊薄成本；保存时会同步最新股价计算当前资产与净值。</div>
            <div class="portfolio-initialize-rows">${rows.map((row, index) => `<div class="portfolio-initialize-row">
              <div class="field portfolio-initialize-stock" data-initialization-stock="${row.id}"><span>股票</span>${row.stock
                ? `<div class="portfolio-initialize-selected"><div><strong>${escapeHtml(row.stock.name)}</strong><small>${escapeHtml(row.stock.code)}</small></div><button type="button" data-action="clearInitializationStock" data-row-id="${row.id}">更换</button></div>`
                : `<input data-input="initializationStockSearch" data-row-id="${row.id}" value="${escapeHtml(row.query || "")}" placeholder="搜索股票名称或代码" autocomplete="off"><div data-initialization-results="${row.id}">${initializationResultsMarkup(row)}</div>`}</div>
              <label class="field"><span>持股数</span><input data-init-row-field="shares" data-row-id="${row.id}" type="number" min="0" step="any" value="${escapeHtml(row.shares || "")}" placeholder="0"></label>
              <label class="field"><span>摊薄成本</span><input data-init-row-field="averageCost" data-row-id="${row.id}" type="number" min="0" ${costInputAttrs()} value="${escapeHtml(row.averageCost || "")}" placeholder="原币价格"></label>
              <button type="button" class="portfolio-initialize-remove" data-action="removeInitializationRow" data-row-id="${row.id}" aria-label="删除第 ${index + 1} 行">×</button>
            </div>`).join("")}</div>
          </section>
          ${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}
        </div><div class="simple-modal-foot"><button type="button" data-action="closePortfolioModal">取消</button><button class="primary" type="submit">${isEditing ? "保存导入" : "完成初始化"}</button></div></form>
      </section></div>`;
    }

    function renderRenamePortfolioModal() {
      const portfolio = activePortfolio();
      return modalShell("重命名组合", `
        <label class="field"><span>组合名称</span><input name="name" maxlength="30" required value="${escapeHtml(portfolio?.name || "")}" placeholder="例如：长期账户"></label>
      `, "renamePortfolio", "保存");
    }

    function renderDeletePortfolioModal() {
      const portfolio = activePortfolio();
      const positionCount = portfolio?.positions?.length || 0;
      const detail = positionCount ? `当前组合包含 ${positionCount} 只持仓，现金、持仓、交易流水和净值数据都会一并删除。` : "当前组合的现金、交易流水和净值数据都会一并删除。";
      return modalShell("删除组合", `
        <div class="portfolio-delete-warning">
          <strong>这是不可逆操作。</strong>
          <span>你将删除组合「${escapeHtml(portfolio?.name || "当前组合")}」。${escapeHtml(detail)}</span>
        </div>
        <label class="field"><span>请输入 0000 确认删除</span><input name="confirmCode" inputmode="numeric" pattern="0000" autocomplete="off" placeholder="0000" required></label>
      `, "deletePortfolio", "确认删除", "portfolio-delete-modal");
    }

    function renderCashModal(modal) {
      const portfolio = activePortfolio();
      const isHkus = portfolio?.accountType === "HKUS";
      return modalShell("校准现金", isHkus ? `
        <div class="grid-2"><label class="field"><span>港币余额（港元）</span><input data-input="cashAmount" name="cashHkd" inputmode="decimal" value="${formatCashAmount(portfolio.cash?.HKD)}" required></label><label class="field"><span>美元余额（美元）</span><input data-input="cashAmount" name="cashUsd" inputmode="decimal" value="${formatCashAmount(portfolio.cash?.USD)}" required></label></div>
      ` : `<label class="field"><span>人民币余额（元）</span><input data-input="cashAmount" name="cashCny" inputmode="decimal" value="${formatCashAmount(portfolio?.cash?.CNY)}" required></label>`, "calibrateCash", "保存");
    }

    function renderCashFlowModal(modal) {
      const portfolio = activePortfolio();
      const isSubscription = modal.type === "subscription";
      const currenciesForAccount = portfolio?.accountType === "HKUS" ? ["HKD", "USD"] : ["CNY"];
      return modalShell(isSubscription ? "申购" : "赎回", `
        <label class="field"><span>币种</span><select name="currency">${currenciesForAccount.map((currency) => `<option value="${currency}">${currencies[currency].label}</option>`).join("")}</select></label>
        <label class="field"><span>${isSubscription ? "申购" : "赎回"}金额（万原币）</span><input name="amount" type="number" min="0.000001" step="any" required></label>
        <div class="muted">按操作前盘中估算净值折算份额；${isSubscription ? "资金增加、份额增加" : "资金减少、份额减少"}，单位净值不因资金流入流出突变。</div>
      `, "portfolioCashFlow", isSubscription ? "确认申购" : "确认赎回");
    }

    function renderRebalanceStockSearch(modal, side) {
      const queryKey = `${side}Query`;
      const stockKey = `${side}Stock`;
      const stock = modal[stockKey];
      const isActive = modal.searchSide === side;
      return `
        <label class="field"><span>${side === "sell" ? "卖出" : "买入"}股票名称/代码搜索</span><div class="search-combobox">
          <input data-input="portfolioStockSearch" data-side="${side}" autocomplete="off" placeholder="输入股票名称、代码或拼音" value="${escapeHtml(modal[queryKey] || "")}">
          ${isActive && (state.portfolioSearchLoading || state.portfolioSearchResults.length || (modal[queryKey] && !stock)) ? `<div class="search-results show">
            ${state.portfolioSearchLoading ? `<div class="empty" style="padding:18px">正在匹配股票...</div>` : state.portfolioSearchResults.length ? state.portfolioSearchResults.map((item, index) => `<button type="button" class="result-item" data-action="selectPortfolioStock" data-side="${side}" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}</span></span></button>`).join("") : `<div class="empty" style="padding:18px">没有匹配结果，请尝试其他名称或代码。</div>`}
          </div>` : ""}
        </div></label>
      `;
    }

    function rebalanceCurrentPosition(stock, portfolio) {
      if (!stock || !portfolio) return null;
      return (portfolio.positions || []).find((item) => item.code === stock.code && item.market === stock.market) || null;
    }

    function rebalanceSidePreview(modal, side, portfolio, metrics) {
      const stock = modal[`${side}Stock`];
      const position = rebalanceCurrentPosition(stock, portfolio);
      const currency = stock?.currency || marketCurrency(stock?.market);
      const price = Number(modal[`${side}Price`] || stock?.latestPrice || position?.latestPrice || position?.averageCost || 0);
      const shares = Number(modal[`${side}Shares`] || 0);
      const currentRatio = position && metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase * 100 : 0;
      const tradeBase = price > 0 && shares > 0 ? price * shares * portfolioFx(currency, portfolioBaseCurrency(portfolio)) : 0;
      const tradeRatio = metrics.netBase ? tradeBase / metrics.netBase * 100 : 0;
      const afterRatio = side === "sell" ? Math.max(0, currentRatio - tradeRatio) : currentRatio + tradeRatio;
      return { currentRatio, tradeRatio, afterRatio };
    }

    function renderRebalancePreview(modal, side, portfolio, metrics) {
      const preview = rebalanceSidePreview(modal, side, portfolio, metrics);
      const label = side === "sell" ? "本次卖出仓位" : "本次买入仓位";
      const afterLabel = side === "sell" ? "卖出后仓位" : "买入后仓位";
      return `<div class="rebalance-preview">
        <div class="rebalance-preview-item"><span>当前持仓仓位</span><strong data-rebalance-preview="${side}-current">${preview.currentRatio.toFixed(2)}%</strong></div>
        <div class="rebalance-preview-item"><span>${label}</span><strong data-rebalance-preview="${side}-trade">${preview.tradeRatio.toFixed(2)}%</strong></div>
        <div class="rebalance-preview-item"><span>${afterLabel}</span><strong data-rebalance-preview="${side}-after">${preview.afterRatio.toFixed(2)}%</strong></div>
      </div>`;
    }

    function renderRebalanceQuick(side) {
      return `<div class="rebalance-quick">${[
        ["1/5", 0.2],
        ["1/4", 0.25],
        ["1/3", 1 / 3],
        ["1/2", 0.5]
      ].map(([label, ratio]) => `<button type="button" data-rebalance-ratio-side="${side}" data-rebalance-ratio="${ratio}">${label}</button>`).join("")}</div>`;
    }

    function portfolioPriceTick(market, price = 0) {
      const value = Number(price) || 0;
      if (market === "CN") return 0.01;

    function renderVersionControl(form, locked = "") {
      const version = normalizeStockVersion(form.version);
      const mode = form.versionCustom ? "自定义" : stockVersionMode(version);
      if (mode === "自定义") {
        return `<input data-field="version" value="${escapeHtml(form.versionCustom ? (form.version || "") : version)}" placeholder="输入版本" ${locked}>`;
      }
      return `
        <select data-field="version" ${locked}>
          ${["乐观", "中性", "悲观", "自定义"].map((option) => `<option value="${option}" ${mode === option ? "selected" : ""}>${option}</option>`).join("")}
        </select>
      `;
    }

    function renderValuationAssumptions(form, currency, locked = "") {
      if (form.useSegmentValuation) return renderSegmentValuation(form, currency, locked);
      return `
        <div class="form-grid three">
          ${formField("前瞻利润", amountInput("expectedProfitCny", form.expectedProfitCny, amountCurrencyFor(form, "expectedProfitCny"), locked), { required: true, className: "input-short" })}
          ${formField("前瞻 PE", `<input class="numeric-input" type="number" step="any" data-field="expectedPE" value="${escapeHtml(form.expectedPEInput !== undefined ? form.expectedPEInput : form.expectedPE)}" required ${locked}>`, { required: true, className: "input-short" })}
          ${formField("前瞻年份", forecastYearSelect(form.forecastYear, locked), { className: "input-short" })}
        </div>
        <div class="form-grid three follow-row">
          ${formField("利润备注", `<textarea class="auto-grow-note" rows="1" data-field="expectedPERemark" ${locked}>${escapeHtml(form.expectedPERemark)}</textarea>`, { className: "input-wide span-2" })}
          ${formField("版本", renderVersionControl(form, locked), { className: "input-medium" })}
        </div>
      `;
    }

    function renderSegmentValuation(form, currency, locked = "") {
      const segments = Array.isArray(form.segmentValuations) ? form.segmentValuations : [];
      return `
        <div class="segment-valuation">
          <div class="segment-row head">
            <span>分部名</span><span>前瞻利润</span><span>前瞻 PE</span><span>前瞻年份</span><span>利润备注</span><span></span>
          </div>
          ${segments.map((segment, index) => `
            <div class="segment-row">
              <input data-segment-field="segmentName" data-segment-index="${index}" value="${escapeHtml(segment.segmentName || "")}" placeholder="分部${index + 1}" ${locked}>
              ${amountInput(`segmentProfit:${index}`, segment.expectedProfitCny, amountCurrencyFor(form, `segmentProfit:${index}`), locked)}
              <input class="numeric-input" type="number" step="any" data-segment-field="expectedPE" data-segment-index="${index}" value="${escapeHtml(segment.expectedPEInput !== undefined ? segment.expectedPEInput : segment.expectedPE)}" ${locked}>
              ${segmentForecastYearSelect(segment.forecastYear || form.forecastYear, index, locked)}
              <textarea class="auto-grow-note" rows="1" data-segment-field="expectedPERemark" data-segment-index="${index}" ${locked}>${escapeHtml(segment.expectedPERemark || "")}</textarea>
              <button class="icon segment-remove" type="button" data-action="removeSegment" data-index="${index}" title="删除分部" aria-label="删除分部" ${locked || segments.length <= 1 ? "disabled" : ""}>×</button>
            </div>
          `).join("")}
          <div class="segment-actions">
            <button type="button" data-action="addSegment" ${locked}>增加分部</button>
          </div>
          <div class="segment-total">
            ${formField("加总前瞻利润", `<div class="readonly-value"><span data-segment-total="profit">${metricMoney(form.expectedProfitCny, currency)}</span></div>`, { className: "input-short" })}
            ${formField("加总前瞻 PE", `<div class="readonly-value"><span data-segment-total="pe">${form.expectedPE ? `${trimNumber(form.expectedPE)} 倍` : "--"}</span></div>`, { className: "input-short" })}
          </div>
          <div class="segment-version">
            ${formField("版本", renderVersionControl(form, locked), { className: "input-medium" })}
          </div>
        </div>
      `;
    }

    function sectionCard(title, description, body, options = {}) {
      return `
        <section class="section-card">
          <div class="section-head">
            <h3>${escapeHtml(title)}</h3>
            ${options.titleExtra || ""}
          </div>
          ${body}
        </section>
      `;
    }

    function formField(label, control, options = {}) {
      return `
        <div class="form-field ${options.className || ""}">
          <label class="${options.required ? "required" : ""}">${escapeHtml(label)}</label>
          ${control}
          ${options.help ? `<div class="field-help">${escapeHtml(options.help)}</div>` : ""}
          ${options.error ? `<div class="inline-error">${escapeHtml(options.error)}</div>` : ""}
        </div>
      `;
    }

    function amountInput(key, cny, currency, attrs = "") {
      return `
        <div class="amount-field">
          <input class="numeric-input" type="number" step="any" data-amount="${key}" value="${escapeHtml(amountInputValueFor(state.form, key, cny, currency))}" placeholder="0.00" ${attrs}>
          <select data-amount-currency="${key}" aria-label="金额币种" ${attrs}>
            ${Object.keys(currencies).map((code) => `<option value="${code}" ${currency === code ? "selected" : ""}>亿 ${code}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function percentStepperInput(key, value, attrs = "") {
      const percent = (Number(value) || 0) * 100;
      return `
        <div class="percent-stepper">
          <button type="button" data-discount-step="-10" ${attrs}>-</button>
          <input class="numeric-input" type="text" inputmode="decimal" data-percent-field="${key}" value="${escapeHtml(formatPercentInput(percent))}" ${attrs}>
          <button type="button" data-discount-step="10" ${attrs}>+</button>
        </div>
      `;
    }

    function parsePercentInput(value) {
      const parsed = Number(String(value ?? "").replace("%", "").trim());
      return Math.min(100, Math.max(0, Number.isFinite(parsed) ? parsed : 0));
    }

    function formatPercentInput(value) {
      return `${trimNumber(parsePercentInput(value))}%`;
    }

    function field(label, key, value, type = "text") {
      return `<div class="field"><label>${label}</label><input type="${type}" data-field="${key}" value="${escapeHtml(value)}"></div>`;
    }

    function numberField(label, key, value, min = "", max = "", step = "any") {
      return `<div class="field"><label>${label}</label><input type="number" min="${min}" max="${max}" step="${step}" data-field="${key}" value="${escapeHtml(value)}"></div>`;
    }

    function amountField(label, key, cny, currency) {
      return `<div class="field"><label>${label}（${currencies[currency].unit}）</label><input type="number" step="any" data-amount="${key}" value="${escapeHtml(toDisplay(cny, currency))}"></div>`;
    }

    function selectField(label, key, value, options) {
      return `
        <div class="field">
          <label>${label}</label>
          <select data-field="${key}">
            ${options.map(([optionValue, optionLabel]) => `<option value="${optionValue}" ${value === optionValue ? "selected" : ""}>${optionLabel}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function textareaField(label, key, value) {
      return `<div class="field"><label>${label}</label><textarea data-field="${key}">${escapeHtml(value)}</textarea></div>`;
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><span>${label}</span><strong class="${cls}">${value}</strong></div>`;
    }

    function resultItem(label, value) {
      const text = value && value !== "--" ? value : "—";
      const cls = String(text).startsWith("-") ? "loss" : String(text).includes("%") && text !== "—" ? "gain" : "";
      return `<div class="result-metric"><strong>${label}</strong><span class="${cls}">${text}</span></div>`;
    }

    function forecastYearSelect(value, attrs = "") {
      const years = ["2025A"];
      for (let year = 2026; year <= 2035; year += 1) years.push(`${year}E`);
      if (value && !years.includes(value)) years.unshift(value);
      return `
        <select data-field="forecastYear" ${attrs}>
          ${years.map((year) => `<option value="${year}" ${value === year ? "selected" : ""}>${year}</option>`).join("")}
        </select>
      `;
    }

    function segmentForecastYearSelect(value, index, attrs = "") {
      const years = ["2025A"];
      for (let year = 2026; year <= 2035; year += 1) years.push(`${year}E`);
      if (value && !years.includes(value)) years.unshift(value);
      return `
        <select data-segment-field="forecastYear" data-segment-index="${index}" ${attrs}>
          ${years.map((year) => `<option value="${year}" ${value === year ? "selected" : ""}>${year}</option>`).join("")}
        </select>
      `;
    }

    function bindEvents() {
      document.getElementById("app").onclick = (event) => {
        if (state.themeMenuOpen && !event.target.closest(".theme-dock")) {
          state.themeMenuOpen = false;
          document.querySelector(".theme-dock")?.classList.remove("open");
          document.querySelector(".theme-orb")?.setAttribute("aria-expanded", "false");
        }
        const actionEl = event.target.closest("[data-action]");
        if (actionEl) onAction({ currentTarget: actionEl });
      };
      document.querySelectorAll("[data-filter]").forEach((el) => {
        el.addEventListener("click", () => { state.filter = el.dataset.filter; render(); });
      });
      document.querySelectorAll("[data-sort]").forEach((el) => {
        el.addEventListener("click", () => toggleSort(el.dataset.sort));
      });
      bindRowDragEvents();
      const stockConnectTax = document.querySelector("[data-input='stockConnectTax']");
      if (stockConnectTax) {
        stockConnectTax.addEventListener("click", (event) => event.stopPropagation());
        stockConnectTax.addEventListener("change", (event) => {
          state.stockConnectDividendTax = event.target.checked;
          render();
        });
      }
      document.querySelectorAll("[data-field]").forEach((el) => {
        el.addEventListener("input", () => {
          updateFormField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
          if (el.matches("textarea.auto-grow-note")) autoGrowTextarea(el);
        });
        el.addEventListener("change", () => updateFormField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value));
      });
      document.querySelectorAll("textarea.auto-grow-note").forEach(autoGrowTextarea);
      document.querySelectorAll("[data-amount]").forEach((el) => {
        el.addEventListener("input", () => updateAmountField(el.dataset.amount, el.value));
      });
      document.querySelectorAll("[data-amount-currency]").forEach((el) => {
        el.addEventListener("change", () => updateAmountCurrency(el.dataset.amountCurrency, el.value));
      });
      document.querySelectorAll("[data-segment-field]").forEach((el) => {
        el.addEventListener("input", () => {
          updateSegmentField(Number(el.dataset.segmentIndex), el.dataset.segmentField, el.value);
          if (el.matches("textarea.auto-grow-note")) autoGrowTextarea(el);
        });
        el.addEventListener("change", () => updateSegmentField(Number(el.dataset.segmentIndex), el.dataset.segmentField, el.value));
      });
      document.querySelectorAll("[data-percent-field]").forEach((el) => {
        el.addEventListener("input", () => updatePercentField(el.dataset.percentField, el.value));
        el.addEventListener("change", () => {
          updatePercentField(el.dataset.percentField, el.value);
          el.value = formatPercentInput((Number(state.form?.[el.dataset.percentField]) || 0) * 100);
        });
      });
      document.querySelectorAll("[data-discount-step]").forEach((el) => {
        el.addEventListener("click", () => stepDiscountField(Number(el.dataset.discountStep)));
      });
      const loginForm = document.querySelector("[data-form='login']");
      if (loginForm) loginForm.addEventListener("submit", onLogin);
      const profileForm = document.querySelector("[data-form='profile']");
      if (profileForm) profileForm.addEventListener("submit", onProfileSubmit);
      const listSearch = document.querySelector("[data-input='searchList']");
      if (listSearch) {
        const applyListSearch = (input) => {
          state.query = input.value;
          const selectionStart = input.selectionStart;
          const selectionEnd = input.selectionEnd;
          render();
          const nextInput = document.querySelector("[data-input='searchList']");
          if (!nextInput) return;
          nextInput.focus({ preventScroll: true });
          if (Number.isInteger(selectionStart) && Number.isInteger(selectionEnd)) nextInput.setSelectionRange(selectionStart, selectionEnd);
        };
        listSearch.addEventListener("compositionstart", () => { listSearch.dataset.composing = "true"; });
        listSearch.addEventListener("compositionend", (event) => {
          delete event.currentTarget.dataset.composing;
          applyListSearch(event.currentTarget);
        });
        listSearch.addEventListener("input", (event) => {
          const input = event.currentTarget;
          state.query = input.value;
          if (event.isComposing || input.dataset.composing === "true") return;
          applyListSearch(input);
        });
      }
      const viewPublisher = document.querySelector("[data-input='viewPublisher']");
      if (viewPublisher) viewPublisher.addEventListener("change", async (event) => {
        state.viewPublisherId = event.target.value;
        state.query = "";
        if (state.viewPublisherId === "own") {
          openOwnPool();
          return;
        } else {
          state.tableLoading = true;
          render();
          await loadPublisherStocks(state.viewPublisherId);
          state.tableLoading = false;
        }
        render();
      });
      const shareVisibilityToggle = document.querySelector("[data-input='shareVisibilityToggle']");
      if (shareVisibilityToggle) {
        shareVisibilityToggle.addEventListener("change", (event) => {
          updateShareVisibility(event.target.checked ? "public" : "private");
        });
      }
      const squareSort = document.querySelector("[data-input='squareSort']");
      if (squareSort) squareSort.addEventListener("change", (event) => { state.squareSort = event.target.value; render(); });

        state.benchmarkHistory = benchmarkRows || [];

      return `${PORTFOLIO_STORAGE_PREFIX}${state.session?.user?.id || "guest"}`;

    function normalizePortfolioPositionIds(portfolios) {
      let changed = false;
      const seenIds = new Set();
      const normalized = (portfolios || []).map((portfolio) => ({
        ...portfolio,
        positions: (portfolio.positions || []).map((position) => {
          const currentId = typeof position.id === "string" ? position.id.trim() : "";
          if (currentId && !seenIds.has(currentId)) {
            seenIds.add(currentId);
            return position;
          }
          const positionId = id("position");
          seenIds.add(positionId);
          changed = true;
          return { ...position, id: positionId };
        })
      }));
      return { portfolios: normalized, changed };
    }

    async function loadPortfolios() {
      const saved = readJson(portfolioStorageKey(), { portfolios: [], activePortfolioId: "" });
      state.portfolios = Array.isArray(saved?.portfolios) ? saved.portfolios : [];
      state.activePortfolioId = saved?.activePortfolioId || state.portfolios[0]?.id || "";
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        try {
          const rows = await supabaseRequest(`/rest/v1/portfolios?user_id=eq.${encodeURIComponent(state.session.user.id)}&select=id,payload&order=created_at.asc`);
          const cloudPortfolios = (rows || []).map((row) => ({ ...(row.payload || {}), id: row.id }));
          if (cloudPortfolios.length) {
            state.portfolios = cloudPortfolios;
          } else if (state.portfolios.length) {
            await persistPortfoliosToCloud(state.portfolios);
          }
        } catch (error) {
          console.warn("组合云端表尚未就绪，暂时使用本地数据。", error);
        }
      }
      const normalized = normalizePortfolioPositionIds(state.portfolios);
      state.portfolios = normalized.portfolios;
      if (state.activePortfolioId && !state.portfolios.some((item) => item.id === state.activePortfolioId)) {
        state.activePortfolioId = state.portfolios[0]?.id || "";
      }
      if (!state.activePortfolioId) state.activePortfolioId = state.portfolios[0]?.id || "";
      writeJson(portfolioStorageKey(), { portfolios: state.portfolios, activePortfolioId: state.activePortfolioId });
      if (normalized.changed && state.session?.access_token && state.session.access_token !== "local-demo") {
        persistPortfoliosToCloud(state.portfolios).catch((error) => console.warn("旧持仓标识修复同步失败。", error));
      }
    }

      if (!newTag) {
        const input = event.currentTarget.querySelector('input[name="tagName"]');
        input?.setCustomValidity("请输入标签名。");
        input?.reportValidity();
        return;
      }
      if (!Number.isFinite(targetWeight) || targetWeight < 0 || targetWeight > 100) return showPortfolioError("目标仓位请输入 0 到 100 之间的百分比。");
      const now = new Date().toISOString();
      updateActivePortfolio((item) => {
        const tagTargets = { ...(item.tagTargets || {}) };
        if (oldTag !== newTag) delete tagTargets[oldTag];
        if (targetWeight > 0) tagTargets[newTag] = targetWeight;
        else delete tagTargets[newTag];
        return {
          ...item,
          tagTargets,
          positions: (item.positions || []).map((position) => ({
            ...position,
            tags: [...new Set((position.tags || []).map((tag) => tag === oldTag ? newTag : tag))]
          })),
          updatedAt: now
        };
      });
      if (state.portfolioTagFilter === oldTag) state.portfolioTagFilter = newTag;
      closePortfolioModal();
    }

    async function persistPortfoliosToCloud(portfolios) {
      if (!portfolios?.length) return;
      await supabaseRequest("/rest/v1/portfolios?on_conflict=id", {
        method: "POST",
        prefer: "resolution=merge-duplicates",
        body: JSON.stringify(portfolios.map((portfolio) => ({
          id: portfolio.id,
          user_id: state.session.user.id,
          name: portfolio.name,
          payload: { ...portfolio, id: undefined },
          updated_at: new Date().toISOString()
        })))
      });
    }

    function updateActivePortfolio(updater) {
      state.portfolios = state.portfolios.map((item) => item.id === state.activePortfolioId ? updater({ ...item, cash: { ...(item.cash || {}) }, positions: [...(item.positions || [])] }) : item);
      savePortfolios();
    }

    function deleteActivePortfolio() {
      const portfolio = activePortfolio();
      if (!portfolio) return;
      const index = state.portfolios.findIndex((item) => item.id === portfolio.id);
      state.portfolios = state.portfolios.filter((item) => item.id !== portfolio.id);
      state.activePortfolioId = state.portfolios[index]?.id || state.portfolios[index - 1]?.id || state.portfolios[0]?.id || "";
      state.portfolioModal = null;
      savePortfolios();
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        supabaseRequest(`/rest/v1/portfolios?id=eq.${encodeURIComponent(portfolio.id)}`, { method: "DELETE" })
          .catch((error) => console.warn("组合云端删除失败。", error));
      }
      render();
    }

    function openPortfolioTagModal(tag) {
      const portfolio = activePortfolio();
      if (!portfolio || !(portfolio.positions || []).some((position) => (position.tags || []).includes(tag))) return;
      state.portfolioError = "";
      state.portfolioModal = { type: "tag", tag, targetWeight: portfolioTagTargetWeight(portfolio, tag) };
      render();
      const input = document.querySelector('[data-form="portfolioTag"] input[name="tagName"]');
      input?.focus();
      input?.select();
    }

    function openPortfolioModal(type, positionId = "", positionKey = "") {
      const portfolio = activePortfolio();
      const position = findPortfolioPosition(portfolio, positionId, positionKey);
      state.portfolioError = "";
      state.portfolioSearchResults = [];
      state.portfolioSearchLoading = false;
      state.portfolioSearchComposing = false;
      state.portfolioModal = type === "initialize"
        ? (() => {
          const imported = positionId ? state.portfolios.find((item) => item.id === positionId) : null;
          if (!imported) return { type, portfolioId: "", name: "", accountType: "CNY", startCny: "", startHkd: "", startUsd: "", cashCny: "", cashHkd: "", cashUsd: "", rows: [initializationRow()] };
          return {
            type, portfolioId: imported.id, name: imported.name, accountType: imported.accountType,
            startCny: Number(imported.startCny || 0) / 10000, startHkd: Number(imported.startHkd || 0) / 10000, startUsd: Number(imported.startUsd || 0) / 10000,
            cashCny: Number(imported.cash?.CNY || 0) / 10000, cashHkd: Number(imported.cash?.HKD || 0) / 10000, cashUsd: Number(imported.cash?.USD || 0) / 10000,
            rows: (imported.positions || []).length ? imported.positions.map((item) => ({
              id: id("initrow"), query: `${item.name} ${item.code}`, stock: { ...item }, shares: String(item.shares || ""), averageCost: String(item.averageCost || ""), results: [], loading: false
            })) : [initializationRow()]
          };
        })()
        : type === "rebalance"
        ? { type, searchSide: "sell", sellStock: null, buyStock: null, sellQuery: "", buyQuery: "", sellPrice: "", buyPrice: "", sellShares: "", buyShares: "", lastEditedSide: "" }
        : { type, position, stock: null, searchQuery: "", tags: [...(position?.tags || [])] };
      render();
    }

    function closePortfolioModal() {
      const pageScroll = { x: window.scrollX, y: window.scrollY };
      const currentTableScroll = document.querySelector(".portfolio-table .table-scroll");
      const tableScroll = currentTableScroll
        ? { left: currentTableScroll.scrollLeft, top: currentTableScroll.scrollTop }
        : null;
      if (portfolioInitializationSearchTimer) window.clearTimeout(portfolioInitializationSearchTimer);
      portfolioInitializationSearchRequestId += 1;
      state.portfolioModal = null;
      state.portfolioError = "";
      state.portfolioSearchResults = [];
      render();
      const restoreScroll = () => {
        window.scrollTo(pageScroll.x, pageScroll.y);
        const nextTableScroll = document.querySelector(".portfolio-table .table-scroll");
        if (nextTableScroll && tableScroll) {
          nextTableScroll.scrollLeft = tableScroll.left;
          nextTableScroll.scrollTop = tableScroll.top;
        }
      };
      restoreScroll();
      window.requestAnimationFrame(() => window.requestAnimationFrame(restoreScroll));
    }

    function addInitializationRow() {
      if (state.portfolioModal?.type !== "initialize") return;
      state.portfolioModal.rows.push(initializationRow());
      render();
    }

    function removeInitializationRow(rowId) {
      if (state.portfolioModal?.type !== "initialize") return;
      state.portfolioModal.rows = state.portfolioModal.rows.filter((row) => row.id !== rowId);
      if (!state.portfolioModal.rows.length) state.portfolioModal.rows.push(initializationRow());
      render();
    }

    function clearInitializationStock(rowId) {
      const row = state.portfolioModal?.rows?.find((item) => item.id === rowId);
      if (!row) return;
      row.stock = null;
      row.query = "";
      row.results = [];
      const host = document.querySelector(`[data-initialization-stock='${rowId}']`);
      if (!host) return;
      host.innerHTML = `<span>股票</span><input data-input="initializationStockSearch" data-row-id="${rowId}" value="" placeholder="搜索股票名称或代码" autocomplete="off"><div data-initialization-results="${rowId}"></div>`;
      const input = host.querySelector("[data-input='initializationStockSearch']");
      input?.addEventListener("input", onInitializationStockSearch);
      input?.focus({ preventScroll: true });
    }

    function onInitializationStockSearch(event) {
      const rowId = event.target.dataset.rowId;
      const query = event.target.value.trim();
      const row = state.portfolioModal?.rows?.find((item) => item.id === rowId);
      if (!row) return;
      row.query = event.target.value;
      row.stock = null;
      row.results = [];
      row.loading = Boolean(query);
      if (portfolioInitializationSearchTimer) window.clearTimeout(portfolioInitializationSearchTimer);
      const requestId = ++portfolioInitializationSearchRequestId;
      updateInitializationSearchResults(rowId);
      if (!query) { row.loading = false; updateInitializationSearchResults(rowId); return; }
      portfolioInitializationSearchTimer = window.setTimeout(async () => {
        try {
          const results = await searchStocks(query);
          if (requestId !== portfolioInitializationSearchRequestId || row.query.trim() !== query) return;
          row.results = results.slice(0, 8);
        } finally {
          if (requestId === portfolioInitializationSearchRequestId) row.loading = false;
        }
        updateInitializationSearchResults(rowId);
      }, 180);
    }

    function updateInitializationSearchResults(rowId) {
      const row = state.portfolioModal?.rows?.find((item) => item.id === rowId);
      const host = document.querySelector(`[data-initialization-results='${rowId}']`);
      if (!row || !host) return;
      host.innerHTML = initializationResultsMarkup(row);
    }

    function selectInitializationStock(rowId, index) {
      const row = state.portfolioModal?.rows?.find((item) => item.id === rowId);
      const stock = row?.results?.[index];
      if (!row || !stock) return;
      row.stock = stock;
      row.query = `${stock.name} ${stock.code}`;
      row.results = [];
      row.loading = false;
      const host = document.querySelector(`[data-initialization-stock='${rowId}']`);
      if (host) host.innerHTML = `<span>股票</span><div class="portfolio-initialize-selected"><div><strong>${escapeHtml(stock.name)}</strong><small>${escapeHtml(stock.code)}</small></div><button type="button" data-action="clearInitializationStock" data-row-id="${row.id}">更换</button></div>`;
    }

    async function onPortfolioStockSearch(event) {
      const query = event.target.value.trim();
      const side = event.target.dataset.side || "";
      const modal = state.portfolioModal;
      if (!modal || (modal.type !== "open" && modal.type !== "rebalance")) return;
      if (modal.type === "rebalance") {
        const safeSide = side === "buy" ? "buy" : "sell";
        state.portfolioModal.searchSide = safeSide;
        state.portfolioModal[`${safeSide}Query`] = query;
        state.portfolioModal[`${safeSide}Stock`] = null;
        state.portfolioModal[`${safeSide}Price`] = "";
      } else {
        state.portfolioModal.searchQuery = query;
        state.portfolioModal.stock = null;
      }
      state.portfolioSearchResults = [];
      if (!query) {
        state.portfolioSearchLoading = false;
        render();
        return;
      }
      state.portfolioSearchLoading = true;
      const expectedQuery = query;
      render();
      try {
        const results = await searchStocks(query);
        if (state.portfolioModal?.type === "rebalance") {
          const safeSide = side === "buy" ? "buy" : "sell";
          if (state.portfolioModal?.[`${safeSide}Query`] !== expectedQuery || state.portfolioModal?.searchSide !== safeSide) return;
        } else if (state.portfolioModal?.searchQuery !== expectedQuery) return;
        state.portfolioSearchResults = results;
      } finally {
        if (state.portfolioModal?.type === "rebalance") {
          const safeSide = side === "buy" ? "buy" : "sell";
          if (state.portfolioModal?.[`${safeSide}Query`] === expectedQuery) state.portfolioSearchLoading = false;
        } else if (state.portfolioModal?.searchQuery === expectedQuery) state.portfolioSearchLoading = false;
      }
      render();
      requestAnimationFrame(() => {
        const selector = state.portfolioModal?.type === "rebalance" ? `[data-input='portfolioStockSearch'][data-side='${side === "buy" ? "buy" : "sell"}']` : "[data-input='portfolioStockSearch']";
        const input = document.querySelector(selector);
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      });
    }

    async function selectPortfolioStock(index, side = "") {
      const selected = state.portfolioSearchResults[index];
      if (!selected || !state.portfolioModal) return;
      state.portfolioSearchLoading = true;
      state.portfolioError = "";
      render();
      let quote = selected;
      try { quote = await fetchQuote(selected); } catch (error) { console.warn("开仓行情读取失败，使用录入价格。", error); }
      if (state.portfolioModal.type === "rebalance") {
        const safeSide = side === "buy" ? "buy" : "sell";
        const stock = { ...selected, ...quote };
        state.portfolioModal = {
          ...state.portfolioModal,
          searchSide: safeSide,
          [`${safeSide}Stock`]: stock,
          [`${safeSide}Query`]: `${selected.name} ${selected.code}`,
          [`${safeSide}Price`]: Number(stock.latestPrice) || ""
        };
      } else {
        state.portfolioModal = { ...state.portfolioModal, stock: { ...selected, ...quote }, searchQuery: `${selected.name} ${selected.code}` };
      }
      state.portfolioSearchResults = [];
      state.portfolioSearchLoading = false;
      render();
    }

    function submitCreatePortfolio(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const name = String(form.get("name") || "").trim();
      const accountType = String(form.get("accountType") || "CNY");
      const startCny = Number(form.get("startCny") || 0) * 10000;
      const startHkd = Number(form.get("startHkd") || 0) * 10000;
      const startUsd = Number(form.get("startUsd") || 0) * 10000;
      if (!name) return showPortfolioError("请输入组合名称。");
      if (state.portfolios.some((item) => item.id !== modal.portfolioId && item.name.trim().toLowerCase() === name.toLowerCase())) return showPortfolioError("组合名称不能重复。");
      if ([startCny, startHkd, startUsd].some((value) => !Number.isFinite(value) || value < 0)) return showPortfolioError("启动金额不能小于 0。");
      const startBase = accountType === "HKUS" ? startUsd + startHkd * portfolioFx("HKD", "USD") : startCny;
      if (startBase <= 0) return showPortfolioError("组合启动金额必须大于 0。");
      const existing = modal.portfolioId ? state.portfolios.find((item) => item.id === modal.portfolioId) : null;
      const portfolio = {
        ...(existing || {}), id: existing?.id || id("portfolio"), name, accountType,
        startCny: accountType === "CNY" ? startCny : 0,
        startHkd: accountType === "HKUS" ? startHkd : 0,
        startUsd: accountType === "HKUS" ? startUsd : 0,
        startBase,
        totalUnits: startBase,
        cash: accountType === "HKUS" ? { CNY: 0, HKD: startHkd, USD: startUsd } : { CNY: startCny, HKD: 0, USD: 0 },
        positions: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      state.portfolios.push(portfolio);
      state.activePortfolioId = portfolio.id;
      savePortfolios();
      closePortfolioModal();
    }

    async function submitInitializePortfolio(event) {
      event.preventDefault();
      const modal = state.portfolioModal;
      if (modal?.type !== "initialize") return;
      const existing = modal.portfolioId ? state.portfolios.find((item) => item.id === modal.portfolioId) : null;
      const name = String(modal.name || "").trim();
      const accountType = modal.accountType === "HKUS" ? "HKUS" : "CNY";
      const amounts = ["startCny", "startHkd", "startUsd", "cashCny", "cashHkd", "cashUsd"].reduce((result, key) => ({ ...result, [key]: Number(modal[key] || 0) * 10000 }), {});
      if (!name) return showPortfolioError("请输入组合名称。");
      if (state.portfolios.some((item) => item.id !== modal.portfolioId && item.name.trim().toLowerCase() === name.toLowerCase())) return showPortfolioError("组合名称不能重复。");
      if (Object.values(amounts).some((value) => !Number.isFinite(value) || value < 0)) return showPortfolioError("启动金额和现金不能小于 0。");
      const startBase = accountType === "HKUS" ? amounts.startUsd + amounts.startHkd * portfolioFx("HKD", "USD") : amounts.startCny;
      if (startBase <= 0) return showPortfolioError("组合启动金额必须大于 0。");
      const completedRows = (modal.rows || []).filter((row) => row.stock || row.shares || row.averageCost);
      for (const row of completedRows) {
        if (!row.stock) return showPortfolioError("请为每一行持仓选择股票。");
        if (!(Number(row.shares) > 0)) return showPortfolioError(`${row.stock.name} 的持股数必须大于 0。`);
        if (!(Number(row.averageCost) > 0)) return showPortfolioError(`${row.stock.name} 的摊薄成本必须大于 0。`);
        if (accountType === "CNY" && !["CN", "HK"].includes(row.stock.market)) return showPortfolioError("人民币账户只能导入 A 股或港股通股票。");
        if (accountType === "HKUS" && !["HK", "US"].includes(row.stock.market)) return showPortfolioError("港美账户只能导入港股或美股。");
      }
      const duplicate = completedRows.find((row, index) => completedRows.findIndex((other) => other.stock.code === row.stock.code && other.stock.market === row.stock.market) !== index);
      if (duplicate) return showPortfolioError(`${duplicate.stock.name} 重复录入，请合并为一行。`);
      state.portfolioError = "";
      const now = new Date().toISOString();
      const positions = await Promise.all(completedRows.map(async (row) => {
        let quote = row.stock;
        try { quote = { ...row.stock, ...(await fetchQuote(row.stock)) }; } catch (error) { console.warn("初始化行情读取失败，暂以摊薄成本计算。", error); }
        const existingPosition = existing?.positions?.find((item) => item.code === row.stock.code && item.market === row.stock.market);
        return {
          ...(existingPosition || {}), id: existingPosition?.id || id("position"), name: row.stock.name, code: row.stock.code, rawCode: row.stock.rawCode || row.stock.code,
          market: row.stock.market, exchange: row.stock.exchange, quoteId: row.stock.quoteId,
          currency: row.stock.currency || marketCurrency(row.stock.market), shares: Number(row.shares), averageCost: Number(row.averageCost),
          latestPrice: Number(quote.latestPrice) || Number(row.averageCost), previousClose: Number(quote.previousClose) || 0,
          changePercent: Number.isFinite(Number(quote.changePercent)) ? Number(quote.changePercent) : null,
          targetWeight: Number(existingPosition?.targetWeight || 0), priceUpdatedAt: now, createdAt: existingPosition?.createdAt || now, updatedAt: now
        };
      }));
      const portfolio = {
        ...(existing || {}), id: existing?.id || id("portfolio"), name, accountType,
        startCny: accountType === "CNY" ? amounts.startCny : 0,
        startHkd: accountType === "HKUS" ? amounts.startHkd : 0,
        startUsd: accountType === "HKUS" ? amounts.startUsd : 0,
        startBase, totalUnits: startBase,
        cash: accountType === "HKUS" ? { CNY: 0, HKD: amounts.cashHkd, USD: amounts.cashUsd } : { CNY: amounts.cashCny, HKD: 0, USD: 0 },
        positions, tradeHistory: existing?.tradeHistory || [], cashFlows: existing?.cashFlows || [], initializationMethod: "import", initializedAt: now, createdAt: existing?.createdAt || now, updatedAt: now
      };
      if (existing) state.portfolios = state.portfolios.map((item) => item.id === existing.id ? portfolio : item);
      else state.portfolios.push(portfolio);
      state.activePortfolioId = portfolio.id;
      savePortfolios();
      closePortfolioModal();
    }

    function submitRenamePortfolio(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      if (!portfolio || state.portfolioModal?.type !== "rename") return;
      const form = new FormData(event.currentTarget);
      const name = String(form.get("name") || "").trim();
      if (!name) return showPortfolioError("请输入组合名称。");
      if (state.portfolios.some((item) => item.id !== portfolio.id && item.name.trim().toLowerCase() === name.toLowerCase())) return showPortfolioError("组合名称不能重复。");
      updateActivePortfolio((item) => ({ ...item, name, updatedAt: new Date().toISOString() }));
      closePortfolioModal();
    }

    function submitDeletePortfolio(event) {
      event.preventDefault();
      const modal = state.portfolioModal;
      if (modal?.type !== "delete") return;
      const form = new FormData(event.currentTarget);
      if (String(form.get("confirmCode") || "").trim() !== "0000") return showPortfolioError("请输入四个 0 后再确认删除。");
      deleteActivePortfolio();
    }

    function submitCalibrateCash(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      if (!portfolio) return;
      const form = new FormData(event.currentTarget);
      const next = portfolio.accountType === "HKUS"
        ? { HKD: parseCashAmount(form.get("cashHkd")), USD: parseCashAmount(form.get("cashUsd")) }
        : { CNY: parseCashAmount(form.get("cashCny")) };
      if (Object.values(next).some((value) => !Number.isFinite(value) || value < 0)) return showPortfolioError("现金余额不能小于 0。");
      updateActivePortfolio((item) => ({ ...item, cash: { ...item.cash, ...next }, updatedAt: new Date().toISOString() }));
      closePortfolioModal();
    }

    function submitPortfolioCashFlow(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || !["subscription", "redemption"].includes(modal?.type)) return;
      const form = new FormData(event.currentTarget);
      const currency = String(form.get("currency") || portfolioBaseCurrency(portfolio));
      const amount = Number(form.get("amount")) * 10000;
      if (!Number.isFinite(amount) || amount <= 0) return showPortfolioError("请输入有效金额。");
      const metrics = portfolioMetrics(portfolio);
      if (metrics.nav <= 0) return showPortfolioError("当前净值无效，无法计算份额。");
      if (modal.type === "redemption" && Number(portfolio.cash?.[currency] || 0) < amount) return showPortfolioError(`${currencies[currency].label}现金余额不足。`);
      const baseAmount = amount * portfolioFx(currency, portfolioBaseCurrency(portfolio));
      const unitsChanged = baseAmount / metrics.nav;
      const oldUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      if (modal.type === "redemption" && unitsChanged >= oldUnits) return showPortfolioError("赎回份额必须小于当前总份额。");
      updateActivePortfolio((item) => ({
        ...item,
        totalUnits: oldUnits + (modal.type === "subscription" ? unitsChanged : -unitsChanged),
        cash: { ...item.cash, [currency]: Number(item.cash?.[currency] || 0) + (modal.type === "subscription" ? amount : -amount) },
        cashFlows: [...(item.cashFlows || []), { id: id("flow"), type: modal.type, currency, amount, navBefore: metrics.nav, unitsChanged, occurredAt: new Date().toISOString() }],
        updatedAt: new Date().toISOString()
      }));
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        supabaseRequest("/rest/v1/portfolio_cash_flows", { method: "POST", body: JSON.stringify({
          portfolio_id: portfolio.id, user_id: state.session.user.id, flow_type: modal.type,
          currency, amount, nav_before: metrics.nav, units_changed: unitsChanged
        }) }).catch((error) => console.warn("申购赎回流水保存失败。", error));
      }
      closePortfolioModal();
    }

    function rebalanceCashCurrency(portfolio, currency) {
      return portfolio.accountType === "CNY" ? "CNY" : currency;
    }

    function rebalanceBasePerShare(stock, price, portfolio) {
      const currency = stock?.currency || marketCurrency(stock?.market);
      return Number(price || 0) * portfolioFx(currency, portfolioBaseCurrency(portfolio));
    }

    function updateRebalancePreviewDom() {
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || modal?.type !== "rebalance") return;
      const metrics = portfolioMetrics(portfolio);
      ["sell", "buy"].forEach((side) => {
        const stock = modal[`${side}Stock`];
        const priceInput = document.querySelector(`[data-rebalance-price='${side}']`);
        const sharesInput = document.querySelector(`[data-rebalance-shares='${side}']`);
        const price = Number(priceInput?.value || 0);
        const shares = Number(sharesInput?.value || 0);
        const position = rebalanceCurrentPosition(stock, portfolio);
        const currentRatio = position && metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase * 100 : 0;
        const tradeBase = price > 0 && shares > 0 ? price * shares * portfolioFx(stock?.currency || marketCurrency(stock?.market), portfolioBaseCurrency(portfolio)) : 0;
        const tradeRatio = metrics.netBase ? tradeBase / metrics.netBase * 100 : 0;
        const afterRatio = side === "sell" ? Math.max(0, currentRatio - tradeRatio) : currentRatio + tradeRatio;
        const currentNode = document.querySelector(`[data-rebalance-preview='${side}-current']`);
        const tradeNode = document.querySelector(`[data-rebalance-preview='${side}-trade']`);
        const afterNode = document.querySelector(`[data-rebalance-preview='${side}-after']`);
        if (currentNode) currentNode.textContent = `${currentRatio.toFixed(2)}%`;
        if (tradeNode) tradeNode.textContent = `${tradeRatio.toFixed(2)}%`;
        if (afterNode) afterNode.textContent = `${afterRatio.toFixed(2)}%`;
      });
    }

    function applyRebalanceRatio(side, ratio) {
      const modal = state.portfolioModal;
      const portfolio = activePortfolio();
      if (!portfolio || modal?.type !== "rebalance" || !["sell", "buy"].includes(side) || !Number.isFinite(ratio) || ratio <= 0) return;
      const input = document.querySelector(`[data-rebalance-shares='${side}']`);
      if (!input) return;
      const stock = modal[`${side}Stock`];
      const position = rebalanceCurrentPosition(stock, portfolio);
      let shares = position ? Math.floor(Number(position.shares || 0) * ratio) : 0;
      if (side === "buy" && !shares) {
        const sellStock = modal.sellStock;
        const buyStock = modal.buyStock;
        const sellPrice = Number(document.querySelector("[data-rebalance-price='sell']")?.value || 0);
        const buyPrice = Number(document.querySelector("[data-rebalance-price='buy']")?.value || 0);
        const sellPosition = rebalanceCurrentPosition(sellStock, portfolio);
        if (sellStock && buyStock && sellPosition && sellPrice > 0 && buyPrice > 0) {
          const sellShares = Math.floor(Number(sellPosition.shares || 0) * ratio);
          const sourceBase = rebalanceBasePerShare(sellStock, sellPrice, portfolio) * sellShares;
          const buyPerShare = rebalanceBasePerShare(buyStock, buyPrice, portfolio);
          shares = buyPerShare > 0 ? Math.floor(sourceBase / buyPerShare) : 0;
        }
      }
      input.value = shares > 0 ? String(shares) : "";
      modal[`${side}Shares`] = input.value;
      modal.lastEditedSide = side;
      onRebalanceInput(side, "shares");
    }

    function onRebalanceInput(side, field) {
      const modal = state.portfolioModal;
      const portfolio = activePortfolio();
      if (!portfolio || modal?.type !== "rebalance" || !["sell", "buy"].includes(side)) return;
      const priceInput = document.querySelector(`[data-rebalance-price='${side}']`);
      const sharesInput = document.querySelector(`[data-rebalance-shares='${side}']`);
      modal[`${side}Price`] = priceInput?.value || "";
      modal[`${side}Shares`] = sharesInput?.value || "";
      if (field === "shares") modal.lastEditedSide = side;
      const sourceSide = modal.lastEditedSide || side;
      const targetSide = sourceSide === "sell" ? "buy" : "sell";
      const sourceStock = modal[`${sourceSide}Stock`];
      const targetStock = modal[`${targetSide}Stock`];
      const sourcePrice = Number(document.querySelector(`[data-rebalance-price='${sourceSide}']`)?.value || 0);
      const targetPrice = Number(document.querySelector(`[data-rebalance-price='${targetSide}']`)?.value || 0);
      const sourceShares = Number(document.querySelector(`[data-rebalance-shares='${sourceSide}']`)?.value || 0);
      const targetSharesInput = document.querySelector(`[data-rebalance-shares='${targetSide}']`);
      if (sourceStock && targetStock && sourcePrice > 0 && targetPrice > 0 && sourceShares > 0 && targetSharesInput) {
        const sourceBase = rebalanceBasePerShare(sourceStock, sourcePrice, portfolio) * sourceShares;
        const targetPerShare = rebalanceBasePerShare(targetStock, targetPrice, portfolio);
        const nextShares = targetPerShare > 0
          ? (sourceSide === "sell" ? Math.floor(sourceBase / targetPerShare) : Math.ceil(sourceBase / targetPerShare))
          : 0;
        targetSharesInput.value = nextShares > 0 ? String(nextShares) : "";
        modal[`${targetSide}Shares`] = targetSharesInput.value;
      }
      updateRebalancePreviewDom();
    }

    function validatePortfolioStockForAccount(portfolio, stock, label) {
      if (portfolio.accountType === "CNY" && !["CN", "HK"].includes(stock.market)) return `${label}股票不符合人民币账户可交易市场。`;
      if (portfolio.accountType === "HKUS" && !["HK", "US"].includes(stock.market)) return `${label}股票不符合港美账户可交易市场。`;
      return "";
    }

    function submitRebalanceTrade(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || modal?.type !== "rebalance") return;
      const form = new FormData(event.currentTarget);
      const sellStock = modal.sellStock;
      const buyStock = modal.buyStock;
      if (!sellStock) return showPortfolioError("请先选择卖出股票。");
      if (!buyStock) return showPortfolioError("请先选择买入股票。");
      if (sellStock.code === buyStock.code && sellStock.market === buyStock.market) return showPortfolioError("调仓买入和卖出不能是同一只股票。");
      const marketError = validatePortfolioStockForAccount(portfolio, sellStock, "卖出") || validatePortfolioStockForAccount(portfolio, buyStock, "买入");
      if (marketError) return showPortfolioError(marketError);
      const sellPosition = rebalanceCurrentPosition(sellStock, portfolio);
      if (!sellPosition) return showPortfolioError("卖出股票必须是当前持仓。");
      const sellPrice = Number(form.get("sellPrice"));
      const buyPrice = Number(form.get("buyPrice"));
      const sellShares = Number(form.get("sellShares"));
      const buyShares = Number(form.get("buyShares"));
      if (!Number.isFinite(sellPrice) || sellPrice <= 0 || !Number.isFinite(buyPrice) || buyPrice <= 0) return showPortfolioError("请输入有效的卖出价格和买入价格。");
      if (!Number.isInteger(sellShares) || sellShares <= 0 || !Number.isInteger(buyShares) || buyShares <= 0) return showPortfolioError("卖出数量和买入数量必须为正整数。");
      if (sellShares > Number(sellPosition.shares)) return showPortfolioError("卖出数量不能超过当前持股数。");
      const sellCurrency = sellStock.currency || sellPosition.currency || marketCurrency(sellStock.market);
      const buyCurrency = buyStock.currency || marketCurrency(buyStock.market);
      const sellCashCurrency = rebalanceCashCurrency(portfolio, sellCurrency);
      const buyCashCurrency = rebalanceCashCurrency(portfolio, buyCurrency);
      const sellCashAmount = sellPrice * sellShares * portfolioFx(sellCurrency, sellCashCurrency);
      const buyCashAmount = buyPrice * buyShares * portfolioFx(buyCurrency, buyCashCurrency);
      const cashDeltas = { [sellCashCurrency]: sellCashAmount };
      cashDeltas[buyCashCurrency] = Number(cashDeltas[buyCashCurrency] || 0) - buyCashAmount;
      for (const [currency, delta] of Object.entries(cashDeltas)) {
        if (Number(portfolio.cash?.[currency] || 0) + delta < -0.000001) return showPortfolioError(`${currencies[currency]?.label || currency}现金余额不足。`);
      }
      updateActivePortfolio((item) => {
        const positions = [...item.positions];
        const now = new Date().toISOString();
        const sellIndex = positions.findIndex((position) => position.id === sellPosition.id);
        let soldPositionId = sellPosition.id;
        if (sellIndex >= 0) {
          const old = positions[sellIndex];
          const remaining = Number(old.shares) - sellShares;
          if (remaining === 0) positions.splice(sellIndex, 1);
          else positions[sellIndex] = {
            ...old,
            shares: remaining,
            averageCost: (Number(old.shares) * Number(old.averageCost) - sellPrice * sellShares) / remaining,
            latestPrice: Number(old.latestPrice) || sellPrice
          };
        }
        const buyIndex = positions.findIndex((position) => position.code === buyStock.code && position.market === buyStock.market);
        let boughtPositionId = "";
        if (buyIndex >= 0) {
          const old = positions[buyIndex];
          const newShares = Number(old.shares) + buyShares;
          positions[buyIndex] = {
            ...old,
            shares: newShares,
            averageCost: (Number(old.shares) * Number(old.averageCost) + buyPrice * buyShares) / newShares,
            latestPrice: Number(buyStock.latestPrice) || Number(old.latestPrice) || buyPrice
          };
          boughtPositionId = old.id;
        } else {
          boughtPositionId = id("position");
          positions.push({
            id: boughtPositionId, name: buyStock.name, code: buyStock.code, rawCode: buyStock.rawCode || "", market: buyStock.market,
            exchange: buyStock.exchange || "", quoteId: buyStock.quoteId || "", currency: buyCurrency, shares: buyShares, averageCost: buyPrice,
            latestPrice: Number(buyStock.latestPrice) || buyPrice, priceUpdatedAt: buyStock.marketCapUpdatedAt || todayString()
          });
        }
        const nextCash = { ...item.cash };
        Object.entries(cashDeltas).forEach(([currency, delta]) => { nextCash[currency] = Number(nextCash[currency] || 0) + delta; });
        const tradeHistory = [
          ...(item.tradeHistory || []),
          { id: id("trade"), positionId: soldPositionId, code: sellStock.code, market: sellStock.market, type: "reduce", currency: sellCurrency, price: sellPrice, shares: sellShares, occurredAt: now },
          { id: id("trade"), positionId: boughtPositionId, code: buyStock.code, market: buyStock.market, type: "add", currency: buyCurrency, price: buyPrice, shares: buyShares, occurredAt: now }
        ];
        return { ...item, positions, tradeHistory, cash: nextCash, updatedAt: now };
      });
      closePortfolioModal();
    }

    function submitPositionTrade(event) {
      event.preventDefault();
      const portfolio = activePortfolio();
      const modal = state.portfolioModal;
      if (!portfolio || !modal) return;
      const form = new FormData(event.currentTarget);
      const price = Number(form.get("price"));
      const shares = Number(form.get("shares"));
      if (!Number.isFinite(price) || price <= 0) return showPortfolioError("请输入有效价格。");
      if (!Number.isInteger(shares) || shares <= 0) return showPortfolioError("买卖数量必须为正整数。");
      const stock = modal.type === "open" ? modal.stock : modal.position;
      if (!stock) return showPortfolioError("请先选择股票。");
      if (modal.type === "edit") {
        const targetWeight = parsePositionTargetWeight(form.get("targetWeight"));
        const valuationStockId = String(form.get("valuationStockId") || "");
        if (valuationStockId && !portfolioValuationStock(stock, valuationStockId)) return showPortfolioError("所选估值版本已不存在，请重新选择。");
        if (!Number.isFinite(targetWeight) || targetWeight < 0 || targetWeight > 100) return showPortfolioError("目标仓位请输入 0 到 100 之间的百分比。");
        const tradePlan = { buy: [], sell: [] };
        for (const side of ["buy", "sell"]) {
          for (let index = 0; index < 3; index += 1) {
            const planPrice = Number(form.get(`plan_${side}_${index}_price`) || 0);
            const planShares = Number(form.get(`plan_${side}_${index}_shares`) || 0);
            if (!Number.isFinite(planPrice) || planPrice < 0) return showPortfolioError("计划价格不能小于 0。");
            if (!Number.isInteger(planShares) || planShares < 0) return showPortfolioError("计划股数必须为非负整数。");
            tradePlan[side].push({ price: planPrice, shares: planShares, done: form.has(`plan_${side}_${index}_done`) });
          }
        }
        updateActivePortfolio((item) => ({
          ...item,
          positions: item.positions.map((position) => position.id === stock.id ? { ...position, shares, averageCost: price, targetWeight, valuationStockId, tradePlan, tags: [...new Set((modal.tags || []).map((tag) => String(tag).trim()).filter(Boolean))] } : position),
          updatedAt: new Date().toISOString()
        }));
        closePortfolioModal();
        return;
      }
      if (portfolio.accountType === "CNY" && !["CN", "HK"].includes(stock.market)) return showPortfolioError("人民币账户只能开仓 A 股或港股通股票。");
      if (portfolio.accountType === "HKUS" && !["HK", "US"].includes(stock.market)) return showPortfolioError("港美账户只能开仓港股或美股。");
      if (modal.type === "open" && portfolio.positions.some((item) => item.code === stock.code && item.market === stock.market)) return showPortfolioError("该股票已在组合中，请使用加仓。");
      if (modal.type === "reduce" && shares > Number(stock.shares)) return showPortfolioError("减持数量不能超过当前股数。");
      const amount = price * shares;
      const currency = stock.currency || marketCurrency(stock.market);
      const cashCurrency = portfolio.accountType === "CNY" ? "CNY" : currency;
      const cashAmount = amount * portfolioFx(currency, cashCurrency);
      if (modal.type !== "reduce" && Number(portfolio.cash?.[cashCurrency] || 0) < cashAmount) return showPortfolioError(`${currencies[cashCurrency]?.label || cashCurrency}现金余额不足。`);
      updateActivePortfolio((item) => {
        const positions = [...item.positions];
        if (modal.type === "open") {
          positions.push({
            id: id("position"), name: stock.name, code: stock.code, rawCode: stock.rawCode || "", market: stock.market,
            exchange: stock.exchange || "", quoteId: stock.quoteId || "", currency, shares, averageCost: price,
            latestPrice: Number(stock.latestPrice) || price, priceUpdatedAt: stock.marketCapUpdatedAt || todayString()
          });
        } else {
          const index = positions.findIndex((position) => position.id === stock.id);
          if (index >= 0 && modal.type === "add") {
            const old = positions[index];
            const newShares = Number(old.shares) + shares;
            positions[index] = { ...old, shares: newShares, averageCost: (Number(old.shares) * Number(old.averageCost) + amount) / newShares, latestPrice: Number(old.latestPrice) || price };
          }
          if (index >= 0 && modal.type === "reduce") {
            const oldPosition = positions[index];
            const remaining = Number(oldPosition.shares) - shares;
            if (remaining === 0) positions.splice(index, 1);
            else positions[index] = {
              ...oldPosition,
              shares: remaining,
              averageCost: (Number(oldPosition.shares) * Number(oldPosition.averageCost) - amount) / remaining
            };
          }
        }
        const cashDelta = modal.type === "reduce" ? cashAmount : -cashAmount;
        const tradeHistory = modal.type === "add" || modal.type === "reduce"
          ? [...(item.tradeHistory || []), { id: id("trade"), positionId: stock.id, code: stock.code, market: stock.market, type: modal.type, currency, price, shares, occurredAt: new Date().toISOString() }]
          : [...(item.tradeHistory || [])];
        return { ...item, positions, tradeHistory, cash: { ...item.cash, [cashCurrency]: Number(item.cash?.[cashCurrency] || 0) + cashDelta }, updatedAt: new Date().toISOString() };
      });
      closePortfolioModal();
    }

    function rollbackPortfolioTrade(tradeId) {
      const portfolio = activePortfolio();
      if (!portfolio || !tradeId) return;
      const trade = (portfolio.tradeHistory || []).find((item) => item.id === tradeId);
      if (!trade || !["add", "reduce"].includes(trade.type)) return showPortfolioError("没有找到可回滚的交易记录。");
      const position = (portfolio.positions || []).find((item) => item.id === trade.positionId || (!trade.positionId && item.code === trade.code));
      if (!position) return showPortfolioError("当前持仓中已找不到这只股票，无法安全回滚。");
      const price = Number(trade.price);
      const shares = Number(trade.shares);
      const currentShares = Number(position.shares);
      const currentCost = Number(position.averageCost);
      if (!(price > 0) || !Number.isInteger(shares) || shares <= 0 || !Number.isFinite(currentShares) || currentShares < 0) return showPortfolioError("这条交易记录数据不完整，无法回滚。");
      if (trade.type === "add" && currentShares < shares) return showPortfolioError("当前股数少于这笔加仓数量，无法安全回滚。");
      const tradeTypeText = trade.type === "add" ? "加仓" : "减持";
      const occurredAt = trade.occurredAt ? new Date(trade.occurredAt).toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "--";
      const cashCurrency = portfolio.accountType === "CNY" ? "CNY" : (trade.currency || position.currency || marketCurrency(position.market));
      const cashAmount = price * shares * portfolioFx(trade.currency || position.currency, cashCurrency);
      const cashText = formatPortfolioMoney(cashAmount, cashCurrency);
      const message = trade.type === "add"
        ? `确定回滚这笔${tradeTypeText}吗？\n\n${position.name} ${position.code}\n时间：${occurredAt}\n数量：${shares.toLocaleString("zh-CN")} 股\n成交价：${formatPortfolioMoney(price, trade.currency || position.currency)}\n\n回滚后会减少对应股数、恢复现金 ${cashText}，并删除这条交易历史。`
        : `确定回滚这笔${tradeTypeText}吗？\n\n${position.name} ${position.code}\n时间：${occurredAt}\n数量：${shares.toLocaleString("zh-CN")} 股\n成交价：${formatPortfolioMoney(price, trade.currency || position.currency)}\n\n回滚后会补回对应股数、扣回现金 ${cashText}，并删除这条交易历史。`;
      if (!confirm(message)) return;

      let nextPosition = null;
      updateActivePortfolio((item) => {
        const positions = [...(item.positions || [])];
        const index = positions.findIndex((entry) => entry.id === position.id);
        if (index < 0) return item;
        const old = positions[index];
        if (trade.type === "add") {
          const remaining = Number(old.shares) - shares;
          if (remaining <= 0) {
            positions.splice(index, 1);
            nextPosition = null;
          } else {
            const restoredCost = (Number(old.shares) * Number(old.averageCost) - price * shares) / remaining;
            nextPosition = { ...old, shares: remaining, averageCost: restoredCost };
            positions[index] = nextPosition;
          }
        } else {
          const restoredShares = Number(old.shares) + shares;
          const restoredCost = (Number(old.shares) * (Number.isFinite(currentCost) ? currentCost : 0) + price * shares) / restoredShares;
          nextPosition = { ...old, shares: restoredShares, averageCost: restoredCost, latestPrice: Number(old.latestPrice) || price };
          positions[index] = nextPosition;
        }
        const cashDelta = trade.type === "add" ? cashAmount : -cashAmount;
        const nextCash = { ...(item.cash || {}), [cashCurrency]: Number(item.cash?.[cashCurrency] || 0) + cashDelta };
        return {
          ...item,
          positions,
          cash: nextCash,
          tradeHistory: (item.tradeHistory || []).filter((entry) => entry.id !== tradeId),
          updatedAt: new Date().toISOString()
        };
      });
      if (nextPosition && state.portfolioModal?.type === "history") state.portfolioModal = { ...state.portfolioModal, position: nextPosition };
      if (!nextPosition && state.portfolioModal?.type === "history") state.portfolioModal = null;
      state.portfolioError = "";
      render();
    }

    function stepPositionTargetWeight(direction) {
      const input = document.querySelector('input[name="targetWeight"]');
      if (!input) return;
      const tiers = [2, 3, 5, 8, 15, 25, 35];
      const current = parsePositionTargetWeight(input.value);
      const next = direction > 0
        ? (tiers.find((value) => value > current + 0.000001) ?? tiers.at(-1))
        : ([...tiers].reverse().find((value) => value < current - 0.000001) ?? tiers[0]);
      input.value = formatPositionTargetWeight(next);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function updatePositionPlanDone(positionId, side, index, done) {
      if (!positionId || !["buy", "sell"].includes(side) || !Number.isInteger(index) || index < 0 || index > 2) return;
      updateActivePortfolio((portfolio) => ({
        ...portfolio,
        positions: portfolio.positions.map((position) => {
          if (position.id !== positionId) return position;
          const tradePlan = normalizedPositionTradePlan(position);
          tradePlan[side][index] = { ...tradePlan[side][index], done };

        }),
        updatedAt: new Date().toISOString()

    function positionTradeSuggestion(position, portfolio, requestedType) {
      const metrics = portfolioMetrics(portfolio);
      const targetWeight = Number(position.targetWeight) || 0;
      const currentValue = positionBaseValue(position, portfolio);
      const currentWeight = metrics.netBase > 0 ? currentValue / metrics.netBase * 100 : 0;
      const gapBase = metrics.netBase * targetWeight / 100 - currentValue;
      const price = Number(position.latestPrice) || Number(position.averageCost) || 0;
      const basePerShare = price * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
      const lotSize = position.market === "CN" && requestedType === "add" ? 100 : 1;
      const roundLot = (value) => Math.floor(Math.max(0, value) / lotSize) * lotSize;
      const maxShares = requestedType === "reduce" ? Number(position.shares) : Infinity;
      const fullShares = basePerShare > 0 ? Math.min(maxShares, roundLot(Math.abs(gapBase) / basePerShare)) : 0;
      const gridShares = Math.min(maxShares, roundLot(Math.max(lotSize, fullShares / 4)));
      const toleranceBase = metrics.netBase * 0.0025;
      const action = !targetWeight || !basePerShare || Math.abs(gapBase) <= toleranceBase || !fullShares ? "hold" : gapBase > 0 ? "add" : "reduce";
      return { targetWeight, currentWeight, gapPercent: targetWeight - currentWeight, fullShares, gridShares: action === "hold" ? 0 : gridShares, action };
    }

    async function refreshPortfolioQuotes({ renderAfter = true } = {}) {
      const portfolio = activePortfolio();
      if (portfolioQuoteRefreshInFlight || !portfolio) return;
      portfolioQuoteRefreshInFlight = true;
      if (renderAfter) render();
      try {
        const [updates] = await Promise.all([Promise.all(portfolio.positions.map(async (position) => {
          try { return await fetchQuote(position); }
          catch { return null; }
        })), refreshIntradayBenchmarks(portfolio)]);
        state.portfolios = state.portfolios.map((item) => item.id === portfolio.id ? {
          ...item,
          positions: item.positions.map((position, index) => updates[index]?.latestPrice ? {
            ...position,
            quoteId: updates[index].quoteId || position.quoteId || stockQuoteId(position),
            rawCode: updates[index].rawCode || position.rawCode,
            latestPrice: updates[index].latestPrice,
            previousClose: updates[index].previousClose,
            dayHigh: updates[index].dayHigh,
            dayLow: updates[index].dayLow,
            intradayQuoteAt: updates[index].intradayQuoteAt || "",
            changePercent: updates[index].changePercent,
            priceUpdatedAt: new Date().toISOString()
          } : position)
        } : item);
        state.portfolioQuotesUpdatedAt = new Date().toISOString();
        writeJson(portfolioStorageKey(), { portfolios: state.portfolios, activePortfolioId: state.activePortfolioId });
      } finally {
        portfolioQuoteRefreshInFlight = false;
        if (renderAfter) render();
      }
    }

    async function fetchIntradayBenchmark(item) {
      const variableName = `v_${item.symbol}`;
      delete window[variableName];
      await loadScript(`https://qt.gtimg.cn/q=${item.symbol}&_=${Date.now()}`);
      const text = window[variableName];
      delete window[variableName];
      const parts = text ? text.split("~") : [];
      const latest = Number(parts[3]);
      const previousClose = Number(parts[4]);
      const quotedChange = Number(parts[32]);
      if (!latest || !previousClose) throw new Error(`${item.label}行情不可用`);
      return { code: item.code, latest, changePercent: Number.isFinite(quotedChange) ? quotedChange : (latest / previousClose - 1) * 100 };
    }

    async function refreshIntradayBenchmarks(portfolio) {
      const rows = await Promise.all((intradayBenchmarkCatalog[portfolio.accountType] || []).map(async (item) => {
        try { return await fetchIntradayBenchmark(item); } catch (error) { console.warn(error); return null; }
      }));
      rows.filter(Boolean).forEach((row) => { state.portfolioBenchmarks[row.code] = row; });
    }

    function formSnapshot(form) {
      if (!form) return "";
      const copy = { ...stripRuntimeMarketCapFields(form), publishNote: form.publishNote || "" };
      return JSON.stringify(copy);
    }

    function markFormDirty() {
      state.formDirty = Boolean(state.form && formSnapshot(state.form) !== state.formInitialSnapshot);
    }

    function updateFormField(key, value) {
      if (!state.form) return;
      if (key === "version") {
        if (value === "自定义") {
          state.form.versionCustom = true;
          state.form.version = "";
          markFormDirty();
          render();
          return;
        }
        state.form.versionCustom = Boolean(state.form.versionCustom && !["乐观", "中性", "悲观"].includes(value));
        state.form.version = value;
        markFormDirty();
        return;
      }
      if (key === "useSegmentValuation") {
        state.form.useSegmentValuation = Boolean(value);
        if (state.form.useSegmentValuation) {
          state.form = normalizeSegmentValuationFields(state.form);
        }
        markFormDirty();
        render();
        return;
      }
      if (key === "expectedPE") {
        state.form.expectedPEInput = String(value);
        state.form[key] = Number(value);
      }
      else if (key === "netCashDiscountRate") state.form[key] = Number(value);
      else state.form[key] = value;
      markFormDirty();
      if (key === "market") {
        state.form.displayCurrency = defaultCurrencyFor(state.form);
        render();
        return;
      }
      if (key === "displayCurrency") {
        render();
        return;
      }
      if (["expectedPE", "netCashDiscountRate", "expectedPERemark", "shareholderReturnRemark", "forecastYear"].includes(key)) refreshSummary();
    }

    function updateSegmentField(index, key, value) {
      if (!state.form || !Array.isArray(state.form.segmentValuations) || !state.form.segmentValuations[index]) return;
      state.form.segmentValuations[index] = {
        ...state.form.segmentValuations[index],
        [key]: key === "expectedPE" ? Number(value) : value,
        ...(key === "expectedPE" ? { expectedPEInput: String(value) } : {})
      };
      applySegmentValuationTotals(state.form);
      markFormDirty();
      if (["expectedPE", "forecastYear", "expectedPERemark"].includes(key)) refreshSummary();
    }

    function addSegmentValuation() {
      if (!state.form || state.form.sourceType === "subscribed") return;
      if (!Array.isArray(state.form.segmentValuations)) state.form.segmentValuations = [];
      state.form.segmentValuations.push(emptySegmentValuationRow(state.form.segmentValuations.length + 1, state.form.forecastYear || "2026E"));
      applySegmentValuationTotals(state.form);
      markFormDirty();
      render();
    }

    function removeSegmentValuation(index) {
      if (!state.form || state.form.sourceType === "subscribed" || !Array.isArray(state.form.segmentValuations)) return;
      if (state.form.segmentValuations.length <= 1 || !state.form.segmentValuations[index]) return;
      state.form.segmentValuations.splice(index, 1);
      applySegmentValuationTotals(state.form);
      markFormDirty();
      render();
    }

    function updatePercentField(key, value) {
      if (!state.form) return;
      const percent = parsePercentInput(value);
      state.form[key] = percent / 100;
      markFormDirty();
      refreshSummary();
    }

    function stepDiscountField(step) {
      if (!state.form) return;
      const input = document.querySelector("[data-percent-field='netCashDiscountRate']");
      const current = input ? parsePercentInput(input.value) : (Number(state.form.netCashDiscountRate) || 0) * 100;
      const next = Math.min(100, Math.max(0, current + step));
      if (input) input.value = formatPercentInput(next);
      updatePercentField("netCashDiscountRate", next);
    }

    function updateAmountField(key, value) {
      if (!state.form) return;
      if (key.startsWith("segmentProfit:")) {
        const index = Number(key.split(":")[1]);
        if (!Array.isArray(state.form.segmentValuations) || !state.form.segmentValuations[index]) return;
        state.form.segmentValuations[index] = {
          ...state.form.segmentValuations[index],
          expectedProfitCny: toCny(value, amountCurrencyFor(state.form, key)),
          expectedProfitInput: String(value),
          expectedProfitOriginal: {
            value: String(value),
            currency: amountCurrencyFor(state.form, key)
          }
        };
        applySegmentValuationTotals(state.form);
        markFormDirty();
        refreshSummary();
        return;
      }
      state.form.amountInputValues = normalizeAmountInputValues({
        ...state.form.amountInputValues,
        [key]: String(value)
      });
      const inputCurrency = amountCurrencyFor(state.form, key);
      state.form.originalAmounts = {
        ...normalizeOriginalAmounts(state.form),
        [key]: { value: String(value), currency: inputCurrency }
      };
      state.form[key] = toCny(value, inputCurrency);
      if (["expectedDividendCny", "expectedBuybackCny"].includes(key)) {
        state.form.expectedDividendCny = Number(state.form.expectedDividendCny) || 0;
        state.form.expectedBuybackCny = Number(state.form.expectedBuybackCny) || 0;
        state.form.expectedShareholderReturnCny = state.form.expectedDividendCny + state.form.expectedBuybackCny;
        const totalCurrency = amountCurrencyFor(state.form, "expectedShareholderReturnCny");
        const totalInputValue = roundedInputNumber(toDisplay(state.form.expectedShareholderReturnCny, totalCurrency));
        state.form.amountInputValues.expectedShareholderReturnCny = totalInputValue;
        state.form.originalAmounts.expectedShareholderReturnCny = {
          value: totalInputValue,
          currency: totalCurrency
        };
        const total = document.querySelector("[data-amount='expectedShareholderReturnCny']");
        if (total) total.value = totalInputValue;
      }
      markFormDirty();
      refreshSummary();
    }

    function updateAmountCurrency(key, currency) {
      if (!state.form || !currencies[currency]) return;
      if (key.startsWith("segmentProfit:")) {
        const index = Number(key.split(":")[1]);
        if (!Array.isArray(state.form.segmentValuations) || !state.form.segmentValuations[index]) return;
        state.form.segmentValuations[index] = {
          ...state.form.segmentValuations[index],
          expectedProfitCurrency: currency,
          expectedProfitInput: roundedInputNumber(toDisplay(state.form.segmentValuations[index].expectedProfitCny, currency)),
          expectedProfitOriginal: {
            value: roundedInputNumber(toDisplay(state.form.segmentValuations[index].expectedProfitCny, currency)),
            currency
          }
        };
      } else {
        state.form.amountCurrencies = normalizeAmountCurrencies({
          ...state.form.amountCurrencies,
          [key]: currency
        });
        const convertedValue = roundedInputNumber(toDisplay(state.form[key], currency));
        state.form.amountInputValues = normalizeAmountInputValues({
          ...state.form.amountInputValues,
          [key]: convertedValue
        });
        state.form.originalAmounts = {
          ...normalizeOriginalAmounts(state.form),
          [key]: { value: convertedValue, currency }
        };
      }
      markFormDirty();
      render();
    }

    function refreshSummary() {
      const summary = document.querySelector(".summary");
      if (!summary || !state.form) return;
      const currency = state.form.displayCurrency || "CNY";
      const c = calc(state.form);
      const segmentProfit = document.querySelector("[data-segment-total='profit']");

    async function saveStock({ keepOpen = false, fromPublish = false } = {}) {
      if (state.saving || (state.publishing && !fromPublish)) return null;
      state.form = normalizeShareholderReturnFields(state.form);
      if (!state.form.name.trim() || !state.form.code.trim()) {
        state.drawerError = "请填写股票名称和代码。";
        render();
        return null;
      }
      if (state.form.useSegmentValuation && !Number(state.form.expectedProfitCny)) {
        state.drawerError = "请至少填写一个分部的前瞻利润。";
        render();
        return null;
      }
      if (!Number(state.form.expectedPE)) {
        state.drawerError = "请填写前瞻 PE。";
        render();
        return null;
      }
      state.saving = true;
      state.drawerError = "";
      render();
      const now = new Date().toISOString();
      const payload = {
        ...normalizeShareholderReturnFields(state.form),
        publishNote: "",
        updatedAt: now,
        manualOrder: state.form.manualOrder ?? Date.now()
      };
      const persistedPayload = payloadForStockRecord(payload);
      const rowPatch = {
        payload: persistedPayload,
        updated_at: now,
        source_user_id: payload.sourceUserId || null,
        source_stock_id: payload.sourceStockId || null,
        source_nickname: payload.sourceNickname || null,
        source_type: payload.sourceType || "self",
        last_source_updated_at: payload.lastSourceUpdatedAt || null,
        source_seen_published_at: payload.sourceSeenPublishedAt || null,
        is_shared: Boolean(payload.isShared),
        last_published_at: payload.lastPublishedAt || null
      };
      if (payload.id) {
        try {
          await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(payload.id)}`, {
            method: "PATCH",
            body: JSON.stringify(rowPatch)
          });
        } catch (error) {
          state.drawerError = `保存失败：${error.message || String(error)}`;
          state.saving = false;
          render();
          return null;
        }
        state.stocks = state.stocks.map((item) => item.id === payload.id ? payload : item);
      } else {
        payload.createdAt = now;
        payload.pin = "normal";
        let data;
        try {
          data = await supabaseRequest("/rest/v1/stock_records?select=id,payload", {
            method: "POST",
            prefer: "return=representation",
            body: JSON.stringify({
              user_id: state.session.user.id,
              ...rowPatch
            })
          });
        } catch (error) {
          state.drawerError = `保存失败：${error.message || String(error)}`;
          state.saving = false;
          render();
          return null;
        }
        payload.id = data?.[0]?.id;
        state.stocks.push(payload);
      }
      state.form = { ...payload };
      state.formInitialSnapshot = formSnapshot(state.form);
      state.formDirty = false;
      state.saving = false;
      if (!keepOpen) {
        state.drawerOpen = false;
        state.editingId = null;
        state.form = null;
        state.formInitialSnapshot = "";
      }
      render();
      return payload;
    }

    async function publishStock() {
      if (state.publishing || state.saving) return;
      if (state.form?.sourceType === "subscribed") {
        state.drawerError = "订阅来的股票不能发布。如需发布自己的观点，请先转为我的股票。";
        render();
        return;
      }
      if (state.profile?.share_banned) {
        state.drawerError = "你的分享能力当前已被管理员禁用，暂时不能发布。";
        render();
        return;
      }
      if (!confirm("发布会保存当前内容并生成一个可分享快照，确定发布吗？")) return;
      state.publishing = true;
      const note = state.form?.publishNote?.trim() || "";
      const stock = await saveStock({ keepOpen: true, fromPublish: true });
      if (!stock?.id) {
        state.publishing = false;
        render();
        return;
      }
      const now = new Date().toISOString();
      const payload = {
        ...stock,
        isShared: true,
        lastPublishedAt: now,
        updatedAt: now,
        publishNote: ""
      };
      try {
        const latest = await supabaseRequest(`/rest/v1/stock_publications?stock_id=eq.${encodeURIComponent(stock.id)}&select=version_number&order=version_number.desc&limit=1`);
        const versionNumber = Number(latest?.[0]?.version_number || 0) + 1;
        const publicationPayload = buildPublicationSnapshot(payload, note);
        await supabaseRequest(`/rest/v1/stock_records?id=eq.${encodeURIComponent(stock.id)}`, {
          method: "PATCH",
          body: JSON.stringify({
            payload: payloadForStockRecord(payload),
            updated_at: now,
            is_shared: true,
            last_published_at: now
          })
        });
        await supabaseRequest("/rest/v1/stock_publications", {
          method: "POST",
          body: JSON.stringify({
            stock_id: stock.id,
            publisher_id: state.session.user.id,
            version_number: versionNumber,
            change_note: note,
            payload: publicationPayload
          })
        });
      } catch (error) {
        state.drawerError = `发布失败：${error.message || String(error)}`;
        state.publishing = false;
        render();
        return;
      }
      state.stocks = state.stocks.map((item) => item.id === stock.id ? payload : item);
      state.form = { ...payload };
      state.formInitialSnapshot = formSnapshot(state.form);
      state.formDirty = false;
      state.publishing = false;
      state.drawerOpen = false;
      state.editingId = null;
      state.form = null;
      state.formInitialSnapshot = "";
      render();
    }

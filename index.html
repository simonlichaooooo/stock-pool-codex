    function activePortfolio() {
      return state.portfolios.find((item) => item.id === state.activePortfolioId) || state.portfolios[0] || null;
    }

    function portfolioBaseCurrency(portfolio) {
      return portfolio?.accountType === "HKUS" ? "USD" : "CNY";
    }

    function portfolioFx(currency, baseCurrency) {
      if (currency === baseCurrency) return 1;
      const cnyRate = currencies[currency]?.rateToCny || 1;
      const baseCnyRate = currencies[baseCurrency]?.rateToCny || 1;
      return cnyRate / baseCnyRate;
    }

    function positionBaseValue(position, portfolio) {
      const price = Number(position.latestPrice) || Number(position.averageCost) || 0;
      return Number(position.shares || 0) * price * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
    }

    function portfolioPositionKey(position) {
      const market = String(position?.market || "").trim().toUpperCase();
      const code = String(position?.code || "").trim().toUpperCase();
      return market && code ? `${market}:${code}` : "";
    }

    function findPortfolioPosition(portfolio, positionId = "", positionKey = "") {
      const positions = portfolio?.positions || [];
      const idMatch = positionId
        ? positions.find((item) => String(item.id || "") === String(positionId))
        : null;
      if (idMatch) return idMatch;
      return positionKey
        ? positions.find((item) => portfolioPositionKey(item) === positionKey)
        : null;
    }

    function portfolioMetrics(portfolio) {
      if (!portfolio) return { positionBase: 0, cashBase: 0, netBase: 0, netCny: 0, positionCny: 0, cashCny: 0, nav: 0 };
      const base = portfolioBaseCurrency(portfolio);
      const positionBase = (portfolio.positions || []).reduce((sum, item) => sum + positionBaseValue(item, portfolio), 0);
      const cash = portfolio.cash || {};
      const cashBase = portfolio.accountType === "HKUS"
        ? Number(cash.USD || 0) + Number(cash.HKD || 0) * portfolioFx("HKD", "USD")
        : Number(cash.CNY || 0);
      const netBase = positionBase + cashBase;
      const baseToCny = currencies[base]?.rateToCny || 1;
      const totalUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      const assetNav = totalUnits ? netBase / totalUnits : 0;
      return {
        positionBase,
        cashBase,
        netBase,
        positionCny: positionBase * baseToCny,
        cashCny: cashBase * baseToCny,
        netCny: netBase * baseToCny,
        nav: assetNav
      };
    }

    function formatWan(value) {
      return `${(Number(value || 0) / 10000).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} 万元`;
    }

    function formatPortfolioSummary(value, portfolio, { signed = false } = {}) {
      const amount = Number(value || 0) / 10000;
      const sign = signed && amount > 0 ? "+" : "";
      const unit = portfolio?.accountType === "HKUS" ? "万美元" : "万元";
      return `${sign}${amount.toLocaleString("zh-CN", { minimumFractionDigits: 0, maximumFractionDigits: 2 })} ${unit}`;
    }

    function formatPortfolioWan(value, { signed = false } = {}) {
      const amount = Number(value || 0) / 10000;
      const sign = signed && amount > 0 ? "+" : "";
      return `${sign}${amount.toLocaleString("zh-CN", { minimumFractionDigits: 0, maximumFractionDigits: 2 })}万`;
    }

    function parseCashAmount(value) {
      const normalized = String(value ?? "").replace(/,/g, "").trim();
      return normalized ? Number(normalized) : NaN;
    }

    function formatCashAmount(value, fixed = true) {
      const amount = Number(value || 0);
      if (!Number.isFinite(amount)) return "";
      return amount.toLocaleString("en-US", {
        useGrouping: true,
        minimumFractionDigits: fixed ? 2 : 0,
        maximumFractionDigits: 2
      });
    }

    function formatCashAmountInput(input) {
      const previous = input.value;
      const selectionStart = input.selectionStart ?? previous.length;
      const logicalCaret = previous.slice(0, selectionStart).replace(/,/g, "").length;
      const clean = previous.replace(/,/g, "").replace(/[^\d.]/g, "");
      if (!clean) {
        input.value = "";
        return;
      }
      const dotIndex = clean.indexOf(".");
      const hasDecimal = dotIndex >= 0;
      const integer = (hasDecimal ? clean.slice(0, dotIndex) : clean).replace(/^0+(?=\d)/, "") || "0";
      const decimal = hasDecimal ? clean.slice(dotIndex + 1).replace(/\./g, "").slice(0, 2) : "";
      const grouped = integer.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const formatted = hasDecimal ? `${grouped}.${decimal}` : grouped;
      input.value = formatted;
      let nextCaret = 0;
      let logicalCount = 0;
      while (nextCaret < formatted.length && logicalCount < logicalCaret) {
        if (formatted[nextCaret] !== ",") logicalCount += 1;
        nextCaret += 1;
      }
      input.setSelectionRange(nextCaret, nextCaret);
    }

    function portfolioTotalProfit(portfolio, metrics) {
      const flowCapital = (portfolio.cashFlows || []).reduce((sum, flow) => {
        const baseAmount = Number(flow.unitsChanged || 0) * Number(flow.navBefore || 0);
        return sum + (flow.type === "redemption" ? -baseAmount : baseAmount);
      }, 0);
      return metrics.netBase - Number(portfolio.startBase || 0) - flowCapital;
    }

    function portfolioActionIcon(name) {
      const icons = {
        open: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`,
        rebalance: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/><path d="M8 7h8"/><path d="M8 17h8"/></svg>`,

    function previousPortfolioNav() {
      if (state.navHistoryPortfolioId && state.navHistoryPortfolioId !== state.activePortfolioId) return null;
      const today = todayString();
      const row = [...state.navHistory]
        .filter((item) => item.nav_date && item.nav_date < today && Number(item.unit_nav) > 0)
        .sort((a, b) => b.nav_date.localeCompare(a.nav_date))[0];
      return row ? Number(row.unit_nav) : null;
    }

    function portfolioDailyProfit(portfolio) {
      const base = portfolioBaseCurrency(portfolio);
      let dailyProfit = 0;
      let quotedPositions = 0;
      for (const position of portfolio.positions || []) {
        const shares = Number(position.shares || 0);
        if (!shares) continue;
        const latestPrice = Number(position.latestPrice);
        const previousClose = Number(position.previousClose);
        if (!(latestPrice > 0) || !(previousClose > 0)) continue;
        quotedPositions += 1;
        dailyProfit += (latestPrice - previousClose) * shares * portfolioFx(position.currency, base);
      }
      return { amount: dailyProfit, quotedPositions };
    }

    function renderPortfolioNavChange(currentNav, portfolio) {
      if (state.portfolioPrivacyMode) return `<span class="muted">当日盈亏 **** · 较昨日 ****</span>`;
      const totalUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      const { amount: profitAmount, quotedPositions } = portfolioDailyProfit(portfolio);
      const hasPositions = (portfolio.positions || []).some((position) => Number(position.shares || 0) > 0);
      if (!(totalUnits > 0) || (hasPositions && !quotedPositions)) return `<span class="muted">当日盈亏 -- · 较昨日 --</span>`;
      const delta = profitAmount / totalUnits;
      const previousNav = Number(currentNav) - delta;
      const change = previousNav > 0 ? delta / previousNav * 100 : 0;
      const sign = delta > 0 ? "+" : "";
      const className = delta > 0 ? "gain" : delta < 0 ? "loss" : "muted";
      return `<span class="portfolio-nav-change">当日盈亏 <span class="${className}">${formatPortfolioWan(profitAmount, { signed: true })}</span> · 较昨日 <span class="${className}">${sign}${delta.toFixed(4)}（${sign}${change.toFixed(2)}%）</span></span>`;

    function portfolioDailyProfitSummary(portfolio, metrics) {

    function filteredNavHistory() {
      const rows = [...state.navHistory].sort((a, b) => a.nav_date.localeCompare(b.nav_date));
      if (!rows.length || state.navRange === "ALL") return rows;
      if (state.navRange === "YEAR") return rows.filter((row) => row.nav_date.startsWith(state.navYear));
      const start = new Date(`${rows.at(-1).nav_date}T00:00:00`);
      if (state.navRange === "3M") start.setMonth(start.getMonth() - 3); else start.setMonth(0, 1);
      return rows.filter((row) => new Date(`${row.nav_date}T00:00:00`) >= start);
    }

    function performanceStats(rows) {
      if (rows.length < 2) return { total: null, drawdown: null, sharpe: null };
      let peak = Number(rows[0].unit_nav), drawdown = 0; const returns = [];
      rows.forEach((row, index) => { const nav = Number(row.unit_nav); peak = Math.max(peak, nav); drawdown = Math.min(drawdown, nav / peak - 1); if (index) returns.push(nav / Number(rows[index - 1].unit_nav) - 1); });
      const mean = returns.reduce((a,b)=>a+b,0) / returns.length; const variance = returns.reduce((s,v)=>s+(v-mean)**2,0) / Math.max(1, returns.length-1);
      return { total: Number(rows.at(-1).unit_nav) / Number(rows[0].unit_nav) - 1, drawdown, sharpe: variance ? mean / Math.sqrt(variance) * Math.sqrt(252) : null };
    }

    function renderNavSvg(rows) {
      if (rows.length < 2) return `<div class="empty">暂无足够的日终净值数据。</div>`;
      const values = rows.map((row) => Number(row.unit_nav) / Number(rows[0].unit_nav));

      const all=[...values,...bmValues.filter(Boolean)], min = Math.min(...all), max = Math.max(...all), span=max-min||.01; const makePath=(series)=>series.map((value,index)=>value==null?"":`${index ? "L" : "M"}${(index/(series.length-1)*960+20).toFixed(1)},${(280-(value-min)/span*240).toFixed(1)}`).join(" ");
      return `<div class="muted" style="margin-bottom:8px">绿色：组合${firstBm ? `　蓝色：${state.benchmarkCode}` : ""}</div><svg class="nav-chart" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="${makePath(values)}" fill="none" stroke="#0f5f55" stroke-width="3" vector-effect="non-scaling-stroke"/>${firstBm?`<path d="${makePath(bmValues)}" fill="none" stroke="#2f5f98" stroke-width="2" vector-effect="non-scaling-stroke"/>`:""}</svg>`;

    function renderPortfolioNavHistory(rows, portfolio) {

      return `<section class="table-panel portfolio-nav-history"><div class="portfolio-nav-history-title">净值明细</div><div class="table-scroll"><table><thead><tr><th>日期</th><th class="num">净值</th><th class="num">当日净值涨跌幅</th><th class="num">当日盈亏金额</th></tr></thead><tbody>${body}</tbody></table></div></section>`;

    function renderPortfolioPerformance(portfolio) {

    function triggeredPositionTradePlans(position, portfolio) {
      if (!isSameLocalDay(position?.intradayQuoteAt)) return [];
      const latestPrice = Number(position.latestPrice);
      if (!(latestPrice > 0)) return [];
      const dayHigh = Math.max(latestPrice, Number(position.dayHigh) || latestPrice);
      const dayLow = Math.min(latestPrice, Number(position.dayLow) || latestPrice);
      const plan = normalizedPositionTradePlan(position);
      return ["buy", "sell"].flatMap((side) => plan[side].map((row, index) => {
        const price = Number(row.price);
        if (!(price > 0) || row.done) return null;
        const triggered = side === "buy" ? dayLow <= price : dayHigh >= price;
        if (!triggered) return null;
        return {
          side,
          index,
          label: `${side === "buy" ? "买点" : "卖点"}${index + 1}`,
          price,
          shares: Number(row.shares) || 0,

              ? (latestPrice - averageCost) * Number(position.shares || 0) * portfolioFx(position.currency, base)
              : NaN;
            const holdingReturn = averageCost > 0 && latestPrice > 0 ? (latestPrice / averageCost - 1) * 100 : NaN;
            const holdingProfitClass = state.portfolioPrivacyMode ? "muted" : Number.isFinite(holdingProfit) ? (holdingProfit > 0 ? "gain" : holdingProfit < 0 ? "loss" : "") : "muted";
            const holdingProfitText = Number.isFinite(holdingProfit)
              ? `${holdingProfit > 0 ? "+" : ""}${base === "USD" ? formatPortfolioNumber(holdingProfit) : formatWan(holdingProfit)}`
              : "--";
            const holdingProfitCell = state.portfolioPrivacyMode
              ? "****"
              : `${holdingProfitText}${Number.isFinite(holdingReturn) ? `<div class="portfolio-holding-profit-rate">${holdingReturn > 0 ? "+" : ""}${holdingReturn.toFixed(2)}%</div>` : ""}`;
            return `<tr>
              <td data-label="股票" class="sticky-col"><div class="stock-name">${escapeHtml(position.name)}</div><div class="stock-code">${escapeHtml(position.code)}</div>${(position.tags || []).length ? `<div class="position-row-tags">${position.tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}</div>` : ""}</td>
              <td data-label="股数">${portfolioPrivate(Number(position.shares).toLocaleString("zh-CN"))}</td>
              <td data-label="摊薄成本" class="num">${portfolioPrivate(formatPortfolioNumber(position.averageCost))}</td>
              <td data-label="实时股价" class="num">${position.latestPrice ? formatPortfolioNumber(position.latestPrice) : "--"}</td>
              <td data-label="当日涨跌幅" class="${changeClass}">${Number.isFinite(change) ? `${change > 0 ? "+" : ""}${change.toFixed(2)}%` : "--"}</td>
              <td data-label="当日盈亏" class="num ${dailyProfitClass}">${portfolioPrivate(dailyProfitText)}</td>
              <td data-label="持仓盈亏" class="num ${holdingProfitClass}">${holdingProfitCell}</td>
              <td data-label="市值" class="num">${portfolioPrivate(base === "USD" ? formatPortfolioMoney(value, "USD") : formatWan(value))}</td>
              <td data-label="仓位比例" class="portfolio-position-weight">${(weight * 100).toFixed(2)}%</td>
              <td data-label="目标仓位">${Number(position.targetWeight) > 0 ? `${Number(position.targetWeight).toFixed(2)}%` : "--"}</td>
              <td data-label="估值信息" class="portfolio-valuation-cell">${renderPortfolioValuation(position)}</td>
              <td data-label="操作"><div class="actions"><button class="trade-add ${pendingBuys.length ? "trade-plan-alert" : ""}" data-action="addPosition" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">${pendingBuys.length ? `<span class="trade-alert-dot" aria-hidden="true"></span>加仓` : "加仓"}</button><button class="trade-reduce ${pendingSells.length ? "trade-plan-alert" : ""}" data-action="reducePosition" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">${pendingSells.length ? `<span class="trade-alert-dot" aria-hidden="true"></span>减仓` : "减仓"}</button><button class="trade-edit" data-action="editPosition" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">编辑</button><button class="trade-history" data-action="positionHistory" data-id="${escapeHtml(String(position.id || ""))}" data-position-key="${escapeHtml(portfolioPositionKey(position))}">交易历史</button></div></td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        </section>`;
    }

    function portfolioValuationVersions(position) {
      if (!position) return [];
      return state.stocks.filter((stock) => stock.code === position.code && stock.market === position.market);
    }

    function portfolioValuationStock(position, selectedId = position?.valuationStockId) {
      return portfolioValuationVersions(position).find((stock) => stock.id === selectedId) || null;
    }

    function renderPortfolioValuation(position, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      if (!stock) return `<span class="muted">--</span>`;
      const computed = calc(stock);
      return `<span>${percent(computed.upside)}</span><span>${computed.forwardPE == null ? "--" : `${trimNumber(computed.forwardPE)}x`}</span><span>${percent(computed.shareholderReturnRate)}</span>`;
    }

    function renderPortfolioValuationPreview(position, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      if (!stock) return "选择后将在持仓列表展示 Upside、Forward PE、股东回报率。";
      const computed = calc(stock);
      const item = (label, value) => `<span class="position-valuation-preview-item"><strong>${label}</strong><span>${value}</span></span>`;
      return `${item("Upside", percent(computed.upside))}<span class="position-valuation-preview-separator">·</span>${item("Forward PE", computed.forwardPE == null ? "--" : `${trimNumber(computed.forwardPE)}x`)}<span class="position-valuation-preview-separator">·</span>${item("股东回报率", percent(computed.shareholderReturnRate))}`;
    }

    function positionPlanValuation(position, price, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      const targetPrice = Number(price);
      const latestMarketCap = Number(stock?.latestMarketCapCny);
      const referencePrice = Number(stock?.latestPrice) || Number(position?.latestPrice);
      if (!stock || !(targetPrice > 0) || !(latestMarketCap > 0) || !(referencePrice > 0)) return null;
      const targetMarketCap = latestMarketCap * targetPrice / referencePrice;
      return { ...calc({ ...stock, latestMarketCapCny: targetMarketCap }), targetMarketCap, targetPrice };
    }

    function positionPlanPriceFromMetric(position, metric, value, selectedId = position?.valuationStockId) {
      const stock = portfolioValuationStock(position, selectedId);
      const inputValue = Number(value);
      const latestMarketCap = Number(stock?.latestMarketCapCny);
      const referencePrice = Number(stock?.latestPrice) || Number(position?.latestPrice);
      if (!stock || !Number.isFinite(inputValue) || !(latestMarketCap > 0) || !(referencePrice > 0)) return null;
      const cashValue = (Number(stock.netCashCny) || 0) * (Number(stock.netCashDiscountRate) || 0);
      let targetMarketCap = 0;
      if (metric === "upside") {
        const upside = inputValue / 100;
        const expectedMarketCap = calc(stock).expectedMarketCapCny;
        if (!(upside > -1) || !(expectedMarketCap > 0)) return null;
        targetMarketCap = expectedMarketCap / (1 + upside);
      } else if (metric === "forwardPE") {
        const profit = Number(stock.expectedProfitCny) || 0;
        if (!profit) return null;
        targetMarketCap = inputValue * profit + cashValue;
      } else if (metric === "shareholderReturnRate") {
        const rate = inputValue / 100;
        const shareholderReturn = shareholderReturnTotal(stock);
        if (!rate || !shareholderReturn) return null;
        targetMarketCap = shareholderReturn / rate;
      } else {
        return null;
      }
      const price = referencePrice * targetMarketCap / latestMarketCap;
      return Number.isFinite(price) && price > 0 ? price : null;
    }

    function formatPositionPlanNumber(value, digits = 2) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "";
      return Number(value).toFixed(digits).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
    }

    function renderPositionPlanMetricValue(computed, metric) {
      if (!computed) return "--";
      if (metric === "forwardPE") return computed.forwardPE == null ? "--" : `${formatPositionPlanNumber(computed.forwardPE)}x`;
      return percent(computed[metric]);
    }

    function allPortfolioTags() {
      return [...new Set(state.portfolios.flatMap((portfolio) => (portfolio.positions || []).flatMap((position) => position.tags || [])).map((tag) => String(tag).trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "zh-CN"));
    }

    function portfolioTagTargetWeight(portfolio, tag) {
      const value = Number(portfolio?.tagTargets?.[tag]);
      return Number.isFinite(value) && value > 0 ? Math.min(100, value) : 0;
    }

    function renderPortfolioTagAllocationIcon(actualWeight, targetWeight) {
      if (!(targetWeight > 0) || Math.abs(actualWeight - targetWeight) < 0.005) return "";
      const over = actualWeight > targetWeight;
      const label = `${over ? "超配" : "低配"} ${Math.abs(actualWeight - targetWeight).toFixed(2)}%`;
      const path = over
        ? `<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>`
        : `<path d="M12 5v14"/><path d="m18 13-6 6-6-6"/>`;
      return `<span class="portfolio-tag-allocation ${over ? "over" : "under"}" title="${label}" aria-label="${label}"><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg></span>`;
    }

    function renderPortfolioTagSummary(portfolio, metrics) {
      const tagRows = [...new Set((portfolio.positions || []).flatMap((position) => position.tags || []))]
        .map((tag) => {
          const tagged = (portfolio.positions || []).filter((position) => (position.tags || []).includes(tag));
          return { tag, tagged, value: tagged.reduce((sum, position) => sum + positionBaseValue(position, portfolio), 0) };
        })
        .sort((a, b) => b.value - a.value || a.tag.localeCompare(b.tag, "zh-CN"));
      if (!tagRows.length) return `<section class="portfolio-tag-filter-panel"><div class="portfolio-tag-filter-head">标签筛选</div><div class="muted">当前组合暂无标签，可在编辑持仓中添加。</div></section>`;
      const base = portfolioBaseCurrency(portfolio);
      return `<section class="portfolio-tag-filter-panel"><div class="portfolio-tag-filter-head">标签筛选</div><div class="portfolio-tag-summary" aria-label="标签汇总">${tagRows.map(({ tag, tagged, value }) => {
        let profit = 0, previousValue = 0, quoted = 0;
        tagged.forEach((position) => {
          const previousClose = Number(position.previousClose), latestPrice = Number(position.latestPrice), shares = Number(position.shares || 0);
          if (previousClose > 0 && latestPrice > 0 && shares > 0) {
            const fx = portfolioFx(position.currency, base);
            quoted += 1; profit += (latestPrice - previousClose) * shares * fx; previousValue += previousClose * shares * fx;
          }
        });
        const dailyPercent = quoted && previousValue > 0 ? profit / previousValue * 100 : NaN;
        const active = state.portfolioTagFilter === tag;
        const className = Number.isFinite(dailyPercent) ? (dailyPercent > 0 ? "gain" : dailyPercent < 0 ? "loss" : "muted") : "muted";
        const actualWeight = metrics.netBase ? value / metrics.netBase * 100 : 0;
        const targetWeight = portfolioTagTargetWeight(portfolio, tag);
        const stat = `<button type="button" class="portfolio-tag-stat ${active ? "active" : ""}" data-action="togglePortfolioTag" data-tag="${escapeHtml(tag)}"><strong>${escapeHtml(tag)}</strong><span>${actualWeight.toFixed(2)}%</span>${renderPortfolioTagAllocationIcon(actualWeight, targetWeight)}<span class="${className}">${Number.isFinite(dailyPercent) ? `${dailyPercent > 0 ? "+" : ""}${dailyPercent.toFixed(2)}%` : "--"}</span></button>`;
        return active ? `<span class="portfolio-tag-filter-item">${stat}<button type="button" class="portfolio-tag-rename-trigger" data-action="editPortfolioTag" data-tag="${escapeHtml(tag)}" title="编辑标签" aria-label="编辑标签 ${escapeHtml(tag)}">✎</button></span>` : stat;
      }).join("")}</div></section>`;
    }

    function renderPortfolioModal() {
      const modal = state.portfolioModal;
      if (!modal) return "";
      if (modal.type === "create") return renderCreatePortfolioModal();
      if (modal.type === "initialize") return renderInitializePortfolioModal(modal);
      if (modal.type === "rename") return renderRenamePortfolioModal();
      if (modal.type === "delete") return renderDeletePortfolioModal(modal);
      if (modal.type === "cash") return renderCashModal(modal);
      if (modal.type === "subscription" || modal.type === "redemption") return renderCashFlowModal(modal);
      if (modal.type === "rebalance") return renderRebalanceModal(modal);
      if (modal.type === "history") return renderPositionHistoryModal(modal);
      if (modal.type === "tag") return renderPortfolioTagModal(modal);
      return renderPositionModal(modal);
    }

    function renderPortfolioTagModal(modal) {
      return modalShell("编辑标签", `
        <label class="field"><span>标签名称</span><input name="tagName" maxlength="20" required value="${escapeHtml(modal.tag || "")}" placeholder="例如：AI / 高股息"></label>
        <label class="field"><span>目标仓位</span><div class="position-target-control"><button type="button" data-tag-target-weight-step="-1" aria-label="降低标签目标仓位">−</button><input name="tagTargetWeight" type="text" inputmode="decimal" value="${formatPositionTargetWeight(modal.targetWeight)}" required aria-label="标签目标仓位，支持 0% 到 100%"><button type="button" data-tag-target-weight-step="1" aria-label="提高标签目标仓位">+</button></div><div class="position-target-quick">${[3,5,8,15,20,30,50].map((value) => `<button type="button" data-tag-target-weight-value="${value}">${value}%</button>`).join("")}</div></label>
        <div class="portfolio-tag-edit-note">可手动输入 0%–100% 的任意仓位；目标仅应用于当前组合，设为 0% 时不显示偏离提示。</div>
      `, "portfolioTag", "保存");
    }

    function renderPositionHistoryModal(modal) {
      const portfolio = activePortfolio();
      const position = modal.position;
      const rows = (portfolio?.tradeHistory || [])
        .filter((item) => item.positionId === position?.id || (item.code === position?.code && (!item.market || item.market === position?.market)))
        .sort((a, b) => String(b.occurredAt || "").localeCompare(String(a.occurredAt || "")));
      const body = rows.length ? `<div class="table-scroll"><table class="position-history-table">
        <thead><tr><th>日期</th><th>交易类型</th><th>成交价</th><th>变动股数</th><th>操作</th></tr></thead>
        <tbody>${rows.map((item) => {
          const canRollback = !item.positionId || item.positionId === position?.id;
          return `<tr><td>${new Date(item.occurredAt).toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })}</td><td>${item.type === "add" ? "加仓" : "减持"}</td><td>${formatPortfolioMoney(item.price, item.currency || position.currency)}</td><td>${item.type === "add" ? "+" : "-"}${Number(item.shares).toLocaleString("zh-CN")}</td><td>${canRollback ? `<button class="history-rollback" data-action="rollbackTrade" data-trade-id="${item.id}">回滚</button>` : `<span class="muted">历史周期</span>`}</td></tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div class="empty" style="padding:28px 12px">暂无加仓或减持记录。</div>`;
      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal">
        <div class="simple-modal-head"><h2>${escapeHtml(position?.name || "持仓")} · 交易历史</h2><button class="icon" data-action="closePortfolioModal" aria-label="关闭">×</button></div>
        <div class="simple-modal-body">${body}${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}</div>
        <div class="simple-modal-foot"><button data-action="closePortfolioModal">关闭</button></div>
      </section></div>`;
    }

    function modalShell(title, body, formName, submitText, modalClass = "") {
      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal ${escapeHtml(modalClass)}">
        <div class="simple-modal-head"><h2>${escapeHtml(title)}</h2><button class="icon" data-action="closePortfolioModal" aria-label="关闭">×</button></div>
        <form data-form="${formName}"><div class="simple-modal-body">${body}${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}</div>
        <div class="simple-modal-foot"><button type="button" data-action="closePortfolioModal">取消</button><button class="primary" type="submit">${escapeHtml(submitText)}</button></div></form>
      </section></div>`;
    }

    function renderCreatePortfolioModal() {
      return modalShell("创建组合", `
        <label class="field"><span>组合名称</span><input name="name" maxlength="30" required placeholder="例如：长期账户"></label>
        <label class="field"><span>账户类型</span><select name="accountType" data-input="portfolioAccountType"><option value="CNY">人民币账户</option><option value="HKUS">港美账户</option></select></label>
        <div data-account-fields="CNY"><label class="field"><span>人民币启动金额（万元）</span><input name="startCny" type="number" min="0" step="0.01" value="0" required></label></div>
        <div data-account-fields="HKUS" style="display:none"><div class="grid-2"><label class="field"><span>港币启动金额（万港币）</span><input name="startHkd" type="number" min="0" step="0.01" value="0"></label><label class="field"><span>美元启动金额（万美元）</span><input name="startUsd" type="number" min="0" step="0.01" value="0"></label></div></div>
        <div class="portfolio-create-import"><div><strong>导入一个已运行的组合</strong><span>一次录入启动金额、当前现金和全部持仓，系统据此计算当前净值。</span></div><button type="button" data-action="initializePortfolio">初始化导入</button></div>
      `, "createPortfolio", "创建");
    }

    function initializationRow() {
      return { id: id("initrow"), query: "", stock: null, shares: "", averageCost: "", results: [], loading: false };
    }

    function initializationResultsMarkup(row) {
      if (!row?.loading && !row?.results?.length) return "";
      return `<div class="portfolio-initialize-results">${row.loading
        ? `<div class="muted" style="padding:10px">搜索中…</div>`
        : row.results.map((stock, resultIndex) => `<button type="button" class="portfolio-initialize-result" data-action="selectInitializationStock" data-row-id="${row.id}" data-index="${resultIndex}"><span>${escapeHtml(stock.name)}</span><small>${escapeHtml(stock.code)} · ${escapeHtml(stock.market)}</small></button>`).join("")}</div>`;
    }

    function renderInitializePortfolioModal(modal) {
      const isHkus = modal.accountType === "HKUS";
      const isEditing = Boolean(modal.portfolioId);
      const rows = modal.rows || [];
      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal portfolio-initialize-modal">
        <div class="simple-modal-head"><h2>${isEditing ? "导入组合" : "初始化导入组合"}</h2><button class="icon" data-action="closePortfolioModal" aria-label="关闭">×</button></div>
        <form data-form="initializePortfolio"><div class="simple-modal-body">
          <div class="grid-2"><label class="field"><span>组合名称</span><input data-init-field="name" name="name" maxlength="30" required value="${escapeHtml(modal.name || "")}" placeholder="例如：My"></label><label class="field"><span>账户类型</span><select data-input="initializationAccountType" name="accountType"${isEditing ? " disabled" : ""}><option value="CNY"${isHkus ? "" : " selected"}>人民币账户</option><option value="HKUS"${isHkus ? " selected" : ""}>港美账户</option></select></label></div>
          <section class="portfolio-initialize-section"><div class="portfolio-initialize-section-head"><h3>1. 启动金额</h3></div><div class="portfolio-initialize-help">组合最初开始运行时的本金，用作净值 1.0000 的计算基准。</div>${isHkus
            ? `<div class="grid-2"><label class="field"><span>港币启动金额（万港币）</span><input data-init-field="startHkd" name="startHkd" type="number" min="0" step="any" value="${escapeHtml(modal.startHkd || "")}"></label><label class="field"><span>美元启动金额（万美元）</span><input data-init-field="startUsd" name="startUsd" type="number" min="0" step="any" value="${escapeHtml(modal.startUsd || "")}"></label></div>`
            : `<label class="field"><span>人民币启动金额（万元）</span><input data-init-field="startCny" name="startCny" type="number" min="0" step="any" value="${escapeHtml(modal.startCny || "")}" required></label>`}</section>
          <section class="portfolio-initialize-section"><div class="portfolio-initialize-section-head"><h3>2. 当前现金</h3></div><div class="portfolio-initialize-help">填写导入当天账户内实际可用的现金余额。</div>${isHkus
            ? `<div class="grid-2"><label class="field"><span>港币现金（万港币）</span><input data-init-field="cashHkd" name="cashHkd" type="number" min="0" step="any" value="${escapeHtml(modal.cashHkd || "")}"></label><label class="field"><span>美元现金（万美元）</span><input data-init-field="cashUsd" name="cashUsd" type="number" min="0" step="any" value="${escapeHtml(modal.cashUsd || "")}"></label></div>`
            : `<label class="field"><span>人民币现金（万元）</span><input data-init-field="cashCny" name="cashCny" type="number" min="0" step="any" value="${escapeHtml(modal.cashCny || "")}" required></label>`}</section>
          <section class="portfolio-initialize-section"><div class="portfolio-initialize-section-head"><h3>3. 当前持仓</h3><button type="button" data-action="addInitializationRow">增加一行</button></div><div class="portfolio-initialize-help">逐行搜索股票并录入当前持股数和摊薄成本；保存时会同步最新股价计算当前资产与净值。</div>
            <div class="portfolio-initialize-rows">${rows.map((row, index) => `<div class="portfolio-initialize-row">
              <div class="field portfolio-initialize-stock" data-initialization-stock="${row.id}"><span>股票</span>${row.stock
                ? `<div class="portfolio-initialize-selected"><div><strong>${escapeHtml(row.stock.name)}</strong><small>${escapeHtml(row.stock.code)}</small></div><button type="button" data-action="clearInitializationStock" data-row-id="${row.id}">更换</button></div>`
                : `<input data-input="initializationStockSearch" data-row-id="${row.id}" value="${escapeHtml(row.query || "")}" placeholder="搜索股票名称或代码" autocomplete="off"><div data-initialization-results="${row.id}">${initializationResultsMarkup(row)}</div>`}</div>
              <label class="field"><span>持股数</span><input data-init-row-field="shares" data-row-id="${row.id}" type="number" min="0" step="any" value="${escapeHtml(row.shares || "")}" placeholder="0"></label>
              <label class="field"><span>摊薄成本</span><input data-init-row-field="averageCost" data-row-id="${row.id}" type="number" min="0" step="any" value="${escapeHtml(row.averageCost || "")}" placeholder="原币价格"></label>
              <button type="button" class="portfolio-initialize-remove" data-action="removeInitializationRow" data-row-id="${row.id}" aria-label="删除第 ${index + 1} 行">×</button>
            </div>`).join("")}</div>
          </section>
          ${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}
        </div><div class="simple-modal-foot"><button type="button" data-action="closePortfolioModal">取消</button><button class="primary" type="submit">${isEditing ? "保存导入" : "完成初始化"}</button></div></form>
      </section></div>`;
    }

    function renderRenamePortfolioModal() {
      const portfolio = activePortfolio();
      return modalShell("重命名组合", `
        <label class="field"><span>组合名称</span><input name="name" maxlength="30" required value="${escapeHtml(portfolio?.name || "")}" placeholder="例如：长期账户"></label>
      `, "renamePortfolio", "保存");
    }

    function renderDeletePortfolioModal() {
      const portfolio = activePortfolio();
      const positionCount = portfolio?.positions?.length || 0;
      const detail = positionCount ? `当前组合包含 ${positionCount} 只持仓，现金、持仓、交易流水和净值数据都会一并删除。` : "当前组合的现金、交易流水和净值数据都会一并删除。";
      return modalShell("删除组合", `
        <div class="portfolio-delete-warning">
          <strong>这是不可逆操作。</strong>
          <span>你将删除组合「${escapeHtml(portfolio?.name || "当前组合")}」。${escapeHtml(detail)}</span>
        </div>
        <label class="field"><span>请输入 0000 确认删除</span><input name="confirmCode" inputmode="numeric" pattern="0000" autocomplete="off" placeholder="0000" required></label>
      `, "deletePortfolio", "确认删除", "portfolio-delete-modal");
    }

    function renderCashModal(modal) {
      const portfolio = activePortfolio();
      const isHkus = portfolio?.accountType === "HKUS";
      return modalShell("校准现金", isHkus ? `
        <div class="grid-2"><label class="field"><span>港币余额（港元）</span><input data-input="cashAmount" name="cashHkd" inputmode="decimal" value="${formatCashAmount(portfolio.cash?.HKD)}" required></label><label class="field"><span>美元余额（美元）</span><input data-input="cashAmount" name="cashUsd" inputmode="decimal" value="${formatCashAmount(portfolio.cash?.USD)}" required></label></div>
      ` : `<label class="field"><span>人民币余额（元）</span><input data-input="cashAmount" name="cashCny" inputmode="decimal" value="${formatCashAmount(portfolio?.cash?.CNY)}" required></label>`, "calibrateCash", "保存");
    }

    function renderCashFlowModal(modal) {
      const portfolio = activePortfolio();
      const isSubscription = modal.type === "subscription";
      const currenciesForAccount = portfolio?.accountType === "HKUS" ? ["HKD", "USD"] : ["CNY"];
      return modalShell(isSubscription ? "申购" : "赎回", `
        <label class="field"><span>币种</span><select name="currency">${currenciesForAccount.map((currency) => `<option value="${currency}">${currencies[currency].label}</option>`).join("")}</select></label>
        <label class="field"><span>${isSubscription ? "申购" : "赎回"}金额（万原币）</span><input name="amount" type="number" min="0.000001" step="any" required></label>
        <div class="muted">按操作前盘中估算净值折算份额；${isSubscription ? "资金增加、份额增加" : "资金减少、份额减少"}，单位净值不因资金流入流出突变。</div>
      `, "portfolioCashFlow", isSubscription ? "确认申购" : "确认赎回");
    }

    function renderRebalanceStockSearch(modal, side) {
      const queryKey = `${side}Query`;
      const stockKey = `${side}Stock`;
      const stock = modal[stockKey];
      const isActive = modal.searchSide === side;
      return `
        <label class="field"><span>${side === "sell" ? "卖出" : "买入"}股票名称/代码搜索</span><div class="search-combobox">
          <input data-input="portfolioStockSearch" data-side="${side}" autocomplete="off" placeholder="输入股票名称、代码或拼音" value="${escapeHtml(modal[queryKey] || "")}">
          ${isActive && (state.portfolioSearchLoading || state.portfolioSearchResults.length || (modal[queryKey] && !stock)) ? `<div class="search-results show">
            ${state.portfolioSearchLoading ? `<div class="empty" style="padding:18px">正在匹配股票...</div>` : state.portfolioSearchResults.length ? state.portfolioSearchResults.map((item, index) => `<button type="button" class="result-item" data-action="selectPortfolioStock" data-side="${side}" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}</span></span></button>`).join("") : `<div class="empty" style="padding:18px">没有匹配结果，请尝试其他名称或代码。</div>`}
          </div>` : ""}
        </div></label>
      `;
    }

    function rebalanceCurrentPosition(stock, portfolio) {
      if (!stock || !portfolio) return null;
      return (portfolio.positions || []).find((item) => item.code === stock.code && item.market === stock.market) || null;
    }

    function rebalanceSidePreview(modal, side, portfolio, metrics) {
      const stock = modal[`${side}Stock`];
      const position = rebalanceCurrentPosition(stock, portfolio);
      const currency = stock?.currency || marketCurrency(stock?.market);
      const price = Number(modal[`${side}Price`] || stock?.latestPrice || position?.latestPrice || position?.averageCost || 0);
      const shares = Number(modal[`${side}Shares`] || 0);
      const currentRatio = position && metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase * 100 : 0;
      const tradeBase = price > 0 && shares > 0 ? price * shares * portfolioFx(currency, portfolioBaseCurrency(portfolio)) : 0;
      const tradeRatio = metrics.netBase ? tradeBase / metrics.netBase * 100 : 0;
      const afterRatio = side === "sell" ? Math.max(0, currentRatio - tradeRatio) : currentRatio + tradeRatio;
      return { currentRatio, tradeRatio, afterRatio };
    }

    function renderRebalancePreview(modal, side, portfolio, metrics) {
      const preview = rebalanceSidePreview(modal, side, portfolio, metrics);
      const label = side === "sell" ? "本次卖出仓位" : "本次买入仓位";
      const afterLabel = side === "sell" ? "卖出后仓位" : "买入后仓位";
      return `<div class="rebalance-preview">
        <div class="rebalance-preview-item"><span>当前持仓仓位</span><strong data-rebalance-preview="${side}-current">${preview.currentRatio.toFixed(2)}%</strong></div>
        <div class="rebalance-preview-item"><span>${label}</span><strong data-rebalance-preview="${side}-trade">${preview.tradeRatio.toFixed(2)}%</strong></div>
        <div class="rebalance-preview-item"><span>${afterLabel}</span><strong data-rebalance-preview="${side}-after">${preview.afterRatio.toFixed(2)}%</strong></div>
      </div>`;
    }

    function renderRebalanceQuick(side) {
      return `<div class="rebalance-quick">${[
        ["1/5", 0.2],
        ["1/4", 0.25],
        ["1/3", 1 / 3],
        ["1/2", 0.5]
      ].map(([label, ratio]) => `<button type="button" data-rebalance-ratio-side="${side}" data-rebalance-ratio="${ratio}">${label}</button>`).join("")}</div>`;
    }

    function renderRebalanceModal(modal) {
      const portfolio = activePortfolio();
      const metrics = portfolioMetrics(portfolio);
      const side = (key, label, className) => {
        const stock = modal[`${key}Stock`];
        const position = rebalanceCurrentPosition(stock, portfolio);
        const currency = stock?.currency || position?.currency || "";
        const price = modal[`${key}Price`] ?? (stock?.latestPrice || position?.latestPrice || "");
        return `<section class="rebalance-side ${className}">
          <h3>${label}</h3>
          ${renderRebalanceStockSearch(modal, key)}
          <div class="rebalance-fields">
            <label class="field"><span>${key === "sell" ? "卖出价格" : "买入价格"}</span><div class="input-with-suffix"><input name="${key}Price" data-rebalance-price="${key}" type="number" min="0.000001" step="any" value="${Number(price) || ""}" required><span class="input-suffix">${currency || "原币"}</span></div></label>
            <label class="field"><span class="rebalance-field-title"><span>${key === "sell" ? "卖出数量" : "买入数量"}</span>${key === "sell" && position ? `<span class="rebalance-holding-note">当前持有 ${Number(position.shares).toLocaleString("zh-CN")} 股</span>` : ""}</span><div class="input-with-suffix"><input name="${key}Shares" data-rebalance-shares="${key}" type="number" min="1" step="1" value="${Number(modal[`${key}Shares`] || 0) || ""}" ${key === "sell" && position ? `max="${Number(position.shares)}"` : ""}><span class="input-suffix">股</span></div>${renderRebalanceQuick(key)}</label>
          </div>
          ${renderRebalancePreview(modal, key, portfolio, metrics)}
        </section>`;
      };
      return modalShell("调仓", `<div class="rebalance-grid">${side("sell", "卖出", "sell")}${side("buy", "买入", "buy")}</div>`, "rebalanceTrade", "确认调仓", "rebalance-modal");
    }

    function renderPositionModal(modal) {
      const portfolio = activePortfolio();
      const isOpen = modal.type === "open";
      const position = modal.position;
      const title = isOpen ? "开仓" : modal.type === "add" ? "加仓" : "减持";
      const stockBlock = isOpen ? `
        <label class="field"><span>股票名称/代码搜索</span><div class="search-combobox">
          <input data-input="portfolioStockSearch" autocomplete="off" placeholder="输入股票名称、代码或拼音，例如：腾讯 / 0700 / AAPL" value="${escapeHtml(modal.searchQuery || "")}">
          ${(state.portfolioSearchLoading || state.portfolioSearchResults.length || (modal.searchQuery && !modal.stock)) ? `<div class="search-results show">
            ${state.portfolioSearchLoading ? `<div class="empty" style="padding:18px">正在匹配股票...</div>` : state.portfolioSearchResults.length ? state.portfolioSearchResults.map((item, index) => `<button type="button" class="result-item" data-action="selectPortfolioStock" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.code)} · ${marketLabel(item.market)}</span></span></button>`).join("") : `<div class="empty" style="padding:18px">没有匹配结果，请尝试其他名称或代码。</div>`}
          </div>` : ""}
        </div></label>
      ` : `<div class="portfolio-selected-stock"><strong>${escapeHtml(position.name)}</strong> <span class="stock-code">${escapeHtml(position.code)} · ${position.currency}</span></div>`;
      const currency = modal.stock?.currency || position?.currency || "";
      if (modal.type === "edit") return modalShell("编辑持仓", `<div class="position-edit-layout">
        <div class="position-edit-main">${stockBlock}
          <div class="grid-2 position-edit-fields"><label class="field"><span>摊薄成本</span><div class="input-with-suffix"><input name="price" type="number" min="0.000001" step="any" value="${Number(position.averageCost)}" required><span class="input-suffix">${escapeHtml(currency || "原币")}</span></div></label><label class="field"><span>持股数</span><div class="input-with-suffix"><input name="shares" type="number" min="1" step="1" value="${Number(position.shares)}" required><span class="input-suffix">股</span></div></label></div>
          <label class="field"><span>关联股池估值版本</span><select name="valuationStockId" data-input="portfolioValuationVersion"><option value="">不关联</option>${portfolioValuationVersions(position).map((stock) => `<option value="${escapeHtml(stock.id)}"${stock.id === position.valuationStockId ? " selected" : ""}>${escapeHtml(normalizeStockVersion(stock.version))} · ${escapeHtml(formatDate(stock.updatedAt || stock.marketCapUpdatedAt))}</option>`).join("")}</select><div class="position-valuation-preview" data-portfolio-valuation-preview>${renderPortfolioValuationPreview(position)}</div></label>
          <label class="field"><span>目标仓位</span><div class="position-target-control"><button type="button" data-target-weight-step="-1" aria-label="降低目标仓位">−</button><input name="targetWeight" type="text" inputmode="decimal" value="${formatPositionTargetWeight(position.targetWeight)}" required><button type="button" data-target-weight-step="1" aria-label="提高目标仓位">+</button></div><div class="position-target-quick">${[2,3,5,8,15,25,35].map((value) => `<button type="button" data-target-weight-value="${value}">${value}%</button>`).join("")}</div></label>
          <div class="position-tag-editor"><div class="position-tag-title">标签</div><div class="position-tag-input"><input name="newTag" maxlength="20" placeholder="自定义标签，如：AI / 高股息"><button type="button" data-action="addPositionTag">添加</button></div>${modal.tags.length ? `<div class="position-tags-selected">${modal.tags.map((tag) => `<button type="button" data-action="toggleEditPositionTag" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)} ×</button>`).join("")}</div>` : `<div class="muted">暂未添加标签</div>`}${allPortfolioTags().filter((tag) => !modal.tags.includes(tag)).length ? `<div class="position-tag-existing"><span>快速选择已有标签</span><div>${allPortfolioTags().filter((tag) => !modal.tags.includes(tag)).map((tag) => `<button type="button" data-action="toggleEditPositionTag" data-tag="${escapeHtml(tag)}">+ ${escapeHtml(tag)}</button>`).join("")}</div></div>` : ""}</div>
        </div>
        ${renderPositionTradePlan(position)}
      </div>`, "positionTrade", "保存", "position-edit-modal");
      const stockMarket = modal.stock?.market || position?.market || "";
      const stockConnectNote = portfolio?.accountType === "CNY" && stockMarket === "HK"
        ? `<div class="muted">港股通按港币成交价录入，成交金额将按当前汇率折算为人民币现金。</div>`
        : "";
      const suggestion = !isOpen ? positionTradeSuggestion(position, portfolio, modal.type) : null;
      const suggestedShares = suggestion?.action === modal.type ? suggestion.gridShares : 0;
      const defaultTradeShares = modal.type === "add" ? "" : (suggestedShares || "");
      const suggestionBlock = suggestion ? renderPositionTradeSuggestion(suggestion, modal.type) : "";
      const tradeFields = `<div class="grid-2"><label class="field"><span>${modal.type === "reduce" ? "卖出" : "买入"}价格</span><div class="input-with-suffix"><input name="price" type="number" min="0.000001" step="any" value="${Number(position?.latestPrice) || ""}" required><span class="input-suffix">${currency || "原币"}</span></div></label><label class="field"><span>${modal.type === "reduce" ? "卖出" : "买入"}数量</span><div class="input-with-suffix"><input name="shares" type="number" min="1" step="1" value="${defaultTradeShares}" required ${modal.type === "reduce" ? `max="${position.shares}"` : ""}><span class="input-suffix">股</span></div></label></div>`;
      const tradeMain = `${stockBlock}${suggestionBlock}${tradeFields}${stockConnectNote}${modal.type === "reduce" ? `<div class="muted">当前持有 ${Number(position.shares).toLocaleString("zh-CN")} 股</div>` : ""}`;
      const body = isOpen ? tradeMain : `<div class="position-trade-layout"><div class="position-trade-main">${tradeMain}</div>${renderPositionTradePlanReadonly(position, modal.type === "reduce" ? "sell" : "buy")}</div>`;
      return modalShell(title, body, "positionTrade", modal.type === "reduce" ? "确认减持" : "确认买入", isOpen ? "" : "position-trade-modal");
    }

    function normalizedPositionTradePlan(position) {
      const source = position?.tradePlan || {};
      const normalizeSide = (side) => Array.from({ length: 3 }, (_, index) => {
        const row = Array.isArray(source[side]) ? source[side][index] : null;
        return { price: Number(row?.price) || "", shares: Number(row?.shares) || "", done: Boolean(row?.done) };
      });
      return { buy: normalizeSide("buy"), sell: normalizeSide("sell") };
    }

    function renderPositionTradeSuggestion(suggestion, type) {
      const isAdd = type === "add";
      const title = isAdd ? "加仓建议" : "减仓建议";
      const summary = `当前 ${suggestion.currentWeight.toFixed(2)}% · 目标 ${suggestion.targetWeight.toFixed(2)}% · 差额 ${suggestion.gapPercent > 0 ? "+" : ""}${suggestion.gapPercent.toFixed(2)}%`;
      let message = "";
      if (suggestion.targetWeight <= 0) {
        message = "尚未设置有效目标仓位，暂不提供建议。";
      } else if (suggestion.action === type) {
        message = `建议${isAdd ? "买入" : "卖出"}约 <strong>${suggestion.fullShares.toLocaleString("zh-CN")} 股</strong>到达目标；按四档网格分批，本次建议 <strong>${suggestion.gridShares.toLocaleString("zh-CN")} 股</strong>。`;
      } else if (isAdd && suggestion.gapPercent < 0) {
        message = `当前仓位已超配 ${Math.abs(suggestion.gapPercent).toFixed(2)}%，不建议加仓。`;
      } else if (!isAdd && suggestion.gapPercent > 0) {
        message = `当前仓位仍低配 ${suggestion.gapPercent.toFixed(2)}%，不建议减仓。`;
      } else {
        message = `当前仓位已接近目标，不建议${isAdd ? "加仓" : "减仓"}。`;
      }
      return `<div class="trade-suggestion"><strong>${title}</strong><br>${summary}<br>${message}</div>`;
    }

    function parsePositionTargetWeight(value) {
      const parsed = Number(String(value ?? "").replace("%", "").trim());
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function formatPositionTargetWeight(value) {
      const parsed = Number(value) || 0;
      return `${Number.isInteger(parsed) ? parsed : parsed.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}%`;
    }

    function renderPositionTradePlan(position) {
      const plan = normalizedPositionTradePlan(position);
      const currency = position?.currency || "原币";
      const valuationStock = portfolioValuationStock(position);
      const rows = (side, label) => plan[side].map((row, index) => {
        const computed = positionPlanValuation(position, row.price);
        return `<div class="position-plan-row plan-${side}">
        <span>${label}${index + 1}</span>
        <div class="input-with-suffix"><input name="plan_${side}_${index}_price" data-plan-price data-plan-side="${side}" data-plan-index="${index}" type="number" min="0" step="any" value="${row.price}" placeholder="价格" aria-label="${label}${index + 1}价格"><span class="input-suffix">${currency}</span></div>
        <div class="input-with-suffix position-plan-metric"><input data-plan-metric="upside" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="${computed ? formatPositionPlanNumber(computed.upside * 100) : ""}" placeholder="--" aria-label="${label}${index + 1} Upside" ${valuationStock ? "" : "disabled"}><span class="input-suffix">%</span></div>
        <div class="input-with-suffix position-plan-metric"><input data-plan-metric="forwardPE" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="${computed ? formatPositionPlanNumber(computed.forwardPE) : ""}" placeholder="--" aria-label="${label}${index + 1} Forward PE" ${valuationStock ? "" : "disabled"}><span class="input-suffix">x</span></div>
        <div class="input-with-suffix position-plan-metric"><input data-plan-metric="shareholderReturnRate" data-plan-side="${side}" data-plan-index="${index}" type="number" step="any" value="${computed ? formatPositionPlanNumber(computed.shareholderReturnRate * 100) : ""}" placeholder="--" aria-label="${label}${index + 1}前瞻股东回报率" ${valuationStock ? "" : "disabled"}><span class="input-suffix">%</span></div>
        <div class="input-with-suffix"><input name="plan_${side}_${index}_shares" type="number" min="0" step="1" value="${row.shares}" placeholder="股数" aria-label="${label}${index + 1}股数"><span class="input-suffix">股</span></div>
        <input name="plan_${side}_${index}_done" type="checkbox" ${row.done ? "checked" : ""} aria-label="${label}${index + 1}完成">
      </div>`;
      }).join("");
      return `<section class="position-plan"><h3>加减仓计划</h3><p class="position-plan-help">${valuationStock ? "填写价格，三项指标自动计算；也可只填写任一指标反算价格和其余两项。" : "关联股池估值版本后，可按价格查看指标或用任一指标反算价格。"}</p><div class="position-plan-head"><span>计划</span><span>价格</span><span>Upside</span><span>Forward PE</span><span>前瞻股东回报率</span><span>股数</span><span>完成</span></div>${rows("buy", "买点")}${rows("sell", "卖点")}</section>`;
    }

    function renderPositionTradePlanReadonly(position, side) {
      const plan = normalizedPositionTradePlan(position)[side];
      const label = side === "buy" ? "买点" : "卖点";
      const currency = position?.currency || "原币";
      const rows = plan.map((row, index) => {
        const computed = positionPlanValuation(position, row.price);
        return `<div class="position-plan-row plan-${side}"><span>${label}${index + 1}</span><div class="position-plan-value">${row.price ? `${row.price} ${currency}` : "--"}</div><div class="position-plan-value">${renderPositionPlanMetricValue(computed, "upside")}</div><div class="position-plan-value">${renderPositionPlanMetricValue(computed, "forwardPE")}</div><div class="position-plan-value">${renderPositionPlanMetricValue(computed, "shareholderReturnRate")}</div><div class="position-plan-value">${row.shares ? `${row.shares} 股` : "--"}</div><input type="checkbox" data-plan-live-done data-position-id="${position.id}" data-plan-side="${side}" data-plan-index="${index}" ${row.done ? "checked" : ""} aria-label="${label}${index + 1}完成"></div>`;
      }).join("");
      return `<section class="position-plan-readonly"><div class="position-plan-head"><span>计划</span><span>价格</span><span>Upside</span><span>Forward PE</span><span>前瞻股东回报率</span><span>股数</span><span>完成</span></div>${rows}</section>`;
    }

    function currentPositionPlanValuationId() {
      const selected = document.querySelector("[data-input='portfolioValuationVersion']")?.value;
      return selected === undefined ? state.portfolioModal?.position?.valuationStockId : selected;
    }

    function syncPositionPlanRow(side, index, sourceMetric = "") {
      const position = state.portfolioModal?.position;
      if (!position || state.portfolioModal?.type !== "edit") return;
      const selectedId = currentPositionPlanValuationId();
      const stock = portfolioValuationStock(position, selectedId);
      const priceInput = document.querySelector(`[data-plan-price][data-plan-side='${side}'][data-plan-index='${index}']`);
      const metricInputs = [...document.querySelectorAll(`[data-plan-metric][data-plan-side='${side}'][data-plan-index='${index}']`)];
      metricInputs.forEach((input) => { input.disabled = !stock; });
      if (!stock || !priceInput) {
        metricInputs.forEach((input) => { input.value = ""; input.setCustomValidity(""); input.removeAttribute("aria-invalid"); });
        return;
      }
      if (sourceMetric) {
        const sourceInput = metricInputs.find((input) => input.dataset.planMetric === sourceMetric);
        if (!sourceInput) return;
        if (!sourceInput.value.trim()) {
          priceInput.value = "";
          metricInputs.forEach((input) => { input.value = ""; input.setCustomValidity(""); input.removeAttribute("aria-invalid"); });
          return;
        }
        const nextPrice = positionPlanPriceFromMetric(position, sourceMetric, sourceInput.value, selectedId);
        if (!(nextPrice > 0)) {
          const message = sourceMetric === "upside"
            ? "Upside 需大于 -100%，且估值需能计算出正的前瞻市值。"
            : sourceMetric === "forwardPE"
            ? "当前估值缺少有效的前瞻利润，无法按 Forward PE 反算。"
            : "前瞻股东回报率和前瞻股东回报需为非零值。";
          sourceInput.setCustomValidity(message);
          sourceInput.setAttribute("aria-invalid", "true");
          sourceInput.title = message;
          return;
        }
        sourceInput.setCustomValidity("");
        sourceInput.removeAttribute("aria-invalid");
        sourceInput.removeAttribute("title");
        priceInput.value = formatPositionPlanNumber(nextPrice, 6);
      }
      const computed = positionPlanValuation(position, priceInput.value, selectedId);
      metricInputs.forEach((input) => {
        input.setCustomValidity("");
        input.removeAttribute("aria-invalid");
        input.removeAttribute("title");
        if (!computed) {
          input.value = "";
          return;
        }
        if (input.dataset.planMetric === sourceMetric) return;
        const value = input.dataset.planMetric === "forwardPE"
          ? computed.forwardPE
          : computed[input.dataset.planMetric] == null ? null : computed[input.dataset.planMetric] * 100;
        input.value = formatPositionPlanNumber(value);
      });
    }

    function refreshPositionPlanValuations() {
      if (state.portfolioModal?.type !== "edit") return;
      const hasValuation = Boolean(portfolioValuationStock(state.portfolioModal.position, currentPositionPlanValuationId()));
      const help = document.querySelector(".position-plan-help");
      if (help) help.textContent = hasValuation
        ? "填写价格，三项指标自动计算；也可只填写任一指标反算价格和其余两项。"
        : "关联股池估值版本后，可按价格查看指标或用任一指标反算价格。";
      for (const side of ["buy", "sell"]) {
        for (let index = 0; index < 3; index += 1) syncPositionPlanRow(side, index);
      }
    }

    function renderSquare() {
      const query = state.query.trim().toLowerCase();
      let profiles = [...state.squareProfiles];
      if (query) profiles = profiles.filter((item) => `${item.nickname} ${item.email || ""}`.toLowerCase().includes(query));
      profiles.sort((a, b) => {
        if (state.squareSort === "count") return (b.stockCount || 0) - (a.stockCount || 0);
        return String(b.latestPublishedAt || "").localeCompare(String(a.latestPublishedAt || ""));
      });
      return `
        <div class="toolbar">
          <input data-input="searchList" placeholder="搜索发布者昵称" value="${escapeHtml(state.query)}">
          <select data-input="squareSort">
            <option value="recent" ${state.squareSort === "recent" ? "selected" : ""}>最近发布</option>
            <option value="count" ${state.squareSort === "count" ? "selected" : ""}>发布数量</option>
          </select>
        </div>

    function renderPublisherSelect() {

          ${state.followedPublishers.map((item) => `<option value="${item.id}" ${state.viewPublisherId === item.id ? "selected" : ""}>${escapeHtml(item.nickname)} 的股池</option>`).join("")}
        </select>
      `;
    }

    function compactStockSearchValue(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[^\u4e00-\u9fffa-z0-9]+/g, "");
    }

    function stockMatchesPoolSearch(stock, rawQuery) {
      const tokens = String(rawQuery ?? "").trim().split(/\s+/).map(compactStockSearchValue).filter(Boolean);
      if (!tokens.length) return true;
      const aliases = Array.isArray(stock.aliases) ? stock.aliases.join(" ") : stock.aliases;
      const code = String(stock.code || "");
      const codeWithoutLeadingZeros = code.replace(/^0+(?=\d)/, "");
      const searchableValues = [
        stock.name,
        code,
        codeWithoutLeadingZeros,
        aliases,
        stock.market,
        stock.exchange
      ].map(compactStockSearchValue).filter(Boolean);
      return tokens.every((token) => searchableValues.some((value) => value.includes(token)));
    }

    function userStocks() {
      const query = state.query.trim();
      const viewingOwn = state.viewPublisherId === "own";
      let rows = viewingOwn ? [...state.stocks] : [...state.publisherStocks];
      if (state.filter !== "ALL") rows = rows.filter((item) => item.market === state.filter);
      if (viewingOwn && state.shareFilter === "SHARED") rows = rows.filter((item) => item.isShared);
      if (query) rows = rows.filter((item) => stockMatchesPoolSearch(item, query));
      rows.sort((a, b) => {
        if (state.sort.key === "manual") return (a.manualOrder || 0) - (b.manualOrder || 0);
        const va = listSortValue(a, state.sort.key);
        const vb = listSortValue(b, state.sort.key);
        return state.sort.dir === "asc" ? va - vb : vb - va;
      });
      return rows;
    }

    function listSortValue(stock, key) {
      const c = calc(stock);
      const latest = Number(stock.latestMarketCapCny) || 0;
      if (key === "shareholderReturnRate") return shareholderReturnRateForList(stock, c) ?? -Infinity;
      if (key === "dividendYield") return latest ? (Number(stock.expectedDividendCny) || 0) / latest : -Infinity;
      if (key === "buybackRate") return latest ? (Number(stock.expectedBuybackCny) || 0) / latest : -Infinity;
      return c[key] ?? -Infinity;
    }

    function renderTable() {
      const rows = userStocks();
      const viewingOwn = state.viewPublisherId === "own";
      if (state.tableLoading) return renderTableSkeleton(viewingOwn);
      if (!rows.length) {
        const title = viewingOwn ? "还没有匹配的股票" : "这个分享股池暂无已发布股票";
        const text = viewingOwn ? "从股票搜索开始录入市值、盈利假设和估值参数，建立你的研究股池。" : "可以切换其他关注人，或回到自己的股池继续维护研究记录。";
        return `
          <section class="table-panel">
            <div class="empty">
              <strong>${title}</strong>
              <p>${text}</p>
              ${viewingOwn ? `<button class="primary stock-add-button" data-action="newStock">+添加股票</button>` : ""}
            </div>
          </section>
        `;
      }
      return `
        <section class="table-panel stock-pool-table">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  ${viewingOwn ? `<th class="drag-col sticky-col" aria-label="拖拽排序"></th>` : ""}
                  <th class="sticky-col ${viewingOwn ? "stock-col-after-drag" : ""}">股票名称</th>
                  <th>版本</th>
                  <th class="num">最新市值<br><span class="stock-code">CNY 亿</span></th>
                  ${sortTh("upside", "Upside", "num")}
                  ${sortTh("forwardPE", "Forward PE", "num")}
                  ${sortTh("shareholderReturnRate", "股东回报率", "num")}
                  ${sortTh("dividendYield", "股息率", "num")}
                  ${sortTh("buybackRate", "回购率", "num")}
                  <th class="num">前瞻市值<br><span class="stock-code">CNY 亿</span></th>
                  <th class="num">前瞻利润<br><span class="stock-code">CNY 亿</span></th>
                  <th class="num">前瞻 PE</th>
                  <th class="num">净现金<br><span class="stock-code">CNY 亿</span></th>
                  <th class="num">现金折扣</th>
                  <th class="num">前瞻股东回报<br><span class="stock-code">CNY 亿</span></th>
                  ${viewingOwn ? "<th class=\"share-head\">分享</th><th>来源</th>" : ""}
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((stock) => renderRow(stock, viewingOwn)).join("")}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderTableSkeleton(viewingOwn) {
      const colSpan = viewingOwn ? 18 : 15;
      return `
        <section class="table-panel stock-pool-table">
          <div class="table-scroll">
            <table>
              <thead><tr><th colspan="${colSpan}">正在加载股池数据</th></tr></thead>
              <tbody>${Array.from({ length: 6 }).map(() => `<tr><td colspan="${colSpan}"><div class="skeleton-row"></div></td></tr>`).join("")}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function sortTh(key, label, cls = "") {
      const active = state.sort.key === key;
      const arrow = active ? (state.sort.dir === "asc" ? " ↑" : " ↓") : "";
      return `<th class="sortable ${cls}" data-sort="${key}">${label}${arrow}</th>`;
    }

    function renderRow(stock, viewingOwn) {
      const c = calc(stock);
      const sourceDeleted = Boolean(stock.sourceDeletedAt);
      const shareholderRate = shareholderReturnRateForList(stock, c);
      const latest = Number(stock.latestMarketCapCny) || 0;
      const dividendYield = latest ? (Number(stock.expectedDividendCny) || 0) / latest : null;
      const buybackRate = latest ? (Number(stock.expectedBuybackCny) || 0) / latest : null;
      return `
        <tr class="stock-row" data-stock-row="${stock.id}">
          ${viewingOwn ? `<td data-label="排序" class="drag-col sticky-col"><span class="drag-handle" draggable="true" data-drag-id="${stock.id}" title="拖拽调整顺序" aria-label="拖拽调整顺序">⠿</span></td>` : ""}
          <td data-label="股票名称" class="sticky-col ${viewingOwn ? "stock-col-after-drag" : ""}">
            <div class="stock-name">${escapeHtml(stock.name || "--")}</div>
            <div class="stock-code">${escapeHtml(stock.code || "--")}</div>
          </td>
          <td data-label="版本" class="version-cell" title="${escapeHtml(normalizeStockVersion(stock.version))}">${escapeHtml(normalizeStockVersion(stock.version))}</td>
          <td data-label="最新市值" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.latestMarketCapCny)}</td>
          <td data-label="Upside" class="kpi plain-kpi ${Number(c.upside) >= 0 ? "gain" : "loss"}">${sourceDeleted ? "--" : percent(c.upside)}</td>
          <td data-label="Forward PE" class="kpi plain-kpi">${sourceDeleted || !c.forwardPE ? "--" : trimNumber(c.forwardPE) + "x"}</td>
          <td data-label="股东回报率" class="kpi ${Number(shareholderRate) >= 0 ? "gain" : "loss"}">${sourceDeleted ? "--" : percent(shareholderRate)}</td>
          <td data-label="股息率" class="kpi">${sourceDeleted ? "--" : percent(dividendYield)}</td>
          <td data-label="回购率" class="kpi">${sourceDeleted ? "--" : percent(buybackRate)}</td>
          <td data-label="前瞻市值" class="num">${sourceDeleted ? "--" : moneyYiCny(c.expectedMarketCapCny)}</td>
          <td data-label="前瞻利润" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.expectedProfitCny)}</td>
          <td data-label="前瞻 PE" class="num">${sourceDeleted || !stock.expectedPE ? "--" : trimNumber(stock.expectedPE) + "x"}</td>
          <td data-label="净现金" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.netCashCny)}</td>
          <td data-label="现金折扣" class="num">${sourceDeleted ? "--" : stock.netCashDiscountRate ?? "--"}</td>
          <td data-label="前瞻股东回报" class="num">${sourceDeleted ? "--" : moneyYiCny(stock.expectedShareholderReturnCny)}</td>
          ${viewingOwn ? `
            <td data-label="分享" class="share-cell">${renderShareState(stock)}</td>
            <td data-label="来源">${renderSourceCell(stock)}</td>
          ` : ""}
          <td data-label="操作">
            <div class="actions">
              ${viewingOwn ? `
                <button class="icon" title="编辑" data-action="edit" data-id="${stock.id}">✎</button>
                <button class="icon" title="上提1位" data-action="moveUp" data-id="${stock.id}">↑</button>
                <button class="icon" title="下提1位" data-action="moveDown" data-id="${stock.id}">↓</button>
                ${stock.sourceType === "subscribed" ? `
                  <button class="text-action" title="取消订阅" data-action="unsubscribeStock" data-id="${stock.id}">取消订阅</button>
                  <button class="text-action" title="转为我的股票" data-action="convertToOwn" data-id="${stock.id}">转为我的</button>
                ` : ""}
                <button class="icon danger" title="删除" data-action="delete" data-id="${stock.id}">×</button>
              ` : `
                <button class="text-action" data-action="copySharedStock" data-id="${stock.id}">一键复制</button>
                <button class="primary text-action" data-action="subscribeStock" data-id="${stock.id}">订阅</button>
                <button class="text-action" data-action="openPublicationHistory" data-id="${stock.id}">历史</button>
              `}
            </div>
          </td>
        </tr>
      `;
    }

    function renderShareState(stock) {
      if (stock.sourceDeletedAt) {
        return `<span class="badge unshared">订阅失效</span>`;
      }
      if (!stock.isShared) {
        const sharing = state.sharingStockId === stock.id;
        return `<button class="text-action share-action" data-action="shareStock" data-id="${stock.id}" ${sharing ? "disabled" : ""}>${sharing ? "分享中..." : "去分享"}</button>`;
      }
      return `
        <div class="share-state">
          <span class="badge shared">已分享</span>
          <button class="text-action share-action" data-action="openPublicationHistory" data-id="${stock.id}">历史</button>
        </div>
      `;
    }

    function renderPublicationHistory() {
      const modal = state.publicationHistory;
      if (!modal.open) return "";
      const stock = modal.stock || {};
      return `
        <div class="history-modal open" data-history-backdrop="true">
          <section class="history-panel">
            <div class="history-head">
              <div>
                <h3>${escapeHtml(stock.name || "发布历史")}</h3>

            </div>
            <div class="history-body">
              ${modal.loading ? `<div class="empty">正在加载发布历史...</div>` : ""}
              ${modal.error ? `<div class="form-error">${escapeHtml(modal.error)}</div>` : ""}
              ${!modal.loading && !modal.error ? renderPublicationHistoryRows(modal.rows) : ""}
            </div>
          </section>
        </div>
      `;
    }

    function renderDeleteConfirm() {
      const modal = state.deleteConfirm;
      if (!modal.open) return "";
      return `
        <div class="history-modal open" data-delete-backdrop="true">
          <section class="confirm-panel">
            <div class="confirm-head">
              <h3>删除股票</h3>
              <button class="icon" data-action="closeDeleteConfirm" title="关闭" ${modal.deleting ? "disabled" : ""}>×</button>
            </div>
            <div class="confirm-body">
              <p>确认删除该股票吗？如有分享，也同步一并删除。</p>
              ${modal.stockName ? `<div class="stock-code">${escapeHtml(modal.stockName)}</div>` : ""}
              ${modal.error ? `<div class="form-error">${escapeHtml(modal.error)}</div>` : ""}
              <div class="confirm-actions">
                <button data-action="closeDeleteConfirm" ${modal.deleting ? "disabled" : ""}>取消</button>
                <button class="danger-primary" data-action="confirmDeleteStock" ${modal.deleting ? "disabled" : ""}>${modal.deleting ? "删除中..." : "确认删除"}</button>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderPublicationHistoryRows(rows) {
      if (!rows.length) return `<div class="empty">还没有发布快照。</div>`;
      return `
        <div class="history-list">
          ${rows.map((row, index) => renderPublicationHistoryItem(row, rows[index + 1])).join("")}
        </div>
      `;
    }

    function renderPublicationHistoryItem(row, previousRow) {
      const stock = stockFromPublication(row);
      const previous = previousRow ? stockFromPublication(previousRow) : null;
      const c = row.payload?.computed || calc(stock);
      return `
        <article class="history-item">
          <div class="history-item-head">
            <div>
              <h4>V${Number(row.version_number) || "--"} · ${formatDateTime(row.created_at)}</h4>
              <div class="stock-code">${escapeHtml(stock.forecastYear || "--")} · ${escapeHtml(marketLabel(stock.market))}</div>
            </div>
            <div class="history-delta">${renderPublicationDeltas(stock, previous)}</div>
          </div>
          ${row.change_note ? `<p class="history-note">${escapeHtml(row.change_note)}</p>` : ""}
          <div class="history-grid">
            ${historyMetric("当时市值", moneyYiCny(stock.latestMarketCapCny))}
            ${historyMetric("前瞻市值", moneyYiCny(c.expectedMarketCapCny), { meta: stock.forecastYear ? `@${stock.forecastYear}` : "" })}
            ${historyMetric("Upside", percent(c.upside))}
            ${historyMetric("前瞻利润", moneyYiCny(stock.expectedProfitCny), { meta: stock.expectedPERemark || "", tooltip: stock.expectedPERemark || "" })}
            ${historyMetric("前瞻估值", stock.expectedPE ? `${trimNumber(stock.expectedPE)}x` : "--")}
            ${historyMetric("Forward PE", c.forwardPE ? `${trimNumber(c.forwardPE)}x` : "--")}
            ${historyMetric("净现金", moneyYiCny(stock.netCashCny))}
            ${historyMetric("现金折扣", percent(stock.netCashDiscountRate))}
            ${historyMetric("净现金口径", stock.netCashScope || "--", { text: true, tooltip: stock.netCashScope || "" })}
            ${historyMetric("前瞻股东回报", moneyYiCny(stock.expectedShareholderReturnCny))}
            ${historyMetric("前瞻股东回报率", percent(c.shareholderReturnRate))}
            ${historyMetric("股东回报政策", stock.shareholderReturnRemark || "--", { text: true, tooltip: stock.shareholderReturnRemark || "" })}
          </div>
        </article>
      `;
    }

    function historyMetric(label, value, options = {}) {
      const tooltip = options.tooltip ? ` data-tooltip="${escapeHtml(options.tooltip)}" title="${escapeHtml(options.tooltip)}"` : "";
      const meta = options.meta ? `<em${tooltip}>${escapeHtml(options.meta)}</em>` : "";
      const valueTooltip = options.text && options.tooltip ? ` data-tooltip="${escapeHtml(options.tooltip)}" title="${escapeHtml(options.tooltip)}"` : "";
      return `
        <div class="history-metric">
          <div class="history-metric-title"><span>${escapeHtml(label)}</span>${meta}</div>
          <strong class="${options.text ? "text-value" : ""}"${valueTooltip}>${escapeHtml(value)}</strong>
        </div>
      `;
    }

    function renderPublicationDeltas(stock, previous) {
      if (!previous) return `<span class="badge soft">首个版本</span>`;
      const items = [
        deltaBadge("市值", previous.latestMarketCapCny, stock.latestMarketCapCny, ""),
        deltaBadge("利润", previous.expectedProfitCny, stock.expectedProfitCny, ""),
        deltaBadge("PE", previous.expectedPE, stock.expectedPE, "x"),
        deltaBadge("净现金", previous.netCashCny, stock.netCashCny, "")
      ].filter(Boolean);
      return items.length ? items.join("") : `<span class="badge soft">核心假设无变化</span>`;
    }

    function deltaBadge(label, before, after, suffix) {
      const a = Number(after);
      const b = Number(before);
      if (!Number.isFinite(a) || !Number.isFinite(b) || a === b) return "";
      return `<span class="badge soft">${escapeHtml(label)} ${trimNumber(b)}${suffix} → ${trimNumber(a)}${suffix}</span>`;
    }

    function renderSourceCell(stock) {
      if (stock.sourceDeletedAt) {
        return `

              <span class="badge warn">已删除</span>
            </div>
          </div>

      }
      if (!stock.sourceStockId) return "";
      const typeLabel = stock.sourceType === "subscribed" ? "订阅" : stock.sourceType === "copied" ? "复制" : "来源";
      return `
        <div class="source-cell">
          <div class="source-tags">
            <strong>${escapeHtml(stock.sourceNickname || stock.sourceUserId || "--")}</strong>
            <span class="badge source">${typeLabel}</span>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>钞·作业</title>
  <style>
    :root {
      --bg: #e7edf5;
      --panel: #ffffff;
      --panel-2: #edf2f8;
      --text: #071426;
      --muted: #40516a;
      --line: #aebccc;
      --soft: #d7e0eb;
      --brand: #075ee8;
      --brand-strong: #073b93;
      --brand-soft: #dceaff;
      --accent: #0057d9;
      --gain: #c01b12;
      --loss: #087443;
      --warn: #8a4b00;
      --shadow: none;
      --shadow-soft: none;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --focus: 0 0 0 3px rgba(7, 94, 232, 0.25);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      min-height: 32px;
      padding: 0 11px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    button:hover { border-color: #98a6b8; background: #f8fafc; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    button.primary:hover { background: var(--brand-strong); }
    button.icon { width: 32px; padding: 0; }
    button.danger { color: #b42318; }
    button.ghost { background: transparent; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      background: white;
      color: var(--text);
      outline: none;
      min-height: 34px;
      font-size: 13px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(15, 95, 85, 0.12);
    }
    textarea { min-height: 76px; resize: vertical; }

    .shell { min-height: 100vh; }
    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .topbar-inner {
      width: min(1480px, calc(100vw - 48px));
      min-height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .topbar-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding-right: 18px;
      border-right: 1px solid #d9e2df;
    }
    .brand-logo {
      display: block;
      width: 154px;
      height: 44px;
      object-fit: contain;
      object-position: left center;
      flex: 0 0 auto;
    }
    .brand h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .brand span { color: var(--muted); font-size: 12px; }
    .userbar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }

    .workspace {
      width: min(1500px, calc(100vw - 48px));
      margin: 18px auto 44px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) repeat(6, auto);
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      box-shadow: var(--shadow-soft);
    }
    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
    }
    .nav-primary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .nav-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px;
      width: fit-content;
      box-shadow: var(--shadow-soft);
    }
    .nav-tabs button {
      border: 0;
      background: transparent;
      min-width: 72px;
      min-height: 30px;
      font-weight: 700;
    }
    .nav-tabs button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      box-shadow: none;
    }
    .topbar-nav { flex-wrap: nowrap; }
    .filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: var(--panel);
    }
    .segmented button {
      border: 0;
      border-radius: 0;
      border-right: 1px solid var(--line);
      min-width: 58px;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active {
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 700;
    }

    .table-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-scroll { overflow: auto; max-height: calc(100vh - 164px); }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1320px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
      white-space: nowrap;
    }
    th {
      background: var(--panel-2);
      color: #344054;
      font-weight: 750;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--brand); }
    tbody tr:hover { background: #f8fbfb; }
    tbody tr.stock-row.dragging { opacity: .45; }
    tbody tr.stock-row.drag-over-before td { box-shadow: inset 0 2px 0 var(--brand); }
    tbody tr.stock-row.drag-over-after td { box-shadow: inset 0 -2px 0 var(--brand); }
    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 28px;
      color: #98a2b3;
      cursor: grab;
      user-select: none;
      vertical-align: middle;
      font-size: 16px;
    }
    .drag-handle:active { cursor: grabbing; }
    th.drag-col,
    td.drag-col {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      padding-left: 6px;
      padding-right: 6px;
      text-align: center;
    }
    .stock-name { font-weight: 760; }
    .stock-code { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .version-cell {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 760;
      color: #344054;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--soft);
      color: #344054;
      font-size: 12px;
      font-weight: 650;
    }
    .gain { color: var(--gain); font-weight: 700; }
    .loss { color: var(--loss); font-weight: 700; }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 5px; align-items: center; }
    .tax-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tax-header label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .tax-header input {
      width: 14px;
      height: 14px;
      padding: 0;
      box-shadow: none;
      order: 2;
    }
    .empty {
      padding: 42px 22px;
      text-align: center;
      color: var(--muted);
    }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .login-panel {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .login-panel h1 { margin: 0 0 7px; font-size: 22px; }
    .login-panel p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-size: 14px; }
    .login-actions { display: grid; gap: 10px; }
    .oauth-button {
      width: 100%;
      min-height: 38px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0;
    }
    .login-divider::before,
    .login-divider::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; color: #344054; font-weight: 700; }
    .form-row { display: grid; grid-template-columns: 1fr 104px; gap: 8px; align-items: end; }
    .notice {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #b8d3ff;
      background: #eef5ff;
      color: #163b76;
      border-radius: 5px;
      line-height: 1.55;
      font-size: 13px;
    }
    .share-banner {
      margin-bottom: 12px;
      padding: 11px 12px;
      border: 1px solid #b8d3ff;
      background: #eef5ff;
      color: #163b76;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .update-banner {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #f1d28a;
      background: #fff8e5;
      color: #7a4b00;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .publisher-panel {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .publisher-panel h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }
    .publisher-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }
    .share-settings {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: #344054;
      font-size: 13px;
      font-weight: 600;
    }
    .share-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: #344054;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .share-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .share-switch-track {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: #d0d7e2;
      transition: background .16s ease, box-shadow .16s ease;
      flex: 0 0 auto;
    }
    .share-switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.24);
      transition: transform .16s ease;
    }
    .share-switch input:checked + .share-switch-track {
      background: var(--brand);
    }
    .share-switch input:checked + .share-switch-track::after {
      transform: translateX(16px);
    }
    .share-switch input:focus-visible + .share-switch-track {
      box-shadow: 0 0 0 3px rgba(15, 95, 85, 0.14);
    }
    .share-switch input:disabled + .share-switch-track,
    .share-switch input:disabled ~ span {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .nav-pool-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      flex: 0 1 auto;
      min-width: 0;
      margin-left: auto;
    }
    .nav-publisher-select {
      width: 130px;
      min-width: 130px;
      max-width: 130px;
      flex: 0 0 130px;
      border-color: rgba(15, 95, 85, 0.38);
      background-color: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(15, 95, 85, 0.08);
    }
    .share-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .share-state, .source-cell {
      display: grid;
      gap: 4px;
    }
    .share-cell { text-align: center; }
    .share-cell .share-state { justify-items: center; }
    .share-cell button { margin: 0 auto; }
    .share-head { text-align: center; }
    .share-action {
      min-height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.2;
    }
    .share-state strong, .source-cell strong { font-size: 13px; }
    .source-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge.soft { font-weight: 500; color: var(--muted); background: #f4f6fa; }
    .badge.warn { background: #fff4cc; color: #805400; }
    .publish-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .publish-box label {
      display: block;
      font-weight: 700;
      color: #344054;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .publish-box textarea { min-height: 82px; }
    .publish-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .publish-actions button {
      min-width: 112px;
      border-color: #c2410c;
      background: #c2410c;
      color: white;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(194, 65, 12, 0.16);
    }
    .publish-actions button:hover:not(:disabled) {
      border-color: #9a3412;
      background: #9a3412;
    }
    .history-modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 30;
      background: rgba(15, 23, 42, 0.36);
      padding: 32px;
      overflow: auto;
    }
    .history-modal.open { display: grid; place-items: start center; }
    .history-panel {
      width: min(1040px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.2);
      overflow: hidden;
    }
    .history-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .history-head h3 { margin: 0; font-size: 18px; }
    .history-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .history-body {
      padding: 16px 18px 18px;
      background: #f6f8fa;
      max-height: min(760px, calc(100vh - 150px));
      overflow: auto;
    }
    .history-list {
      display: grid;
      gap: 12px;
    }
    .history-item {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px;
      display: grid;
      gap: 12px;
    }
    .history-item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .history-item h4 { margin: 0; font-size: 15px; }
    .history-note {
      margin: 0;
      color: #344054;
      line-height: 1.55;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .history-metric {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #f8fafc;
      padding: 8px;
      min-height: 58px;
      min-width: 0;
    }
    .history-metric-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
      min-width: 0;
    }
    .history-metric-title span,
    .history-metric-title em {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-style: normal;
    }
    .history-metric-title em {
      max-width: 58%;
      color: #667085;
      text-align: right;
    }
    .history-metric strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      overflow-wrap: anywhere;
    }
    .history-metric strong.text-value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow-wrap: normal;
    }
    .history-metric [data-tooltip] { cursor: help; }
    .history-metric [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 8px;
      right: 8px;
      top: calc(100% - 4px);
      z-index: 4;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #111827;
      color: white;
      font-size: 12px;
      line-height: 1.5;
      white-space: normal;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
    }
    .history-delta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .form-error {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #f6c0b7;
      background: #fff3f0;
      color: #912018;
      border-radius: 6px;
      line-height: 1.5;
      text-align: left;
      font-size: 13px;
    }
    .readonly-note {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #d7e3f8;
      background: #f2f6ff;
      color: #24436f;
      border-radius: 6px;
      line-height: 1.5;
      font-size: 13px;
    }
    .disclaimer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .square-card, .admin-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }
    .square-card h3, .admin-card h3 { margin: 0; font-size: 16px; }
    .mini-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .mini-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--soft);
      padding-top: 7px;
    }
    .admin-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .admin-list {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .admin-user-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      min-height: 62px;
      text-align: left;
      padding: 10px;
      display: grid;
      gap: 4px;
    }
    .admin-user-row.active { background: #e9f0fb; }
    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .admin-actions input { width: min(360px, 100%); }
    .private-row { background: #fffdf6; }

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: none;
      z-index: 20;
    }
    .drawer.open { display: block; }
    .drawer-panel {
      width: min(1320px, 100vw);
      height: 100%;
      margin-left: auto;
      background: var(--panel);

    .position-plan-row input[type="checkbox"] { width: 18px; min-height: 18px; margin: 0 auto; accent-color: var(--brand); }

    .rebalance-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; justify-content: center; min-width: 0; }

    /* A+B visual system: clean brokerage terminal density with calmer research-workbench surfaces. */
    body {
      background:
        linear-gradient(180deg, #f7faf9 0, #f3f6f7 260px, #eef3f2 100%);

      border-color: #d6dfdd;

      background: #fff;
      color: #667085;
      box-shadow: none;
    }

    .journal-filters { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 14px; margin:0 0 16px; padding:12px 14px 14px; border:1px solid #bdcfcb; border-radius:6px; background:#e7efed; box-shadow:0 3px 10px rgba(30,65,57,.045); }
    .journal-filter-action { display:flex; grid-column:2; grid-row:1; justify-content:flex-end; }
    .journal-filter-action .primary { min-height:30px; }
    .journal-filter-row { grid-column:1/-1; min-width:0; }
    .journal-filter-action + .journal-filter-row { grid-column:1; grid-row:1; }
    .journal-filter-tags { display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
    .journal-filter-tag { display:inline-flex; align-items:baseline; min-height:28px; padding:4px 9px; border:1px solid #d7e1de; border-radius:4px; background:#fff; color:#50615d; font-size:12px; line-height:18px; font-weight:500; }

    .journal-filter-tag.active { border-color:#8fb4ac; background:#e8f2ef; color:#174f44; font-weight:650; box-shadow:none; }
    .journal-filter-count { margin-left:4px; color:#7e8f8b; font-size:12px; line-height:inherit; font-weight:500; font-variant-numeric:tabular-nums; }
    .journal-filter-count::before { content:"· "; }
    .journal-filter-tag.active .journal-filter-count { color:#6e8d86; }
    .journal-list { display:grid; gap:10px; }
    .journal-entry { display:grid; grid-template-columns:96px minmax(0,1fr) 76px; gap:16px; padding:22px 20px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow-soft); }
    .journal-date { border-right:1px solid var(--line); padding-right:14px; color:var(--brand-strong); font-family:"Baskerville","Songti SC","STSong",serif; }
    .journal-date-day { display:block; font-size:44px; line-height:.88; font-weight:600; font-style:italic; letter-spacing:-2px; }
    .journal-date-month { display:block; margin-top:9px; font-size:15px; line-height:1.1; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#4f6963; }
    .journal-content { min-width:0; }
    .journal-text { margin:0; color:#243145; font-size:15px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
    .journal-text::first-line { color:#172536; font-size:17px; font-weight:700; line-height:1.65; }
    .journal-text.collapsed { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:7; overflow:hidden; }
    .journal-expand { margin-top:10px; border:0; padding:0; min-height:auto; color:var(--brand); background:transparent; font-size:12px; }
    .journal-stocks { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
    .journal-stock-chip { display:inline-flex; align-items:baseline; gap:6px; padding:5px 8px; background:var(--brand-soft); border:1px solid #c5ddd8; border-radius:999px; color:var(--brand-strong); font-size:12px; }
    .journal-stock-chip small { color:#64748b; font-variant-numeric:tabular-nums; }
    .journal-actions { display:flex; justify-content:flex-end; align-items:flex-start; gap:6px; }
    .journal-actions button { width:34px; min-height:32px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
    .journal-actions svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .journal-action-edit { color:#245a8d; border-color:#b8cee4; background:#f0f7ff; }
    .journal-action-edit:hover { color:#184975; border-color:#7da8d1; background:#e3f0fc; }
    .journal-action-delete { color:#b42318; border-color:#f3b6ad; background:#fff3f0; }
    .journal-action-delete:hover { color:#912018; border-color:#e4877b; background:#fee4e2; }
    .journal-empty { padding:70px 24px; text-align:center; background:var(--panel); border:1px solid var(--line); color:var(--muted); }
    .journal-empty h2 { color:var(--text); }
    .journal-editor { width:min(900px,100%); }

    }

    function sessionFromHash() {
      if (!hasAuthTokensInHash()) return null;
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const expiresAt = Number(params.get("expires_at")) || Math.floor(Date.now() / 1000) + Number(params.get("expires_in") || 3600);
      if (!accessToken) return null;
      const claims = decodeJwt(accessToken);
      const session = {
        access_token: accessToken,
        refresh_token: refreshToken,
        expires_at: expiresAt,
        user: {
          id: claims.sub,
          email: claims.email || claims.user_metadata?.email || "",
          user_metadata: claims.user_metadata || {},
          app_metadata: claims.app_metadata || {}
        },
        claims
      };
      writeJson(AUTH_STORAGE_KEY, session);
      history.replaceState(null, "", AUTH_REDIRECT_URL);
      return session;
    }

    function currentSession() {
      const hashSession = sessionFromHash();
      if (hashSession) return hashSession;
      const saved = readJson(AUTH_STORAGE_KEY, null);
      if (!saved?.access_token) return null;
      const claims = decodeJwt(saved.access_token);
      saved.claims = saved.claims || claims;
      saved.user = {
        ...(saved.user || {}),
        id: saved.user?.id || claims.sub,
        email: saved.user?.email || claims.email || claims.user_metadata?.email || "",
        user_metadata: saved.user?.user_metadata || claims.user_metadata || {},
        app_metadata: saved.user?.app_metadata || claims.app_metadata || {}
      };
      return saved;
    }

    function persistSession(session) {
      if (!session?.access_token) return null;
      const claims = decodeJwt(session.access_token);
      const normalized = {
        ...session,
        expires_at: session.expires_at || Math.floor(Date.now() / 1000) + Number(session.expires_in || 3600),
        user: {
          ...(session.user || {}),
          id: session.user?.id || claims.sub,
          email: session.user?.email || claims.email || claims.user_metadata?.email || "",
          user_metadata: session.user?.user_metadata || claims.user_metadata || {},
          app_metadata: session.user?.app_metadata || claims.app_metadata || {}
        },
        claims
      };
      state.session = normalized;
      writeJson(AUTH_STORAGE_KEY, normalized);
      return normalized;
    }

    async function refreshSession() {
      if (!state.session?.refresh_token) throw new Error("登录已过期，请重新登录。");
      const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: state.session.refresh_token })
      });
      if (!response.ok) {
        writeJson(AUTH_STORAGE_KEY, null);
        state.session = null;
        throw new Error("登录已过期，请重新登录。");
      }
      return persistSession(await response.json());
    }

    async function ensureFreshSession() {
      if (!state.session?.access_token) throw new Error("请先登录。");
      const expiresAt = Number(state.session.expires_at || 0);
      if (expiresAt && expiresAt - Math.floor(Date.now() / 1000) < 60) {
        await refreshSession();
      }
    }

    async function supabaseRequest(path, options = {}) {
      await ensureFreshSession();
      let response = await supabaseFetch(path, options);
      if (response.status === 401) {
        const errorText = await response.clone().text();
        if (/jwt expired/i.test(errorText)) {
          await refreshSession();
          response = await supabaseFetch(path, options);
        }
      }
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `Supabase 请求失败：HTTP ${response.status}`);
      }
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    async function supabaseFetch(path, options = {}) {

          Authorization: `Bearer ${state.session.access_token}`,
          "Content-Type": "application/json",

        }
      });
      return response;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function defaultCurrencyFor(stock) {
      if (!stock) return "CNY";
      if (stock.market === "CN" || stock.market === "HK") return "CNY";
      if (stock.market === "US") return "USD";
      return stock.currency || "CNY";
    }

    function toDisplay(cny, currency) {
      const rate = currencies[currency]?.rateToCny || 1;
      return Number(cny || 0) / rate;
    }

    function toCny(value, currency) {
      const rate = currencies[currency]?.rateToCny || 1;
      return Number(value || 0) * rate;
    }

    function roundedInputNumber(value, decimals = 6) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "";
      const factor = 10 ** decimals;
      return String(Math.round((number + Number.EPSILON) * factor) / factor);
    }

    function defaultAmountCurrencies() {
      return {
        expectedProfitCny: "CNY",
        expectedDividendCny: "CNY",
        expectedBuybackCny: "CNY",
        expectedShareholderReturnCny: "CNY",
        netCashCny: "CNY"
      };
    }

    function normalizeAmountCurrencies(value) {
      const defaults = defaultAmountCurrencies();
      const raw = value && typeof value === "object" ? value : {};
      return Object.fromEntries(Object.entries(defaults).map(([key, fallback]) => {
        const currency = raw[key];
        return [key, currencies[currency] ? currency : fallback];
      }));
    }

    function normalizeAmountInputValues(value) {
      const raw = value && typeof value === "object" ? value : {};
      return Object.fromEntries(Object.entries(defaultAmountCurrencies()).map(([key]) => {
        const input = raw[key];
        return [key, input === undefined || input === null ? "" : String(input)];
      }));
    }

    function normalizeOriginalAmounts(form) {
      const raw = form?.originalAmounts && typeof form.originalAmounts === "object" ? form.originalAmounts : {};
      const currencyMap = normalizeAmountCurrencies(form?.amountCurrencies);
      const inputMap = normalizeAmountInputValues(form?.amountInputValues);
      return Object.fromEntries(Object.keys(defaultAmountCurrencies()).map((key) => {
        const entry = raw[key] && typeof raw[key] === "object" ? raw[key] : {};
        const currency = currencies[entry.currency] ? entry.currency : currencyMap[key];
        const value = entry.value === undefined || entry.value === null ? inputMap[key] : String(entry.value);
        return [key, { value, currency }];
      }));
    }

    function amountCurrencyFor(form, key) {
      if (!form) return "CNY";
      if (String(key).startsWith("segmentProfit:")) {
        const index = Number(String(key).split(":")[1]);
        const segment = Array.isArray(form.segmentValuations) ? form.segmentValuations[index] : null;
        if (currencies[segment?.expectedProfitOriginal?.currency]) return segment.expectedProfitOriginal.currency;
        return currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY";
      }
      const original = normalizeOriginalAmounts(form)[key];
      if (currencies[original?.currency]) return original.currency;
      const map = normalizeAmountCurrencies(form.amountCurrencies);
      return currencies[map[key]] ? map[key] : "CNY";
    }

    function amountInputValueFor(form, key, cny, currency) {
      if (String(key).startsWith("segmentProfit:")) {
        const index = Number(String(key).split(":")[1]);
        const segment = Array.isArray(form?.segmentValuations) ? form.segmentValuations[index] : null;
        if (segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null && segment.expectedProfitOriginal.value !== "") {
          return String(segment.expectedProfitOriginal.value);
        }
        if (segment?.expectedProfitInput !== undefined && segment?.expectedProfitInput !== null && segment.expectedProfitInput !== "") {
          return String(segment.expectedProfitInput);
        }
      } else {
        const original = normalizeOriginalAmounts(form)[key];
        if (original?.value !== "") return original.value;
        const input = normalizeAmountInputValues(form?.amountInputValues)[key];
        if (input !== "") return input;
      }
      return roundedInputNumber(toDisplay(cny, currency), 2);
    }

    function money(cny, currency) {
      if (cny === null || cny === undefined || Number.isNaN(Number(cny))) return "--";
      const value = toDisplay(cny, currency);
      return `${trimNumber(value)} ${currency}`;
    }

    function metricMoney(cny, currency) {
      if (!Number(cny)) return "—";
      return money(cny, currency);
    }

    function moneyYiCny(cny) {
      if (cny === null || cny === undefined || Number.isNaN(Number(cny))) return "--";
      return trimNumber(cny);
    }

    function trimNumber(value) {
      const abs = Math.abs(Number(value));
      const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
      return Number(value).toLocaleString("zh-CN", { maximumFractionDigits: digits, minimumFractionDigits: 0 });
    }

    function percent(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "--";
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function marketLabel(market) {
      return ({ CN: "A股", HK: "H股", US: "美股" })[market] || market || "--";
    }

    function todayString() {
      return new Date().toISOString().slice(0, 10);
    }

    function isSameLocalDay(value, reference = new Date()) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return false;
      return date.getFullYear() === reference.getFullYear()
        && date.getMonth() === reference.getMonth()
        && date.getDate() === reference.getDate();
    }

    function formatDateTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function formatDate(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function marketCurrency(market) {
      return ({ CN: "CNY", HK: "HKD", US: "USD" })[market] || "CNY";
    }

    function normalizeCode(code, market) {
      if (market === "HK") return `${String(code).padStart(5, "0")}.HK`;
      if (market === "CN") {
        const suffix = String(code).startsWith("6") ? ".SH" : ".SZ";

    function fetchWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { signal: controller.signal }).finally(() => window.clearTimeout(timeout));
    }

    function jsonp(url, callbackParam = "cb") {
      return new Promise((resolve, reject) => {
        const callbackName = `jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("JSONP 请求超时"));
        }, 8000);

        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error("JSONP 请求失败"));
        };
        script.src = `${url}${separator}${callbackParam}=${callbackName}`;
        document.head.appendChild(script);
      });
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timeout = window.setTimeout(() => {
          script.remove();
          reject(new Error("脚本请求超时"));
        }, 8000);
        script.onload = () => {
          window.clearTimeout(timeout);
          script.remove();
          resolve();
        };
        script.onerror = () => {
          window.clearTimeout(timeout);
          script.remove();
          reject(new Error("脚本请求失败"));
        };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    async function searchStocks(query) {

      if (cached && Date.now() - cached.savedAt < 2 * 60 * 1000) return cached.rows;
      const searches = await Promise.allSettled([searchStocksEastmoney(query), searchStocksTencent(query)]);
      const merged = searches.flatMap((result) => result.status === "fulfilled" ? result.value : [])
        .filter((stock, index, all) => index === all.findIndex((item) => item.code === stock.code && item.market === stock.market))
        .slice(0, 12);
      searches.filter((result) => result.status === "rejected").forEach((result) => console.warn("股票搜索源暂不可用。", result.reason));
      stockSearchCache.set(cacheKey, { rows: merged, savedAt: Date.now() });
      return merged;
    }

    function stockQuoteId(stock) {
      if (stock.quoteId) return stock.quoteId;
      const raw = String(stock.rawCode || stock.code || "").replace(/\.(HK|SH|SZ)$/i, "");
      if (stock.market === "HK" && raw) return `116.${raw.padStart(5, "0")}`;
      if (stock.market === "CN" && raw) return `${raw.startsWith("6") ? "1" : "0"}.${raw}`;
      return "";
    }

    function quotePriceScale(stock) {
      return stock.market === "CN" ? 100 : 1000;
    }

    async function fetchQuote(stock) {
      let triedTencent = false;
      if (stock.market === "HK") {
        triedTencent = true;
        try { return await fetchTencentQuote(stock); }
        catch (error) { console.warn("腾讯港股实时行情不可用，尝试东方财富备用行情。", error); }
      }
      const quoteId = stockQuoteId(stock);
      const fields = "f43,f44,f45,f57,f58,f60,f116,f170";
      if (quoteId) {
        const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${encodeURIComponent(quoteId)}&fields=${fields}`;
        try {
          const json = await jsonp(url);
          const data = json?.data;
          const priceScale = quotePriceScale(stock);
          const latestPrice = Number(data?.f43) / priceScale;
          if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error("行情接口没有返回最新价");
          const marketCap = Number(data?.f116);
          const sourceCurrency = marketCurrency(stock.market);
          const latestMarketCapCny = marketCap > 0
            ? marketCap * (currencies[sourceCurrency]?.rateToCny || 1) / 100000000
            : Number(stock.latestMarketCapCny) || stock.marketCapCny || 0;
          const previousClose = Number(data?.f60) / priceScale || 0;
          const dayHigh = Number(data?.f44) / priceScale || latestPrice;
          const dayLow = Number(data?.f45) / priceScale || latestPrice;
          const changePercent = data?.f170 !== null && data?.f170 !== undefined && Number.isFinite(Number(data.f170))
            ? Number(data.f170) / 100
            : previousClose ? (latestPrice / previousClose - 1) * 100 : null;
          return {
            ...stock,
            quoteId,
            name: data.f58 || stock.name,
            rawCode: data.f57 || stock.rawCode,
            latestPrice,
            previousClose,
            dayHigh,
            dayLow,
            intradayQuoteAt: new Date().toISOString(),
            changePercent,
            latestMarketCapCny,
            marketCapSourceCurrency: sourceCurrency,
            marketCapUpdatedAt: todayString()
          };
        } catch (error) {
          console.warn("东方财富行情接口不可用，尝试腾讯备用行情。", error);
        }
      }
      if (!triedTencent) {
        try { return await fetchTencentQuote(stock); }
        catch (error) { console.warn("腾讯行情接口不可用，保留最近行情。", error); }
      }
      return {
        ...stock,
        intradayQuoteAt: "",
        latestMarketCapCny: Number(stock.latestMarketCapCny) || stock.marketCapCny || 0,
        marketCapSourceCurrency: stock.currency || marketCurrency(stock.market),
        marketCapUpdatedAt: stock.marketCapUpdatedAt || stock.updatedAt || todayString()
      };
    }

      return {

    async function refreshMarketCaps({ renderAfter = true } = {}) {
      if (marketCapRefreshInFlight || !state.session) return;
      const ownTargets = state.stocks.filter((stock) => stock.quoteId && !stock.sourceDeletedAt);
      const publisherTargets = state.publisherStocks.filter((stock) => stock.quoteId && !stock.sourceDeletedAt);
      const targets = [
        ...ownTargets.map((stock) => ({ scope: "own", stock })),
        ...publisherTargets.map((stock) => ({ scope: "publisher", stock }))
      ];
      if (!targets.length) return;
      marketCapRefreshInFlight = true;
      try {
        const quotes = await Promise.all(targets.map(async (item) => {
          try {
            return { ...item, quote: await fetchQuote(item.stock) };
          } catch (error) {
            console.warn("刷新市值失败。", item.stock?.code, error);
            return null;
          }
        }));
        quotes.filter(Boolean).forEach(({ scope, stock, quote }) => {
          if (scope === "own") {
            state.stocks = state.stocks.map((item) => item.id === stock.id ? mergeRuntimeMarketCap(item, quote) : item);
          } else {
            state.publisherStocks = state.publisherStocks.map((item) => item.id === stock.id ? mergeRuntimeMarketCap(item, quote) : item);
          }
          if (state.form?.id === stock.id) {
            state.form = mergeRuntimeMarketCap(state.form, quote);
          }
        });
      } finally {
        marketCapRefreshInFlight = false;
      }
      if (renderAfter) render();
    }

    function startMarketCapAutoRefresh() {

      marketCapRefreshTimer = window.setInterval(() => {

    function stopMarketCapAutoRefresh() {

    function tencentSymbol(stock) {
      const raw = String(stock.rawCode || stock.code || "").replace(/\.(HK|SH|SZ)$/i, "");
      if (stock.market === "HK") return `hk${raw.padStart(5, "0")}`;
      if (stock.market === "CN") return `${raw.startsWith("6") ? "sh" : "sz"}${raw}`;
      if (stock.market === "US") return `us${raw.toUpperCase()}`;
      return "";
    }

    async function fetchTencentQuote(stock) {
      const symbol = tencentSymbol(stock);
      if (!symbol) throw new Error("无法识别腾讯行情代码");
      let parts = null;
      if (stock.market === "HK") {
        const response = await fetchWithTimeout(`https://web.ifzq.gtimg.cn/appstock/app/hkMinute/query?code=${encodeURIComponent(symbol)}&_=${Date.now()}`, 8000);
        if (!response.ok) throw new Error(`腾讯港股实时行情 HTTP ${response.status}`);
        const json = await response.json();
        parts = json?.data?.[symbol]?.qt?.[symbol] || null;
      } else {
        const variableName = `v_${symbol}`;
        delete window[variableName];
        await loadScript(`https://qt.gtimg.cn/q=${symbol}&_=${Date.now()}`);
        const text = window[variableName];
        delete window[variableName];
        parts = text ? text.split("~") : null;
      }
      if (!parts?.length) throw new Error("腾讯行情没有返回数据");
      const marketCapYi = Number(parts[45] || parts[44]);
      const sourceCurrency = marketCurrency(stock.market);
      const latestPrice = Number(parts[3]) || Number(stock.latestPrice) || 0;
      if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error("腾讯行情没有返回最新价");
      const previousClose = Number(parts[4]) || 0;
      const dayHigh = Number(parts[33]) || latestPrice;
      const dayLow = Number(parts[34]) || latestPrice;
      const quotedChangePercent = String(parts[32] || "").trim() === "" ? NaN : Number(parts[32]);
      return {
        ...stock,
        latestPrice,
        previousClose,
        dayHigh,
        dayLow,
        intradayQuoteAt: new Date().toISOString(),
        changePercent: Number.isFinite(quotedChangePercent) ? quotedChangePercent : previousClose ? (latestPrice / previousClose - 1) * 100 : null,
        latestMarketCapCny: marketCapYi > 0 ? marketCapYi * (currencies[sourceCurrency]?.rateToCny || 1) : Number(stock.latestMarketCapCny) || 0,
        marketCapSourceCurrency: sourceCurrency,
        marketCapUpdatedAt: todayString()
      };
    }

    function calc(stock) {
      const latest = Number(stock.latestMarketCapCny) || 0;
      const profit = Number(stock.expectedProfitCny) || 0;
      const pe = Number(stock.expectedPE) || 0;
      const cash = Number(stock.netCashCny) || 0;
      const discount = Number(stock.netCashDiscountRate) || 0;
      const shareholder = shareholderReturnTotal(stock);
      const expectedMarketCapCny = profit * pe + cash * discount;
      return {
        expectedMarketCapCny,
        upside: latest ? expectedMarketCapCny / latest - 1 : null,
        forwardPE: profit ? (latest - cash * discount) / profit : null,
        shareholderReturnRate: latest ? shareholder / latest : null
      };
    }

    function shareholderReturnRateForList(stock, computed) {
      const rate = computed.shareholderReturnRate;
      if (rate === null || rate === undefined) return rate;
      if (!state.stockConnectDividendTax || stock.market !== "HK") return rate;
      const latest = Number(stock.latestMarketCapCny) || 0;
      if (!latest) return rate;
      return ((Number(stock.expectedDividendCny) || 0) * 0.8 + (Number(stock.expectedBuybackCny) || 0)) / latest;
    }

    function shareholderReturnTotal(stock) {
      return Number(stock?.expectedShareholderReturnCny) || 0;
    }

    function emptySegmentValuationRow(index = 0, forecastYear = "2026E") {
      return {
        segmentName: index ? `分部${index}` : "",
        expectedProfitCny: 0,
        expectedProfitCurrency: "CNY",
        expectedProfitInput: "",
        expectedProfitOriginal: { value: "", currency: "CNY" },
        expectedPE: 0,
        expectedPEInput: "",
        forecastYear,
        expectedPERemark: ""
      };
    }

    function normalizeSegmentValuationFields(stock) {
      const next = { ...stock };
      next.useSegmentValuation = Boolean(next.useSegmentValuation);
      const rawSegments = Array.isArray(next.segmentValuations) ? next.segmentValuations : [];
      next.segmentValuations = rawSegments.map((segment, index) => ({
        segmentName: segment?.segmentName || segment?.name || `分部${index + 1}`,
        expectedProfitCny: Number(segment?.expectedProfitCny) || 0,
        expectedProfitCurrency: currencies[segment?.expectedProfitOriginal?.currency] ? segment.expectedProfitOriginal.currency : currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY",
        expectedProfitInput: segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null ? String(segment.expectedProfitOriginal.value) : segment?.expectedProfitInput === undefined || segment?.expectedProfitInput === null ? "" : String(segment.expectedProfitInput),
        expectedProfitOriginal: {
          value: segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null ? String(segment.expectedProfitOriginal.value) : segment?.expectedProfitInput === undefined || segment?.expectedProfitInput === null ? "" : String(segment.expectedProfitInput),
          currency: currencies[segment?.expectedProfitOriginal?.currency] ? segment.expectedProfitOriginal.currency : currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY"
        },
        expectedPE: Number(segment?.expectedPE) || 0,
        expectedPEInput: segment?.expectedPEInput === undefined || segment?.expectedPEInput === null ? String(Number(segment?.expectedPE) || "") : String(segment.expectedPEInput),
        forecastYear: segment?.forecastYear || next.forecastYear || "2026E",
        expectedPERemark: segment?.expectedPERemark || ""
      }));
      if (next.useSegmentValuation) {
        while (next.segmentValuations.length < 2) {
          next.segmentValuations.push(emptySegmentValuationRow(next.segmentValuations.length + 1, next.forecastYear || "2026E"));
        }
        applySegmentValuationTotals(next);
      }
      return next;
    }

    function applySegmentValuationTotals(stock) {
      if (!stock?.useSegmentValuation) return stock;
      const segments = Array.isArray(stock.segmentValuations) ? stock.segmentValuations : [];
      const totalProfit = segments.reduce((sum, segment) => sum + (Number(segment.expectedProfitCny) || 0), 0);
      const totalMarketCap = segments.reduce((sum, segment) => {
        return sum + (Number(segment.expectedProfitCny) || 0) * (Number(segment.expectedPE) || 0);
      }, 0);
      stock.expectedProfitCny = totalProfit;
      stock.expectedPE = totalProfit ? totalMarketCap / totalProfit : 0;
      return stock;
    }

    function normalizeShareholderReturnFields(stock) {
      const next = normalizeSegmentValuationFields(stock);
      next.version = normalizeStockVersion(next.version);
      next.amountCurrencies = normalizeAmountCurrencies(next.amountCurrencies);
      next.amountInputValues = normalizeAmountInputValues(next.amountInputValues);
      next.originalAmounts = normalizeOriginalAmounts(next);
      next.amountCurrencies = Object.fromEntries(Object.entries(next.originalAmounts).map(([key, entry]) => [key, entry.currency]));
      next.amountInputValues = Object.fromEntries(Object.entries(next.originalAmounts).map(([key, entry]) => [key, entry.value]));
      next.expectedPEInput = next.expectedPEInput === undefined || next.expectedPEInput === null ? String(Number(next.expectedPE) || "") : String(next.expectedPEInput);
      if (next.expectedDividendCny === undefined && next.expectedBuybackCny === undefined) {
        next.expectedDividendCny = Number(next.expectedShareholderReturnCny) || 0;
        next.expectedBuybackCny = 0;
      } else {
        next.expectedDividendCny = Number(next.expectedDividendCny) || 0;
        next.expectedBuybackCny = Number(next.expectedBuybackCny) || 0;
      }
      if (next.expectedShareholderReturnCny === undefined || next.expectedShareholderReturnCny === "") {
        next.expectedShareholderReturnCny = next.expectedDividendCny + next.expectedBuybackCny;
      } else {
        next.expectedShareholderReturnCny = Number(next.expectedShareholderReturnCny) || 0;
      }
      return next;
    }

    function normalizeStockVersion(value) {
      const text = String(value || "").trim();
      return text || "中性";
    }

    function stockVersionMode(value) {
      return ["乐观", "中性", "悲观"].includes(normalizeStockVersion(value)) ? normalizeStockVersion(value) : "自定义";
    }

    function buildPublicationSnapshot(stock, changeNote = "") {
      const normalized = normalizeShareholderReturnFields(stock);
      const computed = calc(normalized);
      return {
        schemaVersion: 2,
        stock: {
          id: normalized.id || null,
          name: normalized.name || "",
          code: normalized.code || "",
          market: normalized.market || "",
          exchange: normalized.exchange || "",
          version: normalizeStockVersion(normalized.version),
          displayCurrency: normalized.displayCurrency || defaultCurrencyFor(normalized)
        },
        assumptions: {
          latestMarketCapCny: Number(normalized.latestMarketCapCny) || 0,
          marketCapUpdatedAt: normalized.marketCapUpdatedAt || "",
          amountCurrencies: normalizeAmountCurrencies(normalized.amountCurrencies),
          amountInputValues: normalizeAmountInputValues(normalized.amountInputValues),
          originalAmounts: normalizeOriginalAmounts(normalized),
          useSegmentValuation: Boolean(normalized.useSegmentValuation),
          segmentValuations: Array.isArray(normalized.segmentValuations) ? normalized.segmentValuations : [],
          expectedProfitCny: Number(normalized.expectedProfitCny) || 0,
          expectedPE: Number(normalized.expectedPE) || 0,
          expectedPEInput: normalized.expectedPEInput === undefined || normalized.expectedPEInput === null ? "" : String(normalized.expectedPEInput),
          forecastYear: normalized.forecastYear || "",
          expectedPERemark: normalized.expectedPERemark || "",
          netCashCny: Number(normalized.netCashCny) || 0,
          netCashScope: normalized.netCashScope || "",
          netCashDiscountRate: Number(normalized.netCashDiscountRate) || 0,
          expectedDividendCny: Number(normalized.expectedDividendCny) || 0,
          expectedBuybackCny: Number(normalized.expectedBuybackCny) || 0,
          expectedShareholderReturnCny: Number(normalized.expectedShareholderReturnCny) || 0,
          shareholderReturnRemark: normalized.shareholderReturnRemark || ""
        },
        computed,
        note: {
          investmentNote: normalized.investmentNote || "",
          myNote: normalized.myNote || "",
          changeNote
        }
      };
    }

    function stockFromPublication(publication) {
      const payload = publication?.payload || {};
      if (!payload.schemaVersion) return normalizeShareholderReturnFields(payload);
      return normalizeShareholderReturnFields({
        ...(payload.stock || {}),
        ...(payload.assumptions || {}),
        investmentNote: payload.note?.investmentNote || "",
        myNote: payload.note?.myNote || "",
        isShared: true,
        lastPublishedAt: publication.created_at || payload.lastPublishedAt || "",
        updatedAt: publication.created_at || payload.updatedAt || ""
      });
    }

    function stockWithPublication(stock, publication) {
      if (!publication) return stock;
      return {
        ...stock,
        ...stockFromPublication(publication),
        id: stock.id,
        userId: stock.userId,
        publisherId: stock.publisherId,
        publisherNickname: stock.publisherNickname,
        sourceUserId: stock.sourceUserId,
        sourceStockId: stock.sourceStockId,
        sourceNickname: stock.sourceNickname,
        sourceType: stock.sourceType,
        isShared: true,
        lastPublishedAt: publication.created_at || stock.lastPublishedAt,
        updatedAt: publication.created_at || stock.updatedAt
      };
    }

    function journalStorageKey() {

    function journalDateParts(value) {
      const date = new Date(value);
      return {
        day: String(date.getDate()).padStart(2, "0"),
        month: date.toLocaleDateString("zh-CN", { month: "short" })
      };
    }

    function journalPriceText(stock) {
      const price = Number(stock.publishedPrice);
      return price > 0 ? `${price.toLocaleString("zh-CN", { maximumFractionDigits: 3 })} ${stock.currency || marketCurrency(stock.market)}` : `— ${stock.currency || marketCurrency(stock.market)}`;
    }

    function journalMonthKey(entry) {
      const date = new Date(entry.publishedAt || entry.createdAt);
      if (Number.isNaN(date.getTime())) return "";
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function journalStockKey(stock) {
      return journalSecurityCodeKey(stock);
    }

    function journalSecurityCodeKey(stock) {
      const rawCode = String(stock?.code || "").trim().toUpperCase();
      const parts = rawCode.split(".");
      const suffix = parts.length > 1 ? parts.at(-1) : "";
      const market = String(stock?.market || suffix || "").toUpperCase();
      let symbol = parts[0] || rawCode;
      if (market === "HK" || suffix === "HK") symbol = symbol.replace(/^0+(?=\d)/, "");
      return `${market}:${symbol}`;
    }

    function normalizeJournalStockName(name, market) {
      let value = String(name || "").trim().replace(/[‐‑‒–—]/g, "-");
      if (String(market || "").toUpperCase() !== "HK") return value;
      value = value.replace(/-([a-z]{1,3})$/i, (_, suffix) => `-${suffix.toUpperCase()}`);
      if (!value.includes("-")) value = value.replace(/([\u4e00-\u9fff])([a-z]{1,3})$/i, (_, chinese, suffix) => `${chinese}-${suffix.toUpperCase()}`);
      return value;
    }

    function canonicalJournalStock(stock) {
      if (!stock) return stock;
      const candidates = [
        ...state.stocks,
        ...state.publisherStocks,
        ...state.portfolios.flatMap((portfolio) => portfolio.positions || []),
        ...stockCatalog
      ];
      const key = journalSecurityCodeKey(stock);
      const canonical = candidates.find((candidate) => journalSecurityCodeKey(candidate) === key);
      const market = stock.market || canonical?.market || "";
      return {
        ...stock,
        market,
        name: normalizeJournalStockName(canonical?.name || stock.name, market)
      };
    }

    function canonicalJournalEntry(entry) {
      const originalStocks = entry?.stocks || [];
      const stocks = originalStocks.map(canonicalJournalStock);
      let content = String(entry?.content || "");
      originalStocks.forEach((stock, index) => {
        const canonical = stocks[index];
        if (!stock?.name || !canonical?.name || stock.name === canonical.name) return;
        content = content.split(`$${stock.name}(${stock.code})`).join(`$${canonical.name}(${canonical.code || stock.code})`);
      });
      return { ...entry, content, stocks };
    }

    function journalFilterTag(label, count, active, attrs) {
      return `<button type="button" class="journal-filter-tag ${active ? "active" : ""}" ${attrs}>${escapeHtml(label)}${count == null ? "" : `<span class="journal-filter-count">${count}</span>`}</button>`;
    }

    function renderJournalView() {
      const allRows = [...state.journals].sort((a, b) => String(b.publishedAt || b.createdAt).localeCompare(String(a.publishedAt || a.createdAt)));
      const months = [...new Set(allRows.map(journalMonthKey).filter(Boolean))].sort().reverse();
      const stockStats = new Map();
      allRows.forEach((entry) => {
        const seen = new Set();
        (entry.stocks || []).forEach((stock) => {
          const key = journalStockKey(stock);
          if (!stock.code || seen.has(key)) return;
          seen.add(key);
          const current = stockStats.get(key) || { stock: canonicalJournalStock(stock), count: 0 };
          current.count += 1;
          stockStats.set(key, current);
        });
      });
      const stocks = [...stockStats.entries()].sort((a, b) => b[1].count - a[1].count || String(a[1].stock.name).localeCompare(String(b[1].stock.name), "zh-CN"));
      const rows = allRows.filter((entry) => {
        const monthMatches = !state.journalMonthFilter || journalMonthKey(entry) === state.journalMonthFilter;
        const stockMatches = !state.journalStockFilter || (entry.stocks || []).some((stock) => journalStockKey(stock) === state.journalStockFilter);
        return monthMatches && stockMatches;
      });
      const filters = `<section class="journal-filters" aria-label="日志筛选">
        <div class="journal-filter-action"><button class="primary stock-add-button journal-write-button" data-action="newJournal" ${!state.journalDbReady && state.session?.access_token !== "local-demo" ? "disabled" : ""}>+ 写日志</button></div>
        <div class="journal-filter-row"><div class="journal-filter-tags">
          ${journalFilterTag("全部月份", null, !state.journalMonthFilter, `data-action="filterJournalMonth" data-month=""`)}
          ${months.map((month) => journalFilterTag(`${month.slice(0, 4)}年${Number(month.slice(5))}月`, allRows.filter((entry) => journalMonthKey(entry) === month).length, state.journalMonthFilter === month, `data-action="filterJournalMonth" data-month="${month}"`)).join("")}
        </div></div>
        <div class="journal-filter-row"><div class="journal-filter-tags">
          ${journalFilterTag("全部股票", null, !state.journalStockFilter, `data-action="filterJournalStock" data-stock-key=""`)}
          ${stocks.map(([key, item]) => journalFilterTag(`${item.stock.name} ${item.stock.code}`, item.count, state.journalStockFilter === key, `data-action="filterJournalStock" data-stock-key="${escapeHtml(key)}"`)).join("")}
        </div></div>
      </section>`;
      return `
        ${state.journalDbError ? `<div class="simple-modal-error" style="margin-bottom:12px">日志数据库尚未启用。请先按部署说明执行建表 SQL，然后刷新页面；当前设备已有的本地日志会自动迁移。</div>` : ""}
        ${filters}
        ${rows.length ? `<div class="journal-list">${rows.map((entry) => {
          const date = journalDateParts(entry.publishedAt || entry.createdAt);
          const expanded = state.expandedJournalIds.includes(entry.id);
          const long = String(entry.content || "").length > 260 || String(entry.content || "").split("\n").length > 7;
          const displayEntry = canonicalJournalEntry(entry);
          return `<article class="journal-entry">
            <time class="journal-date" datetime="${escapeHtml(entry.publishedAt || entry.createdAt)}"><span class="journal-date-day">${date.day}</span><span class="journal-date-month">${escapeHtml(date.month)}</span></time>
            <div class="journal-content"><p class="journal-text ${expanded ? "" : "collapsed"}">${escapeHtml(displayEntry.content)}</p>
              ${long ? `<button class="journal-expand" data-action="toggleJournal" data-id="${entry.id}">${expanded ? "收起" : "展开阅读全文"}</button>` : ""}
              ${displayEntry.stocks.length ? `<div class="journal-stocks">${displayEntry.stocks.map((stock) => `<span class="journal-stock-chip"><strong>${escapeHtml(stock.name)}</strong><span>${escapeHtml(stock.code)}</span><small>${escapeHtml(journalPriceText(stock))}</small></span>`).join("")}</div>` : ""}
            </div>
            <div class="journal-actions">
              <button class="journal-action-edit" data-action="editJournal" data-id="${entry.id}" title="修改日志" aria-label="修改日志" ${!state.journalDbReady && state.session?.access_token !== "local-demo" ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"></path><path d="m13.5 6.5 4 4"></path></svg></button>
              <button class="journal-action-delete" data-action="deleteJournal" data-id="${entry.id}" title="删除日志" aria-label="删除日志" ${!state.journalDbReady && state.session?.access_token !== "local-demo" ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="m7 7 1 13h8l1-13"></path><path d="M10 11v5M14 11v5"></path></svg></button>
            </div>
          </article>`;
        }).join("")}</div>` : allRows.length ? `<section class="journal-empty"><h2>没有匹配的日志</h2><p>可以切换上方的月份或股票标签查看其他日志。</p><button data-action="clearJournalFilters">清除筛选</button></section>` : `<section class="journal-empty"><h2>还没有日志</h2><p>写下今天的判断，输入 $ 可以插入股票。</p></section>`}
      `;
    }

    function renderJournalModal() {
      const modal = state.journalModal;
      if (!modal) return "";
      return `<div class="simple-modal-backdrop"><section class="simple-modal journal-editor" role="dialog" aria-modal="true" aria-label="${modal.id ? "更改日志" : "写日志"}">
        <div class="simple-modal-head"><h2>${modal.id ? "更改日志" : "写日志"}</h2><button class="icon" data-action="closeJournal" aria-label="关闭">×</button></div>
        <form data-form="journal"><div class="simple-modal-body">

          <div class="journal-editor-help">在正文中输入 $ 后直接继续输入股票名称或代码；匹配浮层不会打断输入，选择后会在原光标位置插入股票并在发布时记录实时价格。</div>
          ${(modal.stocks || []).length ? `<div class="journal-selected-stocks">${modal.stocks.map(canonicalJournalStock).map((stock, index) => `<span class="journal-selected-stock"><strong>${escapeHtml(stock.name)}</strong>${escapeHtml(stock.code)}<button type="button" data-action="removeJournalStock" data-index="${index}" aria-label="移除">×</button></span>`).join("")}</div>` : ""}
          ${state.journalError ? `<div class="simple-modal-error">${escapeHtml(state.journalError)}</div>` : ""}
        </div><div class="simple-modal-foot"><button type="button" data-action="closeJournal">取消</button><button class="primary" type="submit" ${state.journalSaving ? "disabled" : ""}>${state.journalSaving ? "正在记录价格..." : modal.id ? "保存更改" : "发布日志"}</button></div></form>
      </section></div>`;
    }

    async function loadJournals() {
      const localRows = readJson(journalStorageKey(), []);
      state.journals = Array.isArray(localRows) ? localRows : [];
      state.journalDbReady = state.session?.access_token === "local-demo";
      state.journalDbError = "";
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        try {
          const rows = await supabaseRequest(`/rest/v1/journal_entries?user_id=eq.${encodeURIComponent(state.session.user.id)}&select=id,payload,created_at,updated_at&order=created_at.desc`);
          const cloudRows = (rows || []).map((row) => ({ ...(row.payload || {}), id: row.id, createdAt: row.payload?.createdAt || row.created_at }));
          const cloudIds = new Set(cloudRows.map((entry) => entry.id));
          const pendingLocalRows = state.journals.filter((entry) => entry?.id && !cloudIds.has(entry.id));
          if (pendingLocalRows.length) {
            await supabaseRequest("/rest/v1/journal_entries?on_conflict=id", {
              method: "POST",
              prefer: "resolution=merge-duplicates",
              body: JSON.stringify(pendingLocalRows.map((entry) => ({
                id: entry.id,
                user_id: state.session.user.id,
                payload: { ...entry, id: undefined },
                updated_at: entry.updatedAt || new Date().toISOString()
              })))
            });
          }
          state.journals = [...pendingLocalRows, ...cloudRows].sort((a, b) => String(b.publishedAt || b.createdAt).localeCompare(String(a.publishedAt || a.createdAt)));
          state.journalDbReady = true;
        } catch (error) {
          state.journalDbReady = false;
          state.journalDbError = error.message || String(error);
          console.warn("日志数据库尚未就绪。", error);
        }
      }
      writeJson(journalStorageKey(), state.journals);
      if (state.journalDbReady) repairMissingJournalPrices().catch((error) => console.warn("日志价格补全失败。", error));
    }

    async function captureJournalStockPrice(stock, capturedAt = new Date().toISOString()) {
      if (Number(stock.publishedPrice) > 0) return stock;
      const quote = await fetchQuote(stock);
      const latestPrice = Number(quote.latestPrice);
      if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error(`${stock.name || stock.code} 暂无有效行情`);
      return { ...stock, publishedPrice: latestPrice, currency: stock.currency || marketCurrency(stock.market), priceCapturedAt: capturedAt };
    }

    async function repairMissingJournalPrices() {
      const targets = state.journals.filter((entry) => (entry.stocks || []).some((stock) => !(Number(stock.publishedPrice) > 0)));
      if (!targets.length || !state.session?.access_token || state.session.access_token === "local-demo") return;
      const repaired = [];
      for (const entry of targets) {
        const stocks = await Promise.all((entry.stocks || []).map(async (stock) => {
          try { return await captureJournalStockPrice(stock, new Date().toISOString()); }
          catch { return stock; }
        }));
        if (stocks.some((stock, index) => Number(stock.publishedPrice) > 0 && !(Number(entry.stocks[index]?.publishedPrice) > 0))) {
          repaired.push({ ...entry, stocks, updatedAt: new Date().toISOString() });
        }
      }
      if (!repaired.length) return;
      await supabaseRequest("/rest/v1/journal_entries?on_conflict=id", {
        method: "POST",
        prefer: "resolution=merge-duplicates",
        body: JSON.stringify(repaired.map((entry) => ({ id: entry.id, user_id: state.session.user.id, payload: { ...entry, id: undefined }, updated_at: entry.updatedAt })))
      });
      const repairedById = new Map(repaired.map((entry) => [entry.id, entry]));
      state.journals = state.journals.map((entry) => repairedById.get(entry.id) || entry);
      writeJson(journalStorageKey(), state.journals);
      if (state.mainView === "journal") render();
    }

    function openJournal(entryId = "") {
      const entry = state.journals.find((item) => item.id === entryId);
      state.journalModal = entry ? canonicalJournalEntry(JSON.parse(JSON.stringify(entry))) : { id: "", content: "", stocks: [] };
      state.journalSearchResults = [];

      state.journalError = "";

      setTimeout(() => document.querySelector("[data-input='journalContent']")?.focus(), 0);

      state.journalModal = null; state.journalSearchResults = []; state.journalSearchQuery = ""; state.journalError = ""; render();

    function updateJournalMentionPopup(content = "", show = true) {
      const popup = document.querySelector("[data-journal-mention-popup]");
      if (!popup) return;
      popup.innerHTML = content;
      popup.classList.toggle("show", show);
      if (show) positionJournalMentionPopup();
    }

    function positionJournalMentionPopup() {
      const textarea = document.querySelector("[data-input='journalContent']");
      const popup = document.querySelector("[data-journal-mention-popup]");
      const field = textarea?.closest(".journal-content-field");
      if (!textarea || !popup || !field) return;
      const style = getComputedStyle(textarea);
      const mirror = document.createElement("div");
      mirror.style.position = "fixed";
      mirror.style.visibility = "hidden";
      mirror.style.pointerEvents = "none";
      mirror.style.left = `${textarea.getBoundingClientRect().left}px`;
      mirror.style.top = `${textarea.getBoundingClientRect().top}px`;
      mirror.style.width = `${textarea.clientWidth}px`;
      mirror.style.height = `${textarea.clientHeight}px`;
      mirror.style.overflow = "hidden";
      mirror.style.whiteSpace = "pre-wrap";
      mirror.style.overflowWrap = "break-word";
      mirror.style.wordBreak = "break-word";
      ["fontFamily", "fontSize", "fontWeight", "fontStyle", "letterSpacing", "lineHeight", "textTransform", "textIndent", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth", "boxSizing"].forEach((name) => { mirror.style[name] = style[name]; });
      const before = document.createTextNode(textarea.value.slice(0, textarea.selectionStart));
      const marker = document.createElement("span");
      marker.textContent = "\u200b";
      mirror.append(before, marker);
      document.body.appendChild(mirror);
      mirror.scrollTop = textarea.scrollTop;
      mirror.scrollLeft = textarea.scrollLeft;
      const markerRect = marker.getBoundingClientRect();
      const fieldRect = field.getBoundingClientRect();
      const lineHeight = parseFloat(style.lineHeight) || 28;
      const popupWidth = Math.min(440, Math.max(240, field.clientWidth - 20));
      let left = markerRect.left - fieldRect.left;
      left = Math.max(10, Math.min(left, field.clientWidth - popupWidth - 10));
      let top = markerRect.top - fieldRect.top + lineHeight + 5;
      popup.style.width = `${popupWidth}px`;
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      mirror.remove();
      const popupRect = popup.getBoundingClientRect();
      if (popupRect.bottom > window.innerHeight - 12) {
        top = Math.max(30, top - popupRect.height - lineHeight - 10);
        popup.style.top = `${top}px`;
      }
    }

    function journalMentionResultsHtml(results) {
      if (!results.length) return `<div class="journal-mention-hint">没有匹配结果，请继续输入或更换名称、代码。</div>`;
      return results.map((rawItem, index) => {

    function scheduleJournalSearch(query, focusTarget = "content", cursor = null) {
      const value = String(query || "").trim();
      state.journalSearchQuery = value;
      if (Number.isInteger(cursor)) state.journalInsertCursor = cursor;
      if (journalSearchTimer) window.clearTimeout(journalSearchTimer);
      const requestId = ++journalSearchRequestId;
      if (!value) {
        state.journalSearchResults = [];
        state.journalSearchLoading = false;
        updateJournalMentionPopup(`<div class="journal-mention-hint">继续输入股票名称或代码</div>`, true);
        return;
      }
      state.journalSearchResults = [];
      updateJournalMentionPopup(`<div class="journal-mention-hint">正在联网匹配“${escapeHtml(value)}”...</div>`, true);
      journalSearchTimer = window.setTimeout(async () => {
        journalSearchTimer = null;
        state.journalSearchLoading = true;
        const results = await searchStocks(value);
        if (requestId !== journalSearchRequestId || !state.journalModal) return;
        state.journalSearchResults = results;
        state.journalSearchLoading = false;
        updateJournalMentionPopup(journalMentionResultsHtml(results), true);
      }, 80);
    }

    function selectJournalStock(index) {
      const stock = canonicalJournalStock(state.journalSearchResults[index]);
      if (!stock || !state.journalModal) return;
      if (!state.journalModal.stocks.some((item) => item.code === stock.code && item.market === stock.market)) state.journalModal.stocks.push(stock);
      const textarea = document.querySelector("[data-input='journalContent']");
      const content = textarea?.value ?? state.journalModal.content;
      const cursor = document.activeElement === textarea ? textarea.selectionStart : (state.journalInsertCursor || content.length);
      const before = content.slice(0, cursor).replace(/\$[^\s$]*$/, "");
      state.journalModal.content = `${before}$${stock.name}(${stock.code}) ${content.slice(cursor)}`;
      state.journalSearchResults = [];
      state.journalSearchQuery = "";
      render();
      const nextCursor = before.length + stock.name.length + stock.code.length + 4;
      setTimeout(() => {
        const nextTextarea = document.querySelector("[data-input='journalContent']");
        nextTextarea?.focus();
        nextTextarea?.setSelectionRange(nextCursor, nextCursor);
      }, 0);
    }

    async function deleteJournal(entryId) {
      const entry = state.journals.find((item) => item.id === entryId);
      if (!entry) return;
      const preview = String(entry.content || "").replace(/\s+/g, " ").slice(0, 48);
      if (!confirm(`确定删除这篇日志吗？\n\n${preview}${String(entry.content || "").length > 48 ? "…" : ""}\n\n删除后无法恢复。`)) return;
      try {
        if (state.session?.access_token && state.session.access_token !== "local-demo") {
          await supabaseRequest(`/rest/v1/journal_entries?id=eq.${encodeURIComponent(entryId)}&user_id=eq.${encodeURIComponent(state.session.user.id)}`, { method: "DELETE" });
        }
        state.journals = state.journals.filter((item) => item.id !== entryId);
        state.expandedJournalIds = state.expandedJournalIds.filter((id) => id !== entryId);
        writeJson(journalStorageKey(), state.journals);
        render();
      } catch (error) {
        alert(`删除日志失败：${error.message || String(error)}`);
      }
    }

    async function submitJournal(event) {
      event.preventDefault();
      if (!state.journalModal || state.journalSaving) return;
      const content = String(new FormData(event.currentTarget).get("content") || "").trim();
      if (!content) { state.journalError = "请先写下日志内容。"; render(); return; }
      state.journalSaving = true; state.journalError = ""; render();
      const now = new Date().toISOString();
      const priceResults = await Promise.allSettled((state.journalModal.stocks || []).map((stock) => captureJournalStockPrice(stock, now)));
      const failedPrice = priceResults.find((result) => result.status === "rejected");
      if (failedPrice) {
        state.journalSaving = false;
        state.journalError = `价格获取失败，请稍后重试：${failedPrice.reason?.message || String(failedPrice.reason)}`;
        render();
        return;
      }
      const stocks = priceResults.map((result) => canonicalJournalStock(result.value));
      const entry = { ...state.journalModal, id: state.journalModal.id || id("journal"), content, stocks, publishedAt: state.journalModal.publishedAt || now, createdAt: state.journalModal.createdAt || now, updatedAt: now };
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        try {
          await supabaseRequest("/rest/v1/journal_entries?on_conflict=id", { method:"POST", prefer:"resolution=merge-duplicates", body:JSON.stringify({ id:entry.id, user_id:state.session.user.id, payload:{ ...entry, id:undefined }, updated_at:now }) });
        } catch (error) {
          state.journalSaving = false;
          state.journalError = `数据库保存失败：${error.message || String(error)}`;
          render();
          return;
        }
      }
      state.journals = state.journals.some((item) => item.id === entry.id) ? state.journals.map((item) => item.id === entry.id ? entry : item) : [entry, ...state.journals];
      writeJson(journalStorageKey(), state.journals);
      state.journalSaving = false; state.journalModal = null; render();
    }

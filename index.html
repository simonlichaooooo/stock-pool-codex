<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>钞·作业</title>
  <style>
    :root {
      --bg: #f4f6f7;
      --panel: #ffffff;
      --panel-2: #f8faf9;
      --text: #121926;
      --muted: #697386;
      --line: #d8e1df;
      --soft: #edf2f1;
      --brand: #0b6b5f;
      --brand-strong: #084f47;
      --brand-soft: #e8f4f1;
      --accent: #356a9a;
      --gain: #b42318;
      --loss: #067647;
      --warn: #9a6700;
      --shadow: 0 18px 42px rgba(18, 25, 38, 0.08);
      --shadow-soft: 0 6px 18px rgba(18, 25, 38, 0.055);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --focus: 0 0 0 3px rgba(11, 107, 95, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      min-height: 32px;
      padding: 0 11px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    button:hover { border-color: #98a6b8; background: #f8fafc; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    button.primary:hover { background: var(--brand-strong); }
    button.icon { width: 32px; padding: 0; }
    button.danger { color: #b42318; }
    button.ghost { background: transparent; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      background: white;
      color: var(--text);
      outline: none;
      min-height: 34px;
      font-size: 13px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(15, 95, 85, 0.12);
    }
    textarea { min-height: 76px; resize: vertical; }

    .shell { min-height: 100vh; }
    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .topbar-inner {
      width: min(1480px, calc(100vw - 48px));
      min-height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .brand-logo {
      display: block;
      width: 154px;
      height: 44px;
      object-fit: contain;
      object-position: left center;
      flex: 0 0 auto;
    }
    .brand h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .brand span { color: var(--muted); font-size: 12px; }
    .userbar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }

    .workspace {
      width: min(1500px, calc(100vw - 48px));
      margin: 18px auto 44px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) repeat(6, auto);
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      box-shadow: var(--shadow-soft);
    }
    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
    }
    .nav-primary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .nav-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px;
      width: fit-content;
      box-shadow: var(--shadow-soft);
    }
    .nav-tabs button {
      border: 0;
      background: transparent;
      min-width: 72px;
      min-height: 30px;
      font-weight: 700;
    }
    .nav-tabs button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      box-shadow: none;
    }
    .filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: var(--panel);
    }
    .segmented button {
      border: 0;
      border-radius: 0;
      border-right: 1px solid var(--line);
      min-width: 58px;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active {
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 700;
    }

    .table-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-scroll { overflow: auto; max-height: calc(100vh - 164px); }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1320px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
      white-space: nowrap;
    }
    th {
      background: var(--panel-2);
      color: #344054;
      font-weight: 750;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--brand); }
    tbody tr:hover { background: #f8fbfb; }
    tbody tr.stock-row.dragging { opacity: .45; }
    tbody tr.stock-row.drag-over-before td { box-shadow: inset 0 2px 0 var(--brand); }
    tbody tr.stock-row.drag-over-after td { box-shadow: inset 0 -2px 0 var(--brand); }
    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 28px;
      color: #98a2b3;
      cursor: grab;
      user-select: none;
      vertical-align: middle;
      font-size: 16px;
    }
    .drag-handle:active { cursor: grabbing; }
    th.drag-col,
    td.drag-col {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      padding-left: 6px;
      padding-right: 6px;
      text-align: center;
    }
    .stock-name { font-weight: 760; }
    .stock-code { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .version-cell {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 760;
      color: #344054;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--soft);
      color: #344054;
      font-size: 12px;
      font-weight: 650;
    }
    .gain { color: var(--gain); font-weight: 700; }
    .loss { color: var(--loss); font-weight: 700; }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 5px; align-items: center; }
    .tax-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tax-header label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .tax-header input {
      width: 14px;
      height: 14px;
      padding: 0;
      box-shadow: none;
      order: 2;
    }
    .empty {
      padding: 42px 22px;
      text-align: center;
      color: var(--muted);
    }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .login-panel {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .login-panel h1 { margin: 0 0 7px; font-size: 22px; }
    .login-panel p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-size: 14px; }
    .login-actions { display: grid; gap: 10px; }
    .oauth-button {
      width: 100%;
      min-height: 38px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0;
    }
    .login-divider::before,
    .login-divider::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; color: #344054; font-weight: 700; }
    .form-row { display: grid; grid-template-columns: 1fr 104px; gap: 8px; align-items: end; }
    .notice {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #b8d3ff;
      background: #eef5ff;
      color: #163b76;
      border-radius: 5px;
      line-height: 1.55;
      font-size: 13px;
    }
    .share-banner {
      margin-bottom: 12px;
      padding: 11px 12px;
      border: 1px solid #b8d3ff;
      background: #eef5ff;
      color: #163b76;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .update-banner {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #f1d28a;
      background: #fff8e5;
      color: #7a4b00;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .publisher-panel {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .publisher-panel h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }
    .publisher-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }
    .share-settings {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: #344054;
      font-size: 13px;
      font-weight: 600;
    }
    .share-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: #344054;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .share-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .share-switch-track {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: #d0d7e2;
      transition: background .16s ease, box-shadow .16s ease;
      flex: 0 0 auto;
    }
    .share-switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.24);
      transition: transform .16s ease;
    }
    .share-switch input:checked + .share-switch-track {
      background: var(--brand);
    }
    .share-switch input:checked + .share-switch-track::after {
      transform: translateX(16px);
    }
    .share-switch input:focus-visible + .share-switch-track {
      box-shadow: 0 0 0 3px rgba(15, 95, 85, 0.14);
    }
    .share-switch input:disabled + .share-switch-track,
    .share-switch input:disabled ~ span {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .nav-pool-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      flex: 0 1 auto;
      min-width: 0;
      margin-left: auto;
    }
    .nav-publisher-select {
      width: 130px;
      min-width: 130px;
      max-width: 130px;
      flex: 0 0 130px;
      border-color: rgba(15, 95, 85, 0.38);
      background-color: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(15, 95, 85, 0.08);
    }
    .share-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .share-state, .source-cell {
      display: grid;
      gap: 4px;
    }
    .share-cell { text-align: center; }
    .share-cell .share-state { justify-items: center; }
    .share-cell button { margin: 0 auto; }
    .share-head { text-align: center; }
    .share-action {
      min-height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.2;
    }
    .share-state strong, .source-cell strong { font-size: 13px; }
    .source-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge.soft { font-weight: 500; color: var(--muted); background: #f4f6fa; }
    .badge.warn { background: #fff4cc; color: #805400; }
    .publish-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .publish-box label {
      display: block;
      font-weight: 700;
      color: #344054;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .publish-box textarea { min-height: 82px; }
    .publish-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .publish-actions button {
      min-width: 112px;
      border-color: #c2410c;
      background: #c2410c;
      color: white;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(194, 65, 12, 0.16);
    }
    .publish-actions button:hover:not(:disabled) {
      border-color: #9a3412;
      background: #9a3412;
    }
    .history-modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 30;
      background: rgba(15, 23, 42, 0.36);
      padding: 32px;
      overflow: auto;
    }
    .history-modal.open { display: grid; place-items: start center; }
    .history-panel {
      width: min(1040px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.2);
      overflow: hidden;
    }
    .history-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .history-head h3 { margin: 0; font-size: 18px; }
    .history-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .history-body {
      padding: 16px 18px 18px;
      background: #f6f8fa;
      max-height: min(760px, calc(100vh - 150px));
      overflow: auto;
    }
    .history-list {
      display: grid;
      gap: 12px;
    }
    .history-item {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px;
      display: grid;
      gap: 12px;
    }
    .history-item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .history-item h4 { margin: 0; font-size: 15px; }
    .history-note {
      margin: 0;
      color: #344054;
      line-height: 1.55;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .history-metric {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #f8fafc;
      padding: 8px;
      min-height: 58px;
      min-width: 0;
    }
    .history-metric-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
      min-width: 0;
    }
    .history-metric-title span,
    .history-metric-title em {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-style: normal;
    }
    .history-metric-title em {
      max-width: 58%;
      color: #667085;
      text-align: right;
    }
    .history-metric strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      overflow-wrap: anywhere;
    }
    .history-metric strong.text-value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow-wrap: normal;
    }
    .history-metric [data-tooltip] { cursor: help; }
    .history-metric [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 8px;
      right: 8px;
      top: calc(100% - 4px);
      z-index: 4;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #111827;
      color: white;
      font-size: 12px;
      line-height: 1.5;
      white-space: normal;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
    }
    .history-delta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .form-error {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #f6c0b7;
      background: #fff3f0;
      color: #912018;
      border-radius: 6px;
      line-height: 1.5;
      text-align: left;
      font-size: 13px;
    }
    .readonly-note {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #d7e3f8;
      background: #f2f6ff;
      color: #24436f;
      border-radius: 6px;
      line-height: 1.5;
      font-size: 13px;
    }
    .disclaimer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .square-card, .admin-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }
    .square-card h3, .admin-card h3 { margin: 0; font-size: 16px; }
    .mini-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .mini-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--soft);
      padding-top: 7px;
    }
    .admin-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .admin-list {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .admin-user-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      min-height: 62px;
      text-align: left;
      padding: 10px;
      display: grid;
      gap: 4px;
    }
    .admin-user-row.active { background: #e9f0fb; }
    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .admin-actions input { width: min(360px, 100%); }
    .private-row { background: #fffdf6; }

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: none;
      z-index: 20;
    }
    .drawer.open { display: block; }
    .drawer-panel {
      width: min(1320px, 100vw);
      height: 100%;
      margin-left: auto;
      background: var(--panel);
      box-shadow: -12px 0 34px rgba(15, 23, 42, 0.16);
      display: flex;
      flex-direction: column;
    }
    .drawer-head {

      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));
    }

    function appBaseUrl() {
      if (location.hostname.endsWith("github.io")) {
        return `${location.origin}${APP_GITHUB_PAGES_PATH}`;
      }
      const path = location.pathname.endsWith("/")
        ? location.pathname
        : location.pathname.replace(/[^/]*$/, "");
      return `${location.origin}${path || "/"}`;
    }

    function hasAuthTokensInHash() {
      return location.hash.includes("access_token=");
    }

    function rememberPendingShareFromUrl() {
      const publisherId = new URLSearchParams(location.search).get("share");
      if (publisherId) {
        localStorage.setItem(PENDING_SHARE_KEY, publisherId);
        return publisherId;
      }
      if (!hasAuthTokensInHash()) {
        localStorage.removeItem(PENDING_SHARE_KEY);
      }
      return null;
    }

    function decodeJwt(token) {
      try {
        const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(decodeURIComponent(Array.from(atob(payload)).map((char) => `%${char.charCodeAt(0).toString(16).padStart(2, "0")}`).join("")));
      } catch {
        return {};
      }
    }

    function sessionFromHash() {
      if (!hasAuthTokensInHash()) return null;
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const expiresAt = Number(params.get("expires_at")) || Math.floor(Date.now() / 1000) + Number(params.get("expires_in") || 3600);
      if (!accessToken) return null;
      const claims = decodeJwt(accessToken);
      const session = {
        access_token: accessToken,
        refresh_token: refreshToken,
        expires_at: expiresAt,
        user: {
          id: claims.sub,
          email: claims.email || claims.user_metadata?.email || "",
          user_metadata: claims.user_metadata || {},
          app_metadata: claims.app_metadata || {}
        },
        claims
      };
      writeJson(AUTH_STORAGE_KEY, session);
      history.replaceState(null, "", AUTH_REDIRECT_URL);
      return session;
    }

    function currentSession() {
      const hashSession = sessionFromHash();
      if (hashSession) return hashSession;
      const saved = readJson(AUTH_STORAGE_KEY, null);
      if (!saved?.access_token) return null;
      const claims = decodeJwt(saved.access_token);
      saved.claims = saved.claims || claims;
      saved.user = {
        ...(saved.user || {}),
        id: saved.user?.id || claims.sub,
        email: saved.user?.email || claims.email || claims.user_metadata?.email || "",
        user_metadata: saved.user?.user_metadata || claims.user_metadata || {},
        app_metadata: saved.user?.app_metadata || claims.app_metadata || {}
      };
      return saved;
    }

    function persistSession(session) {
      if (!session?.access_token) return null;
      const claims = decodeJwt(session.access_token);
      const normalized = {
        ...session,
        expires_at: session.expires_at || Math.floor(Date.now() / 1000) + Number(session.expires_in || 3600),
        user: {
          ...(session.user || {}),
          id: session.user?.id || claims.sub,
          email: session.user?.email || claims.email || claims.user_metadata?.email || "",
          user_metadata: session.user?.user_metadata || claims.user_metadata || {},
          app_metadata: session.user?.app_metadata || claims.app_metadata || {}
        },
        claims
      };
      state.session = normalized;
      writeJson(AUTH_STORAGE_KEY, normalized);
      return normalized;
    }

    async function refreshSession() {
      if (!state.session?.refresh_token) throw new Error("登录已过期，请重新登录。");
      const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: state.session.refresh_token })
      });
      if (!response.ok) {
        writeJson(AUTH_STORAGE_KEY, null);
        state.session = null;
        throw new Error("登录已过期，请重新登录。");
      }
      return persistSession(await response.json());
    }

    async function ensureFreshSession() {
      if (!state.session?.access_token) throw new Error("请先登录。");
      const expiresAt = Number(state.session.expires_at || 0);
      if (expiresAt && expiresAt - Math.floor(Date.now() / 1000) < 60) {
        await refreshSession();

    }

    async function supabaseRequest(path, options = {}) {
      await ensureFreshSession();

        if (/jwt expired/i.test(errorText)) {
          await refreshSession();
          response = await supabaseFetch(path, options);
        }
      }
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `Supabase 请求失败：HTTP ${response.status}`);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function defaultCurrencyFor(stock) {
      if (!stock) return "CNY";
      if (stock.market === "CN" || stock.market === "HK") return "CNY";
      if (stock.market === "US") return "USD";
      return stock.currency || "CNY";
    }

    function toDisplay(cny, currency) {
      const rate = currencies[currency]?.rateToCny || 1;
      return Number(cny || 0) / rate;
    }

    function toCny(value, currency) {
      const rate = currencies[currency]?.rateToCny || 1;
      return Number(value || 0) * rate;
    }

    function roundedInputNumber(value, decimals = 6) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "";
      const factor = 10 ** decimals;
      return String(Math.round((number + Number.EPSILON) * factor) / factor);
    }

    function defaultAmountCurrencies() {
      return {
        expectedProfitCny: "CNY",
        expectedDividendCny: "CNY",
        expectedBuybackCny: "CNY",
        expectedShareholderReturnCny: "CNY",
        netCashCny: "CNY"
      };
    }

    function normalizeAmountCurrencies(value) {
      const defaults = defaultAmountCurrencies();
      const raw = value && typeof value === "object" ? value : {};
      return Object.fromEntries(Object.entries(defaults).map(([key, fallback]) => {
        const currency = raw[key];
        return [key, currencies[currency] ? currency : fallback];
      }));
    }

    function normalizeAmountInputValues(value) {
      const raw = value && typeof value === "object" ? value : {};
      return Object.fromEntries(Object.entries(defaultAmountCurrencies()).map(([key]) => {
        const input = raw[key];
        return [key, input === undefined || input === null ? "" : String(input)];
      }));
    }

    function normalizeOriginalAmounts(form) {
      const raw = form?.originalAmounts && typeof form.originalAmounts === "object" ? form.originalAmounts : {};
      const currencyMap = normalizeAmountCurrencies(form?.amountCurrencies);
      const inputMap = normalizeAmountInputValues(form?.amountInputValues);
      return Object.fromEntries(Object.keys(defaultAmountCurrencies()).map((key) => {
        const entry = raw[key] && typeof raw[key] === "object" ? raw[key] : {};
        const currency = currencies[entry.currency] ? entry.currency : currencyMap[key];
        const value = entry.value === undefined || entry.value === null ? inputMap[key] : String(entry.value);
        return [key, { value, currency }];
      }));
    }

    function amountCurrencyFor(form, key) {
      if (!form) return "CNY";
      if (String(key).startsWith("segmentProfit:")) {
        const index = Number(String(key).split(":")[1]);
        const segment = Array.isArray(form.segmentValuations) ? form.segmentValuations[index] : null;
        if (currencies[segment?.expectedProfitOriginal?.currency]) return segment.expectedProfitOriginal.currency;
        return currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY";
      }
      const original = normalizeOriginalAmounts(form)[key];
      if (currencies[original?.currency]) return original.currency;
      const map = normalizeAmountCurrencies(form.amountCurrencies);
      return currencies[map[key]] ? map[key] : "CNY";
    }

    function amountInputValueFor(form, key, cny, currency) {
      if (String(key).startsWith("segmentProfit:")) {
        const index = Number(String(key).split(":")[1]);
        const segment = Array.isArray(form?.segmentValuations) ? form.segmentValuations[index] : null;
        if (segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null && segment.expectedProfitOriginal.value !== "") {
          return String(segment.expectedProfitOriginal.value);
        }
        if (segment?.expectedProfitInput !== undefined && segment?.expectedProfitInput !== null && segment.expectedProfitInput !== "") {
          return String(segment.expectedProfitInput);
        }
      } else {
        const original = normalizeOriginalAmounts(form)[key];
        if (original?.value !== "") return original.value;
        const input = normalizeAmountInputValues(form?.amountInputValues)[key];
        if (input !== "") return input;
      }
      return roundedInputNumber(toDisplay(cny, currency), 2);
    }

    function money(cny, currency) {
      if (cny === null || cny === undefined || Number.isNaN(Number(cny))) return "--";
      const value = toDisplay(cny, currency);
      return `${trimNumber(value)} ${currency}`;
    }

    function metricMoney(cny, currency) {
      if (!Number(cny)) return "—";
      return money(cny, currency);
    }

    function moneyYiCny(cny) {
      if (cny === null || cny === undefined || Number.isNaN(Number(cny))) return "--";
      return trimNumber(cny);
    }

    function trimNumber(value) {
      const abs = Math.abs(Number(value));
      const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
      return Number(value).toLocaleString("zh-CN", { maximumFractionDigits: digits, minimumFractionDigits: 0 });
    }

    function percent(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "--";
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function marketLabel(market) {
      return ({ CN: "A股", HK: "H股", US: "美股" })[market] || market || "--";
    }

    function todayString() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDateTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function formatDate(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function marketCurrency(market) {
      return ({ CN: "CNY", HK: "HKD", US: "USD" })[market] || "CNY";
    }

    function normalizeCode(code, market) {
      if (market === "HK") return `${String(code).padStart(5, "0")}.HK`;
      if (market === "CN") {
        const suffix = String(code).startsWith("6") ? ".SH" : ".SZ";

    function fetchWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { signal: controller.signal }).finally(() => window.clearTimeout(timeout));
    }

    function jsonp(url, callbackParam = "cb") {
      return new Promise((resolve, reject) => {
        const callbackName = `jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("JSONP 请求超时"));
        }, 8000);

        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error("JSONP 请求失败"));
        };
        script.src = `${url}${separator}${callbackParam}=${callbackName}`;
        document.head.appendChild(script);
      });
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timeout = window.setTimeout(() => {
          script.remove();
          reject(new Error("脚本请求超时"));
        }, 8000);
        script.onload = () => {
          window.clearTimeout(timeout);
          script.remove();
          resolve();
        };
        script.onerror = () => {
          window.clearTimeout(timeout);
          script.remove();
          reject(new Error("脚本请求失败"));
        };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    async function fetchQuote(stock) {
      let triedTencent = false;
      if (stock.market === "HK") {
        triedTencent = true;
        try { return await fetchTencentQuote(stock); }
        catch (error) { console.warn("腾讯港股实时行情不可用，尝试东方财富备用行情。", error); }
      }
      const quoteId = stockQuoteId(stock);
      const fields = "f43,f57,f58,f60,f116,f170";
      if (quoteId) {
        const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${encodeURIComponent(quoteId)}&fields=${fields}`;
        try {
          const json = await jsonp(url);
          const data = json?.data;
          const priceScale = quotePriceScale(stock);
          const latestPrice = Number(data?.f43) / priceScale;
          if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error("行情接口没有返回最新价");
          const marketCap = Number(data?.f116);
          const sourceCurrency = marketCurrency(stock.market);
          const latestMarketCapCny = marketCap > 0
            ? marketCap * (currencies[sourceCurrency]?.rateToCny || 1) / 100000000
            : Number(stock.latestMarketCapCny) || stock.marketCapCny || 0;
          const previousClose = Number(data?.f60) / priceScale || 0;
          const changePercent = data?.f170 !== null && data?.f170 !== undefined && Number.isFinite(Number(data.f170))
            ? Number(data.f170) / 100
            : previousClose ? (latestPrice / previousClose - 1) * 100 : null;
          return {
            ...stock,
            quoteId,
            name: data.f58 || stock.name,
            rawCode: data.f57 || stock.rawCode,
            latestPrice,
            previousClose,
            changePercent,
            latestMarketCapCny,
            marketCapSourceCurrency: sourceCurrency,
            marketCapUpdatedAt: todayString()
          };
        } catch (error) {
          console.warn("东方财富行情接口不可用，尝试腾讯备用行情。", error);
        }
      }
      if (!triedTencent) {
        try { return await fetchTencentQuote(stock); }
        catch (error) { console.warn("腾讯行情接口不可用，保留最近行情。", error); }
      }
      return {
        ...stock,
        latestMarketCapCny: Number(stock.latestMarketCapCny) || stock.marketCapCny || 0,
        marketCapSourceCurrency: stock.currency || marketCurrency(stock.market),
        marketCapUpdatedAt: stock.marketCapUpdatedAt || stock.updatedAt || todayString()
      };
    }

    async function refreshMarketCaps({ renderAfter = true } = {}) {
      if (marketCapRefreshInFlight || !state.session) return;
      const ownTargets = state.stocks.filter((stock) => stock.quoteId && !stock.sourceDeletedAt);
      const publisherTargets = state.publisherStocks.filter((stock) => stock.quoteId && !stock.sourceDeletedAt);
      const targets = [
        ...ownTargets.map((stock) => ({ scope: "own", stock })),
        ...publisherTargets.map((stock) => ({ scope: "publisher", stock }))
      ];
      if (!targets.length) return;
      marketCapRefreshInFlight = true;
      try {
        const quotes = await Promise.all(targets.map(async (item) => {
          try {
            return { ...item, quote: await fetchQuote(item.stock) };
          } catch (error) {
            console.warn("刷新市值失败。", item.stock?.code, error);
            return null;
          }
        }));
        quotes.filter(Boolean).forEach(({ scope, stock, quote }) => {
          if (scope === "own") {
            state.stocks = state.stocks.map((item) => item.id === stock.id ? mergeRuntimeMarketCap(item, quote) : item);
          } else {
            state.publisherStocks = state.publisherStocks.map((item) => item.id === stock.id ? mergeRuntimeMarketCap(item, quote) : item);
          }
          if (state.form?.id === stock.id) {
            state.form = mergeRuntimeMarketCap(state.form, quote);
          }
        });
      } finally {
        marketCapRefreshInFlight = false;
      }
      if (renderAfter) render();
    }

    async function fetchTencentQuote(stock) {
      const symbol = tencentSymbol(stock);
      if (!symbol) throw new Error("无法识别腾讯行情代码");
      let parts = null;
      if (stock.market === "HK") {
        const response = await fetchWithTimeout(`https://web.ifzq.gtimg.cn/appstock/app/hkMinute/query?code=${encodeURIComponent(symbol)}&_=${Date.now()}`, 8000);
        if (!response.ok) throw new Error(`腾讯港股实时行情 HTTP ${response.status}`);
        const json = await response.json();
        parts = json?.data?.[symbol]?.qt?.[symbol] || null;
      } else {
        const variableName = `v_${symbol}`;
        delete window[variableName];
        await loadScript(`https://qt.gtimg.cn/q=${symbol}&_=${Date.now()}`);
        const text = window[variableName];
        delete window[variableName];
        parts = text ? text.split("~") : null;
      }
      if (!parts?.length) throw new Error("腾讯行情没有返回数据");
      const marketCapYi = Number(parts[45] || parts[44]);
      if (!marketCapYi || Number.isNaN(marketCapYi)) throw new Error("腾讯行情没有返回总市值");
      const sourceCurrency = marketCurrency(stock.market);
      const latestPrice = Number(parts[3]) || Number(stock.latestPrice) || 0;
      const previousClose = Number(parts[4]) || 0;
      const quotedChangePercent = String(parts[32] || "").trim() === "" ? NaN : Number(parts[32]);
      return {
        ...stock,
        latestPrice,
        previousClose,
        changePercent: Number.isFinite(quotedChangePercent) ? quotedChangePercent : previousClose ? (latestPrice / previousClose - 1) * 100 : null,
        latestMarketCapCny: marketCapYi * (currencies[sourceCurrency]?.rateToCny || 1),
        marketCapSourceCurrency: sourceCurrency,
        marketCapUpdatedAt: todayString()
      };
    }

    function calc(stock) {
      const latest = Number(stock.latestMarketCapCny) || 0;
      const profit = Number(stock.expectedProfitCny) || 0;
      const pe = Number(stock.expectedPE) || 0;
      const cash = Number(stock.netCashCny) || 0;
      const discount = Number(stock.netCashDiscountRate) || 0;
      const shareholder = shareholderReturnTotal(stock);
      const expectedMarketCapCny = profit * pe + cash * discount;
      return {
        expectedMarketCapCny,
        upside: latest ? expectedMarketCapCny / latest - 1 : null,
        forwardPE: profit ? (latest - cash * discount) / profit : null,
        shareholderReturnRate: latest ? shareholder / latest : null
      };
    }

    function shareholderReturnRateForList(stock, computed) {
      const rate = computed.shareholderReturnRate;
      if (rate === null || rate === undefined) return rate;
      if (!state.stockConnectDividendTax || stock.market !== "HK") return rate;
      const latest = Number(stock.latestMarketCapCny) || 0;
      if (!latest) return rate;
      return ((Number(stock.expectedDividendCny) || 0) * 0.8 + (Number(stock.expectedBuybackCny) || 0)) / latest;
    }

    function shareholderReturnTotal(stock) {
      return Number(stock?.expectedShareholderReturnCny) || 0;
    }

    function emptySegmentValuationRow(index = 0, forecastYear = "2026E") {
      return {
        segmentName: index ? `分部${index}` : "",
        expectedProfitCny: 0,
        expectedProfitCurrency: "CNY",
        expectedProfitInput: "",
        expectedProfitOriginal: { value: "", currency: "CNY" },
        expectedPE: 0,
        expectedPEInput: "",
        forecastYear,
        expectedPERemark: ""
      };
    }

    function normalizeSegmentValuationFields(stock) {
      const next = { ...stock };
      next.useSegmentValuation = Boolean(next.useSegmentValuation);
      const rawSegments = Array.isArray(next.segmentValuations) ? next.segmentValuations : [];
      next.segmentValuations = rawSegments.map((segment, index) => ({
        segmentName: segment?.segmentName || segment?.name || `分部${index + 1}`,
        expectedProfitCny: Number(segment?.expectedProfitCny) || 0,
        expectedProfitCurrency: currencies[segment?.expectedProfitOriginal?.currency] ? segment.expectedProfitOriginal.currency : currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY",
        expectedProfitInput: segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null ? String(segment.expectedProfitOriginal.value) : segment?.expectedProfitInput === undefined || segment?.expectedProfitInput === null ? "" : String(segment.expectedProfitInput),
        expectedProfitOriginal: {
          value: segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null ? String(segment.expectedProfitOriginal.value) : segment?.expectedProfitInput === undefined || segment?.expectedProfitInput === null ? "" : String(segment.expectedProfitInput),
          currency: currencies[segment?.expectedProfitOriginal?.currency] ? segment.expectedProfitOriginal.currency : currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY"
        },
        expectedPE: Number(segment?.expectedPE) || 0,
        expectedPEInput: segment?.expectedPEInput === undefined || segment?.expectedPEInput === null ? String(Number(segment?.expectedPE) || "") : String(segment.expectedPEInput),
        forecastYear: segment?.forecastYear || next.forecastYear || "2026E",
        expectedPERemark: segment?.expectedPERemark || ""
      }));
      if (next.useSegmentValuation) {
        while (next.segmentValuations.length < 2) {
          next.segmentValuations.push(emptySegmentValuationRow(next.segmentValuations.length + 1, next.forecastYear || "2026E"));
        }
        applySegmentValuationTotals(next);
      }
      return next;
    }

    function applySegmentValuationTotals(stock) {
      if (!stock?.useSegmentValuation) return stock;
      const segments = Array.isArray(stock.segmentValuations) ? stock.segmentValuations : [];
      const totalProfit = segments.reduce((sum, segment) => sum + (Number(segment.expectedProfitCny) || 0), 0);
      const totalMarketCap = segments.reduce((sum, segment) => {
        return sum + (Number(segment.expectedProfitCny) || 0) * (Number(segment.expectedPE) || 0);
      }, 0);
      stock.expectedProfitCny = totalProfit;
      stock.expectedPE = totalProfit ? totalMarketCap / totalProfit : 0;
      return stock;
    }

    function normalizeShareholderReturnFields(stock) {
      const next = normalizeSegmentValuationFields(stock);
      next.version = normalizeStockVersion(next.version);
      next.amountCurrencies = normalizeAmountCurrencies(next.amountCurrencies);
      next.amountInputValues = normalizeAmountInputValues(next.amountInputValues);
      next.originalAmounts = normalizeOriginalAmounts(next);
      next.amountCurrencies = Object.fromEntries(Object.entries(next.originalAmounts).map(([key, entry]) => [key, entry.currency]));
      next.amountInputValues = Object.fromEntries(Object.entries(next.originalAmounts).map(([key, entry]) => [key, entry.value]));
      next.expectedPEInput = next.expectedPEInput === undefined || next.expectedPEInput === null ? String(Number(next.expectedPE) || "") : String(next.expectedPEInput);
      if (next.expectedDividendCny === undefined && next.expectedBuybackCny === undefined) {
        next.expectedDividendCny = Number(next.expectedShareholderReturnCny) || 0;
        next.expectedBuybackCny = 0;
      } else {
        next.expectedDividendCny = Number(next.expectedDividendCny) || 0;
        next.expectedBuybackCny = Number(next.expectedBuybackCny) || 0;
      }
      if (next.expectedShareholderReturnCny === undefined || next.expectedShareholderReturnCny === "") {
        next.expectedShareholderReturnCny = next.expectedDividendCny + next.expectedBuybackCny;
      } else {
        next.expectedShareholderReturnCny = Number(next.expectedShareholderReturnCny) || 0;
      }
      return next;
    }

    function normalizeStockVersion(value) {
      const text = String(value || "").trim();
      return text || "中性";
    }

    function stockVersionMode(value) {
      return ["乐观", "中性", "悲观"].includes(normalizeStockVersion(value)) ? normalizeStockVersion(value) : "自定义";
    }

    function buildPublicationSnapshot(stock, changeNote = "") {
      const normalized = normalizeShareholderReturnFields(stock);
      const computed = calc(normalized);
      return {
        schemaVersion: 2,
        stock: {
          id: normalized.id || null,
          name: normalized.name || "",
          code: normalized.code || "",
          market: normalized.market || "",
          exchange: normalized.exchange || "",
          version: normalizeStockVersion(normalized.version),
          displayCurrency: normalized.displayCurrency || defaultCurrencyFor(normalized)
        },
        assumptions: {
          latestMarketCapCny: Number(normalized.latestMarketCapCny) || 0,
          marketCapUpdatedAt: normalized.marketCapUpdatedAt || "",
          amountCurrencies: normalizeAmountCurrencies(normalized.amountCurrencies),
          amountInputValues: normalizeAmountInputValues(normalized.amountInputValues),
          originalAmounts: normalizeOriginalAmounts(normalized),
          useSegmentValuation: Boolean(normalized.useSegmentValuation),
          segmentValuations: Array.isArray(normalized.segmentValuations) ? normalized.segmentValuations : [],
          expectedProfitCny: Number(normalized.expectedProfitCny) || 0,
          expectedPE: Number(normalized.expectedPE) || 0,
          expectedPEInput: normalized.expectedPEInput === undefined || normalized.expectedPEInput === null ? "" : String(normalized.expectedPEInput),
          forecastYear: normalized.forecastYear || "",
          expectedPERemark: normalized.expectedPERemark || "",
          netCashCny: Number(normalized.netCashCny) || 0,
          netCashScope: normalized.netCashScope || "",
          netCashDiscountRate: Number(normalized.netCashDiscountRate) || 0,
          expectedDividendCny: Number(normalized.expectedDividendCny) || 0,
          expectedBuybackCny: Number(normalized.expectedBuybackCny) || 0,
          expectedShareholderReturnCny: Number(normalized.expectedShareholderReturnCny) || 0,
          shareholderReturnRemark: normalized.shareholderReturnRemark || ""
        },
        computed,
        note: {
          investmentNote: normalized.investmentNote || "",
          myNote: normalized.myNote || "",
          changeNote
        }
      };
    }

    function stockFromPublication(publication) {
      const payload = publication?.payload || {};
      if (!payload.schemaVersion) return normalizeShareholderReturnFields(payload);
      return normalizeShareholderReturnFields({
        ...(payload.stock || {}),
        ...(payload.assumptions || {}),
        investmentNote: payload.note?.investmentNote || "",
        myNote: payload.note?.myNote || "",
        isShared: true,
        lastPublishedAt: publication.created_at || payload.lastPublishedAt || "",
        updatedAt: publication.created_at || payload.updatedAt || ""

    }

    function activePortfolio() {

    function portfolioBaseCurrency(portfolio) {
      return portfolio?.accountType === "HKUS" ? "USD" : "CNY";
    }

    function portfolioFx(currency, baseCurrency) {
      if (currency === baseCurrency) return 1;
      const cnyRate = currencies[currency]?.rateToCny || 1;
      const baseCnyRate = currencies[baseCurrency]?.rateToCny || 1;
      return cnyRate / baseCnyRate;
    }

    function positionBaseValue(position, portfolio) {
      const price = Number(position.latestPrice) || Number(position.averageCost) || 0;
      return Number(position.shares || 0) * price * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
    }

    function portfolioMetrics(portfolio) {
      if (!portfolio) return { positionBase: 0, cashBase: 0, netBase: 0, netCny: 0, positionCny: 0, cashCny: 0, nav: 0 };
      const base = portfolioBaseCurrency(portfolio);
      const positionBase = (portfolio.positions || []).reduce((sum, item) => sum + positionBaseValue(item, portfolio), 0);
      const cash = portfolio.cash || {};
      const cashBase = portfolio.accountType === "HKUS"
        ? Number(cash.USD || 0) + Number(cash.HKD || 0) * portfolioFx("HKD", "USD")
        : Number(cash.CNY || 0);
      const netBase = positionBase + cashBase;
      const baseToCny = currencies[base]?.rateToCny || 1;
      const totalUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      const assetNav = totalUnits ? netBase / totalUnits : 0;
      return {
        positionBase,
        cashBase,
        netBase,
        positionCny: positionBase * baseToCny,
        cashCny: cashBase * baseToCny,
        netCny: netBase * baseToCny,
        nav: assetNav
      };
    }

    function formatWan(value) {
      return `${(Number(value || 0) / 10000).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} 万元`;

    function formatPortfolioSummary(value, portfolio, { signed = false } = {}) {
      const amount = Number(value || 0) / 10000;

      const unit = portfolio?.accountType === "HKUS" ? "万美元" : "万元";
      return `${sign}${amount.toLocaleString("zh-CN", { minimumFractionDigits: 0, maximumFractionDigits: 2 })} ${unit}`;
    }

    function portfolioTotalProfit(portfolio, metrics) {
      const flowCapital = (portfolio.cashFlows || []).reduce((sum, flow) => {
        const baseAmount = Number(flow.unitsChanged || 0) * Number(flow.navBefore || 0);
        return sum + (flow.type === "redemption" ? -baseAmount : baseAmount);
      }, 0);
      return metrics.netBase - Number(portfolio.startBase || 0) - flowCapital;
    }

    function formatPortfolioMoney(value, currency) {

    function previousPortfolioNav() {
      if (state.navHistoryPortfolioId && state.navHistoryPortfolioId !== state.activePortfolioId) return null;
      const today = todayString();
      const row = [...state.navHistory]
        .filter((item) => item.nav_date && item.nav_date < today && Number(item.unit_nav) > 0)
        .sort((a, b) => b.nav_date.localeCompare(a.nav_date))[0];
      return row ? Number(row.unit_nav) : null;
    }

    function portfolioDailyProfit(portfolio) {
      const base = portfolioBaseCurrency(portfolio);
      let dailyProfit = 0;
      let quotedPositions = 0;
      for (const position of portfolio.positions || []) {
        const shares = Number(position.shares || 0);
        if (!shares) continue;
        const latestPrice = Number(position.latestPrice);
        const previousClose = Number(position.previousClose);
        if (!(latestPrice > 0) || !(previousClose > 0)) continue;
        quotedPositions += 1;
        dailyProfit += (latestPrice - previousClose) * shares * portfolioFx(position.currency, base);
      }
      return { amount: dailyProfit, quotedPositions };
    }

    function renderPortfolioNavChange(currentNav, portfolio) {
      if (state.portfolioPrivacyMode) return `<span class="muted">当日盈亏 **** · 较昨日 ****</span>`;
      const totalUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      const { amount: profitAmount, quotedPositions } = portfolioDailyProfit(portfolio);
      const hasPositions = (portfolio.positions || []).some((position) => Number(position.shares || 0) > 0);
      if (!(totalUnits > 0) || (hasPositions && !quotedPositions)) return `<span class="muted">当日盈亏 -- · 较昨日 --</span>`;
      const delta = profitAmount / totalUnits;
      const previousNav = Number(currentNav) - delta;
      const change = previousNav > 0 ? delta / previousNav * 100 : 0;
      const sign = delta > 0 ? "+" : "";
      const className = delta > 0 ? "gain" : delta < 0 ? "loss" : "muted";
      return `<span class="${className}">当日盈亏 ${formatPortfolioSummary(profitAmount, portfolio, { signed: true })} · 较昨日 ${sign}${delta.toFixed(4)}（${sign}${change.toFixed(2)}%）</span>`;
    }

    function portfolioDailyProfitSummary(portfolio, metrics) {
      const { amount, quotedPositions } = portfolioDailyProfit(portfolio);
      if (state.portfolioPrivacyMode) return { text: "当日盈亏 ****", className: "muted" };
      const hasPositions = (portfolio.positions || []).some((position) => Number(position.shares || 0) > 0);
      if (hasPositions && !quotedPositions) return { text: "当日盈亏 --", className: "muted" };
      const previousNet = Number(metrics?.netBase || 0) - amount;
      const percent = previousNet > 0 ? amount / previousNet * 100 : 0;
      const sign = amount > 0 ? "+" : "";
      const className = amount > 0 ? "gain" : amount < 0 ? "loss" : "muted";
      const text = `${formatPortfolioSummary(amount, portfolio, { signed: true })} ${sign}${percent.toFixed(2)}%`;
      return { text: `当日盈亏 ${portfolioPrivate(text)}`, className };
    }

    const intradayBenchmarkCatalog = {
      CNY: [{ code: "CSI300", label: "沪深300", symbol: "sh000300" }, { code: "SSE", label: "上证指数", symbol: "sh000001" }],
      HKUS: [{ code: "HSI", label: "恒生指数", symbol: "hkHSI" }, { code: "SP500", label: "标普500", symbol: "usINX" }]
    };

    function renderIntradayBenchmarks(portfolio) {
      const rows = intradayBenchmarkCatalog[portfolio.accountType] || [];
      return `<div class="portfolio-benchmarks">${rows.map((item) => {
        const quote = state.portfolioBenchmarks[item.code];

    }

    function renderPortfolioView() {
      const portfolio = activePortfolio();
      if (!portfolio) {
        return `<section class="portfolio-empty"><h2>还没有组合</h2><p>创建一个组合，开始记录现金和实际仓位。</p><button class="primary" data-action="createPortfolio">创建组合</button></section>`;

      const metrics = portfolioMetrics(portfolio);
      const isHkus = portfolio.accountType === "HKUS";

      const cashRatio = metrics.netBase ? metrics.cashBase / metrics.netBase : 0;

            </div>
            <button class="portfolio-privacy-toggle ${state.portfolioPrivacyMode ? "active" : ""}" data-action="togglePortfolioPrivacy" aria-label="${state.portfolioPrivacyMode ? "显示资产数据" : "隐藏资产数据"}" title="${state.portfolioPrivacyMode ? "显示资产数据" : "隐藏资产数据"}">${portfolioPrivacyIcon()}</button>

            <button class="portfolio-action-btn portfolio-action-rebalance" data-action="rebalancePortfolio">${portfolioActionIcon("rebalance")}<span>调仓</span></button>
            <button class="portfolio-action-btn portfolio-action-summary portfolio-summary-toggle" data-action="togglePortfolioSummary">

            <div class="portfolio-menu">
              <button type="button" class="portfolio-action-btn portfolio-action-more">${portfolioActionIcon("more")}<span>更多操作</span></button>
              <div class="portfolio-menu-panel">
                <button type="button" data-action="createPortfolio">创建新组合</button>
                <button type="button" data-action="renamePortfolio">重命名组合</button>

                <button type="button" class="danger portfolio-menu-danger" data-action="deletePortfolio">删除组合</button>
              </div>
            </div>
            <div class="segmented portfolio-view-tabs"><button class="${state.portfolioPage === "positions" ? "active" : ""}" data-action="portfolioPage" data-page="positions">持仓</button><button class="${state.portfolioPage === "performance" ? "active" : ""}" data-action="portfolioPage" data-page="performance">净值</button></div>
          </div>
        </div>
        ${summaryExpanded ? `<section class="portfolio-summary">
          <div class="portfolio-metric"><div class="portfolio-metric-label">净资产</div><div class="portfolio-metric-value">${portfolioPrivate(formatPortfolioSummary(metrics.netBase, portfolio))}</div><div class="portfolio-metric-sub">总盈亏 <span class="${profitClass}">${portfolioPrivate(formatPortfolioSummary(totalProfit, portfolio, { signed: true }))}</span></div></div>
          <div class="portfolio-metric"><div class="portfolio-metric-label">仓位市值</div><div class="portfolio-metric-value">${portfolioPrivate(formatPortfolioSummary(metrics.positionBase, portfolio))}</div><div class="portfolio-metric-sub">仓位比例 ${(positionRatio * 100).toFixed(2)}%</div></div>
          <div class="portfolio-metric">
            <div class="portfolio-cash-head"><div class="portfolio-metric-label">现金市值</div><button data-action="calibrateCash">校准现金</button></div>
            <div class="portfolio-metric-value">${portfolioPrivate(formatPortfolioSummary(metrics.cashBase, portfolio))}</div>
            <div class="portfolio-metric-sub">现金比例 ${(cashRatio * 100).toFixed(2)}%<br>${portfolioPrivate(isHkus ? `港币 ${formatPortfolioMoney(portfolio.cash?.HKD, "HKD")} · 美元 ${formatPortfolioMoney(portfolio.cash?.USD, "USD")}` : `人民币 ${formatPortfolioMoney(portfolio.cash?.CNY, "CNY")}`)}</div>
          </div>
          <div class="portfolio-metric"><div class="portfolio-metric-label">盘中估算净值</div><div class="portfolio-metric-value">${portfolioPrivate(metrics.nav.toFixed(4))}</div><div class="portfolio-metric-sub">${renderPortfolioNavChange(metrics.nav, portfolio)}${renderIntradayBenchmarks(portfolio)}</div></div>
        </section>` : ""}
        ${state.portfolioPage === "performance" ? renderPortfolioPerformance(portfolio) : renderPortfolioTable(portfolio, metrics)}
      `;
    }

    function filteredNavHistory() {
      const rows = [...state.navHistory].sort((a, b) => a.nav_date.localeCompare(b.nav_date));
      if (!rows.length || state.navRange === "ALL") return rows;
      if (state.navRange === "YEAR") return rows.filter((row) => row.nav_date.startsWith(state.navYear));
      const start = new Date(`${rows.at(-1).nav_date}T00:00:00`);
      if (state.navRange === "3M") start.setMonth(start.getMonth() - 3); else start.setMonth(0, 1);
      return rows.filter((row) => new Date(`${row.nav_date}T00:00:00`) >= start);
    }

    function performanceStats(rows) {
      if (rows.length < 2) return { total: null, drawdown: null, sharpe: null };
      let peak = Number(rows[0].unit_nav), drawdown = 0; const returns = [];
      rows.forEach((row, index) => { const nav = Number(row.unit_nav); peak = Math.max(peak, nav); drawdown = Math.min(drawdown, nav / peak - 1); if (index) returns.push(nav / Number(rows[index - 1].unit_nav) - 1); });
      const mean = returns.reduce((a,b)=>a+b,0) / returns.length; const variance = returns.reduce((s,v)=>s+(v-mean)**2,0) / Math.max(1, returns.length-1);
      return { total: Number(rows.at(-1).unit_nav) / Number(rows[0].unit_nav) - 1, drawdown, sharpe: variance ? mean / Math.sqrt(variance) * Math.sqrt(252) : null };
    }

    function renderNavSvg(rows) {
      if (rows.length < 2) return `<div class="empty">暂无足够的日终净值数据。</div>`;
      const values = rows.map((row) => Number(row.unit_nav) / Number(rows[0].unit_nav));
      const bm = new Map(state.benchmarkHistory.filter((row)=>row.benchmark_code===state.benchmarkCode).map((row)=>[row.trade_date,Number(row.close_value)])); const firstBm = rows.map((row)=>bm.get(row.nav_date)).find(Boolean); const bmValues = rows.map((row)=>firstBm && bm.get(row.nav_date) ? bm.get(row.nav_date)/firstBm : null);
      const all=[...values,...bmValues.filter(Boolean)], min = Math.min(...all), max = Math.max(...all), span=max-min||.01; const makePath=(series)=>series.map((value,index)=>value==null?"":`${index ? "L" : "M"}${(index/(series.length-1)*960+20).toFixed(1)},${(280-(value-min)/span*240).toFixed(1)}`).join(" ");
      return `<div class="muted" style="margin-bottom:8px">绿色：组合${firstBm ? `　蓝色：${state.benchmarkCode}` : ""}</div><svg class="nav-chart" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="${makePath(values)}" fill="none" stroke="#0f5f55" stroke-width="3" vector-effect="non-scaling-stroke"/>${firstBm?`<path d="${makePath(bmValues)}" fill="none" stroke="#2f5f98" stroke-width="2" vector-effect="non-scaling-stroke"/>`:""}</svg>`;
    }

    function renderPortfolioNavHistory(rows, portfolio) {
      if (!rows.length) return `<section class="table-panel portfolio-nav-history"><div class="empty">暂无净值明细。</div></section>`;
      const allRows = [...state.navHistory].sort((a, b) => a.nav_date.localeCompare(b.nav_date));
      const previousByDate = new Map(allRows.map((row, index) => [row.nav_date, index ? allRows[index - 1] : null]));
      const body = [...rows].reverse().map((row) => {
        const nav = Number(row.unit_nav);
        const previousNav = Number(previousByDate.get(row.nav_date)?.unit_nav);
        const hasChange = nav > 0 && previousNav > 0;
        const navChange = hasChange ? nav / previousNav - 1 : NaN;
        const totalUnits = Number(row.total_units) || (nav > 0 ? Number(row.total_assets) / nav : 0);
        const profitAmount = hasChange && totalUnits > 0 ? (nav - previousNav) * totalUnits : NaN;
        const className = hasChange ? (navChange > 0 ? "gain" : navChange < 0 ? "loss" : "muted") : "muted";
        const changeText = hasChange ? `${navChange > 0 ? "+" : ""}${(navChange * 100).toFixed(2)}%` : "--";
        const profitText = Number.isFinite(profitAmount) ? formatPortfolioSummary(profitAmount, portfolio, { signed: true }) : "--";
        return `<tr><td>${escapeHtml(row.nav_date)}</td><td class="num">${nav > 0 ? nav.toFixed(4) : "--"}</td><td class="num ${className}">${changeText}</td><td class="num ${className}">${portfolioPrivate(profitText)}</td></tr>`;
      }).join("");
      return `<section class="table-panel portfolio-nav-history"><div class="portfolio-nav-history-title">净值明细</div><div class="table-scroll"><table><thead><tr><th>日期</th><th class="num">净值</th><th class="num">当日净值涨跌幅</th><th class="num">当日盈亏金额</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
    }

    function renderPortfolioPerformance(portfolio) {
      const rows = filteredNavHistory(), stats = performanceStats(rows); const years = [...new Set(state.navHistory.map((row)=>row.nav_date.slice(0,4)))].sort().reverse();
      const benchmarks = portfolio.accountType === "HKUS" ? [["HSI","恒生指数"],["HSTECH","恒生科技"],["SP500","标普500"],["NDX100","纳斯达克100"]] : [["CSI300","沪深300"]];
      if (!state.benchmarkCode || !benchmarks.some(([code])=>code===state.benchmarkCode)) state.benchmarkCode = benchmarks[0][0];
      return `<div class="toolbar"><div class="segmented"><button data-action="navRange" data-range="3M">近三个月</button><button data-action="navRange" data-range="YTD">年初至今</button><button data-action="navRange" data-range="ALL">全部</button></div><select data-input="navYear"><option value="">选择年份</option>${years.map((year)=>`<option>${year}</option>`).join("")}</select><select data-input="benchmark">${benchmarks.map(([code,label])=>`<option value="${code}">${label}</option>`).join("")}</select></div><div class="performance-grid"><div class="portfolio-metric"><div class="portfolio-metric-label">区间收益</div><div class="portfolio-metric-value">${percent(stats.total)}</div></div><div class="portfolio-metric"><div class="portfolio-metric-label">最大回撤</div><div class="portfolio-metric-value">${percent(stats.drawdown)}</div></div><div class="portfolio-metric"><div class="portfolio-metric-label">年化夏普比率</div><div class="portfolio-metric-value">${stats.sharpe == null ? "--" : stats.sharpe.toFixed(2)}</div><div class="portfolio-metric-sub">无风险利率暂按 0</div></div></div><section class="table-panel" style="padding:14px">${renderNavSvg(rows)}</section>${renderPortfolioNavHistory(rows, portfolio)}`;
    }

    function renderPortfolioTable(portfolio, metrics) {
      const sort = state.portfolioSort || { key: "value", dir: "desc" };
      const positionWeight = (position) => metrics.netBase ? positionBaseValue(position, portfolio) / metrics.netBase : 0;
      const sortValue = (position) => sort.key === "change" ? (position.changePercent == null ? NaN : Number(position.changePercent)) : sort.key === "weight" ? positionWeight(position) : positionBaseValue(position, portfolio);
      const positions = [...(portfolio.positions || [])].sort((a, b) => {
        const aValue = sortValue(a), bValue = sortValue(b);
        const aMissing = !Number.isFinite(aValue), bMissing = !Number.isFinite(bValue);
        if (aMissing !== bMissing) return aMissing ? 1 : -1;
        return (aValue - bValue) * (sort.dir === "asc" ? 1 : -1);
      });
      if (!positions.length) return `<section class="portfolio-empty"><strong>暂无持仓</strong><p>点击“开仓”录入第一只股票。</p><button class="primary" data-action="openPosition">+ 开仓</button></section>`;
      const base = portfolioBaseCurrency(portfolio);
      const dailySummary = portfolioDailyProfitSummary(portfolio, metrics);
      const sortIndicator = (key) => sort.key === key ? `<span class="portfolio-sort-indicator">${sort.dir === "asc" ? "▲" : "▼"}</span>` : "";
      return `
        <section class="table-panel portfolio-table">
          <div class="portfolio-list-head">
            <div class="portfolio-list-head-main">
              <div class="portfolio-list-head-title">持仓列表<span class="portfolio-account-badge">${base === "USD" ? "美元" : "人民币"}</span></div>
              <span class="portfolio-daily-chip ${dailySummary.className}">${dailySummary.text}</span>
            </div>
            <div class="portfolio-list-tools">
              ${state.portfolioQuotesUpdatedAt ? `<span class="portfolio-update-text">最新更新 ${formatDateTime(state.portfolioQuotesUpdatedAt)}</span>` : ""}
              <button class="portfolio-list-refresh" data-action="refreshPortfolioQuotes" ${portfolioQuoteRefreshInFlight ? "disabled" : ""} title="刷新实时股价及全部盈亏数据">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
                ${portfolioQuoteRefreshInFlight ? "刷新中" : "刷新"}
              </button>
            </div>
          </div>
          <div class="table-scroll"><table>
          <thead><tr><th class="sticky-col">股票</th><th>股数</th><th class="num">摊薄成本</th><th class="num">实时股价</th><th class="sortable" data-action="sortPortfolio" data-sort-key="change">当日涨跌幅${sortIndicator("change")}</th><th class="num">当日盈亏</th><th class="num">持仓盈亏</th><th class="num">市值</th><th class="sortable" data-action="sortPortfolio" data-sort-key="weight">仓位比例${sortIndicator("weight")}</th><th>目标仓位</th><th>操作</th></tr></thead>
          <tbody>${positions.map((position) => {
            const value = positionBaseValue(position, portfolio);
            const weight = positionWeight(position);
            const change = position.changePercent == null ? NaN : Number(position.changePercent);
            const changeClass = Number.isFinite(change) ? (change > 0 ? "gain" : change < 0 ? "loss" : "") : "muted";
            const previousClose = Number(position.previousClose);
            const dailyProfit = previousClose > 0 && Number(position.latestPrice) > 0
              ? (Number(position.latestPrice) - previousClose) * Number(position.shares || 0) * portfolioFx(position.currency, base)
              : NaN;
            const dailyProfitClass = state.portfolioPrivacyMode ? "muted" : Number.isFinite(dailyProfit) ? (dailyProfit > 0 ? "gain" : dailyProfit < 0 ? "loss" : "") : "muted";
            const dailyProfitText = Number.isFinite(dailyProfit)
              ? `${dailyProfit > 0 ? "+" : ""}${base === "USD" ? formatPortfolioMoney(dailyProfit, "USD") : formatWan(dailyProfit)}`
              : "--";
            const averageCost = Number(position.averageCost);
            const latestPrice = Number(position.latestPrice);
            const holdingProfit = averageCost > 0 && latestPrice > 0
              ? (latestPrice - averageCost) * Number(position.shares || 0) * portfolioFx(position.currency, base)
              : NaN;
            const holdingReturn = averageCost > 0 && latestPrice > 0 ? (latestPrice / averageCost - 1) * 100 : NaN;
            const holdingProfitClass = state.portfolioPrivacyMode ? "muted" : Number.isFinite(holdingProfit) ? (holdingProfit > 0 ? "gain" : holdingProfit < 0 ? "loss" : "") : "muted";
            const holdingProfitText = Number.isFinite(holdingProfit)
              ? `${holdingProfit > 0 ? "+" : ""}${base === "USD" ? formatPortfolioMoney(holdingProfit, "USD") : formatWan(holdingProfit)}`
              : "--";
            const holdingProfitCell = state.portfolioPrivacyMode
              ? "****"
              : `${holdingProfitText}${Number.isFinite(holdingReturn) ? `<div class="portfolio-holding-profit-rate">${holdingReturn > 0 ? "+" : ""}${holdingReturn.toFixed(2)}%</div>` : ""}`;
            return `<tr>
              <td data-label="股票" class="sticky-col"><div class="stock-name">${escapeHtml(position.name)}</div><div class="stock-code">${escapeHtml(position.code)}</div></td>
              <td data-label="股数">${portfolioPrivate(Number(position.shares).toLocaleString("zh-CN"))}</td>
              <td data-label="摊薄成本" class="num">${portfolioPrivate(formatPortfolioMoneyTrailing(position.averageCost, position.currency))}</td>
              <td data-label="实时股价" class="num">${position.latestPrice ? formatPortfolioMoneyTrailing(position.latestPrice, position.currency) : "--"}</td>
              <td data-label="当日涨跌幅" class="${changeClass}">${Number.isFinite(change) ? `${change > 0 ? "+" : ""}${change.toFixed(2)}%` : "--"}</td>

              <td data-label="市值" class="num">${portfolioPrivate(base === "USD" ? formatPortfolioMoney(value, "USD") : formatWan(value))}</td>
              <td data-label="仓位比例" class="portfolio-position-weight">${(weight * 100).toFixed(2)}%</td>
              <td data-label="目标仓位">${Number(position.targetWeight) > 0 ? `${Number(position.targetWeight).toFixed(2)}%` : "--"}</td>
              <td data-label="操作"><div class="actions"><button class="trade-add" data-action="addPosition" data-id="${position.id}">加仓</button><button class="trade-reduce" data-action="reducePosition" data-id="${position.id}">减仓</button><button class="trade-edit" data-action="editPosition" data-id="${position.id}">编辑</button><button class="trade-history" data-action="positionHistory" data-id="${position.id}">交易历史</button></div></td>
            </tr>`;
          }).join("")}</tbody>
        </table></div></section>`;
    }

    function renderPortfolioModal() {
      const modal = state.portfolioModal;
      if (!modal) return "";
      if (modal.type === "create") return renderCreatePortfolioModal();
      if (modal.type === "rename") return renderRenamePortfolioModal();

    function renderPositionHistoryModal(modal) {
      const portfolio = activePortfolio();
      const position = modal.position;
      const rows = (portfolio?.tradeHistory || [])
        .filter((item) => item.positionId === position?.id || (item.code === position?.code && (!item.market || item.market === position?.market)))
        .sort((a, b) => String(b.occurredAt || "").localeCompare(String(a.occurredAt || "")));
      const body = rows.length ? `<div class="table-scroll"><table class="position-history-table">

      return `<div class="simple-modal-backdrop" data-portfolio-backdrop><section class="simple-modal">

        <div class="simple-modal-body">${body}${state.portfolioError ? `<div class="simple-modal-error">${escapeHtml(state.portfolioError)}</div>` : ""}</div>
        <div class="simple-modal-foot"><button data-action="closePortfolioModal">关闭</button></div>
      </section></div>`;

    function modalShell(title, body, formName, submitText, modalClass = "") {

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <link rel="preconnect" href="https://woywnriyagjlfphezlnx.supabase.co" crossorigin>
  <title>钞·作业</title>
  <style>
    :root {
      --bg: #e7edf5;
      --panel: #ffffff;
      --panel-2: #edf2f8;
      --text: #071426;
      --muted: #40516a;
      --line: #aebccc;
      --soft: #d7e0eb;
      --brand: #075ee8;
      --brand-strong: #073b93;
      --brand-soft: #dceaff;
      --accent: #0057d9;
      --gain: #c01b12;
      --loss: #087443;
      --warn: #8a4b00;
      --shadow: none;
      --shadow-soft: none;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --focus: 0 0 0 3px rgba(7, 94, 232, 0.25);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
      overscroll-behavior-x: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      min-height: 32px;
      padding: 0 11px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    button:hover { border-color: #98a6b8; background: #f8fafc; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    button.primary:hover { background: var(--brand-strong); }
    button.icon { width: 32px; padding: 0; }
    button.danger { color: #b42318; }
    button.ghost { background: transparent; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      background: white;
      color: var(--text);
      outline: none;
      min-height: 34px;
      font-size: 13px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(15, 95, 85, 0.12);
    }
    textarea { min-height: 76px; resize: vertical; }

    .shell { min-height: 100vh; }
    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 5;
    }
    .topbar-inner {
      width: min(1480px, calc(100vw - 48px));
      min-height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .topbar-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding-right: 18px;
      border-right: 1px solid #d9e2df;
    }
    .brand-logo {
      display: block;
      width: 154px;
      height: 44px;
      object-fit: contain;
      object-position: left center;
      flex: 0 0 auto;
    }
    .brand h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .brand span { color: var(--muted); font-size: 12px; }
    .userbar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }

    .workspace {
      width: min(1500px, calc(100vw - 48px));
      margin: 18px auto 44px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) repeat(6, auto);
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      box-shadow: var(--shadow-soft);
    }
    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
    }
    .nav-primary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .nav-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px;
      width: fit-content;
      box-shadow: var(--shadow-soft);
    }
    .nav-tabs button {
      border: 0;
      background: transparent;
      min-width: 72px;
      min-height: 30px;
      font-weight: 700;
    }
    .nav-tabs button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      box-shadow: none;
    }
    .topbar-nav { flex-wrap: nowrap; }
    .filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: var(--panel);
    }
    .segmented button {
      border: 0;
      border-radius: 0;
      border-right: 1px solid var(--line);
      min-width: 58px;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active {
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 700;
    }

    .table-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-scroll { overflow: auto; max-height: calc(100vh - 164px); }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1320px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
      white-space: nowrap;
    }
    th {
      background: var(--panel-2);
      color: #344054;
      font-weight: 750;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--brand); }
    .bias-metric-head { min-width: 112px; }
    .bias-sort-line { display: block; cursor: pointer; white-space: nowrap; }
    .bias-sort-line + .bias-sort-line { margin-top: 3px; color: var(--muted); font-size: 10.5px; }
    .bias-sort-line:hover { color: var(--brand); }
    .bias-metric-cell { min-width: 112px; font-variant-numeric: tabular-nums; }
    .bias-metric-cell span { display: block; line-height: 1.45; white-space: nowrap; }
    .bias-metric-cell .muted { font-size: 10.5px; }
    .bias-alert-panel { margin-bottom: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); box-shadow: var(--shadow); }
    .bias-alert-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .bias-alert-head strong { color: var(--text); font-size: 13px; }
    .bias-alert-head span { color: var(--muted); font-size: 10.5px; }
    .bias-alert-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
    .bias-alert-card { min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
    .bias-alert-card.weak { border-color: #9fc8df; background: #f2f9fd; }
    .bias-alert-card.strong { border-color: #e8b2a9; background: #fff5f2; }
    .bias-alert-card.expanding { border-color: #e6c77b; background: #fffaf0; }
    .bias-alert-card.compressing { border-color: #b8c1d9; background: #f7f8fc; }
    .bias-alert-card-title { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--text); font-size: 11.5px; font-weight: 800; }
    .bias-alert-count { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.72); font-size: 10px; }
    .bias-alert-guide { min-height: 30px; margin: 5px 0 7px; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
    .bias-alert-stocks { display: flex; flex-wrap: wrap; gap: 5px; }
    .bias-alert-stock { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 3px 6px; border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 999px; color: var(--text); background: rgba(255,255,255,.76); font-size: 10.5px; white-space: nowrap; }
    .bias-alert-stock b { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
    .bias-alert-stock em { color: var(--muted); font-style: normal; font-variant-numeric: tabular-nums; }
    .bias-alert-empty { color: var(--muted); font-size: 10.5px; }
    tbody tr:hover { background: #f8fbfb; }
    tbody tr.stock-row.dragging { opacity: .45; }
    tbody tr.stock-row.drag-over-before td { box-shadow: inset 0 2px 0 var(--brand); }
    tbody tr.stock-row.drag-over-after td { box-shadow: inset 0 -2px 0 var(--brand); }
    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 28px;
      color: #98a2b3;
      cursor: grab;
      user-select: none;
      vertical-align: middle;
      font-size: 16px;
    }
    .drag-handle:active { cursor: grabbing; }
    th.drag-col,
    td.drag-col {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      padding-left: 6px;
      padding-right: 6px;
      text-align: center;
    }
    .stock-name { font-weight: 760; }
    .stock-code { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .version-cell {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 760;
      color: #344054;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--soft);
      color: #344054;
      font-size: 12px;
      font-weight: 650;
    }
    .gain { color: var(--gain); font-weight: 700; }
    .loss { color: var(--loss); font-weight: 700; }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 5px; align-items: center; }
    .tax-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tax-header label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .tax-header input {
      width: 14px;
      height: 14px;
      padding: 0;
      box-shadow: none;
      order: 2;
    }
    .empty {
      padding: 42px 22px;
      text-align: center;
      color: var(--muted);
    }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .login-panel {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .login-panel h1 { margin: 0 0 7px; font-size: 22px; }
    .login-panel p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-size: 14px; }
    .login-actions { display: grid; gap: 10px; }
    .oauth-button {
      width: 100%;
      min-height: 38px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0;
    }
    .login-divider::before,
    .login-divider::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; color: #344054; font-weight: 700; }
    .form-row { display: grid; grid-template-columns: 1fr 104px; gap: 8px; align-items: end; }
    .notice {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #b8d3ff;
      background: #eef5ff;
      color: #163b76;
      border-radius: 5px;
      line-height: 1.55;
      font-size: 13px;
    }
    .history-modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 30;
      background: rgba(15, 23, 42, 0.36);
      padding: 32px;
      overflow: auto;
    }
    .history-modal.open { display: grid; place-items: start center; }
    .form-error {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #f6c0b7;
      background: #fff3f0;
      color: #912018;
      border-radius: 6px;
      line-height: 1.5;
      text-align: left;
      font-size: 13px;
    }
    .disclaimer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: none;
      z-index: 20;
    }
    .drawer.open { display: block; }
    .drawer-panel {
      width: min(1320px, 100vw);
      height: 100%;
      margin-left: auto;
      background: var(--panel);
      box-shadow: -12px 0 34px rgba(15, 23, 42, 0.16);
      display: flex;
      flex-direction: column;
    }
    .drawer-head {
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .drawer-head h2 { margin: 0; font-size: 17px; }
    .drawer-body {
      padding: 14px 20px 20px;
      overflow: auto;
      background: #f6f8fa;
    }
    .drawer-foot {
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-start;
      gap: 10px;
    }
    .section {
      border: 1px solid var(--line);
      border-radius: 5px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .section-title {
      padding: 10px 12px;
      background: #f8fafc;
      font-weight: 700;
      border-bottom: 1px solid var(--line);
    }
    .section-body { padding: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .valuation-layout {
      display: grid;
      grid-template-columns: minmax(760px, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }
    .valuation-form {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px 14px 16px;
      box-shadow: var(--shadow-soft);
    }
    .drawer input,
    .drawer select {
      min-height: 30px;
      padding: 4px 8px;
      font-size: 13px;
      line-height: 1.35;

    }
    .drawer textarea {
      min-height: 72px;
      padding: 6px 8px;
      font-size: 13px;
      line-height: 1.55;
      border-radius: 4px;
    }
    .compact-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 8px 10px;
      align-items: center;
      min-height: 34px;
      margin-bottom: 8px;
    }
    .compact-row.two {
      grid-template-columns: 96px 240px 108px 240px;
      column-gap: 14px;
      row-gap: 10px;
    }
    .compact-row.stock-search-row {
      grid-template-columns: 96px 360px minmax(0, 1fr);
    }
    .compact-row.basic-row {
      grid-template-columns: 96px 240px 108px 180px;
    }
    .compact-row.amount-row {
      grid-template-columns: 96px 240px minmax(0, 1fr);
    }
    .compact-row label,
    .inline-label {
      font-weight: 700;
      color: #344054;
      font-size: 13px;
      line-height: 1.35;
      align-self: center;
    }
    .market-cap-value {
      color: #111827;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }
    .form-control-sm { max-width: 180px; }
    .form-control-md { max-width: 240px; }
    .amount-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 68px;
      width: 100%;
    }
    .amount-field input {
      border-radius: 4px 0 0 4px;
      padding-right: 8px;
    }
    .amount-field select {
      min-height: 30px;
      border-left: 0;
      border-radius: 0 4px 4px 0;
      padding: 0 4px;

      background: #f8fafc;
    }
    .form-divider {
      margin: 12px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #d6deea;
      font-weight: 700;
      color: #172033;
      font-size: 13px;
    }
    .result-panel {

    }

    }

    }
    .result-metric span {
      display: block;

    }
    .search-results {

    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }

      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";

    .userbar { color: #7a8699; font-size: 12px; }
    .userbar .badge { background: #f4f6f8; color: #5d6678; font-weight: 600; }
    .userbar button { min-height: 28px; font-size: 12px; color: #5d6678; }
    .workspace {
      width: min(1480px, calc(100vw - 48px));
      margin-top: 16px;
    }
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }
    .page-title h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }
    .page-title p {

      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .page-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .page-title-row h2 { margin: 0; }
    .page-title-row select {

    }

    .rebalance-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; justify-content: center; min-width: 0; }
    .rebalance-side { display: grid; gap: 12px; width: 100%; min-width: 0; max-width: 100%; }

    .rebalance-side .field,

    .performance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }

    /* A+B visual system: clean brokerage terminal density with calmer research-workbench surfaces. */
    body {
      background:

    .journal-filters { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 14px; margin:0 0 16px; padding:12px 14px 14px; border:1px solid #bdcfcb; border-radius:6px; background:#e7efed; box-shadow:0 3px 10px rgba(30,65,57,.045); }
    .journal-filter-action { display:flex; grid-column:2; grid-row:1; justify-content:flex-end; }
    .journal-filter-action .primary { min-height:30px; }
    .journal-filter-row { grid-column:1/-1; min-width:0; }
    .journal-filter-action + .journal-filter-row { grid-column:1; grid-row:1; }
    .journal-filter-tags { display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
    .journal-filter-tag { display:inline-flex; align-items:baseline; min-height:28px; padding:4px 9px; border:1px solid #d7e1de; border-radius:4px; background:#fff; color:#50615d; font-size:12px; line-height:18px; font-weight:500; }
    .journal-filter-tag:hover { border-color:#9ebbb5; background:#fff; color:#263f39; }
    .journal-filter-tag.active { border-color:#8fb4ac; background:#e8f2ef; color:#174f44; font-weight:650; box-shadow:none; }
    .journal-filter-count { margin-left:4px; color:#7e8f8b; font-size:12px; line-height:inherit; font-weight:500; font-variant-numeric:tabular-nums; }
    .journal-filter-count::before { content:"· "; }
    .journal-filter-tag.active .journal-filter-count { color:#6e8d86; }
    .journal-list { display:grid; gap:10px; }
    .journal-entry { display:grid; grid-template-columns:96px minmax(0,1fr) 76px; gap:16px; padding:22px 20px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow-soft); }
    .journal-date { border-right:1px solid var(--line); padding-right:14px; color:var(--brand-strong); font-family:"Baskerville","Songti SC","STSong",serif; }
    .journal-date-day { display:block; font-size:44px; line-height:.88; font-weight:600; font-style:italic; letter-spacing:-2px; }
    .journal-date-month { display:block; margin-top:9px; font-size:15px; line-height:1.1; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#4f6963; }
    .journal-content { min-width:0; }
    .journal-text { margin:0; color:#243145; font-size:15px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
    .journal-text::first-line { color:#172536; font-size:17px; font-weight:700; line-height:1.65; }
    .journal-text.collapsed { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:7; overflow:hidden; }
    .journal-expand { margin-top:10px; border:0; padding:0; min-height:auto; color:var(--brand); background:transparent; font-size:12px; }
    .journal-stocks { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
    .journal-stock-chip { display:inline-flex; align-items:baseline; gap:6px; padding:5px 8px; background:var(--brand-soft); border:1px solid #c5ddd8; border-radius:999px; color:var(--brand-strong); font-size:12px; }
    .journal-stock-chip small { color:#64748b; font-variant-numeric:tabular-nums; }
    .journal-actions { display:flex; justify-content:flex-end; align-items:flex-start; gap:6px; }
    .journal-actions button { width:34px; min-height:32px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
    .journal-actions svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .journal-action-edit { color:#245a8d; border-color:#b8cee4; background:#f0f7ff; }
    .journal-action-edit:hover { color:#184975; border-color:#7da8d1; background:#e3f0fc; }
    .journal-action-delete { color:#b42318; border-color:#f3b6ad; background:#fff3f0; }
    .journal-action-delete:hover { color:#912018; border-color:#e4877b; background:#fee4e2; }
    .journal-empty { padding:70px 24px; text-align:center; background:var(--panel); border:1px solid var(--line); color:var(--muted); }
    .journal-empty h2 { color:var(--text); }
    .journal-editor { width:min(900px,100%); }
    .journal-editor textarea { min-height:300px; padding:16px; font-size:16px; line-height:1.8; }
    .journal-content-field { position:relative; }
    .journal-mention-popup { display:none; position:absolute; z-index:20; width:min(440px,calc(100% - 20px)); max-height:260px; overflow-y:auto; overflow-x:hidden; padding:6px; background:#fff; border:1px solid #cfd9d7; box-shadow:0 14px 30px rgba(18,25,38,.18); }
    .journal-mention-popup.show { display:grid; gap:3px; }
    .journal-mention-hint { padding:10px 12px; color:var(--muted); font-size:12px; }
    .journal-mention-result { width:100%; min-height:42px; display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; border-color:transparent; font-weight:500; flex:0 0 auto; }
    .journal-mention-result:hover, .journal-mention-result.active { border-color:#b8d5d0; background:var(--brand-soft); }
    .journal-mention-result small { color:var(--muted); }
    .journal-editor-help { color:var(--muted); font-size:12px; }
    .journal-stock-picker { position:relative; }
    .journal-stock-results { display:grid; gap:4px; max-height:220px; overflow:auto; }

    function appBaseUrl() {
      if (location.hostname.endsWith("github.io")) {
        return `${location.origin}${APP_GITHUB_PAGES_PATH}`;
      }
      const path = location.pathname.endsWith("/")

      return `${location.origin}${path || "/"}`;
    }

    function hasAuthTokensInHash() {
      return location.hash.includes("access_token=");
    }

    function decodeJwt(token) {
      try {
        const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(decodeURIComponent(Array.from(atob(payload)).map((char) => `%${char.charCodeAt(0).toString(16).padStart(2, "0")}`).join("")));
      } catch {
        return {};
      }
    }

    function sessionFromHash() {
      if (!hasAuthTokensInHash()) return null;
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const expiresAt = Number(params.get("expires_at")) || Math.floor(Date.now() / 1000) + Number(params.get("expires_in") || 3600);
      if (!accessToken) return null;
      const claims = decodeJwt(accessToken);
      const session = {
        access_token: accessToken,
        refresh_token: refreshToken,
        expires_at: expiresAt,
        user: {
          id: claims.sub,
          email: claims.email || claims.user_metadata?.email || "",
          user_metadata: claims.user_metadata || {},
          app_metadata: claims.app_metadata || {}
        },
        claims
      };
      writeJson(AUTH_STORAGE_KEY, session);
      history.replaceState(null, "", AUTH_REDIRECT_URL);
      return session;
    }

    function currentSession() {
      const hashSession = sessionFromHash();
      if (hashSession) return hashSession;
      const saved = readJson(AUTH_STORAGE_KEY, null);
      if (!saved?.access_token) return null;
      const claims = decodeJwt(saved.access_token);
      saved.claims = saved.claims || claims;
      saved.user = {
        ...(saved.user || {}),
        id: saved.user?.id || claims.sub,
        email: saved.user?.email || claims.email || claims.user_metadata?.email || "",
        user_metadata: saved.user?.user_metadata || claims.user_metadata || {},
        app_metadata: saved.user?.app_metadata || claims.app_metadata || {}
      };
      return saved;
    }

    function persistSession(session) {
      if (!session?.access_token) return null;
      const claims = decodeJwt(session.access_token);
      const normalized = {
        ...session,
        expires_at: session.expires_at || Math.floor(Date.now() / 1000) + Number(session.expires_in || 3600),
        user: {
          ...(session.user || {}),
          id: session.user?.id || claims.sub,
          email: session.user?.email || claims.email || claims.user_metadata?.email || "",
          user_metadata: session.user?.user_metadata || claims.user_metadata || {},
          app_metadata: session.user?.app_metadata || claims.app_metadata || {}
        },
        claims
      };
      state.session = normalized;
      writeJson(AUTH_STORAGE_KEY, normalized);
      return normalized;
    }

    async function refreshSession() {
      if (!state.session?.refresh_token) throw new Error("登录已过期，请重新登录。");
      const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: state.session.refresh_token })
      });
      if (!response.ok) {
        writeJson(AUTH_STORAGE_KEY, null);
        state.session = null;
        throw new Error("登录已过期，请重新登录。");
      }
      return persistSession(await response.json());
    }

    async function ensureFreshSession() {
      if (!state.session?.access_token) throw new Error("请先登录。");
      const expiresAt = Number(state.session.expires_at || 0);
      if (expiresAt && expiresAt - Math.floor(Date.now() / 1000) < 60) {
        if (!sessionRefreshPromise) {
          sessionRefreshPromise = refreshSession().finally(() => { sessionRefreshPromise = null; });
        }
        await sessionRefreshPromise;
      }
    }

      const response = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
        method: "POST",

          "Content-Type": "application/json"

          create_user: true,
          email_redirect_to: AUTH_REDIRECT_URL,
          data: {},
          options: {
            email_redirect_to: AUTH_REDIRECT_URL
          }
        })
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `发送登录邮件失败：HTTP ${response.status}`);
      }
    }

      location.href = url.toString();

    async function supabaseRequest(path, options = {}) {
      await ensureFreshSession();
      let response = await supabaseFetch(path, options);
      if (response.status === 401) {
        const errorText = await response.clone().text();
        if (/jwt expired/i.test(errorText)) {
          await refreshSession();
          response = await supabaseFetch(path, options);
        }
      }
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `Supabase 请求失败：HTTP ${response.status}`);
      }
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    async function supabaseFetch(path, options = {}) {
      const response = await fetch(`${SUPABASE_URL}${path}`, {
        ...options,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${state.session.access_token}`,
          "Content-Type": "application/json",
          ...(options.prefer ? { Prefer:options.prefer } : {}),
          ...(options.headers || {})
        }
      });
      return response;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function maskEmail(email) {
      const [localPart, domain] = String(email ?? "").split("@");
      if (!domain) return localPart ? `${localPart.slice(0, 1)}***` : "";
      const visiblePrefix = localPart.slice(0, Math.min(3, localPart.length));
      const visibleSuffix = localPart.length > 5 ? localPart.slice(-2) : "";
      return `${visiblePrefix}***${visibleSuffix}@${domain}`;
    }

    function defaultCurrencyFor(stock) {
      if (!stock) return "CNY";
      if (stock.market === "CN" || stock.market === "HK") return "CNY";
      if (stock.market === "US") return "USD";
      return stock.currency || "CNY";
    }

    function toDisplay(cny, currency) {
      const rate = currencies[currency]?.rateToCny || 1;
      return Number(cny || 0) / rate;
    }

    function toCny(value, currency) {
      const rate = currencies[currency]?.rateToCny || 1;
      return Number(value || 0) * rate;
    }

    function roundedInputNumber(value, decimals = 6) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "";
      const factor = 10 ** decimals;
      return String(Math.round((number + Number.EPSILON) * factor) / factor);
    }

    function defaultAmountCurrencies() {
      return {
        expectedProfitCny: "CNY",
        expectedDividendCny: "CNY",
        expectedBuybackCny: "CNY",
        expectedShareholderReturnCny: "CNY",
        netCashCny: "CNY"
      };
    }

    function normalizeAmountCurrencies(value) {
      const defaults = defaultAmountCurrencies();
      const raw = value && typeof value === "object" ? value : {};
      return Object.fromEntries(Object.entries(defaults).map(([key, fallback]) => {
        const currency = raw[key];
        return [key, currencies[currency] ? currency : fallback];
      }));
    }

    function normalizeAmountInputValues(value) {
      const raw = value && typeof value === "object" ? value : {};
      return Object.fromEntries(Object.entries(defaultAmountCurrencies()).map(([key]) => {
        const input = raw[key];
        return [key, input === undefined || input === null ? "" : String(input)];
      }));
    }

    function normalizeOriginalAmounts(form) {
      const raw = form?.originalAmounts && typeof form.originalAmounts === "object" ? form.originalAmounts : {};
      const currencyMap = normalizeAmountCurrencies(form?.amountCurrencies);
      const inputMap = normalizeAmountInputValues(form?.amountInputValues);
      return Object.fromEntries(Object.keys(defaultAmountCurrencies()).map((key) => {
        const entry = raw[key] && typeof raw[key] === "object" ? raw[key] : {};
        const currency = currencies[entry.currency] ? entry.currency : currencyMap[key];
        const value = entry.value === undefined || entry.value === null ? inputMap[key] : String(entry.value);
        return [key, { value, currency }];
      }));
    }

    function amountCurrencyFor(form, key) {
      if (!form) return "CNY";
      if (String(key).startsWith("segmentProfit:")) {
        const index = Number(String(key).split(":")[1]);
        const segment = Array.isArray(form.segmentValuations) ? form.segmentValuations[index] : null;
        if (currencies[segment?.expectedProfitOriginal?.currency]) return segment.expectedProfitOriginal.currency;
        return currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY";
      }
      const original = normalizeOriginalAmounts(form)[key];
      if (currencies[original?.currency]) return original.currency;
      const map = normalizeAmountCurrencies(form.amountCurrencies);
      return currencies[map[key]] ? map[key] : "CNY";
    }

    function amountInputValueFor(form, key, cny, currency) {
      if (String(key).startsWith("segmentProfit:")) {
        const index = Number(String(key).split(":")[1]);
        const segment = Array.isArray(form?.segmentValuations) ? form.segmentValuations[index] : null;
        if (segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null && segment.expectedProfitOriginal.value !== "") {
          return String(segment.expectedProfitOriginal.value);
        }
        if (segment?.expectedProfitInput !== undefined && segment?.expectedProfitInput !== null && segment.expectedProfitInput !== "") {
          return String(segment.expectedProfitInput);
        }
      } else {
        const original = normalizeOriginalAmounts(form)[key];
        if (original?.value !== "") return original.value;
        const input = normalizeAmountInputValues(form?.amountInputValues)[key];
        if (input !== "") return input;
      }
      return roundedInputNumber(toDisplay(cny, currency), 2);
    }

    function money(cny, currency) {
      if (cny === null || cny === undefined || Number.isNaN(Number(cny))) return "--";
      const value = toDisplay(cny, currency);
      return `${trimNumber(value)} ${currency}`;
    }

    function metricMoney(cny, currency) {
      if (!Number(cny)) return "—";
      return money(cny, currency);
    }

    function moneyYiCny(cny) {
      if (cny === null || cny === undefined || Number.isNaN(Number(cny))) return "--";
      return trimNumber(cny);
    }

    function trimNumber(value) {
      const abs = Math.abs(Number(value));
      const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
      return Number(value).toLocaleString("zh-CN", { maximumFractionDigits: digits, minimumFractionDigits: 0 });
    }

    function percent(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "--";
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function marketLabel(market) {
      return ({ CN: "A股", HK: "H股", US: "美股" })[market] || market || "--";
    }

    function todayString() {
      return new Date().toISOString().slice(0, 10);
    }

    function isSameLocalDay(value, reference = new Date()) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return false;
      return date.getFullYear() === reference.getFullYear()
        && date.getMonth() === reference.getMonth()
        && date.getDate() === reference.getDate();
    }

    function formatDateTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function formatDate(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return date.toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function marketCurrency(market) {
      return ({ CN: "CNY", HK: "HKD", US: "USD" })[market] || "CNY";
    }

    function normalizeCode(code, market) {
      if (market === "HK") return `${String(code).padStart(5, "0")}.HK`;
      if (market === "CN") {
        const suffix = String(code).startsWith("6") ? ".SH" : ".SZ";
        return `${code}${suffix}`;
      }
      return code;
    }

    function isUsStockSearchItem(item) {
      if (item.Classify !== "UsStock") return false;
      if (item.MarketType !== "7" && item.SecurityTypeName !== "美股") return false;
      if (!["105", "106", "107"].includes(String(item.MktNum || ""))) return false;
      const typeUS = String(item.TypeUS || "");
      const code = String(item.Code || "");
      if (code.includes("_")) return false;
      return ["1", "3"].includes(typeUS) || ["7", "20"].includes(String(item.SecurityType || ""));
    }

    function normalizeSearchItem(item) {
      const quoteId = item.QuoteID || `${item.MktNum}.${item.Code}`;
      const classify = item.Classify;
      const securityName = item.SecurityTypeName || "";
      let market = "";
      let exchange = item.JYS || "";
      if (classify === "AStock") {
        market = "CN";
        exchange = item.MktNum === "1" ? "SSE" : "SZSE";
      } else if (classify === "HK" && item.TypeUS === "3") {
        market = "HK";
        exchange = "HKEX";
      } else if (isUsStockSearchItem(item)) {
        market = "US";
      } else {

      }
      return {
        name: item.Name,
        code: normalizeCode(item.Code, market),
        rawCode: item.Code,
        quoteId,
        market,
        exchange,
        currency: marketCurrency(market),
        securityName
      };

    function fetchWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { signal: controller.signal }).finally(() => window.clearTimeout(timeout));
    }

    function jsonp(url, callbackParam = "cb") {
      return new Promise((resolve, reject) => {
        const callbackName = `jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("JSONP 请求超时"));
        }, 8000);

        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error("JSONP 请求失败"));
        };
        script.src = `${url}${separator}${callbackParam}=${callbackName}`;
        document.head.appendChild(script);
      });
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timeout = window.setTimeout(() => {
          script.remove();
          reject(new Error("脚本请求超时"));
        }, 8000);
        script.onload = () => {
          window.clearTimeout(timeout);
          script.remove();
          resolve();
        };
        script.onerror = () => {
          window.clearTimeout(timeout);
          script.remove();
          reject(new Error("脚本请求失败"));
        };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    async function searchStocks(query) {
      const cacheKey = String(query || "").trim().toLowerCase();
      const cached = stockSearchCache.get(cacheKey);
      if (cached && Date.now() - cached.savedAt < 2 * 60 * 1000) return cached.rows;
      const searches = await Promise.allSettled([searchStocksEastmoney(query), searchStocksTencent(query)]);
      const merged = searches.flatMap((result) => result.status === "fulfilled" ? result.value : [])
        .filter((stock, index, all) => index === all.findIndex((item) => item.code === stock.code && item.market === stock.market))
        .slice(0, 12);
      searches.filter((result) => result.status === "rejected").forEach((result) => console.warn("股票搜索源暂不可用。", result.reason));
      stockSearchCache.set(cacheKey, { rows: merged, savedAt: Date.now() });
      return merged;
    }

      if (stock.market === "HK" && raw) return `116.${raw.padStart(5, "0")}`;

    function quotePriceScale(stock) {

    async function fetchQuote(stock) {
      let triedTencent = false;
      if (stock.market === "HK") {
        triedTencent = true;
        try { return await fetchTencentQuote(stock); }
        catch (error) { console.warn("腾讯港股实时行情不可用，尝试东方财富备用行情。", error); }
      }
      const quoteId = stockQuoteId(stock);
      const fields = "f43,f44,f45,f57,f58,f60,f116,f170";
      if (quoteId) {
        const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${encodeURIComponent(quoteId)}&fields=${fields}`;
        try {
          const json = await jsonp(url);
          const data = json?.data;
          const priceScale = quotePriceScale(stock);
          const latestPrice = Number(data?.f43) / priceScale;
          if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error("行情接口没有返回最新价");
          const marketCap = Number(data?.f116);
          const sourceCurrency = marketCurrency(stock.market);
          const latestMarketCapCny = marketCap > 0
            ? marketCap * (currencies[sourceCurrency]?.rateToCny || 1) / 100000000
            : Number(stock.latestMarketCapCny) || stock.marketCapCny || 0;
          const previousClose = Number(data?.f60) / priceScale || 0;
          const dayHigh = Number(data?.f44) / priceScale || latestPrice;
          const dayLow = Number(data?.f45) / priceScale || latestPrice;
          const changePercent = data?.f170 !== null && data?.f170 !== undefined && Number.isFinite(Number(data.f170))
            ? Number(data.f170) / 100
            : previousClose ? (latestPrice / previousClose - 1) * 100 : null;
          return {
            ...stock,
            quoteId,
            name: data.f58 || stock.name,
            rawCode: data.f57 || stock.rawCode,
            latestPrice,
            previousClose,
            dayHigh,
            dayLow,
            intradayQuoteAt: new Date().toISOString(),
            changePercent,
            latestMarketCapCny,
            marketCapSourceCurrency: sourceCurrency,
            marketCapUpdatedAt: todayString()
          };
        } catch (error) {
          console.warn("东方财富行情接口不可用，尝试腾讯备用行情。", error);
        }
      }
      if (!triedTencent) {
        try { return await fetchTencentQuote(stock); }
        catch (error) { console.warn("腾讯行情接口不可用，保留最近行情。", error); }
      }
      return {
        ...stock,
        intradayQuoteAt: "",
        latestMarketCapCny: Number(stock.latestMarketCapCny) || stock.marketCapCny || 0,
        marketCapSourceCurrency: stock.currency || marketCurrency(stock.market),
        marketCapUpdatedAt: stock.marketCapUpdatedAt || stock.updatedAt || todayString()
      };
    }

    function tencentHistorySymbol(stock) {
      const base = tencentSymbol(stock);
      if (stock?.market !== "US") return base;
      const marketNumber = String(stock?.quoteId || "").split(".")[0];
      const exchange = String(stock?.exchange || "").toUpperCase();
      const suffix = marketNumber === "105" || exchange.includes("NASDAQ")
        ? ".OQ"
        : marketNumber === "106" || exchange.includes("NYSE")
          ? ".N"
          : marketNumber === "107" || exchange.includes("AMEX")
            ? ".A"
            : "";

    }

    async function fetchTencentWeeklySeries(stock) {
      const symbol = tencentHistorySymbol(stock);
      if (!symbol) throw new Error("无法识别腾讯周线代码");
      const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${encodeURIComponent(symbol)},week,,,180,qfq&_=${Date.now()}`;
      const response = await fetchWithTimeout(url, 8000);
      if (!response.ok) throw new Error(`腾讯周线 HTTP ${response.status}`);
      const json = await response.json();
      const data = json?.data?.[symbol];
      const rows = data?.qfqweek || data?.week || [];
      const series = rows.map((row) => ({ date: String(row?.[0] || ""), close: Number(row?.[2]) })).filter((item) => item.date && Number.isFinite(item.close) && item.close > 0);
      if (!series.length) throw new Error("腾讯周线数据为空");

    async function fetchEastmoneyWeeklySeries(stock) {
      if (stock?.assetType === "option") return [];
      const quoteId = stockQuoteId(stock);
      if (!quoteId) throw new Error("无法识别周线行情代码");
      const end = todayString().replace(/-/g, "");
      const beginDate = new Date();
      beginDate.setFullYear(beginDate.getFullYear() - 3);
      beginDate.setMonth(beginDate.getMonth() - 3);
      const begin = beginDate.toISOString().slice(0, 10).replace(/-/g, "");
      const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${encodeURIComponent(quoteId)}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=102&fqt=1&beg=${begin}&end=${end}`;
      const json = await jsonp(url);
      return (json?.data?.klines || [])
        .map((line) => String(line).split(","))
        .map((parts) => ({ date: parts[0], close: Number(parts[2]) }))
        .filter((item) => item.date && Number.isFinite(item.close) && item.close > 0);
    }

    async function fetchEastmoneyWeeklyCloses(stock) {

    async function fetchBiasMetrics(stock) {
      if (stock?.assetType === "option") return { bias30w: null, bias2yPercentile: null, biasRecentValues: [], biasUpdatedAt: "" };
      const cacheKey = `${stockQuoteId(stock) || tencentHistorySymbol(stock)}:30w:2y`;
      const cached = biasMetricCache.get(cacheKey);
      if (cached && Date.now() - cached.savedAt < BIAS_METRIC_CACHE_MS) return cached.value;
      if (biasMetricInFlight.has(cacheKey)) return biasMetricInFlight.get(cacheKey);
      const request = (async () => {
        let weeklyCloses;
        try {
          weeklyCloses = await fetchTencentWeeklyCloses(stock);
        } catch (tencentError) {
          console.warn("腾讯周线不可用，尝试东方财富备用周线。", stock?.code, tencentError);
          weeklyCloses = await fetchEastmoneyWeeklyCloses(stock);
        }
      const weeklyBiases = weeklyCloses.map((close, index) => {
        if (index < 29) return null;
        const average30w = weeklyCloses.slice(index - 29, index + 1).reduce((sum, value) => sum + value, 0) / 30;
        return (close / average30w - 1) * 100;
      }).filter(Number.isFinite);
      if (weeklyBiases.length < 104) throw new Error("不足两年有效周线数据");
      const observations = weeklyBiases.slice(-104);
      const bias30w = observations.at(-1);
      const biasRecentValues = observations.slice(-3);
      const lower = observations.filter((value) => value < bias30w).length;
      const equal = observations.filter((value) => value === bias30w).length;
      const value = {
        bias30w,
        bias2yPercentile: (lower + 0.5 * (equal - 1)) / (observations.length - 1) * 100,
        biasRecentValues,
        biasUpdatedAt: new Date().toISOString()
      };
      biasMetricCache.set(cacheKey, { savedAt: Date.now(), value });
      return value;
      })();
      biasMetricInFlight.set(cacheKey, request);
      try {
        return await request;
      } finally {
        biasMetricInFlight.delete(cacheKey);
      }
    }

    async function refreshMarketCaps({ renderAfter = true } = {}) {
      if (marketCapRefreshInFlight || !state.session) return;
      const canRefreshQuote = (stock) => Boolean(stock.quoteId || stockQuoteId(stock) || tencentSymbol(stock));
      const targets = state.stocks.filter(canRefreshQuote);
      if (!targets.length) return;
      marketCapRefreshInFlight = true;
      try {
        const quotes = await Promise.all(targets.map(async (stock) => {
          try {
            const [quote, bias] = await Promise.all([
              fetchQuote(stock),
              fetchBiasMetrics(stock).catch((error) => {
                console.warn("刷新乖离率失败。", stock?.code, error);
                return { bias30w: null, bias2yPercentile: null, biasRecentValues: [], biasUpdatedAt: "" };
              })
            ]);
            return { stock, quote: { ...quote, ...bias } };
          } catch (error) {
            console.warn("刷新市值失败。", stock?.code, error);
            return null;
          }
        }));
        quotes.filter(Boolean).forEach(({ stock, quote }) => {
          state.stocks = state.stocks.map((item) => item.id === stock.id ? mergeRuntimeMarketCap(item, quote) : item);
          if (state.form?.id === stock.id) {
            state.form = mergeRuntimeMarketCap(state.form, quote);
          }
        });
      } finally {
        marketCapRefreshInFlight = false;
      }
      if (renderAfter) render();
    }

    function tencentSymbol(stock) {
      const raw = String(stock.rawCode || stock.code || "").replace(/\.(HK|SH|SZ)$/i, "");
      if (stock.market === "HK") return `hk${raw.padStart(5, "0")}`;
      if (stock.market === "CN") return `${raw.startsWith("6") ? "sh" : "sz"}${raw}`;
      if (stock.market === "US") return `us${raw.toUpperCase()}`;
      return "";
    }

    async function fetchTencentQuote(stock) {
      const symbol = tencentSymbol(stock);
      if (!symbol) throw new Error("无法识别腾讯行情代码");
      let parts = null;
      if (stock.market === "HK") {
        const response = await fetchWithTimeout(`https://web.ifzq.gtimg.cn/appstock/app/hkMinute/query?code=${encodeURIComponent(symbol)}&_=${Date.now()}`, 8000);
        if (!response.ok) throw new Error(`腾讯港股实时行情 HTTP ${response.status}`);
        const json = await response.json();
        parts = json?.data?.[symbol]?.qt?.[symbol] || null;
      } else {
        const variableName = `v_${symbol}`;
        delete window[variableName];
        await loadScript(`https://qt.gtimg.cn/q=${symbol}&_=${Date.now()}`);
        const text = window[variableName];
        delete window[variableName];
        parts = text ? text.split("~") : null;
      }
      if (!parts?.length) throw new Error("腾讯行情没有返回数据");
      const marketCapYi = Number(parts[45] || parts[44]);
      const sourceCurrency = marketCurrency(stock.market);
      const latestPrice = Number(parts[3]) || Number(stock.latestPrice) || 0;
      if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error("腾讯行情没有返回最新价");
      const previousClose = Number(parts[4]) || 0;
      const dayHigh = Number(parts[33]) || latestPrice;
      const dayLow = Number(parts[34]) || latestPrice;
      const quotedChangePercent = String(parts[32] || "").trim() === "" ? NaN : Number(parts[32]);
      return {
        ...stock,
        name: parts[1] || stock.name,
        latestPrice,
        previousClose,
        dayHigh,
        dayLow,
        intradayQuoteAt: new Date().toISOString(),
        changePercent: Number.isFinite(quotedChangePercent) ? quotedChangePercent : previousClose ? (latestPrice / previousClose - 1) * 100 : null,
        latestMarketCapCny: marketCapYi > 0 ? marketCapYi * (currencies[sourceCurrency]?.rateToCny || 1) : Number(stock.latestMarketCapCny) || 0,
        marketCapSourceCurrency: sourceCurrency,
        marketCapUpdatedAt: todayString()
      };
    }

    function stockMarketCapCny(stock) {
      return Number(stock?.latestMarketCapCny) || Number(stock?.marketCapCny) || 0;
    }

    function calc(stock) {
      const latest = stockMarketCapCny(stock);
      const profit = Number(stock.expectedProfitCny) || 0;
      const pe = Number(stock.expectedPE) || 0;
      const cash = Number(stock.netCashCny) || 0;
      const discount = Number(stock.netCashDiscountRate) || 0;
      const shareholder = shareholderReturnTotal(stock);
      const expectedMarketCapCny = profit * pe + cash * discount;
      return {
        expectedMarketCapCny,
        upside: latest ? expectedMarketCapCny / latest - 1 : null,
        forwardPE: profit ? (latest - cash * discount) / profit : null,
        shareholderReturnRate: latest ? shareholder / latest : null
      };
    }

    function shareholderReturnRateForList(stock, computed) {
      const rate = computed.shareholderReturnRate;
      if (rate === null || rate === undefined) return rate;
      if (!state.stockConnectDividendTax || stock.market !== "HK") return rate;
      const latest = stockMarketCapCny(stock);
      if (!latest) return rate;
      return ((Number(stock.expectedDividendCny) || 0) * 0.8 + (Number(stock.expectedBuybackCny) || 0)) / latest;
    }

    function shareholderReturnTotal(stock) {
      return Number(stock?.expectedShareholderReturnCny) || 0;
    }

    function emptySegmentValuationRow(index = 0, forecastYear = "2026E") {
      return {
        segmentName: index ? `分部${index}` : "",
        expectedProfitCny: 0,
        expectedProfitCurrency: "CNY",

        expectedProfitOriginal: { value: "", currency: "CNY" },

    function normalizeSegmentValuationFields(stock) {
      const next = { ...stock };
      next.useSegmentValuation = Boolean(next.useSegmentValuation);
      const rawSegments = Array.isArray(next.segmentValuations) ? next.segmentValuations : [];
      next.segmentValuations = rawSegments.map((segment, index) => ({
        segmentName: segment?.segmentName || segment?.name || `分部${index + 1}`,
        expectedProfitCny: Number(segment?.expectedProfitCny) || 0,
        expectedProfitCurrency: currencies[segment?.expectedProfitOriginal?.currency] ? segment.expectedProfitOriginal.currency : currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY",
        expectedProfitInput: segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null ? String(segment.expectedProfitOriginal.value) : segment?.expectedProfitInput === undefined || segment?.expectedProfitInput === null ? "" : String(segment.expectedProfitInput),
        expectedProfitOriginal: {
          value: segment?.expectedProfitOriginal?.value !== undefined && segment?.expectedProfitOriginal?.value !== null ? String(segment.expectedProfitOriginal.value) : segment?.expectedProfitInput === undefined || segment?.expectedProfitInput === null ? "" : String(segment.expectedProfitInput),
          currency: currencies[segment?.expectedProfitOriginal?.currency] ? segment.expectedProfitOriginal.currency : currencies[segment?.expectedProfitCurrency] ? segment.expectedProfitCurrency : "CNY"
        },
        expectedPE: Number(segment?.expectedPE) || 0,
        expectedPEInput: segment?.expectedPEInput === undefined || segment?.expectedPEInput === null ? String(Number(segment?.expectedPE) || "") : String(segment.expectedPEInput),
        forecastYear: segment?.forecastYear || next.forecastYear || "2026E",
        expectedPERemark: segment?.expectedPERemark || ""
      }));
      if (next.useSegmentValuation) {
        while (next.segmentValuations.length < 2) {
          next.segmentValuations.push(emptySegmentValuationRow(next.segmentValuations.length + 1, next.forecastYear || "2026E"));
        }
        applySegmentValuationTotals(next);
      }
      return next;
    }

    function applySegmentValuationTotals(stock) {
      if (!stock?.useSegmentValuation) return stock;
      const segments = Array.isArray(stock.segmentValuations) ? stock.segmentValuations : [];
      const totalProfit = segments.reduce((sum, segment) => sum + (Number(segment.expectedProfitCny) || 0), 0);
      const totalMarketCap = segments.reduce((sum, segment) => {
        return sum + (Number(segment.expectedProfitCny) || 0) * (Number(segment.expectedPE) || 0);
      }, 0);
      stock.expectedProfitCny = totalProfit;
      stock.expectedPE = totalProfit ? totalMarketCap / totalProfit : 0;
      return stock;
    }

    function normalizeShareholderReturnFields(stock) {
      const next = normalizeSegmentValuationFields(stock);
      next.version = normalizeStockVersion(next.version);
      next.amountCurrencies = normalizeAmountCurrencies(next.amountCurrencies);
      next.amountInputValues = normalizeAmountInputValues(next.amountInputValues);
      next.originalAmounts = normalizeOriginalAmounts(next);
      next.amountCurrencies = Object.fromEntries(Object.entries(next.originalAmounts).map(([key, entry]) => [key, entry.currency]));
      next.amountInputValues = Object.fromEntries(Object.entries(next.originalAmounts).map(([key, entry]) => [key, entry.value]));
      next.expectedPEInput = next.expectedPEInput === undefined || next.expectedPEInput === null ? String(Number(next.expectedPE) || "") : String(next.expectedPEInput);
      if (next.expectedDividendCny === undefined && next.expectedBuybackCny === undefined) {
        next.expectedDividendCny = Number(next.expectedShareholderReturnCny) || 0;
        next.expectedBuybackCny = 0;
      } else {
        next.expectedDividendCny = Number(next.expectedDividendCny) || 0;
        next.expectedBuybackCny = Number(next.expectedBuybackCny) || 0;
      }
      if (next.expectedShareholderReturnCny === undefined || next.expectedShareholderReturnCny === "") {
        next.expectedShareholderReturnCny = next.expectedDividendCny + next.expectedBuybackCny;
      } else {
        next.expectedShareholderReturnCny = Number(next.expectedShareholderReturnCny) || 0;
      }
      return next;
    }

    function normalizeStockVersion(value) {
      const text = String(value || "").trim();
      return text || "中性";
    }

    function stockVersionMode(value) {

    function layoutDebugBox(selector) {

      return `${selector}=x:${layoutDebugNumber(rect.x)} w:${layoutDebugNumber(rect.width)} r:${layoutDebugNumber(rect.right)} client:${element.clientWidth} scroll:${element.scrollWidth} css:${style.width} max:${style.maxWidth} zoom:${style.zoom || "1"}`;

    function updateLayoutDebugPanel() {
      if (!LAYOUT_DEBUG_ENABLED) return;
      const viewport = window.visualViewport;
      const screenWidth = Number(window.screen?.width) || 0;
      const estimatedScale = window.innerWidth ? screenWidth / window.innerWidth : 0;
      const lines = [
        `布局诊断 view=${state.mainView} time=${new Date().toLocaleTimeString("zh-CN")}`,
        `screen=${screenWidth}x${window.screen?.height || 0} avail=${window.screen?.availWidth || 0}x${window.screen?.availHeight || 0}`,
        `inner=${window.innerWidth}x${window.innerHeight} outer=${window.outerWidth}x${window.outerHeight} DPR=${layoutDebugNumber(window.devicePixelRatio)}`,
        `document client=${document.documentElement.clientWidth} scroll=${document.documentElement.scrollWidth} bodyScroll=${document.body.scrollWidth}`,
        `visual=${layoutDebugNumber(viewport?.width)}x${layoutDebugNumber(viewport?.height)} scale=${layoutDebugNumber(viewport?.scale)} offset=${layoutDebugNumber(viewport?.offsetLeft)},${layoutDebugNumber(viewport?.offsetTop)}`,
        `screen/inner=${layoutDebugNumber(estimatedScale)} media860=${matchMedia("(max-width: 860px)").matches} coarse=${matchMedia("(any-pointer: coarse)").matches}`,
        `viewport-meta=${document.querySelector('meta[name="viewport"]')?.getAttribute("content") || "missing"}`,
        layoutDebugBox(".topbar"),
        layoutDebugBox(".topbar-inner"),
        layoutDebugBox(".workspace"),
        layoutDebugBox(".horizontal-data-table"),
        layoutDebugBox(".horizontal-data-table .table-scroll"),
        layoutDebugBox(".horizontal-data-table table"),
        `UA=${navigator.userAgent}`
      ];
      layoutDebugSnapshot = lines.join("\n");
      let trigger = document.querySelector(".layout-debug-trigger");
      if (!trigger) {
        trigger = document.createElement("button");
        trigger.type = "button";
        trigger.className = "layout-debug-trigger";
        trigger.textContent = "复制布局诊断";
        trigger.addEventListener("click", async () => {
          let copied = false;
          try {
            await navigator.clipboard.writeText(layoutDebugSnapshot);
            copied = true;
          } catch (_) {
            const textarea = document.createElement("textarea");
            textarea.value = layoutDebugSnapshot;
            textarea.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
            document.body.appendChild(textarea);
            textarea.select();
            copied = document.execCommand("copy");
            textarea.remove();
          }
          trigger.textContent = copied ? "诊断已复制" : "复制失败，请重试";
          window.setTimeout(() => { trigger.textContent = "复制布局诊断"; }, 1800);
        });
        document.body.appendChild(trigger);
      }
    }

      window.addEventListener("resize", scheduleLayoutDebugPanel, { passive: true });

    function marketInsightMetricCell(metric, period, star = false, starLabel = "符合星级条件") {
      const bias = metric?.bias === null || metric?.bias === undefined ? NaN : Number(metric.bias);
      const percentile = metric?.percentile === null || metric?.percentile === undefined ? NaN : Number(metric.percentile);
      if (!Number.isFinite(bias) || !Number.isFinite(percentile)) {
        return `<td data-label="${period}周乖离率 / 2年分位值" class="num market-insight-metric muted"><div><span>--</span><small>2年分位值 --</small></div></td>`;
      }

      return `<td data-label="${period}周乖离率 / 2年分位值" class="num market-insight-metric ${cls}"><div><span>${marketInsightRuleStar(star, starLabel)}${bias > 0 ? "+" : ""}${bias.toFixed(2)}%</span><small>2年分位值 ${percentile.toFixed(0)}%</small></div></td>`;
    }

    function calculateMarketInsightBiases(weeklyCloses) {
      const closes = (weeklyCloses || []).filter((value) => Number.isFinite(value) && value > 0);
      const result = {};
      [5, 30, 40, 50].forEach((period) => {
        const biases = closes.map((close, index) => {
          if (index < period - 1) return null;
          const average = closes.slice(index - period + 1, index + 1).reduce((sum, value) => sum + value, 0) / period;
          return (close / average - 1) * 100;
        }).filter(Number.isFinite);
        if (biases.length < 104) {
          result[`ma${period}`] = null;
          return;
        }
        const observations = biases.slice(-104);
        const bias = observations.at(-1);
        const lower = observations.filter((value) => value < bias).length;
        const equal = observations.filter((value) => value === bias).length;
        result[`ma${period}`] = {
          bias,
          percentile: observations.length > 1 ? (lower + 0.5 * (equal - 1)) / (observations.length - 1) * 100 : 50
        };
      });
      return result;
    }

    function marketInsightShortRatio(row) {
      const storedRatio = row.shortRatioStored === null || row.shortRatioStored === undefined || row.shortRatioStored === "" ? NaN : Number(row.shortRatioStored);
      if (Number.isFinite(storedRatio)) return storedRatio;
      if (row.shortShares === null || row.shortShares === undefined || row.shortShares === "") return null;
      const shortShares = Number(row.shortShares);
      const issuedShares = Number(row.shortIssuedShares) > 0 ? Number(row.shortIssuedShares) : marketInsightIssuedShares(row);
      return shortShares >= 0 && issuedShares > 0 ? shortShares / issuedShares * 100 : null;
    }

    function marketInsightShortChangeCell(row, shortRatio, star = false) {

    function marketInsightIssuedShares(row) {
      const connectShares = Number(row?.stockConnectShares);
      const connectRatio = Number(row?.stockConnectRatio);
      if (connectShares > 0 && connectRatio > 0) return connectShares / connectRatio * 100;
      const marketCapCny = Number(row?.latestMarketCapCny);
      const latestPrice = Number(row?.latestPrice);
      const hkdRate = Number(currencies.HKD?.rateToCny) || 1;
      return marketCapCny > 0 && latestPrice > 0 ? marketCapCny * 100000000 / hkdRate / latestPrice : null;
    }

    function marketInsightConnectRatio(row) {
      const storedRatio = row.stockConnectRatio === null || row.stockConnectRatio === undefined || row.stockConnectRatio === "" ? NaN : Number(row.stockConnectRatio);
      if (Number.isFinite(storedRatio)) return storedRatio;
      const shares = row.stockConnectShares === null || row.stockConnectShares === undefined || row.stockConnectShares === "" ? NaN : Number(row.stockConnectShares);
      const denominator = Number(row.stockConnectIssuedShares) > 0 ? Number(row.stockConnectIssuedShares) : marketInsightIssuedShares(row);
      return Number.isFinite(shares) && shares >= 0 && denominator > 0 ? shares / denominator * 100 : null;
    }

    async function loadLatestMarketInsightRatios(rows) {
      if (!state.session?.access_token || state.session.access_token === "local-demo" || !rows.length) return rows;
      const chunks = [];
      // 90 天日线记录在 PostgREST 的 2000 行上限内分批取全，避免排在
      // 查询后部的股票拿不到五周前记录而永远无法获得港股通增持星。
      for (let index = 0; index < rows.length; index += 25) chunks.push(rows.slice(index, index + 25));
      const historyStart = new Date();
      // 港股通评星只比较持股数，不依赖历史股本。多回看一些日期，
      // 保证节假日、停更或个别缺失日后仍能找到五周前的有效交易日。
      historyStart.setDate(historyStart.getDate() - 90);
      const historyStartText = historyStart.toISOString().slice(0, 10);
      const shortByCode = new Map(), connectByCode = new Map();
      await Promise.all(chunks.map(async (chunk) => {
        const codes = chunk.map((row) => String(row.rawCode).padStart(5, "0")).join(",");
        const [shortResult, connectResult] = await Promise.allSettled([
          supabaseRequest(`/rest/v1/hk_short_positions_weekly?stock_code=in.(${codes})&report_date=gte.${historyStartText}&select=stock_code,report_date,short_shares,issued_shares,short_ratio_pct&order=report_date.desc&limit=2000`),
          supabaseRequest(`/rest/v1/hk_stock_connect_holdings_daily?stock_code=in.(${codes})&holding_date=gte.${historyStartText}&select=stock_code,holding_date,total_holding_shares,issued_shares,holding_ratio_pct&order=holding_date.desc&limit=2000`)
        ]);
        if (shortResult.status === "fulfilled") shortResult.value.forEach((item) => { if (!shortByCode.has(item.stock_code)) shortByCode.set(item.stock_code, []); shortByCode.get(item.stock_code).push(item); });
        if (connectResult.status === "fulfilled") connectResult.value.forEach((item) => { if (!connectByCode.has(item.stock_code)) connectByCode.set(item.stock_code, []); connectByCode.get(item.stock_code).push(item); });
      }));
      return rows.map((row) => {
        const code = String(row.rawCode).padStart(5, "0");
        const shortRows = shortByCode.get(code) || [];
        const connectRows = (connectByCode.get(code) || []).filter((item) => item.total_holding_shares !== null && item.total_holding_shares !== undefined && Number.isFinite(Number(item.total_holding_shares)));
        const short = shortRows[0], shortFiveWeeksAgo = shortRows.length >= 6 ? shortRows[5] : null;
        const connect = connectRows[0];
        const connectTarget = connect ? new Date(`${connect.holding_date}T00:00:00`) : null;
        if (connectTarget) connectTarget.setDate(connectTarget.getDate() - 35);
        const connectFiveWeeksAgo = connectTarget ? connectRows.find((item) => new Date(`${item.holding_date}T00:00:00`) <= connectTarget) : null;
        const latestShortShares = short ? Number(short.short_shares) : NaN;
        const previousShortShares = shortFiveWeeksAgo ? Number(shortFiveWeeksAgo.short_shares) : NaN;
        const shortChange5wShares = Number.isFinite(latestShortShares) && Number.isFinite(previousShortShares) ? latestShortShares - previousShortShares : null;
        const shortDecline5wShares = Number.isFinite(shortChange5wShares) ? -shortChange5wShares : null;
        const shortRatioForRecord = (item) => {
          if (!item) return NaN;
          const stored = item.short_ratio_pct === null || item.short_ratio_pct === undefined || item.short_ratio_pct === "" ? NaN : Number(item.short_ratio_pct);
          if (Number.isFinite(stored)) return stored;
          const shares = Number(item.short_shares), issuedShares = Number(item.issued_shares);
          return Number.isFinite(shares) && shares >= 0 && issuedShares > 0 ? shares / issuedShares * 100 : NaN;
        };
        const latestShortRatio = shortRatioForRecord(short), previousShortRatio = shortRatioForRecord(shortFiveWeeksAgo);
        const shortChange5wPct = Number.isFinite(latestShortRatio) && Number.isFinite(previousShortRatio) ? latestShortRatio - previousShortRatio : null;
        const connectIncrease5wShares = connect && connectFiveWeeksAgo ? Number(connect.total_holding_shares) - Number(connectFiveWeeksAgo.total_holding_shares) : null;
        const connectRatioForRecord = (item) => {
          if (!item) return NaN;
          const stored = item.holding_ratio_pct === null || item.holding_ratio_pct === undefined || item.holding_ratio_pct === "" ? NaN : Number(item.holding_ratio_pct);
          if (Number.isFinite(stored)) return stored;
          const shares = Number(item.total_holding_shares), issuedShares = Number(item.issued_shares);
          return Number.isFinite(shares) && shares >= 0 && issuedShares > 0 ? shares / issuedShares * 100 : NaN;
        };
        const latestConnectRatio = connectRatioForRecord(connect), previousConnectRatio = connectRatioForRecord(connectFiveWeeksAgo);
        const connectChange5wPct = Number.isFinite(latestConnectRatio) && Number.isFinite(previousConnectRatio) ? latestConnectRatio - previousConnectRatio : null;
        return {
          ...row,
          shortShares:short?.short_shares ?? row.shortShares,
          shortIssuedShares:short?.issued_shares ?? null,
          shortRatioStored:short?.short_ratio_pct ?? null,
          stockConnectShares:connect?.total_holding_shares ?? row.stockConnectShares,
          stockConnectIssuedShares:connect?.issued_shares ?? null,
          stockConnectRatio:connect?.holding_ratio_pct ?? row.stockConnectRatio,
          shortDecline5wShares,
          shortChange5wPct,
          connectIncrease5wShares,
          connectChange5wPct
        };
      });
    }

    async function loadPersistedMarketInsightMetrics(rows, indexCode) {
      if (!state.session?.access_token || state.session.access_token === "local-demo" || !rows.length) return rows;
      const metrics = await supabaseRequest(`/rest/v1/current_hk_market_insight_metrics?index_code=eq.${encodeURIComponent(indexCode)}&select=stock_code,week_date,bias_5w_pct,bias_30w_pct,bias_40w_pct,bias_50w_pct,percentile_5w_2y,percentile_30w_2y,percentile_40w_2y,percentile_50w_2y,five_week_return_pct,index_five_week_return_pct,excess_five_week_return_pct,index_return_quality&limit=1000`);

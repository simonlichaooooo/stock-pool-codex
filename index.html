    function calculateMarketInsightBiasHistory(weeklySeries) {
      const rows = (weeklySeries || []).filter((item) => item?.date && Number(item.close) > 0);
      const result = {};
      [5, 30, 40, 50].forEach((period) => {
        const biases = rows.map((item, index) => {
          if (index < period - 1) return null;
          const window = rows.slice(index - period + 1, index + 1);
          const average = window.reduce((sum, row) => sum + Number(row.close), 0) / period;
          return { date: item.date, value: (Number(item.close) / average - 1) * 100 };
        }).filter(Boolean);
        result[`ma${period}`] = biases;
        result[`p${period}`] = biases.map((item, index) => {
          const observations = biases.slice(Math.max(0, index - 103), index + 1).map((row) => row.value);
          if (observations.length < 104) return null;
          const lower = observations.filter((value) => value < item.value).length;
          const equal = observations.filter((value) => value === item.value).length;
          return { date: item.date, value: (lower + 0.5 * (equal - 1)) / (observations.length - 1) * 100 };
        }).filter(Boolean);
      });
      return result;
    }

    function renderMarketInsightChart(series, { includeZero = false, tooltipRows = [], trendStages = [], extrema = [] } = {}) {
      const validSeries = (series || []).map((item) => ({ ...item, values: (item.values || []).filter((point) => point?.date && Number.isFinite(Number(point.value))) })).filter((item) => item.values.length);
      if (!validSeries.length) return `<div class="market-insight-chart-empty">暂无可用比例数据。<br>请确认该股票已有对应的历史持仓记录。</div>`;
      const timestamps = validSeries.flatMap((item) => item.values.map((point) => new Date(`${point.date}T00:00:00`).getTime())).filter(Number.isFinite);
      const leftSeries = validSeries.filter((item) => item.axis !== "right"), rightSeries = validSeries.filter((item) => item.axis === "right");
      const leftValues = leftSeries.flatMap((item) => item.values.map((point) => Number(point.value)));
      const rightValues = rightSeries.flatMap((item) => item.values.map((point) => Number(point.value)));
      const width = 1200, height = 320, left = 62, right = rightValues.length ? 68 : 24, top = 18, bottom = 38;
      const minTime = Math.min(...timestamps), maxTime = Math.max(...timestamps);
      let minValue = Math.min(...leftValues), maxValue = Math.max(...leftValues);
      if (includeZero) { minValue = Math.min(0, minValue); maxValue = Math.max(0, maxValue); }
      const rawRange = maxValue - minValue;
      const padding = rawRange > 0 ? rawRange * 0.12 : Math.max(Math.abs(maxValue) * 0.05, 0.02);
      minValue -= padding; maxValue += padding;
      let rightMinValue = rightValues.length ? Math.min(...rightValues) : 0, rightMaxValue = rightValues.length ? Math.max(...rightValues) : 1;
      const rightRawRange = rightMaxValue - rightMinValue;
      const rightValuePadding = rightRawRange > 0 ? rightRawRange * 0.12 : Math.max(Math.abs(rightMaxValue) * 0.05, 0.02);
      rightMinValue -= rightValuePadding; rightMaxValue += rightValuePadding;
      const x = (date) => left + ((new Date(`${date}T00:00:00`).getTime() - minTime) / Math.max(1, maxTime - minTime)) * (width - left - right);
      const y = (value) => top + (maxValue - value) / Math.max(0.0001, maxValue - minValue) * (height - top - bottom);
      const yRight = (value) => top + (rightMaxValue - value) / Math.max(0.0001, rightMaxValue - rightMinValue) * (height - top - bottom);
      const axisRange = maxValue - minValue;
      const axisDigits = axisRange < 0.2 ? 3 : axisRange < 2 ? 2 : 1;
      const rightAxisRange = rightMaxValue - rightMinValue;
      const rightAxisDigits = rightAxisRange < 2 ? 2 : rightAxisRange < 20 ? 1 : 0;
      const grids = Array.from({ length: 5 }, (_, index) => {
        const ratio = index / 4, py = top + ratio * (height - top - bottom);
        const leftLabel = maxValue - ratio * (maxValue - minValue);
        const rightLabel = rightMaxValue - ratio * (rightMaxValue - rightMinValue);
        return `<line class="grid" x1="${left}" y1="${py}" x2="${width - right}" y2="${py}"></line><text class="axis-label" x="${left - 8}" y="${py + 4}" text-anchor="end">${leftLabel.toFixed(axisDigits)}%</text>${rightValues.length ? `<text class="axis-label right-axis-label" x="${width - right + 8}" y="${py + 4}">${rightLabel.toFixed(rightAxisDigits)}</text>` : ""}`;
      }).join("");
      const paths = validSeries.map((item) => {
        const scaleY = item.axis === "right" ? yRight : y;
        const d = item.values.map((point, index) => `${index ? "L" : "M"}${x(point.date).toFixed(2)},${scaleY(Number(point.value)).toFixed(2)}`).join(" ");
        const opacity = trendStages.length && item.axis !== "right" ? `.34` : item.axis === "right" ? `.82` : "";
        return `<path class="series-line ${item.dashed ? "dashed" : ""} ${item.axis === "right" ? "right-axis-series" : ""}" d="${d}" stroke="${item.color}" ${opacity ? `opacity="${opacity}"` : ""}><title>${escapeHtml(item.label)}</title></path>`;
      }).join("");
      const trendBands = trendStages.map((stage, index) => {
        const startX = x(stage.start.date), endX = x(stage.end.date);
        const bandX = Math.min(startX, endX), bandWidth = Math.max(2, Math.abs(endX - startX));
        return `<rect x="${bandX.toFixed(2)}" y="${top}" width="${bandWidth.toFixed(2)}" height="${height - top - bottom}" fill="${stage.color}" opacity=".065"></rect><line class="trend-divider" x1="${startX.toFixed(2)}" y1="${top}" x2="${startX.toFixed(2)}" y2="${height - bottom}" stroke="${stage.color}" opacity=".5"></line><text class="trend-stage-label" x="${(bandX + 8).toFixed(2)}" y="${top + 15}" fill="${stage.color}">趋势 ${index + 1}</text>`;
      }).join("");
      const primaryValues = validSeries[0]?.values || [];
      const trendPaths = trendStages.map((stage) => {
        const values = primaryValues.filter((point) => point.date >= stage.start.date && point.date <= stage.end.date);
        const d = values.map((point, index) => `${index ? "L" : "M"}${x(point.date).toFixed(2)},${y(Number(point.value)).toFixed(2)}`).join(" ");
        return values.length > 1 ? `<path class="trend-stage-line" d="${d}" stroke="${stage.color}"></path>` : "";
      }).join("");
      const effectiveTooltips = tooltipRows.length ? tooltipRows : [...new Set(validSeries.flatMap((item) => item.values.map((point) => point.date)))].sort().map((day) => ({ date:day, entries:validSeries.flatMap((item) => { const point = item.values.find((value) => value.date === day); if (!point) return []; const suffix = item.unit ? ` ${item.unit}` : "%"; return [{ label:item.label, value:`${Number(point.value).toFixed(2)}${suffix}` }]; }) }));
      const hitWidth = Math.max(6, (width - left - right) / Math.max(1, effectiveTooltips.length));
      const hitAreas = effectiveTooltips.map((item) => `<rect class="market-insight-chart-hit" data-market-chart-point="${escapeHtml(JSON.stringify(item))}" x="${(x(item.date) - hitWidth / 2).toFixed(2)}" y="${top}" width="${hitWidth.toFixed(2)}" height="${height - top - bottom}" fill="transparent"></rect>`).join("");
      const extremaMarkers = extrema.length ? validSeries.slice(0, 1).flatMap((item) => {
        return extrema.filter((point, index, rows) => index === 0 || point.date !== rows[0].date).map((point) => {
          const px = x(point.date), py = y(Number(point.value));
          const anchor = px > width - 150 ? "end" : "start";
          const tx = px + (anchor === "end" ? -8 : 8);
          const ty = Math.max(top + 12, py - 10);
          return `<circle class="extrema-dot" cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="4.5" fill="${point.color || item.color}"></circle><text class="extrema-label" x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" text-anchor="${anchor}">${escapeHtml(point.label)} ${Number(point.value).toFixed(axisDigits)}%</text>`;
        });
      }).join("") : "";
      const dateText = (time) => new Date(time).toLocaleDateString("zh-CN", { year:"numeric", month:"2-digit" });
      return `<div class="market-insight-chart-legend">${validSeries.map((item) => `<span><i class="${item.dashed ? "dashed" : ""}" style="--legend-color:${item.color}"></i>${escapeHtml(item.label)}</span>`).join("")}</div><div class="market-insight-chart-wrap"><div class="market-insight-chart-stage" data-market-chart><svg class="market-insight-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="历史时间走势图">${trendBands}${grids}${paths}${trendPaths}${extremaMarkers}${hitAreas}<text class="axis-label" x="${left}" y="${height - 10}">${escapeHtml(dateText(minTime))}</text><text class="axis-label" x="${width - right}" y="${height - 10}" text-anchor="end">${escapeHtml(dateText(maxTime))}</text>${rightValues.length ? `<text class="axis-label right-axis-title" x="${width - 4}" y="${top + 4}" text-anchor="end">${escapeHtml(rightSeries[0]?.unit || "价格")}</text>` : ""}</svg><div class="market-insight-chart-tooltip" data-market-chart-tooltip></div></div></div>`;
    }

    function marketInsightRangeValues(values) {
      const now = new Date();
      const cutoff = new Date(now);
      if (state.marketInsightDetailRange === "YTD") cutoff.setMonth(0, 1);
      else cutoff.setFullYear(now.getFullYear() - (state.marketInsightDetailRange === "1Y" ? 1 : 2));
      const cutoffText = cutoff.toISOString().slice(0, 10);
      return (values || []).filter((item) => item.date >= cutoffText);
    }

    function marketInsightTrendAnalysis(values) {
      const points = (values || []).filter((item) => item?.date && Number.isFinite(Number(item.value))).map((item) => ({ date:item.date, value:Number(item.value) })).sort((a, b) => a.date.localeCompare(b.date));
      if (points.length < 2) return { points, stages:[], extrema:[] };
      // 阶段边界必须落在用户实际看到的原始极值上。此前以居中移动平均的
      // 峰值索引回指原始数据，急涨急跌后会把“高点”错标到峰值之后的低位。
      const indexed = points.map((point, index) => ({ ...point, index }));
      const lowPivot = indexed.reduce((best, point) => point.value < best.value ? point : best);
      const highPivot = indexed.reduce((best, point) => point.value > best.value ? point : best);
      const decisiveRange = highPivot.value - lowPivot.value;
      const colors = ["#2563eb", "#d97706", "#7c3aed"];
      if (decisiveRange < 0.000001) return { points, stages:[{ start:points[0], end:points.at(-1), delta:points.at(-1).value - points[0].value, color:colors[0] }], extrema:[] };
      const pivots = [lowPivot, highPivot].sort((a, b) => a.index - b.index);
      const minimumSpan = Math.max(2, Math.floor((points.length - 1) * 0.08));
      const minimumMove = decisiveRange * 0.28;
      const meaningful = (start, end) => end.index - start.index >= minimumSpan && Math.abs(end.value - start.value) >= minimumMove;
      const candidates = [];
      if (meaningful(indexed[0], pivots[0])) candidates.push([indexed[0], pivots[0]]);
      candidates.push([pivots[0], pivots[1]]);
      if (meaningful(pivots[1], indexed.at(-1))) candidates.push([pivots[1], indexed.at(-1)]);
      const stages = candidates.map(([start, end], index) => ({ start:points[start.index], end:points[end.index], delta:points[end.index].value - points[start.index].value, color:colors[index] }));
      const low = points[lowPivot.index], high = points[highPivot.index];
      return { points, stages, extrema:[{ ...low, label:"主要低点", color:"#0f9f8f" }, { ...high, label:"主要高点", color:"#d97706" }] };
    }

    function renderMarketInsightTrendInsight(analysis, label, color) {
      const { points = [], stages = [], extrema = [] } = analysis || {};
      if (points.length < 2) return `<div class="market-insight-trend-insight" style="--trend-color:${color}"><strong>趋势解读</strong><span class="market-insight-trend-summary">当前区间数据点不足，暂不能识别决定性趋势。</span></div>`;
      const dateLabel = (date) => new Date(`${date}T00:00:00`).toLocaleDateString("zh-CN", { year:"numeric", month:"short", day:"numeric" });
      const valueDigits = Math.max(...points.map((point) => point.value)) - Math.min(...points.map((point) => point.value)) < 0.2 ? 3 : 2;
      const stageRows = stages.map((stage, index) => {
        const direction = Math.abs(stage.delta) < 0.0005 ? "基本持平" : stage.delta > 0 ? "上升" : "下降";
        const copy = `${dateLabel(stage.start.date)}—${dateLabel(stage.end.date)}：${label}${direction}，由 ${stage.start.value.toFixed(valueDigits)}% 变为 ${stage.end.value.toFixed(valueDigits)}%，变化 ${stage.delta > 0 ? "+" : ""}${stage.delta.toFixed(valueDigits)} 个百分点。`;
        return `<div class="market-insight-trend-stage" style="--stage-color:${stage.color}"><b>趋势 ${index + 1}</b><span>${escapeHtml(copy)}</span></div>`;
      }).join("");
      const net = points.at(-1).value - points[0].value;
      const low = extrema.find((point) => point.label === "主要低点"), high = extrema.find((point) => point.label === "主要高点");
      const extremaCopy = low && high ? `主要低点为 ${dateLabel(low.date)} 的 ${low.value.toFixed(valueDigits)}%，主要高点为 ${dateLabel(high.date)} 的 ${high.value.toFixed(valueDigits)}%；` : "";
      return `<div class="market-insight-trend-insight" style="--trend-color:${color}"><strong>决定性趋势</strong>${stageRows}<span class="market-insight-trend-summary">${escapeHtml(extremaCopy)}期末较期初${net >= 0 ? "增加" : "减少"} ${Math.abs(net).toFixed(valueDigits)} 个百分点。已忽略不足整体主要振幅 28% 的短小反复。</span></div>`;
    }

    function renderMarketInsightChartAi(title, partyKey) {
      const analysis = state.marketInsightAiAnalysis;
      const meta = state.marketInsightAiMeta || {};
      const party = analysis?.[partyKey];
      const primaryConfidence = party?.hypotheses?.[0]?.confidence || analysis?.confidence || "--";
      const heading = `<div class="market-insight-ai-head"><div class="market-insight-ai-title"><i>AI</i><div><h3>${escapeHtml(title)}</h3><p>结合股价关系提出竞争性假设，不代表交易者真实意图。</p></div></div>${party ? `<span class="market-insight-ai-confidence">主要假设置信度 ${escapeHtml(primaryConfidence)}</span>` : ""}</div>`;
      if (state.marketInsightAiLoading) return `<div class="market-insight-chart-ai">${heading}<div class="market-insight-ai-skeleton"><i></i><i></i><i></i></div></div>`;
      if (state.marketInsightAiError) return `<div class="market-insight-chart-ai">${heading}<div class="market-insight-ai-error">${escapeHtml(state.marketInsightAiError)}<button class="secondary" data-action="retryMarketInsightAi">重新生成</button></div></div>`;
      if (!party) return `<div class="market-insight-chart-ai">${heading}<div class="muted">正在等待历史数据，随后生成对应解读。</div></div>`;
      const hypotheses = (party.hypotheses || []).slice(0, 2).map((item) => `<div class="market-insight-ai-hypothesis"><strong>${escapeHtml(item.label)} · 置信度${escapeHtml(item.confidence)}</strong><span>${escapeHtml(item.explanation)}</span><div class="market-insight-chart-ai-evidence">${renderMarketInsightAiList("支持依据", item.supporting_evidence, 3)}${renderMarketInsightAiList("反向证据", item.counter_evidence, 3)}</div></div>`).join("");
      const updated = meta.generated_at || meta.created_at || "";
      return `<div class="market-insight-chart-ai">${heading}<p class="market-insight-chart-ai-conclusion">${escapeHtml(party.conclusion || "")}</p>${hypotheses}<div class="market-insight-ai-foot"><span>模型 ${escapeHtml(meta.model || "--")} · ${meta.cached ? "读取缓存" : "新生成"}</span><span>${updated ? `生成于 ${escapeHtml(new Date(updated).toLocaleString("zh-CN"))}` : ""}</span></div></div>`;
    }

    async function loadMarketInsightAiAnalysis() {
      const rawCode = state.marketInsightDetailCode;
      if (!rawCode) return;
      const selectedIndex = MARKET_INSIGHT_INDEXES.find((item) => item.id === state.marketInsightIndexId) || MARKET_INSIGHT_INDEXES[0];
      const rangeKey = state.marketInsightDetailRange;
      const cacheKey = `${selectedIndex.code}:${rawCode}:${rangeKey}`;
      if (state.marketInsightAiCache[cacheKey]) {
        state.marketInsightAiAnalysis = state.marketInsightAiCache[cacheKey].analysis;
        state.marketInsightAiMeta = state.marketInsightAiCache[cacheKey].meta;
        state.marketInsightAiLoading = false;
        state.marketInsightAiError = "";
        render();
        return;
      }
      state.marketInsightAiLoading = true;
      state.marketInsightAiAnalysis = null;
      state.marketInsightAiMeta = null;
      state.marketInsightAiError = "";
      render();
      const aiRequestController = new AbortController();
      const aiRequestTimeout = setTimeout(() => aiRequestController.abort(), 270000);
      try {
        const response = state.session?.access_token === "local-demo"
          ? { analysis:marketInsightAiDemo(), meta:{ model:"本地演示", cached:false, generated_at:new Date().toISOString() } }
          : await supabaseRequest("/functions/v1/market-insight-ai", { method:"POST", signal:aiRequestController.signal, body:JSON.stringify({ stock_code:String(rawCode).padStart(5, "0"), index_code:selectedIndex.code, range_key:rangeKey }) });
        if (state.marketInsightDetailCode !== rawCode || state.marketInsightDetailRange !== rangeKey) return;
        state.marketInsightAiCache[cacheKey] = response;
        state.marketInsightAiAnalysis = response.analysis;
        state.marketInsightAiMeta = response.meta || {};
      } catch (error) {
        if (state.marketInsightDetailCode !== rawCode || state.marketInsightDetailRange !== rangeKey) return;
        let message = error?.message || String(error);
        try { message = JSON.parse(message)?.error || message; } catch {}
        state.marketInsightAiError = error?.name === "AbortError" ? "AI 深度思考超过 270 秒，请稍后重新生成。" : (/FunctionsHttpError|404/i.test(message) ? "AI 解读服务尚未部署，请先完成 Supabase Edge Function 配置。" : `AI 解读生成失败：${message}`);
      } finally {
        clearTimeout(aiRequestTimeout);
        if (state.marketInsightDetailCode === rawCode && state.marketInsightDetailRange === rangeKey) {
          state.marketInsightAiLoading = false;
          render();
        }
      }
    }

    function renderMarketInsightDetailView() {
      const stock = state.marketInsightRows.find((item) => item.rawCode === state.marketInsightDetailCode) || HSTECH_CONSTITUENTS.find((item) => item.rawCode === state.marketInsightDetailCode);
      const detail = state.marketInsightDetail || {};
      const bias = detail.biasHistory || {};
      const periods = [5, 30, 40, 50];
      const palette = { 5:"#7c5ce0", 30:"#0f9f8f", 40:"#3b82f6", 50:"#d68b16" };
      const biasSeries = periods.map((period) => ({ label:`${period}周乖离率`, color:palette[period], dashed:period === 5, values:marketInsightRangeValues(bias[`ma${period}`] || []) }));
      const biasMaps = Object.fromEntries(periods.flatMap((period) => [[`ma${period}`, new Map((bias[`ma${period}`] || []).map((item) => [item.date, item.value]))], [`p${period}`, new Map((bias[`p${period}`] || []).map((item) => [item.date, item.value]))]]));
      const biasDates = [...new Set(biasSeries.flatMap((item) => item.values.map((point) => point.date)))].sort();
      const biasTooltips = biasDates.map((day) => ({ date:day, entries:periods.flatMap((period) => {
        const value = biasMaps[`ma${period}`].get(day), percentile = biasMaps[`p${period}`].get(day);
        return Number.isFinite(value) ? [{ label:`${period}周`, value:`${value > 0 ? "+" : ""}${Number(value).toFixed(2)}% · 2年分位值 ${Number.isFinite(percentile) ? `${Number(percentile).toFixed(0)}%` : "--"}` }] : [];
      }) }));
      const shortSeries = [{ label:"空头持仓比例", color:"#d94a5a", values:marketInsightRangeValues(detail.shortHistory || []) }];
      const connectSeries = [{ label:"港股通持仓比例", color:"#7565d8", values:marketInsightRangeValues(detail.connectHistory || []) }];
      const priceSeries = { label:"股价", color:"#64748b", dashed:true, axis:"right", unit:stock?.currency || "HKD", values:marketInsightRangeValues(detail.priceHistory || []) };
      const shortChartSeries = priceSeries.values.length ? [...shortSeries, priceSeries] : shortSeries;
      const connectChartSeries = priceSeries.values.length ? [...connectSeries, priceSeries] : connectSeries;
      const shortTrend = marketInsightTrendAnalysis(shortSeries[0].values);
      const connectTrend = marketInsightTrendAnalysis(connectSeries[0].values);
      const rangeControls = `<div class="market-insight-range" role="group" aria-label="图表时间范围">${[["2Y","2年"],["1Y","1年"],["YTD","今年以来"]].map(([value,label]) => `<button class="${state.marketInsightDetailRange === value ? "active" : ""}" data-action="marketInsightDetailRange" data-range="${value}">${label}</button>`).join("")}</div>`;
      return `<aside class="market-insight-detail-drawer" role="dialog" aria-modal="true" aria-label="${escapeHtml(stock?.name || "股票")}市场洞察详情"><button class="market-insight-detail-scrim" data-action="closeMarketInsightDetail" aria-label="点击遮罩关闭详情" title="关闭详情"></button><div class="market-insight-detail-panel"><section class="market-insight-head market-insight-detail-head"><div class="market-insight-detail-title"><div class="market-insight-title"><h2>${escapeHtml(stock?.name || "股票详情")}</h2><p>${escapeHtml(stock?.code || "")} · 市场洞察历史详情</p></div></div><div class="market-insight-actions">${rangeControls}${state.marketInsightDetailLoading ? `<span class="market-insight-loading">正在加载历史数据</span>` : ""}<button class="market-insight-detail-close" data-action="closeMarketInsightDetail" aria-label="关闭详情" title="关闭详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div></section><div class="market-insight-detail-body">${state.marketInsightDetailError ? `<div class="market-insight-meta"><span class="loss">${escapeHtml(state.marketInsightDetailError)}</span></div>` : ""}<div class="market-insight-charts"><section class="market-insight-chart-card"><h3>乖离率走势</h3><p>纵轴按当前区间数据自适应；曲线展示5周、30周、40周、50周乖离率，移动鼠标可查看数值与对应2年分位值。</p>${state.marketInsightDetailLoading && !detail.biasHistory ? `<div class="market-insight-chart-empty">正在加载周线数据…</div>` : renderMarketInsightChart(biasSeries, { tooltipRows:biasTooltips })}</section><section class="market-insight-chart-card"><h3>空头持仓比例走势</h3><p>左轴为空头持仓比例，右轴为前复权周线股价；彩色分段仅依据持仓比例的真实高低点。</p>${state.marketInsightDetailLoading && !detail.shortHistory ? `<div class="market-insight-chart-empty">正在加载历史数据…</div>` : renderMarketInsightChart(shortChartSeries, { trendStages:shortTrend.stages, extrema:shortTrend.extrema })}${renderMarketInsightChartAi("空头与股价关系解读", "short_position")}</section><section class="market-insight-chart-card"><h3>港股通持仓比例走势</h3><p>左轴为港股通持仓比例，右轴为前复权周线股价；彩色分段仅依据持仓比例的真实高低点。</p>${state.marketInsightDetailLoading && !detail.connectHistory ? `<div class="market-insight-chart-empty">正在加载历史数据…</div>` : renderMarketInsightChart(connectChartSeries, { trendStages:connectTrend.stages, extrema:connectTrend.extrema })}${renderMarketInsightChartAi("港股通与股价关系解读", "stock_connect")}</section></div></div></div></aside>`;
    }

    async function openMarketInsightDetail(rawCode) {
      const stock = state.marketInsightRows.find((item) => item.rawCode === rawCode) || HSTECH_CONSTITUENTS.find((item) => item.rawCode === rawCode);
      if (!stock) return;
      state.marketInsightDetailCode = rawCode;
      state.marketInsightDetail = null;
      state.marketInsightDetailLoading = true;
      state.marketInsightDetailError = "";
      state.marketInsightDetailRange = "2Y";
      state.marketInsightAiAnalysis = null;
      state.marketInsightAiMeta = null;
      state.marketInsightAiLoading = false;
      state.marketInsightAiError = "";
      render();
      const stockCode = String(rawCode).padStart(5, "0");
      const weeklyPromise = fetchTencentWeeklySeries(stock).catch(() => fetchEastmoneyWeeklySeries(stock));
      const quotePromise = fetchQuote(stock).catch(() => stock);
      const canLoadDatabase = state.session?.access_token && state.session.access_token !== "local-demo";
      const selectedIndex = MARKET_INSIGHT_INDEXES.find((item) => item.id === state.marketInsightIndexId) || MARKET_INSIGHT_INDEXES[0];
      const metricsPromise = canLoadDatabase ? supabaseRequest(`/rest/v1/hk_market_insight_metrics_weekly?index_code=eq.${encodeURIComponent(selectedIndex.code)}&stock_code=eq.${encodeURIComponent(stockCode)}&select=week_date,bias_5w_pct,bias_30w_pct,bias_40w_pct,bias_50w_pct,percentile_5w_2y,percentile_30w_2y,percentile_40w_2y,percentile_50w_2y&order=week_date.asc&limit=2000`) : Promise.resolve([]);
      const shortPromise = canLoadDatabase ? supabaseRequest(`/rest/v1/hk_short_positions_weekly?stock_code=eq.${encodeURIComponent(stockCode)}&select=report_date,short_shares,issued_shares,short_ratio_pct&order=report_date.asc&limit=2000`) : Promise.resolve([]);
      const connectPromise = canLoadDatabase ? supabaseRequest(`/rest/v1/hk_stock_connect_holdings_daily?stock_code=eq.${encodeURIComponent(stockCode)}&select=holding_date,total_holding_shares,issued_shares,holding_ratio_pct&order=holding_date.asc&limit=2000`) : Promise.resolve([]);
      const [weeklyResult, quoteResult, metricsResult, shortResult, connectResult] = await Promise.allSettled([weeklyPromise, quotePromise, metricsPromise, shortPromise, connectPromise]);
      const issuedShares = quoteResult.status === "fulfilled" ? marketInsightIssuedShares({ ...stock, ...quoteResult.value }) : marketInsightIssuedShares(stock);
      const ratioValue = (storedRatio, shares, storedIssuedShares) => {
        const ratio = storedRatio === null || storedRatio === undefined || storedRatio === "" ? NaN : Number(storedRatio);
        if (Number.isFinite(ratio)) return ratio;
        const denominator = Number(storedIssuedShares) > 0 ? Number(storedIssuedShares) : issuedShares;
        const numerator = shares === null || shares === undefined || shares === "" ? NaN : Number(shares);
        return Number.isFinite(numerator) && numerator >= 0 && Number(denominator) > 0 ? numerator / Number(denominator) * 100 : NaN;
      };
      const persistedBiasHistory = {};
      if (metricsResult.status === "fulfilled" && metricsResult.value.length) {
        [5, 30, 40, 50].forEach((period) => {
          persistedBiasHistory[`ma${period}`] = metricsResult.value.flatMap((row) => row[`bias_${period}w_pct`] === null ? [] : [{ date:row.week_date, value:Number(row[`bias_${period}w_pct`]) }]).filter((row) => Number.isFinite(row.value));
          persistedBiasHistory[`p${period}`] = metricsResult.value.flatMap((row) => row[`percentile_${period}w_2y`] === null ? [] : [{ date:row.week_date, value:Number(row[`percentile_${period}w_2y`]) }]).filter((row) => Number.isFinite(row.value));
        });
      }
      const shortHistory = shortResult.status === "fulfilled" ? shortResult.value.map((row) => ({ date:row.report_date, value:ratioValue(row.short_ratio_pct, row.short_shares, row.issued_shares) })).filter((row) => Number.isFinite(row.value)) : [];
      const connectHistory = connectResult.status === "fulfilled" ? connectResult.value.map((row) => ({ date:row.holding_date, value:ratioValue(row.holding_ratio_pct, row.total_holding_shares, row.issued_shares) })).filter((row) => Number.isFinite(row.value)) : [];
      const currentConnectRatio = marketInsightConnectRatio(stock);
      if (!connectHistory.length && Number.isFinite(currentConnectRatio)) connectHistory.push({ date:state.marketInsightSnapshot?.stockConnect?.asOf || new Date().toISOString().slice(0, 10), value:currentConnectRatio });
      const priceHistory = weeklyResult.status === "fulfilled" ? weeklyResult.value.map((row) => ({ date:row.date, value:Number(row.close) })).filter((row) => row.date && Number.isFinite(row.value) && row.value > 0) : [];
      state.marketInsightDetail = {
        biasHistory: Object.keys(persistedBiasHistory).length ? persistedBiasHistory : weeklyResult.status === "fulfilled" ? calculateMarketInsightBiasHistory(weeklyResult.value) : {},
        shortHistory,
        connectHistory,
        priceHistory
      };
      const errors = [weeklyResult, quoteResult, metricsResult, shortResult, connectResult].filter((result) => result.status === "rejected").map((result) => result.reason?.message || String(result.reason));
      state.marketInsightDetailError = errors.length ? `部分历史数据加载失败：${errors.join("；")}` : "";
      state.marketInsightDetailLoading = false;
      render();
      loadMarketInsightAiAnalysis();
    }

    function marketInsightConstituents(indexId, snapshot = state.marketInsightSnapshot) {
      const official = snapshot?.constituents?.indexes?.[indexId];
      const members = official?.members?.length ? official.members : indexId === "hstech" ? HSTECH_CONSTITUENTS.map((item) => ({ code:item.rawCode, name:item.name })) : [];
      return members.map((member, order) => {
        const rawCode = String(member.code || "").padStart(4, "0");
        const canonical = stockCatalog.find((stock) => stock.market === "HK" && stock.code.replace(/\.HK$/i, "").padStart(4, "0") === rawCode);
        return { id:`${indexId}-${rawCode}`, order, rawCode, name:canonical?.name || member.name, aliases:canonical?.aliases || "", indexWeight:Number.isFinite(Number(member.weight)) ? Number(member.weight) : null, code:`${rawCode}.HK`, quoteId:`116.${rawCode.padStart(5, "0")}`, market:"HK", exchange:"HKEX", currency:"HKD" };
      });
    }

    function marketInsightGlobalSearch(query) {
      if (!query) return [];
      const found = [];
      MARKET_INSIGHT_INDEXES.forEach((index) => marketInsightConstituents(index.id).forEach((row) => {
        if (`${row.name} ${row.aliases} ${row.code} ${row.rawCode}`.toLowerCase().includes(query) && !found.some((item) => item.indexId === index.id && item.rawCode === row.rawCode)) found.push({ ...row, indexId:index.id, indexName:index.name });
      }));
      return found.slice(0, 8);
    }

    function marketInsightIndexMeta(index) {
      const official = state.marketInsightSnapshot?.constituents?.indexes?.[index.id];
      return { ...index, constituentAsOf:official?.asOf || index.constituentAsOf, sourceUrl:official?.sourceUrl || "https://www.hsi.com.hk/chi/indexes/all-indexes/sizeindexes" };
    }

    function calculateFiveWeekReturn(weeklyCloses) {
      const closes = (weeklyCloses || []).filter((value) => Number.isFinite(value) && value > 0);
      return closes.length >= 6 ? (closes.at(-1) / closes.at(-6) - 1) * 100 : null;
    }

    function marketInsightSortValue(row, key) {
      const numeric = (value) => value === null || value === undefined || value === "" ? NaN : Number(value);
      if (key === "excess5w") return numeric(row.excess5w);
      if (["ma5", "ma30", "ma40", "ma50"].includes(key)) return numeric(row.biasMetrics?.[key]?.bias);
      if (["p5", "p30", "p40", "p50"].includes(key)) return numeric(row.biasMetrics?.[`ma${key.slice(1)}`]?.percentile);
      if (key === "shortRatio") return numeric(marketInsightShortRatio(row));
      if (key === "connectRatio") return numeric(marketInsightConnectRatio(row));
      if (key === "indexWeight") return numeric(row.indexWeight ?? row.latestMarketCapCny);
      return Number(row.order);
    }

    function sortedMarketInsightRows(rows) {
      const { key, dir } = state.marketInsightSort;
      return [...rows].sort((a, b) => {
        const av = marketInsightSortValue(a, key), bv = marketInsightSortValue(b, key);
        const aValid = Number.isFinite(av), bValid = Number.isFinite(bv);
        if (!aValid && !bValid) return a.order - b.order;
        if (!aValid) return 1;
        if (!bValid) return -1;
        return (av - bv) * (dir === "asc" ? 1 : -1) || a.order - b.order;
      });
    }

    function marketInsightSortHeader(label, key, sublabel = "") {
      const active = state.marketInsightSort.key === key;
      const arrow = active ? (state.marketInsightSort.dir === "asc" ? "↑" : "↓") : "↕";
      return `<button class="market-insight-sort ${active ? "active" : ""}" data-action="sortMarketInsight" data-sort-key="${key}" data-sort-arrow="${arrow}"><span>${escapeHtml(label)}${sublabel ? `<br><span class="stock-code">${escapeHtml(sublabel)}</span>` : ""}</span></button>`;
    }

    function marketInsightBiasSortHeader(period) {
      return `<div class="market-insight-dual-sort">${marketInsightSortHeader(`${period}周乖离率`, `ma${period}`)}${marketInsightSortHeader("2年分位值", `p${period}`)}</div>`;
    }

    function marketInsightRating(row) {
      const number = (value) => value === null || value === undefined || value === "" ? NaN : Number(value);
      const rules = [
        number(row.excess5w) > 0,
        number(row.biasMetrics?.ma5?.bias) > 0,
        [30, 40, 50].every((period) => number(row.biasMetrics?.[`ma${period}`]?.bias) > 0),
        number(row.shortDecline5wShares) > 0,
        number(row.connectIncrease5wShares) > 0
      ];
      return { rules, score:rules.filter(Boolean).length };
    }

    const MARKET_INSIGHT_RATING_RULES = [
      { label:"超额收益", title:"5周超额收益为正" },
      { label:"5周乖离正", title:"5周乖离率为正" },
      { label:"中长期乖离正", title:"30、40、50周乖离率均为正" },
      { label:"空头平仓", title:"5周空头持仓下降" },
      { label:"港股通增持", title:"5周港股通持仓增加" }
    ];

    function marketInsightExcessCell(value, star = false) {
      const excess = value === null || value === undefined || value === "" ? NaN : Number(value);
      const cls = excess > 0 ? "gain" : excess < 0 ? "loss" : "";
      return `<td data-label="5周超额收益" class="num ${cls}"><span>${Number.isFinite(excess) ? `${marketInsightRuleStar(star, "5周超额收益为正")}${excess > 0 ? "+" : ""}${excess.toFixed(2)}%` : "--"}</span></td>`;
    }

    function renderMarketInsightView() {
      const index = marketInsightIndexMeta(MARKET_INSIGHT_INDEXES.find((item) => item.id === state.marketInsightIndexId) || MARKET_INSIGHT_INDEXES[0]);
      const snapshot = state.marketInsightSnapshot || {};
      const rows = state.marketInsightRows || [];
      const ratings = new Map(rows.map((row) => [row.id, marketInsightRating(row)]));
      const query = state.marketInsightSearch.trim().toLowerCase();
      const globalMatches = marketInsightGlobalSearch(query);
      const searchedRows = query ? rows.filter((row) => `${row.name} ${row.code} ${row.rawCode}`.toLowerCase().includes(query)) : rows;
      const selectedRuleFilters = Array.isArray(state.marketInsightRuleFilters) ? state.marketInsightRuleFilters : [];
      const ratingCounts = Object.fromEntries([3, 4, 5].map((score) => [score, searchedRows.filter((row) => ratings.get(row.id)?.score === score).length]));
      const ruleCounts = MARKET_INSIGHT_RATING_RULES.map((_, ruleIndex) => searchedRows.filter((row) => ratings.get(row.id)?.rules[ruleIndex]).length);
      const filteredRows = searchedRows.filter((row) => {
        const rating = ratings.get(row.id);
        const matchesScore = state.marketInsightRatingFilter === "all" || rating?.score === Number(state.marketInsightRatingFilter);
        return matchesScore && selectedRuleFilters.every((ruleIndex) => rating?.rules[ruleIndex]);
      });
      const sortedRows = sortedMarketInsightRows(filteredRows);
      const pageCount = Math.max(1, Math.ceil(sortedRows.length / state.marketInsightPageSize));
      const currentPage = Math.min(state.marketInsightPage, pageCount);
      const visibleRows = sortedRows.slice((currentPage - 1) * state.marketInsightPageSize, currentPage * state.marketInsightPageSize);
      const shortAsOf = snapshot.shortPositions?.asOf || "--";
      const connectAsOf = snapshot.stockConnect?.asOf || "--";
      return `
        <section class="market-insight-head">
          <div class="market-insight-actions">
            <label class="market-insight-search"><span class="market-insight-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg></span><input type="search" data-input="marketInsightSearch" value="${escapeHtml(state.marketInsightSearch)}" placeholder="搜索股票名称或代码" aria-label="搜索股票名称或代码">${query && !searchedRows.length && globalMatches.length ? `<div class="market-insight-search-results">${globalMatches.map((item) => `<button data-action="selectMarketInsightSearchResult" data-index-id="${item.indexId}" data-query="${escapeHtml(item.rawCode)}"><span>${escapeHtml(item.name)} · ${escapeHtml(item.code)}</span><small>${escapeHtml(item.indexName)}</small></button>`).join("")}</div>` : ""}</label>
            <div class="market-insight-index-tabs" role="tablist" aria-label="选择指数">${MARKET_INSIGHT_INDEXES.map((item) => `<button class="${item.id === index.id ? "active" : ""}" data-action="selectMarketInsightIndex" data-index-id="${item.id}" ${state.marketInsightLoading ? "disabled" : ""}>${escapeHtml(item.name)}</button>`).join("")}</div>
            <button class="secondary market-insight-refresh" data-action="refreshMarketInsight" ${state.marketInsightLoading ? "disabled" : ""}><span class="market-insight-refresh-icon" aria-hidden="true">↻</span>${state.marketInsightLoading ? "刷新中…" : "刷新数据"}</button>
          </div>
        </section>
        <section class="market-insight-rating-panel">
          <div class="market-insight-rating-main"><div class="market-insight-rating-filter-groups">
              <div class="market-insight-rating-filter-row"><div class="market-insight-rating-filters" role="group" aria-label="总星级筛选">
                ${[5, 4, 3].map((score) => `<button class="rating-rule ${state.marketInsightRatingFilter === String(score) ? "active" : ""}" data-action="filterMarketInsightRating" data-rating="${score}" aria-label="${score}星，${ratingCounts[score]}只" aria-pressed="${state.marketInsightRatingFilter === String(score)}" title="${score}星股票"><span class="rating-score" aria-hidden="true">${"★".repeat(score)}</span> <span>${ratingCounts[score]}</span></button>`).join("")}
              </div></div>
              <div class="market-insight-rating-filter-row"><div class="market-insight-rating-filters" role="group" aria-label="单项评定筛选，可多选">
                ${MARKET_INSIGHT_RATING_RULES.map((rule, ruleIndex) => `<button class="rating-rule ${selectedRuleFilters.includes(ruleIndex) ? "active" : ""}" data-action="filterMarketInsightRule" data-rule-index="${ruleIndex}" aria-pressed="${selectedRuleFilters.includes(ruleIndex)}" title="${escapeHtml(rule.title)}">★ ${escapeHtml(rule.label)} <span>${ruleCounts[ruleIndex]}</span></button>`).join("")}
              </div></div>
            </div>
          </div>
          <div class="market-insight-rating-standard">5周超额收益为正 · 5周乖离率为正 · 30/40/50周乖离率均为正 · 5周空头持仓下降 · 5周港股通持仓增加；每符合一项得1星。</div>
        </section>
        <div class="market-insight-meta">
          <span><strong>${escapeHtml(index.name)}</strong> · ${rows.length} 只成分股</span>
          <span>成分生效日：<strong>${escapeHtml(index.constituentAsOf)}</strong></span>
          <span>空仓报告：<strong>${escapeHtml(shortAsOf)}</strong></span>
          <span>港股通持仓：<strong>${escapeHtml(connectAsOf)}</strong></span>
          ${state.marketInsightLoading ? `<span class="market-insight-loading">正在读取市场数据</span>` : ""}
          ${state.marketInsightError ? `<span class="loss">${escapeHtml(state.marketInsightError)}</span>` : ""}
        </div>
        <section class="table-panel horizontal-data-table market-insight-table portfolio-table">
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th class="sticky-col">股票名称</th>
                <th class="num">${marketInsightSortHeader("5周超额收益", "excess5w")}</th>
                <th class="num">${marketInsightBiasSortHeader(5)}</th>
                <th class="num">${marketInsightBiasSortHeader(30)}</th>
                <th class="num">${marketInsightBiasSortHeader(40)}</th>
                <th class="num">${marketInsightBiasSortHeader(50)}</th>
                <th class="num">${marketInsightSortHeader("空头持仓比例", "shortRatio", "SFC")}</th>
                <th class="num">${marketInsightSortHeader("港股通持仓比例", "connectRatio", "HKEX 日终数据")}</th>
                <th>操作</th>
              </tr></thead>
              <tbody>${visibleRows.map((row) => {
                const shortRatio = marketInsightShortRatio(row);
                const connectRatio = marketInsightConnectRatio(row);
                const rating = ratings.get(row.id) || marketInsightRating(row);
                return `<tr>
                  <td data-label="股票名称" class="sticky-col"><div class="stock-name">${escapeHtml(row.name)}</div><div class="stock-code">${escapeHtml(row.code)}<span class="market-insight-rating-badge">★ ${rating.score}</span></div></td>
                  ${marketInsightExcessCell(row.excess5w, rating.rules[0])}
                  ${marketInsightMetricCell(row.biasMetrics?.ma5, 5, rating.rules[1], "5周乖离率为正")}
                  ${marketInsightMetricCell(row.biasMetrics?.ma30, 30, Number(row.biasMetrics?.ma30?.bias) > 0, "30周乖离率为正")}
                  ${marketInsightMetricCell(row.biasMetrics?.ma40, 40, Number(row.biasMetrics?.ma40?.bias) > 0, "40周乖离率为正")}
                  ${marketInsightMetricCell(row.biasMetrics?.ma50, 50, Number(row.biasMetrics?.ma50?.bias) > 0, "50周乖离率为正")}
                  ${marketInsightShortChangeCell(row, shortRatio, rating.rules[3])}
                  ${marketInsightConnectChangeCell(row, connectRatio, rating.rules[4])}
                  <td data-label="操作"><button class="market-insight-detail-link" data-action="openMarketInsightDetail" data-code="${escapeHtml(row.rawCode)}">查看详情</button></td>
                </tr>`;
              }).join("")}</tbody>
            </table>

        <p class="market-insight-note">
          列表默认按指数权重降序排列；公开成分接口未提供完整权重时，保留官方成分名单顺序。恒生科技权重采用2026年6月8日生效的恒指公司检讨结果。
          5周超额收益 = 股票最近5个完整周度区间的累计涨跌幅 − 所选指数同期累计涨跌幅；指数行情暂不可用时，以该指数成分股市值加权收益估算。
          空头持仓比例 = 证监会“合计须申报淡仓”股数 ÷ 行情总股本估算，不代表全市场全部空头；与证监会周度披露日期存在滞后。
          港股通比例为中国结算两个 CCASS 参与者的日终合计持仓占已发行股份比例。
          数据源：<a href="${escapeHtml(snapshot.shortPositions?.sourceUrl || "https://www.sfc.hk/TC/Regulatory-functions/Market/Short-position-reporting/Aggregated-reportable-short-positions-of-specified-shares")}" target="_blank" rel="noopener">香港证监会</a>、<a href="${escapeHtml(snapshot.stockConnect?.sourceUrl || "https://www3.hkexnews.hk/sdw/search/mutualmarket.aspx?t=hk")}" target="_blank" rel="noopener">港交所</a>、腾讯/东方财富周线行情。
        </p>
        ${state.marketInsightDetailCode ? renderMarketInsightDetailView() : ""}
      `;
    }

    async function loadMarketInsightSnapshot() {
      try {
        const response = await fetchWithTimeout(`data/market-insights.json?v=${Date.now()}`, 8000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const snapshot = await response.json();
        state.marketInsightSnapshot = snapshot;
        state.marketInsightRows = marketInsightConstituents(state.marketInsightIndexId, snapshot).map((item) => ({
          ...item,
          shortShares: snapshot.shortPositions?.byCode?.[item.rawCode]?.shares ?? null,
          shortValueHkd: snapshot.shortPositions?.byCode?.[item.rawCode]?.valueHkd ?? null,
          stockConnectShares: snapshot.stockConnect?.byCode?.[item.rawCode]?.shares ?? null,
          stockConnectRatio: snapshot.stockConnect?.byCode?.[item.rawCode]?.ratio ?? null
        }));
      } catch (error) {
        state.marketInsightError = `官方持仓快照加载失败：${error.message || String(error)}`;
        state.marketInsightRows = marketInsightConstituents(state.marketInsightIndexId, state.marketInsightSnapshot).map((item) => ({ ...item }));
      }
    }

    async function refreshMarketInsight({ force = false } = {}) {
      if (state.marketInsightLoading) return;
      const indexId = state.marketInsightIndexId;
      if (state.marketInsightCache[indexId]?.length && !force) {
        state.marketInsightRows = state.marketInsightCache[indexId];
        state.marketInsightLoaded = true;
        render();
        return;
      }
      state.marketInsightLoading = true;
      state.marketInsightError = "";
      render();
      await loadMarketInsightSnapshot();
      render();
      let rows = [...state.marketInsightRows];
      try {
        rows = await loadLatestMarketInsightRatios(rows);
        state.marketInsightRows = [...rows];
        render();
      } catch (error) {
        console.warn("数据库最新持仓比例加载失败，保留快照数据。", error);
      }
      const index = MARKET_INSIGHT_INDEXES.find((item) => item.id === indexId) || MARKET_INSIGHT_INDEXES[0];
      try {
        rows = await loadPersistedMarketInsightMetrics(rows, index.code);
        state.marketInsightRows = [...rows];
        render();
      } catch (error) {
        console.warn("持久化周线指标尚不可用，临时使用页面计算。", error);
      }
      let indexFiveWeekReturn = rows.find((row) => Number.isFinite(row.indexFiveWeekReturn))?.indexFiveWeekReturn ?? null;
      if (!Number.isFinite(indexFiveWeekReturn)) {
        try {
          const indexCloses = await fetchEastmoneyWeeklyCloses({ quoteId:index.quoteId, market:"INDEX", code:index.code });
          indexFiveWeekReturn = calculateFiveWeekReturn(indexCloses);
        } catch (error) {
          console.warn("指数周线不可用，超额收益暂不展示。", index.code, error);
        }
      }
      if (!Number.isFinite(indexFiveWeekReturn)) {
        const usable = rows.filter((row) => Number.isFinite(row.fiveWeekReturn));
        const weighted = usable.filter((row) => Number(row.latestMarketCapCny) > 0);
        indexFiveWeekReturn = weighted.length
          ? weighted.reduce((sum, row) => sum + row.fiveWeekReturn * Number(row.latestMarketCapCny), 0) / weighted.reduce((sum, row) => sum + Number(row.latestMarketCapCny), 0)
          : usable.length ? usable.reduce((sum, row) => sum + row.fiveWeekReturn, 0) / usable.length : null;
        rows = rows.map((row) => ({ ...row, excess5w:Number.isFinite(indexFiveWeekReturn) && Number.isFinite(row.fiveWeekReturn) ? row.fiveWeekReturn - indexFiveWeekReturn : null }));
      }
      state.marketInsightLoaded = true;
      state.marketInsightLoading = false;
      state.marketInsightUpdatedAt = new Date().toISOString();
      state.marketInsightCache[indexId] = [...rows];
      if (state.mainView === "marketInsight") render();
    }

    function journalStorageKey() {
      return `${JOURNAL_STORAGE_PREFIX}${state.session?.user?.id || "guest"}`;
    }

    function journalDateParts(value) {
      const date = new Date(value);
      return {
        day: String(date.getDate()).padStart(2, "0"),
        month: date.toLocaleDateString("zh-CN", { month: "short" })
      };
    }

    function journalPriceText(stock) {
      const price = Number(stock.publishedPrice);
      return price > 0 ? `${price.toLocaleString("zh-CN", { maximumFractionDigits: 3 })} ${stock.currency || marketCurrency(stock.market)}` : `— ${stock.currency || marketCurrency(stock.market)}`;
    }

    function journalMonthKey(entry) {
      const date = new Date(entry.publishedAt || entry.createdAt);
      if (Number.isNaN(date.getTime())) return "";
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function journalStockKey(stock) {
      return journalSecurityCodeKey(stock);
    }

    function journalSecurityCodeKey(stock) {
      const rawCode = String(stock?.code || "").trim().toUpperCase();
      const parts = rawCode.split(".");
      const suffix = parts.length > 1 ? parts.at(-1) : "";
      const market = String(stock?.market || suffix || "").toUpperCase();
      let symbol = parts[0] || rawCode;
      if (market === "HK" || suffix === "HK") symbol = symbol.replace(/^0+(?=\d)/, "");
      return `${market}:${symbol}`;
    }

    function normalizeJournalStockName(name, market) {
      let value = String(name || "").trim().replace(/[‐‑‒–—]/g, "-");
      if (String(market || "").toUpperCase() !== "HK") return value;
      value = value.replace(/-([a-z]{1,3})$/i, (_, suffix) => `-${suffix.toUpperCase()}`);
      if (!value.includes("-")) value = value.replace(/([\u4e00-\u9fff])([a-z]{1,3})$/i, (_, chinese, suffix) => `${chinese}-${suffix.toUpperCase()}`);
      return value;
    }

    function canonicalJournalStock(stock) {
      if (!stock) return stock;
      const candidates = [
        ...state.stocks,
        ...state.portfolios.flatMap((portfolio) => portfolio.positions || []),
        ...stockCatalog
      ];
      const key = journalSecurityCodeKey(stock);
      const canonical = candidates.find((candidate) => journalSecurityCodeKey(candidate) === key);
      const market = stock.market || canonical?.market || "";
      return {
        ...stock,
        market,
        name: normalizeJournalStockName(canonical?.name || stock.name, market)
      };
    }

    function canonicalJournalEntry(entry) {
      const originalStocks = entry?.stocks || [];
      const stocks = originalStocks.map(canonicalJournalStock);
      let content = String(entry?.content || "");
      originalStocks.forEach((stock, index) => {
        const canonical = stocks[index];
        if (!stock?.name || !canonical?.name || stock.name === canonical.name) return;
        content = content.split(`$${stock.name}(${stock.code})`).join(`$${canonical.name}(${canonical.code || stock.code})`);
      });
      return { ...entry, content, stocks };
    }

    function journalFilterTag(label, count, active, attrs) {
      return `<button type="button" class="journal-filter-tag ${active ? "active" : ""}" ${attrs}>${escapeHtml(label)}${count == null ? "" : `<span class="journal-filter-count">${count}</span>`}</button>`;
    }

    function renderJournalView() {
      const allRows = [...state.journals].sort((a, b) => String(b.publishedAt || b.createdAt).localeCompare(String(a.publishedAt || a.createdAt)));
      const months = [...new Set(allRows.map(journalMonthKey).filter(Boolean))].sort().reverse();
      const stockStats = new Map();
      allRows.forEach((entry) => {
        const seen = new Set();
        (entry.stocks || []).forEach((stock) => {
          const key = journalStockKey(stock);
          if (!stock.code || seen.has(key)) return;
          seen.add(key);
          const current = stockStats.get(key) || { stock: canonicalJournalStock(stock), count: 0 };
          current.count += 1;
          stockStats.set(key, current);
        });
      });
      const stocks = [...stockStats.entries()].sort((a, b) => b[1].count - a[1].count || String(a[1].stock.name).localeCompare(String(b[1].stock.name), "zh-CN"));
      const rows = allRows.filter((entry) => {
        const monthMatches = !state.journalMonthFilter || journalMonthKey(entry) === state.journalMonthFilter;
        const stockMatches = !state.journalStockFilter || (entry.stocks || []).some((stock) => journalStockKey(stock) === state.journalStockFilter);
        return monthMatches && stockMatches;
      });
      const filters = `<section class="journal-filters" aria-label="日志筛选">
        <div class="journal-filter-action"><button class="primary stock-add-button journal-write-button" data-action="newJournal" ${!state.journalDbReady && state.session?.access_token !== "local-demo" ? "disabled" : ""}>+ 写日志</button></div>
        <div class="journal-filter-row"><div class="journal-filter-tags">
          ${journalFilterTag("全部月份", null, !state.journalMonthFilter, `data-action="filterJournalMonth" data-month=""`)}
          ${months.map((month) => journalFilterTag(`${month.slice(0, 4)}年${Number(month.slice(5))}月`, allRows.filter((entry) => journalMonthKey(entry) === month).length, state.journalMonthFilter === month, `data-action="filterJournalMonth" data-month="${month}"`)).join("")}
        </div></div>
        <div class="journal-filter-row"><div class="journal-filter-tags">
          ${journalFilterTag("全部股票", null, !state.journalStockFilter, `data-action="filterJournalStock" data-stock-key=""`)}
          ${stocks.map(([key, item]) => journalFilterTag(`${item.stock.name} ${item.stock.code}`, item.count, state.journalStockFilter === key, `data-action="filterJournalStock" data-stock-key="${escapeHtml(key)}"`)).join("")}
        </div></div>
      </section>`;
      return `
        ${state.journalDbError ? `<div class="simple-modal-error" style="margin-bottom:12px">日志数据库尚未启用。请先按部署说明执行建表 SQL，然后刷新页面；当前设备已有的本地日志会自动迁移。</div>` : ""}
        ${filters}
        ${rows.length ? `<div class="journal-list">${rows.map((entry) => {
          const date = journalDateParts(entry.publishedAt || entry.createdAt);
          const expanded = state.expandedJournalIds.includes(entry.id);
          const long = String(entry.content || "").length > 260 || String(entry.content || "").split("\n").length > 7;
          const displayEntry = canonicalJournalEntry(entry);
          return `<article class="journal-entry">
            <time class="journal-date" datetime="${escapeHtml(entry.publishedAt || entry.createdAt)}"><span class="journal-date-day">${date.day}</span><span class="journal-date-month">${escapeHtml(date.month)}</span></time>
            <div class="journal-content"><p class="journal-text ${expanded ? "" : "collapsed"}">${escapeHtml(displayEntry.content)}</p>
              ${long ? `<button class="journal-expand" data-action="toggleJournal" data-id="${entry.id}">${expanded ? "收起" : "展开阅读全文"}</button>` : ""}
              ${displayEntry.stocks.length ? `<div class="journal-stocks">${displayEntry.stocks.map((stock) => `<span class="journal-stock-chip"><strong>${escapeHtml(stock.name)}</strong><span>${escapeHtml(stock.code)}</span><small>${escapeHtml(journalPriceText(stock))}</small></span>`).join("")}</div>` : ""}
            </div>
            <div class="journal-actions">
              <button class="journal-action-edit" data-action="editJournal" data-id="${entry.id}" title="修改日志" aria-label="修改日志" ${!state.journalDbReady && state.session?.access_token !== "local-demo" ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"></path><path d="m13.5 6.5 4 4"></path></svg></button>
              <button class="journal-action-delete" data-action="deleteJournal" data-id="${entry.id}" title="删除日志" aria-label="删除日志" ${!state.journalDbReady && state.session?.access_token !== "local-demo" ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="m7 7 1 13h8l1-13"></path><path d="M10 11v5M14 11v5"></path></svg></button>
            </div>
          </article>`;
        }).join("")}</div>` : allRows.length ? `<section class="journal-empty"><h2>没有匹配的日志</h2><p>可以切换上方的月份或股票标签查看其他日志。</p><button data-action="clearJournalFilters">清除筛选</button></section>` : `<section class="journal-empty"><h2>还没有日志</h2><p>写下今天的判断，输入 $ 可以插入股票。</p></section>`}
      `;
    }

    function renderJournalModal() {
      const modal = state.journalModal;
      if (!modal) return "";
      return `<div class="simple-modal-backdrop"><section class="simple-modal journal-editor" role="dialog" aria-modal="true" aria-label="${modal.id ? "更改日志" : "写日志"}">
        <div class="simple-modal-head"><h2>${modal.id ? "更改日志" : "写日志"}</h2><button class="icon" data-action="closeJournal" aria-label="关闭">×</button></div>
        <form data-form="journal"><div class="simple-modal-body">
          <label class="field journal-content-field"><span>日志内容</span><textarea name="content" data-input="journalContent" maxlength="30000" placeholder="写下你的所思所想。输入 $ 后直接搜索并插入股票。" required>${escapeHtml(modal.content || "")}</textarea><div class="journal-mention-popup" data-journal-mention-popup></div></label>
          <div class="journal-editor-help">在正文中输入 $ 后直接继续输入股票名称或代码；匹配浮层不会打断输入，选择后会在原光标位置插入股票并在发布时记录实时价格。</div>
          ${(modal.stocks || []).length ? `<div class="journal-selected-stocks">${modal.stocks.map(canonicalJournalStock).map((stock, index) => `<span class="journal-selected-stock"><strong>${escapeHtml(stock.name)}</strong>${escapeHtml(stock.code)}<button type="button" data-action="removeJournalStock" data-index="${index}" aria-label="移除">×</button></span>`).join("")}</div>` : ""}
          ${state.journalError ? `<div class="simple-modal-error">${escapeHtml(state.journalError)}</div>` : ""}
        </div><div class="simple-modal-foot"><button type="button" data-action="closeJournal">取消</button><button class="primary" type="submit" ${state.journalSaving ? "disabled" : ""}>${state.journalSaving ? "正在记录价格..." : modal.id ? "保存更改" : "发布日志"}</button></div></form>
      </section></div>`;
    }

    async function loadJournals() {
      const localRows = readJson(journalStorageKey(), []);
      state.journals = Array.isArray(localRows) ? localRows : [];
      state.journalDbReady = state.session?.access_token === "local-demo";
      state.journalDbError = "";
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        try {
          const rows = await supabaseRequest(`/rest/v1/journal_entries?user_id=eq.${encodeURIComponent(state.session.user.id)}&select=id,payload,created_at,updated_at&order=created_at.desc`);
          const cloudRows = (rows || []).map((row) => ({ ...(row.payload || {}), id: row.id, createdAt: row.payload?.createdAt || row.created_at }));
          const cloudIds = new Set(cloudRows.map((entry) => entry.id));
          const pendingLocalRows = state.journals.filter((entry) => entry?.id && !cloudIds.has(entry.id));
          if (pendingLocalRows.length) {
            await supabaseRequest("/rest/v1/journal_entries?on_conflict=id", {
              method: "POST",
              prefer: "resolution=merge-duplicates",
              body: JSON.stringify(pendingLocalRows.map((entry) => ({
                id: entry.id,
                user_id: state.session.user.id,
                payload: { ...entry, id: undefined },
                updated_at: entry.updatedAt || new Date().toISOString()
              })))
            });
          }
          state.journals = [...pendingLocalRows, ...cloudRows].sort((a, b) => String(b.publishedAt || b.createdAt).localeCompare(String(a.publishedAt || a.createdAt)));
          state.journalDbReady = true;
        } catch (error) {
          state.journalDbReady = false;
          state.journalDbError = error.message || String(error);
          console.warn("日志数据库尚未就绪。", error);
        }
      }
      writeJson(journalStorageKey(), state.journals);
      if (state.journalDbReady) repairMissingJournalPrices().catch((error) => console.warn("日志价格补全失败。", error));
    }

    async function captureJournalStockPrice(stock, capturedAt = new Date().toISOString()) {
      if (Number(stock.publishedPrice) > 0) return stock;
      const quote = await fetchQuote(stock);
      const latestPrice = Number(quote.latestPrice);
      if (!latestPrice || !Number.isFinite(latestPrice)) throw new Error(`${stock.name || stock.code} 暂无有效行情`);
      return { ...stock, publishedPrice: latestPrice, currency: stock.currency || marketCurrency(stock.market), priceCapturedAt: capturedAt };
    }

    async function repairMissingJournalPrices() {
      const targets = state.journals.filter((entry) => (entry.stocks || []).some((stock) => !(Number(stock.publishedPrice) > 0)));
      if (!targets.length || !state.session?.access_token || state.session.access_token === "local-demo") return;
      const repaired = [];
      for (const entry of targets) {
        const stocks = await Promise.all((entry.stocks || []).map(async (stock) => {
          try { return await captureJournalStockPrice(stock, new Date().toISOString()); }
          catch { return stock; }
        }));
        if (stocks.some((stock, index) => Number(stock.publishedPrice) > 0 && !(Number(entry.stocks[index]?.publishedPrice) > 0))) {
          repaired.push({ ...entry, stocks, updatedAt: new Date().toISOString() });
        }
      }
      if (!repaired.length) return;
      await supabaseRequest("/rest/v1/journal_entries?on_conflict=id", {
        method: "POST",
        prefer: "resolution=merge-duplicates",
        body: JSON.stringify(repaired.map((entry) => ({ id: entry.id, user_id: state.session.user.id, payload: { ...entry, id: undefined }, updated_at: entry.updatedAt })))
      });
      const repairedById = new Map(repaired.map((entry) => [entry.id, entry]));
      state.journals = state.journals.map((entry) => repairedById.get(entry.id) || entry);
      writeJson(journalStorageKey(), state.journals);
      if (state.mainView === "journal") render();
    }

    function openJournal(entryId = "") {
      const entry = state.journals.find((item) => item.id === entryId);
      state.journalModal = entry ? canonicalJournalEntry(JSON.parse(JSON.stringify(entry))) : { id: "", content: "", stocks: [] };
      state.journalSearchResults = [];
      state.journalSearchQuery = "";
      state.journalInsertCursor = state.journalModal.content.length;
      state.journalError = "";
      render();
      setTimeout(() => document.querySelector("[data-input='journalContent']")?.focus(), 0);
    }

    function closeJournal() {
      if (journalSearchTimer) window.clearTimeout(journalSearchTimer);
      journalSearchRequestId += 1;
      state.journalModal = null; state.journalSearchResults = []; state.journalSearchQuery = ""; state.journalError = ""; render();
    }

    function updateJournalMentionPopup(content = "", show = true) {
      const popup = document.querySelector("[data-journal-mention-popup]");
      if (!popup) return;
      popup.innerHTML = content;
      popup.classList.toggle("show", show);
      if (show) positionJournalMentionPopup();
    }

    function positionJournalMentionPopup() {
      const textarea = document.querySelector("[data-input='journalContent']");
      const popup = document.querySelector("[data-journal-mention-popup]");
      const field = textarea?.closest(".journal-content-field");
      if (!textarea || !popup || !field) return;
      const style = getComputedStyle(textarea);
      const mirror = document.createElement("div");
      mirror.style.position = "fixed";
      mirror.style.visibility = "hidden";
      mirror.style.pointerEvents = "none";
      mirror.style.left = `${textarea.getBoundingClientRect().left}px`;
      mirror.style.top = `${textarea.getBoundingClientRect().top}px`;
      mirror.style.width = `${textarea.clientWidth}px`;
      mirror.style.height = `${textarea.clientHeight}px`;
      mirror.style.overflow = "hidden";
      mirror.style.whiteSpace = "pre-wrap";
      mirror.style.overflowWrap = "break-word";
      mirror.style.wordBreak = "break-word";
      ["fontFamily", "fontSize", "fontWeight", "fontStyle", "letterSpacing", "lineHeight", "textTransform", "textIndent", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth", "boxSizing"].forEach((name) => { mirror.style[name] = style[name]; });
      const before = document.createTextNode(textarea.value.slice(0, textarea.selectionStart));
      const marker = document.createElement("span");
      marker.textContent = "\u200b";
      mirror.append(before, marker);
      document.body.appendChild(mirror);
      mirror.scrollTop = textarea.scrollTop;
      mirror.scrollLeft = textarea.scrollLeft;
      const markerRect = marker.getBoundingClientRect();
      const fieldRect = field.getBoundingClientRect();
      const lineHeight = parseFloat(style.lineHeight) || 28;
      const popupWidth = Math.min(440, Math.max(240, field.clientWidth - 20));
      let left = markerRect.left - fieldRect.left;
      left = Math.max(10, Math.min(left, field.clientWidth - popupWidth - 10));
      let top = markerRect.top - fieldRect.top + lineHeight + 5;
      popup.style.width = `${popupWidth}px`;
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      mirror.remove();
      const popupRect = popup.getBoundingClientRect();
      if (popupRect.bottom > window.innerHeight - 12) {
        top = Math.max(30, top - popupRect.height - lineHeight - 10);
        popup.style.top = `${top}px`;
      }
    }

    function journalMentionResultsHtml(results) {
      if (!results.length) return `<div class="journal-mention-hint">没有匹配结果，请继续输入或更换名称、代码。</div>`;
      return results.map((rawItem, index) => {
        const item = canonicalJournalStock(rawItem);
        return `<button type="button" class="journal-mention-result" data-action="selectJournalStock" data-index="${index}"><span><strong>${escapeHtml(item.name)}</strong> <small>${escapeHtml(item.code)} · ${marketLabel(item.market)}</small></span><span>插入</span></button>`;
      }).join("");
    }

    function scheduleJournalSearch(query, focusTarget = "content", cursor = null) {
      const value = String(query || "").trim();
      state.journalSearchQuery = value;
      if (Number.isInteger(cursor)) state.journalInsertCursor = cursor;
      if (journalSearchTimer) window.clearTimeout(journalSearchTimer);
      const requestId = ++journalSearchRequestId;
      if (!value) {
        state.journalSearchResults = [];
        state.journalSearchLoading = false;
        updateJournalMentionPopup(`<div class="journal-mention-hint">继续输入股票名称或代码</div>`, true);
        return;
      }
      state.journalSearchResults = [];
      updateJournalMentionPopup(`<div class="journal-mention-hint">正在联网匹配“${escapeHtml(value)}”...</div>`, true);
      journalSearchTimer = window.setTimeout(async () => {
        journalSearchTimer = null;
        state.journalSearchLoading = true;
        const results = await searchStocks(value);
        if (requestId !== journalSearchRequestId || !state.journalModal) return;
        state.journalSearchResults = results;
        state.journalSearchLoading = false;
        updateJournalMentionPopup(journalMentionResultsHtml(results), true);
      }, 80);
    }

    function selectJournalStock(index) {
      const stock = canonicalJournalStock(state.journalSearchResults[index]);
      if (!stock || !state.journalModal) return;
      if (!state.journalModal.stocks.some((item) => item.code === stock.code && item.market === stock.market)) state.journalModal.stocks.push(stock);
      const textarea = document.querySelector("[data-input='journalContent']");
      const content = textarea?.value ?? state.journalModal.content;
      const cursor = document.activeElement === textarea ? textarea.selectionStart : (state.journalInsertCursor || content.length);
      const before = content.slice(0, cursor).replace(/\$[^\s$]*$/, "");
      state.journalModal.content = `${before}$${stock.name}(${stock.code}) ${content.slice(cursor)}`;
      state.journalSearchResults = [];
      state.journalSearchQuery = "";
      render();
      const nextCursor = before.length + stock.name.length + stock.code.length + 4;
      setTimeout(() => {
        const nextTextarea = document.querySelector("[data-input='journalContent']");
        nextTextarea?.focus();
        nextTextarea?.setSelectionRange(nextCursor, nextCursor);
      }, 0);
    }

    async function deleteJournal(entryId) {
      const entry = state.journals.find((item) => item.id === entryId);
      if (!entry) return;
      const preview = String(entry.content || "").replace(/\s+/g, " ").slice(0, 48);
      if (!confirm(`确定删除这篇日志吗？\n\n${preview}${String(entry.content || "").length > 48 ? "…" : ""}\n\n删除后无法恢复。`)) return;
      try {
        if (state.session?.access_token && state.session.access_token !== "local-demo") {
          await supabaseRequest(`/rest/v1/journal_entries?id=eq.${encodeURIComponent(entryId)}&user_id=eq.${encodeURIComponent(state.session.user.id)}`, { method: "DELETE" });
        }
        state.journals = state.journals.filter((item) => item.id !== entryId);
        state.expandedJournalIds = state.expandedJournalIds.filter((id) => id !== entryId);
        writeJson(journalStorageKey(), state.journals);
        render();
      } catch (error) {

    async function submitJournal(event) {
      event.preventDefault();
      if (!state.journalModal || state.journalSaving) return;
      const content = String(new FormData(event.currentTarget).get("content") || "").trim();
      if (!content) { state.journalError = "请先写下日志内容。"; render(); return; }
      state.journalSaving = true; state.journalError = ""; render();
      const now = new Date().toISOString();
      const priceResults = await Promise.allSettled((state.journalModal.stocks || []).map((stock) => captureJournalStockPrice(stock, now)));
      const failedPrice = priceResults.find((result) => result.status === "rejected");
      if (failedPrice) {
        state.journalSaving = false;
        state.journalError = `价格获取失败，请稍后重试：${failedPrice.reason?.message || String(failedPrice.reason)}`;
        render();
        return;
      }
      const stocks = priceResults.map((result) => canonicalJournalStock(result.value));
      const entry = { ...state.journalModal, id: state.journalModal.id || id("journal"), content, stocks, publishedAt: state.journalModal.publishedAt || now, createdAt: state.journalModal.createdAt || now, updatedAt: now };
      if (state.session?.access_token && state.session.access_token !== "local-demo") {
        try {
          await supabaseRequest("/rest/v1/journal_entries?on_conflict=id", { method:"POST", prefer:"resolution=merge-duplicates", body:JSON.stringify({ id:entry.id, user_id:state.session.user.id, payload:{ ...entry, id:undefined }, updated_at:now }) });
        } catch (error) {
          state.journalSaving = false;
          state.journalError = `数据库保存失败：${error.message || String(error)}`;
          render();
          return;
        }
      }
      state.journals = state.journals.some((item) => item.id === entry.id) ? state.journals.map((item) => item.id === entry.id ? entry : item) : [entry, ...state.journals];
      writeJson(journalStorageKey(), state.journals);
      state.journalSaving = false; state.journalModal = null; render();
    }

    function activePortfolio() {
      return state.portfolios.find((item) => item.id === state.activePortfolioId) || state.portfolios[0] || null;
    }

    function portfolioBaseCurrency(portfolio) {
      return portfolio?.accountType === "HKUS" ? "USD" : "CNY";
    }

    function portfolioFx(currency, baseCurrency) {
      if (currency === baseCurrency) return 1;
      const cnyRate = currencies[currency]?.rateToCny || 1;
      const baseCnyRate = currencies[baseCurrency]?.rateToCny || 1;
      return cnyRate / baseCnyRate;
    }

    function positionBaseValue(position, portfolio) {
      if (position?.assetType === "option") {
        const direction = position.direction === "short" ? -1 : 1;
        return direction * Number(position.contracts || 0) * Number(position.contractMultiplier || 0) * (Number(position.latestPrice) || Number(position.averageCost) || 0) * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
      }
      const price = Number(position.latestPrice) || Number(position.averageCost) || 0;
      return Number(position.shares || 0) * price * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
    }

    function optionUnderlyingKey(position) {
      const market=String(position?.market||"").toUpperCase();
      const code=String(position?.assetType==="option"?position.underlyingCode:position?.code||"").toUpperCase();
      return market&&code?`${market}:${code}`:"";
    }

    function positionExposureBaseValue(position, portfolio) {
      if(position?.assetType!=="option") return positionBaseValue(position,portfolio);
      const contracts=Number(position.contracts||0),multiplier=Number(position.contractMultiplier||0),strike=Number(position.strikePrice||0),premium=Number(position.averageCost||0);
      const direction=position.direction==="short"?-1:1;
      const exposure=position.optionType==="put"
        ? -direction*contracts*multiplier*Math.max(0,strike-premium)
        : direction*contracts*multiplier*(strike+premium);
      return exposure*portfolioFx(position.currency,portfolioBaseCurrency(portfolio));
    }

    function optionContractLabel(position) {
      return `${position.optionType==="put"?"Put":"Call"} · ${position.expiryDate||"--"} · 行权 ${formatPortfolioNumber(position.strikePrice)} · ${Number(position.contractMultiplier||0).toLocaleString("zh-CN")}股/张`;
    }

    function parseUniversalOptionCode(value) {
      const source=String(value||"").trim().toUpperCase();
      const compact=source.replace(/\s+/g,"");
      let match=compact.match(/^([A-Z]{1,6})(\d{6})([CP])(\d{8})$/);
      if(match){
        const [,root,date,type,strikeRaw]=match;
        return {contractCode:compact,underlyingQuery:root,underlyingCode:root,market:"US",currency:"USD",expiryDate:`20${date.slice(0,2)}-${date.slice(2,4)}-${date.slice(4,6)}`,optionType:type==="P"?"put":"call",strikePrice:Number(strikeRaw)/1000,contractMultiplier:100};
      }
      match=source.match(/^([A-Z0-9]{1,10})(?:\.(HK|US))?\s+(\d{6}|\d{8})\s+(\d+(?:\.\d+)?)\s*([CP])$/);
      if(match){
        const [,rawRoot,marketHint,dateRaw,strikeRaw,type]=match;
        const market=marketHint||(/^\d+$/.test(rawRoot)?"HK":"US");
        const date=dateRaw.length===6?`20${dateRaw}`:dateRaw;
        const underlyingCode=market==="HK"?`${rawRoot.padStart(5,"0")}.HK`:rawRoot;
        return {contractCode:source,underlyingQuery:rawRoot,underlyingCode,market,currency:market==="HK"?"HKD":"USD",expiryDate:`${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}`,optionType:type==="P"?"put":"call",strikePrice:Number(strikeRaw),contractMultiplier:market==="US"?100:0};
      }
      match=source.match(/^([A-Z0-9]{1,10})(?:\.(HK|US))?[-_\s]+(\d{8}|\d{6})[-_\s]+([CP])[-_\s]+(\d+(?:\.\d+)?)$/);
      if(!match) return null;
      const [,rawRoot,marketHint,dateRaw,type,strikeRaw]=match,market=marketHint||(/^\d+$/.test(rawRoot)?"HK":"US"),date=dateRaw.length===6?`20${dateRaw}`:dateRaw;
      const underlyingCode=market==="HK"?`${rawRoot.padStart(5,"0")}.HK`:rawRoot;
      return {contractCode:source,underlyingQuery:rawRoot,underlyingCode,market,currency:market==="HK"?"HKD":"USD",expiryDate:`${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}`,optionType:type==="P"?"put":"call",strikePrice:Number(strikeRaw),contractMultiplier:market==="US"?100:0};
    }

    function findPortfolioPosition(portfolio, positionId = "", positionKey = "") {
      const positions = portfolio?.positions || [];
      const idMatch = positionId
        ? positions.find((item) => String(item.id || "") === String(positionId))
        : null;
      if (idMatch) return idMatch;
      return positionKey
        ? positions.find((item) => portfolioPositionKey(item) === positionKey)
        : null;
    }

    function portfolioCashSecuredSummary(portfolio) {
      const base = portfolioBaseCurrency(portfolio);
      const cashCurrencies = portfolio?.accountType === "HKUS" ? ["USD", "HKD"] : ["CNY"];
      const frozenByCurrency = Object.fromEntries(cashCurrencies.map((currency) => [currency, 0]));
      (portfolio?.positions || []).forEach((position) => {
        if (position.assetType !== "option" || position.direction !== "short" || position.optionType !== "put") return;
        const optionCurrency = position.currency || marketCurrency(position.market);
        const cashCurrency = portfolio?.accountType === "CNY" ? "CNY" : optionCurrency;
        if (!(cashCurrency in frozenByCurrency)) frozenByCurrency[cashCurrency] = 0;
        const required = Number(position.strikePrice || 0) * Number(position.contractMultiplier || 0) * Number(position.contracts || 0);
        frozenByCurrency[cashCurrency] += required * portfolioFx(optionCurrency, cashCurrency);
      });
      const cash = portfolio?.cash || {};
      const freeByCurrency = Object.fromEntries(Object.keys(frozenByCurrency).map((currency) => [currency, Number(cash[currency] || 0) - Number(frozenByCurrency[currency] || 0)]));
      const frozenBase = Object.entries(frozenByCurrency).reduce((sum, [currency, amount]) => sum + amount * portfolioFx(currency, base), 0);
      const freeBase = Object.entries(freeByCurrency).reduce((sum, [currency, amount]) => sum + amount * portfolioFx(currency, base), 0);
      return { frozenByCurrency, freeByCurrency, frozenBase, freeBase };
    }

    function portfolioMetrics(portfolio) {
      if (!portfolio) return { positionBase: 0, cashBase: 0, netBase: 0, netCny: 0, positionCny: 0, cashCny: 0, nav: 0 };
      const base = portfolioBaseCurrency(portfolio);
      const positionBase = (portfolio.positions || []).reduce((sum, item) => sum + positionBaseValue(item, portfolio), 0);
      const cash = portfolio.cash || {};
      const cashBase = portfolio.accountType === "HKUS"
        ? Number(cash.USD || 0) + Number(cash.HKD || 0) * portfolioFx("HKD", "USD")
        : Number(cash.CNY || 0);
      const cashSecured = portfolioCashSecuredSummary(portfolio);
      const netBase = positionBase + cashBase;
      const baseToCny = currencies[base]?.rateToCny || 1;
      const totalUnits = Number(portfolio.totalUnits || portfolio.startBase || 0);
      const assetNav = totalUnits ? netBase / totalUnits : 0;
      return {
        positionBase,
        cashBase,
        frozenCashBase: cashSecured.frozenBase,
        freeCashBase: cashSecured.freeBase,
        frozenCashByCurrency: cashSecured.frozenByCurrency,
        freeCashByCurrency: cashSecured.freeByCurrency,
        netBase,
        positionCny: positionBase * baseToCny,
        cashCny: cashBase * baseToCny,
        netCny: netBase * baseToCny,
        nav: assetNav
      };
    }

    function positionWeightPercent(position, shares = position?.shares, price = null, portfolio = activePortfolio()) {
      if (!position || !portfolio) return null;
      const resolvedPrice = price == null
        ? Number(position.latestPrice) || Number(position.averageCost) || 0
        : Number(price) || 0;
      const resolvedShares = Number(shares) || 0;
      const total = portfolioMetrics(portfolio).netBase;
      if (!(resolvedPrice > 0) || !(resolvedShares > 0) || !(total > 0)) return null;
      const value = resolvedPrice * resolvedShares * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
      return value / total * 100;
    }

    function formatPositionWeight(value) {
      return value !== null && value !== "" && Number.isFinite(Number(value)) ? `${Number(value).toFixed(1)}%` : "--";

    function editedPositionWeightPercent(position, shares, portfolio = activePortfolio()) {
      if (!position || !portfolio) return null;
      const price = Number(position.latestPrice) || Number(position.averageCost) || 0;
      const nextValue = positionWeightPercent(position, shares, price, portfolio);
      if (nextValue == null) return null;
      const nextBaseValue = (Number(shares) || 0) * price * portfolioFx(position.currency, portfolioBaseCurrency(portfolio));
      const adjustedTotal = portfolioMetrics(portfolio).netBase - positionBaseValue(position, portfolio) + nextBaseValue;
      return adjustedTotal > 0 ? nextBaseValue / adjustedTotal * 100 : null;
    }

    function formatCashAmountInput(input) {
      const previous = input.value;
      const selectionStart = input.selectionStart ?? previous.length;
      const logicalCaret = previous.slice(0, selectionStart).replace(/,/g, "").length;
      const clean = previous.replace(/,/g, "").replace(/[^\d.]/g, "");
      if (!clean) {
        input.value = "";
        return;
      }
      const dotIndex = clean.indexOf(".");
      const hasDecimal = dotIndex >= 0;
      const integer = (hasDecimal ? clean.slice(0, dotIndex) : clean).replace(/^0+(?=\d)/, "") || "0";
      const decimal = hasDecimal ? clean.slice(dotIndex + 1).replace(/\./g, "").slice(0, 2) : "";
      const grouped = integer.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const formatted = hasDecimal ? `${grouped}.${decimal}` : grouped;
      input.value = formatted;
      let nextCaret = 0;
      let logicalCount = 0;
      while (nextCaret < formatted.length && logicalCount < logicalCaret) {
        if (formatted[nextCaret] !== ",") logicalCount += 1;
        nextCaret += 1;
      }
      input.setSelectionRange(nextCaret, nextCaret);
    }

name: Repair official HKEX share capital

on:
  workflow_dispatch:
    inputs:
      codes:
        description: HK stock codes, comma-separated
        required: true
        default: "01024"
      start_date:
        description: Start date (YYYY-MM-DD)
        required: true
        default: "2026-01-01"
      end_date:
        description: End date (YYYY-MM-DD)
        required: true
        default: "2026-12-31"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt
      - name: Repair selected stocks
        run: >-
          python scripts/hkex-share-capital.py
          --codes "${{ inputs.codes }}"
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --batch-size 0

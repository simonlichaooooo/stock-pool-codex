name: Update market insights

on:
  schedule:
    # 香港时间周五 18:00，在证监会通常完成周度发布后刷新前端快照。
    - cron: "0 10 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-insights
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official snapshots
        run: node scripts/update-market-insights.mjs
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/market-insights.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-insights.json
          git commit -m "chore: update market insight data"
          git push

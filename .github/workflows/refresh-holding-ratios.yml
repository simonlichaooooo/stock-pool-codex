name: Refresh market holding ratios

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-market-holding-ratios
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt
      - name: Refresh ratios in small groups
        run: python scripts/hkex-share-capital.py --batch-size 0 --refresh-only
